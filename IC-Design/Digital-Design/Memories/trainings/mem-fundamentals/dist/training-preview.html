"Write-first", "md": "dout shows the **new** data (77) at once — the written value is passed through."}, {"title": "No-change", "md": "dout **keeps** its previous value during a write; it only changes on reads."}]}, {"type": "callout", "kind": "warning", "title": "Match the target", "md": "FPGA block RAMs usually support all three modes, selected by the way the RTL is written. An ASIC SRAM macro has **one** behaviour, given in its datasheet — the RTL model must match it, or simulation and silicon disagree."}]}, {"id": "async-read", "title": "Asynchronous read", "blocks": [{"type": "text", "md": "If the read is described **outside** the clocked block, the data follows the address within the same cycle — the read multiplexer of Topic 4 without the output register. That choice decides which hardware you get:"}, {"type": "table", "columns": ["Read style", "Becomes (FPGA)", "Becomes (ASIC)", "Use"], "rows": [["synchronous (registered)", "block RAM", "SRAM macro", "everything larger than a few hundred bits"], ["asynchronous", "distributed (LUT) RAM", "flip-flops + multiplexer", "small register files, FIFOs of a few words"]], "caption": "The read style decides the hardware"}, {"type": "categorize", "prompt": "Practice: which hardware does the RTL infer?", "categories": [{"id": "macro", "label": "SRAM macro / block RAM"}, {"id": "ff", "label": "flip-flops / LUT RAM"}], "items": [{"text": "4096 × 32, dout <= mem[addr] in always_ff", "category": "macro"}, {"text": "16 × 8, assign rd = mem[ra]", "category": "ff"}, {"text": "32 × 64 register file with 2 asynchronous reads", "category": "ff"}, {"text": "2048 × 72 with byte enables and registered read", "category": "macro"}]}]}, {"id": "sv", "title": "In SystemVerilog: interface variants", "blocks": [{"type": "text", "md": "All variants of this topic as synthesizable code. Compare each one with its waveform above."}, {"type": "text", "md": "**Read latency 1 or 2** — the parameter adds an output register:"}, {"type": "code", "lang": "systemverilog", "code": "module sp_ram_lat #(\n  parameter  int DW = 32, DEPTH = 1024,\n  parameter  int READ_LATENCY = 1,          // 1 or 2\n  localparam int AW = $clog2(DEPTH)\n) (\n  input  logic          clk, en, we,\n  input  logic [AW-1:0] addr,\n  input  logic [DW-1:0] din,\n  output logic [DW-1:0] dout\n);\n  logic [DW-1:0] mem [DEPTH];\n  logic [DW-1:0] q;\n\n  always_ff @(posedge clk)\n    if (en) begin\n      if (we) mem[addr] <= din;\n      q <= mem[addr];\n    end\n\n  if (READ_LATENCY == 2) begin : g_oreg\n    always_ff @(posedge clk) dout <= q;    // extra output register\n  end else begin : g_noreg\n    assign dout = q;\n  end\nendmodule"}, {"type": "text", "md": "**Byte enables** — one write enable per byte:"}, {"type": "code", "lang": "systemverilog", "code": "module sp_ram_be #(\n  parameter  int DEPTH = 1024,\n  localparam int AW    = $clog2(DEPTH)\n) (\n  input  logic          clk, en,\n  input  logic [3:0]    we,              // one write enable per byte\n  input  logic [AW-1:0] addr,\n  input  logic [31:0]   din,\n  output logic [31:0]   dout\n);\n  logic [31:0] mem [DEPTH];\n\n  always_ff @(posedge clk)\n    if (en) begin\n      if (we[0]) mem[addr][ 7: 0] <= din[ 7: 0];   // byte 0\n      if (we[1]) mem[addr][15: 8] <= din[15: 8];   // byte 1\n      if (we[2]) mem[addr][23:16] <= din[23:16];   // byte 2\n      if (we[3]) mem[addr][31:24] <= din[31:24];   // byte 3\n      dout <= mem[addr];\n    end\nendmodule"}, {"type": "text", "md": "**Read-during-write** — three ways to write the same RAM:"}, {"type": "code", "lang": "systemverilog", "code": "// read-first\nalways_ff @(posedge clk)\n  if (en) begin\n    if (we) mem[addr] <= din;\n    dout <= mem[addr];        // old value\n  end"}, {"type": "code", "lang": "systemverilog", "code": "// write-first\nalways_ff @(posedge clk)\n  if (en) begin\n    if (we) begin\n      mem[addr] <= din;\n      dout      <= din;       // new value\n    end else\n      dout <= mem[addr];\n  end"}, {"type": "code", "lang": "systemverilog", "code": "// no-change\nalways_ff @(posedge clk)\n  if (en) begin\n    if (we) mem[addr] <= din;\n    else    dout <= mem[addr]; // only on reads\n  end"}, {"type": "text", "md": "**Asynchronous read** — becomes LUT RAM or flip-flops, not an SRAM macro:"}, {"type": "code", "lang": "systemverilog", "code": "always_ff @(posedge clk) if (we) mem[addr] <= din;   // synchronous write\nassign dout = mem[addr];                              // asynchronous read"}]}], "quiz": {"questions": [{"id": "q-lat", "type": "single", "text": "A memory with read latency 1 gets a read address in cycle 5. When is the data on dout?", "options": ["In cycle 6, after the next clock edge", "In cycle 5", "In cycle 7", "When en goes low"], "correct": [0], "review": ["latency"]}, {"id": "q-oreg", "type": "single", "text": "Why add an output register (latency 2)?", "options": ["The clock can run faster because the critical path is shorter", "It saves memory cells", "It removes the need for an address", "Writes become faster"], "correct": [0], "review": ["latency"]}, {"id": "q-be", "type": "single", "text": "The word holds 0xAABBCCDD. Byte enables are 4'b0011 and din is 0x11223344. What is stored after the write?", "options": ["0xAABB3344", "0x1122CCDD", "0x11223344", "0xAABBCCDD"], "correct": [0], "review": ["byte-enable"], "explain": "Bytes 0 and 1 (the lowest) are written."}, {"id": "q-rf", "type": "single", "text": "Which read-during-write behaviour does this give?  `if (we) mem[addr] <= din;  dout <= mem[addr];`", "options": ["Read-first (old value)", "Write-first (new value)", "No-change", "Undefined"], "correct": [0], "review": ["rdw", "sv"]}, {"id": "q-nc", "type": "single", "text": "In no-change mode, what does dout show during a write?", "options": ["Its previous value", "The new data", "The old content of the written address", "X"], "correct": [0], "review": ["rdw"]}, {"id": "q-async", "type": "single", "text": "What does `assign dout = mem[addr];` on a 16 × 8 array usually become in an FPGA?", "options": ["Distributed (LUT) RAM", "Block RAM", "An SRAM macro", "Flash"], "correct": [0], "review": ["async-read"]}, {"id": "q-match", "type": "truefalse", "text": "An ASIC SRAM model in RTL must use the same read-during-write behaviour as the macro's datasheet.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["rdw"]}, {"id": "q-sig", "type": "multiple", "text": "Which signals are sampled at the rising clock edge of a synchronous memory? Select **all** correct answers.", "options": ["addr", "we", "din", "dout"], "correct": [0, 1, 2], "review": ["signals"]}]}}, "topics/06-multi-port.json": {"id": "multi-port", "title": "Multi-port memories and register files", "duration": "55 min", "summary": "Many designs need more than one access per clock: a FIFO writes and reads, a CPU reads two operands and writes one result, two processors share a buffer. This topic covers single-, dual- and multi-port memories, register files with bypass, collisions and dual-clock memories — with their SystemVerilog templates.", "objectives": ["Compare single-port, simple dual-port, true dual-port memories and register files.", "Write SDP, TDP and register-file models in SystemVerilog.", "Explain write-through bypass and implement it.", "Recognise port collisions and check them with an assertion."], "subsections": [{"id": "port-types", "title": "Port types", "blocks": [{"type": "svg", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5MDAgNTIwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KPGRlZnM+PG1hcmtlciBpZD0ibWkiIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiMzNDQ5NWUiLz48L21hcmtlcj48bWFya2VyIGlkPSJtYiIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwID access the **same address** in the same cycle, the result depends on the memory:"}, {"type": "table", "columns": ["Case", "Typical result"], "rows": [["write A and write B, same address", "**undefined** content — must be avoided"], ["write A, read B, same address", "old data, new data, or X — see the datasheet / tool"], ["read A and read B, same address", "both get the same data — no problem"]], "caption": "Same-address access on two ports"}]}, {"id": "dual-clock", "title": "Dual-clock memories", "blocks": [{"type": "text", "md": "A true dual-port or simple dual-port RAM with **different clocks** on its ports is the core of an **asynchronous FIFO**: one clock domain writes, the other reads. The memory itself is safe; the difficulty is passing the read and write **pointers** between the domains — solved with Gray-code counters and synchronisers in the *Designing with Memories* training."}, {"type": "categorize", "prompt": "Practice: which memory type fits?", "categories": [{"id": "sp", "label": "single port"}, {"id": "sdp", "label": "simple dual port"}, {"id": "tdp", "label": "true dual port"}, {"id": "rf", "label": "register file"}], "items": [{"text": "a FIFO between a producer and a consumer", "category": "sdp"}, {"text": "operands of a RISC CPU (2 reads, 1 write per clock)", "category": "rf"}, {"text": "a buffer shared by two processors that both read and write", "category": "tdp"}, {"text": "a 64 KiB data scratch-pad used by one engine", "category": "sp"}]}]}, {"id": "sv", "title": "In SystemVerilog: multi-port templates", "blocks": [{"type": "text", "md": "**Simple dual port** — one write port and one read port:"}, {"type": "code", "lang": "systemverilog", "code": "module sdp_ram #(\n  parameter  int DW = 32, DEPTH = 512,\n  localparam int AW = $clog2(DEPTH)\n) (\n  input  logic          clk,\n  // write port\n  input  logic          we,\n  input  logic [AW-1:0] waddr,\n  input  logic [DW-1:0] din,\n  // read port\n  input  logic          re,\n  input  logic [AW-1:0] raddr,\n  output logic [DW-1:0] dout\n);\n  logic [DW-1:0] mem [DEPTH];\n\n  always_ff @(posedge clk) begin\n    if (we) mem[waddr] <= din;\n    if (re) dout <= mem[raddr];     // same address as a write: old data\n  end\nendmodule"}, {"type": "text", "md": "**True dual port** — two read/write ports with their own clocks:"}, {"type": "code", "lang": "systemverilog", "code": "module tdp_ram #(\n  parameter  int DW = 32, DEPTH = 1024,\n  localparam int AW = $clog2(DEPTH)\n) (\n  input  logic clka, ena, wea,\n  input  logic [AW-1:0] addra,\n  input  logic [DW-1:0] dina,\n  output logic [DW-1:0] douta,\n  input  logic clkb, enb, web,\n  input  logic [AW-1:0] addrb,\n  input  logic [DW-1:0] dinb,\n  output logic [DW-1:0] doutb\n);\n  logic [DW-1:0] mem [DEPTH];\n\n  // Two processes write the same array, so plain 'always' is used:\n  // 'always_ff' does not allow a variable to be written by two blocks.\n  always @(posedge clka)\n    if (ena) begin\n      if (wea) mem[addra] <= dina;\n      douta <= mem[addra];\n    end\n\n  always @(posedge clkb)\n    if (enb) begin\n      if (web) mem[addrb] <= dinb;\n      doutb <= mem[addrb];\n    end\nendmodule"}, {"type": "callout", "kind": "tip", "title": "A detail experts check", "md": "The SystemVerilog standard forbids writing one variable from two `always_ff` blocks. FPGA synthesis tools recognise the template above with `always`; some also accept a single array written from two `always_ff` blocks with a warning. Follow the template of your tool."}, {"type": "text", "md": "**Register file 2R1W with bypass:**"}, {"type": "code", "lang": "systemverilog", "code": "module regfile_2r1w #(\n  parameter  int DW = 32, N = 32,\n  localparam int AW = $clog2(N)\n) (\n  input  logic          clk, we,\n  input  logic [AW-1:0] wa, ra1, ra2,\n  input  logic [DW-1:0] wd,\n  output logic [DW-1:0] rd1, rd2\n);\n  logic [DW-1:0] rf [N];\n\n  always_ff @(posedge clk) if (we) rf[wa] <= wd;\n\n  // write-through bypass: reading the register that is being written\n  // returns the new value in the same cycle\n  assign rd1 = (we && wa == ra1) ? wd : rf[ra1];\n  assign rd2 = (we && wa == ra2) ? wd : rf[ra2];\nendmodule"}, {"type": "text", "md": "**Collision check** — an assertion that flags two writes to the same address (both ports on one clock):"}, {"type": "code", "lang": "systemverilog", "code": "// inside tdp_ram, when both ports use the same clock 'clk'\na_no_ww_collision: assert property (\n  @(posedge clk) !(ena && wea && enb && web && addra == addrb)\n) else $error(\"write-write collision at address %0h\", addra);"}, {"type": "callout", "kind": "info", "title": "Different clocks", "md": "With two clocks, \"same cycle\" has no exact meaning — collisions are avoided by the protocol, for example by a FIFO's full/empty logic."}]}], "quiz": {"questions": [{"id": "q-sdp", "type": "single", "text": "Which memory allows one write and one read at different addresses in the same clock?", "options": ["Simple dual port", "Single port", "ROM", "eFuse"], "correct": [0], "review": ["port-types"]}, {"id": "q-cost", "type": "single", "text": "Why not give every memory many ports?", "options": ["Each port adds lines and transistors to every cell — area and power grow", "Ports reduce the capacity to one word", "Ports are not allowed in ASICs", "Extra ports make reads asynchronous"], "correct": [0], "review": ["port-types"]}, {"id": "q-always", "type": "single", "text": "Why does the true dual-port template use `always` instead of `always_ff`?", "options": ["The array is written from two processes, which always_ff forbids", "always is faster in simulation", "always_ff cannot use two clocks in one design", "It does not matter"], "correct": [0], "review": ["sv"]}, {"id": "q-bypass", "type": "single", "text": "In regfile_2r1w, we = 1, wa = 7, wd = 0x55, ra1 = 7, rf[7] = 0x10. What is rd1?", "options": ["0x55", "0x10", "X", "0x00"], "correct": [0], "review": ["regfile"]}, {"id": "q-ww", "type": "single", "text": "Two ports write different data to the same address in the same cycle. What is stored?", "options": ["Undefined — this collision must be avoided", "Port A's data", "Port B's data", "The OR of both"], "correct": [0], "review": ["collisions"]}, {"id": "q-match", "type": "match", "text": "Match the use to the memory.", "categories": [{"id": "rf", "label": "register file"}, {"id": "sdp", "label": "simple dual port"}, {"id": "sp", "label": "single port"}], "items": [{"text": "CPU operands, 2 reads + 1 write", "category": "rf"}, {"text": "FIFO storage", "category": "sdp"}, {"text": "data cache way", "category": "sp"}], "review": ["dual-clock", "port-types"]}, {"id": "q-dc", "type": "truefalse", "text": "A simple dual-port RAM with two different clocks is the storage of an asynchronous FIFO.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["dual-clock"]}]}}, "topics/07-fifo.json": {"id": "fifo", "title": "FIFOs", "duration": "55 min", "summary": "The FIFO is the most common memory structure in digital design: a queue built from a dual-port memory and two pointers. This topic shows the ring buffer step by step, how full and empty are detected, how a FIFO looks in waveforms, why asynchronous FIFOs need Gray-code pointers — and a complete synchronous FIFO in SystemVerilog.", "objectives": ["Explain a FIFO as a ring buffer with write and read pointers.", "Detect full and empty with a wrap bit.", "Read FIFO behaviour in waveforms.", "Explain why asynchronous FIFOs use Gray-code pointers and synchronisers.", "Write a synchronous FIFO in SystemVerilog."], "subsections": [{"id": "why-fifo", "title": "Why FIFOs", "blocks": [{"type": "text", "md": "A **FIFO** (first in, first out) is a queue: words leave in the order they arrived. FIFOs connect blocks that produce and consume data at **different moments or rates** — a network port and a processor, a camera and a frame buffer, two clock domains. Inside, a FIFO is a dual-port memory plus two counters."}, {"type": "  passed to the other domain to compute full and empty. A binary counter changing from 0111 to 1000 flips four bits at once — sampled at the wrong moment it can be read as any value. **Gray code** changes only one bit per step, so after a two-flip-flop **synchroniser** the other side sees either the old or the new value — never a wrong one. Full and empty are then slightly **pessimistic** but always safe.\n\nThe full design is covered in *Designing with Memories* (training 4)."}, {"type": "categorize", "prompt": "Practice: which FIFO is needed?", "categories": [{"id": "sync", "label": "synchronous FIFO"}, {"id": "async", "label": "asynchronous FIFO"}], "items": [{"text": "buffer between a 100 MHz camera interface and a 250 MHz processor bus", "category": "async"}, {"text": "queue of requests inside one 500 MHz controller", "category": "sync"}, {"text": "data from a USB PHY clock to the system clock", "category": "async"}, {"text": "skid buffer between two pipeline stages", "category": "sync"}]}]}, {"id": "sv", "title": "In SystemVerilog: a synchronous FIFO", "blocks": [{"type": "text", "md": "A complete synchronous FIFO: storage in a memory array (a simple dual-port RAM), two pointers with a wrap bit, and the flags:"}, {"type": "code", "lang": "systemverilog", "code": "module sync_fifo #(\n  parameter  int DW    = 8,\n  parameter  int DEPTH = 16,               // a power of two\n  localparam int AW    = $clog2(DEPTH)\n) (\n  input  logic          clk, rst_n,\n  input  logic          wr_en,             // push\n  input  logic [DW-1:0] din,\n  output logic          full,\n  input  logic          rd_en,             // pop\n  output logic [DW-1:0] dout,              // valid one clock after a pop\n  output logic          empty\n);\n  logic [DW-1:0] mem [DEPTH];\n  logic [AW:0]   wptr, rptr;               // one extra bit = wrap flag\n  logic          do_wr, do_rd;\n\n  assign do_wr = wr_en && !full;           // ignore a push when full\n  assign do_rd = rd_en && !empty;          // ignore a pop when empty\n\n  always_ff @(posedge clk or negedge rst_n)\n    if (!rst_n) begin\n      wptr <= '0;\n      rptr <= '0;\n    end else begin\n      if (do_wr) wptr <= wptr + 1'b1;\n      if (do_rd) rptr <= rptr + 1'b1;\n    end\n\n  always_ff @(posedge clk) begin\n    if (do_wr) mem[wptr[AW-1:0]] <= din;\n    if (do_rd) dout <= mem[rptr[AW-1:0]];\n  end\n\n  // equal pointers: empty; equal addresses but different wrap bits: full\n  assign empty = (wptr == rptr);\n  assign full  = (wptr[AW-1:0] == rptr[AW-1:0]) && (wptr[AW] != rptr[AW]);\nendmodule"}, {"type": "accordion", "items": [{"title": "Where is the memory?", "md": "`mem` with one write (`do_wr`) and one registered read (`do_rd`) per clock — exactly the simple dual-port RAM of Topic 6, so synthesis can use block RAM or an SRAM macro."}, {"title": "Why `wptr[AW-1:0]` as address?", "md": "The lower bits are the slot; the top bit is only the wrap flag for full/empty."}, {"title": "How would you add a word counter?", "md": "count = wptr − rptr (with AW+1 bits). It gives almost-full / almost-empty flags by comparison."}]}]}], "quiz": {"questions": [{"id": "q-order", "type": "single", "text": "Words A, B, C are pushed in this order. Which word does the first pop return?", "options": ["A", "C", "B", "the newest one"], "correct": [0], "review": ["why-fifo"]}, {"id": "q-empty", "type": "single", "text": "When is a FIFO empty?", "options": ["When the write and read pointers are equal, including the wrap bit", "When the write pointer is 0", "When the slot bits are equal but the wrap bits differ", "When dout is 0"], "correct": [0], "review": ["flags"]}, {"id": "q-full", "type": "single", "text": "Depth 8, wptr = 1 010, rptr = 0 010. What is the state?", "options": ["full", "empty", "2 words", "6 words"], "correct": [0], "review": ["flags"]}, {"id": "q-count", "type": "single", "text": "Depth 8, wptr = 0 110, rptr = 0 011. How many words are stored?", "options": ["3", "6", "5", "9"], "correct": [0], "review": ["flags"], "explain": "6 − 3 = 3."}, {"id": "q-gray", "type": "single", "text": "Why are pointers of an asynchronous FIFO passed between clock domains in Gray code?", "options": ["Only one bit changes per step, so a synchronised copy is either the old or the new value", "Gray code is shorter", "It makes the FIFO deeper", "Binary counters cannot wrap"], "correct": [0], "review": ["async"]}, {"id": "q-fwft", "type": "single", "text": "What is special about a first-word-fall-through FIFO?", "options": ["The oldest word is already visible at the output; the pop only removes it", "It has no read pointer", "It can only hold one word", "It ignores the empty flag"], "correct": [0], "review": ["flags"]}, {"id": "q-both", "type": "truefalse", "text": "A push and a pop in the same clock leave the number of stored words unchanged.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["waves"]}]}}, "topics/08-ecc-memory.json": {"id": "ecc-memory", "title": "ECC memory modules", "duration": "50 min", "summary": "Memories in cars, servers and space systems protect every word with an **error-correcting code**. This topic treats ECC as a hardware module: encoder on the write path, check bits stored with the data, decoder with corrected/uncorrectable flags on the read path, plus overhead, scrubbing and error logging. It ends with a SECDED (39,32) encoder, decoder and ECC RAM in SystemVerilog.", "objectives": ["Explain why memories need ECC and compare parity, SEC and SECDED.", "Describe the ECC memory module and its ce / ue outputs.", "Compute check bits and a syndrome by hand for a small Hamming code.", "Compute the check-bit overhead for a word width.", "Explain read-modify-write, bit interleaving and scrubbing.", "Read and use a SECDED (39,32) encoder, decoder and ECC RAM in SystemVerilog."], "subsections": [{"id": "why-ecc", "title": "Why memories need ECC", "blocks": [{"type": "text", "md": "Memory cells are tiny. A particle from cosmic radiation or from the package can flip a bit (**soft error**); a weak cell can fail after years of use. Large memories — caches, DRAM, on-chip SRAM in cars and servers — therefore store a few extra **check bits** per word and correct errors on every read. This is **ECC** (error-correcting code).\n\nHere we treat ECC as a **memory module** — what it contains, how it is connected and what its signals mean. The mathematics of the codes is covered in the *Error-Correcting Codes* training."}, {"type": "table", "columns": ["Protection", "Extra bits for 32 data bits", "Detects", "Corrects"], "rows": [["none", "0", "—", "—"], ["parity", "1", "1 error (odd number)", "—"], ["SEC (Hamming)", "6", "1 error", "1 error"], ["SECDED (Hamming + parity)", "7", "2 errors", "1 error"]], "caption": "Levels of protection"}]}, {"id": "architecture", "title": "The ECC memory module", "blocks": [{"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5MDAgNDYwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIiB4bWxuczpjMnBhPSJodHRwOi8vYzJwYS5vcmcvbWFuaWZlc3QiPjxtZXRhZGF0YT48YzJwYTptYW5pZmVzdD5BQUFXZ21wMWJXSUFBQUFlYW5WdFpHTXljR0VBRVFBUWdBQUFxZ0E0bTNFRFl6SndZUUFBQUJaY2FuVnRZZ0FBQUVkcWRXMWtZekp0WVFBUkFCQ0FBQUNxQURpYmNRTjFjbTQ2WXpKd1lUbzNObVkyWkdRNE9TMW1ZV1JrTFRRd05qVXRPV1k0WVMxbU9Ua3dZbU0zT0RBeU5tSUFBQUFEbDJwMWJXSUFBQUFwYW5WdFpHTXlZWE1BRVFBUWdBQUFxZ0E0bTNFRFl6SndZUzVoYzNObGNuUnBiMjV6QUFBQUFMeHFkVzFpQUFBQVJHcDFiV1JqWW05eUFCRUFFSUFBQUtvQU9KdHhFMk15Y0dFdWFXNW5jbVZrYVdWdWRDNTJNd0FBQUFBWVl6SnphTWJGemp2bjNwS2IzSlRpOGs0cFY1b0FBQUJ3WTJKdmNxTnBaR002Wm05eWJXRjBiV2x0WVdkbEwzTjJaeXQ0Yld4cWFXNXpkR0Z1WTJWSlJIZ3NlRzF3T21scFpEbzFPRGN3TVRrNE1DMDFOMlk1TFRSbVl6UXRPR1JpTlMwNVkyRmpZVGd5TldZeE16ZHNjbVZzWVhScGIyNXphR2x3YUhCaGNtVnVkRTltQUFBQjRtcDFiV0lBQUFCQmFuVnRaR05pYjNJQUVRQVFnQUFBcWdBNG0zRVRZekp3WVM1aFkzUnBiMjV6TG5ZeUFBQUFBQmhqTW5ObzZhaitvU1EzRHZKbTZmM09pdFRxVEFBQUFabGpZbTl5b21kaFkzUnBiMjV6Z3FKbVlXTjBhVzl1YTJNeWNHRXViM0JsYm1Wa2FuQmhjbUZ0WlhSbGNuT2h tes become read-modify-write.** Writing one byte changes the check bits of the whole word, so the module must read the word, merge the byte, re-encode and write back.\n- **The decoder is on the read path.** It adds a few gate levels of delay; fast memories often add a pipeline stage for it."}, {"type": "callout", "kind": "info", "title": "Interleaving", "md": "Bits of one code word can be placed in physically distant cells (**bit interleaving**), so a single particle that flips several neighbouring cells hits several *different* code words — each with only one error, which ECC can correct."}]}, {"id": "scrubbing", "title": "Error flags, counters and scrubbing", "blocks": [{"type": "accordion", "items": [{"title": "Error counters", "md": "Every corrected error increments a counter. A sudden increase means a memory is getting worse — the system can react before an uncorrectable error happens."}, {"title": "Scrubbing", "md": "A corrected error is only corrected in the **output**; the cell still holds the wrong bit. A **scrubber** reads every word in the background and writes the corrected value back, so single errors cannot accumulate into double errors."}, {"title": "Testing the ECC logic", "md": "MBIST tests the cells with the ECC bypassed and checks the encoder and decoder by writing code words with deliberately flipped bits — see *MBIST Architecture*, Topic 6."}]}, {"type": "categorize", "prompt": "Practice: what should happen?", "categories": [{"id": "ce", "label": "ce = 1: correct and log"}, {"id": "ue", "label": "ue = 1: raise an error"}], "items": [{"text": "one bit of a cache line flipped by a particle", "category": "ce"}, {"text": "two bits of the same word flipped", "category": "ue"}, {"text": "a weak cell read once a day with one wrong bit", "category": "ce"}, {"text": "a whole row failing in one word", "category": "ue"}]}]}, {"id": "sv", "title": "In SystemVerilog: SECDED encoder, decoder and ECC RAM", "blocks": [{"type": "text", "md": "A **parameterised** SECDED (Hamming + overall parity) for any data width. A package holds the helper that gives each data bit its Hamming position:"}, {"type": "code", "lang": "systemverilog", "code": "// SECDED (39,32): 32 data bits + 6 Hamming check bits + 1 overall parity bit\npackage secded32_pkg;\n  // Each Hamming check bit is the parity of the data bits selected by a mask\n  // (data bit i sits at Hamming position 3, 5, 6, 7, 9, ... - never a power of 2)\n  localparam logic [31:0] M0 = 32'h56AA_AD5B, M1 = 32'h9B33_366D,\n                          M2 = 32'hE3C3_C78E, M3 = 32'h03FC_07F0,\n                          M4 = 32'h03FF_F800, M5 = 32'hFC00_0000;\n\n  function automatic logic [5:0] hamming(input logic [31:0] d);\n    return {^(d & M5), ^(d & M4), ^(d & M3), ^(d & M2), ^(d & M1), ^(d & M0)};\n  endfunction\n\n  // syndrome (error position) -> data bit index; 63 = not a data bit\n  localparam logic [5:0] DATA_BIT [64] = '{\n    6'd63, 6'd63, 6'd63, 6'd0, 6'd63, 6'd1, 6'd2, 6'd3,\n    6'd63, 6'd4, 6'd5, 6'd6, 6'd7, 6'd8, 6'd9, 6'd10,\n    6'd63, 6'd11, 6'd12, 6'd13, 6'd14, 6'd15, 6'd16, 6'd17,\n    6'd18, 6'd19, 6'd20, 6'd21, 6'd22, 6'd23, 6'd24, 6'd25,\n    6'd63, 6'd26, 6'd27, 6'd28, 6'd29, 6'd30, 6'd31, 6'd63,\n    6'd63, 6'd63, 6'd63, 6'd63, 6'd63, 6'd63, 6'd63, 6'd63,\n    6'd63, 6'd63, 6'd63, 6'd63, 6'd63, 6'd63, 6'd63, 6'd63,\n    6'd63, 6'd63, 6'd63, 6'd63, 6'd63, 6'd63, 6'd63, 6'd63\n  };\nendpackage\n\nmodule secded32_enc\n  import secded32_pkg::*;\n(\n  input  logic [31:0] data,\n  output logic [6:0]  check            // {overall parity, 6 Hamming bits}\n);\n  logic [5:0] h;\n  assign h     = hamming(data);\n  assign check = {^{data, h}, h};       // overall parity over all 38 bits\nendmodule\n\nmodule secded32_dec\n  import secded32_pkg::*;\n(\n  input  logic [31:0] data_in,\n  input  logic [6:0]  check_in,\n  output logic [31:0] data_out,          // corrected data\n  output logic        ce,                // a single error was corrected\n  output logic        ue                 // uncorrectable (double) error\n);\n  logic [5:0] syn;                       // syndrome: position of a single error\n  logic       par;                       // 1 = odd number of flipped bits\n  logic [5:0] bad_bit;                   // data bit at that position\n\n  assign syn      = check_in[5:0] ^ hamming(data_in);\n  assign par      = ^{data_in, check_in};\n  assign bad_bit  = DATA_BIT[syn];\n  assign data_out = (par && bad_bit != 6'd63) ? data_in ^ (32'd1 << bad_bit)\n                                              : data_in;\n  assign ce = par;                       // error in data, check or parity bit\n  assign ue = !par && (syn != '0);       // two errors: detected only\nendmodule"}, {"type": "text", "md": "The **ECC memory module** puts encoder, memory and decoder together. The stored word is {check bits, data}:"}, {"type": "code", "lang": "systemverilog", "code": "module ecc_ram #(\n  parameter  int DEPTH = 1024,\n  localparam int AW    = $clog2(DEPTH)\n) (\n  input  logic          clk, en, we,\n  input  logic [AW-1:0] addr,\n  input  logic [31:0]   din,\n  output logic [31:0]   dout,            // corrected read data\n  output logic          ce, ue           // error flags of this read\n);\n  logic [6:0]  check_w;\n  logic [38:0] code_r;                   // stored word: {check bits, data}\n\n  secded32_enc u_enc (.data(din), .check(check_w));\n\n  sp_ram #(.DW(39), .DEPTH(DEPTH)) u_ram (\n    .clk, .en, .we, .addr,\n    .din ({check_w, din}),\n    .dout(code_r));\n\n  secded32_dec u_dec (\n    .data_in (code_r[31:0]),\n    .check_in(code_r[38:32]),\n    .data_out(dout), .ce, .ue);\nendmodule"}, {"type": "accordion", "items": [{"title": "How was it verified?", "md": "A testbench wrote a word, then flipped **every single bit** of the 39-bit code word (39 cases: all corrected, ce = 1) and **every pair of bits** (741 cases: all flagged, ue = 1)."}, {"title": "What is missing for a product?", "md": "Byte writes (read-modify-write), a pipeline register after the decoder, error address logging, counters and a scrubber — good exercises for the ECC lab M5."}]}]}], "quiz": {"questions": [{"id": "q-chk", "type": "single", "text": "How many check bits does SECDED need for 64 data bits?", "options": ["8", "7", "6", "64"], "correct": [0], "review": ["overhead"]}, {"id": "q-ce", "type": "single", "text": "What does ce = 1 mean on a read from an ECC memory?", "options": ["One bit was wrong and has been corrected in dout", "The data is unusable", "The memory is empty", "Two bits were corrected"], "correct": [0], "review": ["architecture"]}, {"id": "q-ue", "type": "single", "text": "The decoder raises ue. What should the system do?", "options": ["Treat the data as invalid and report the error", "Use the data normally", "Ignore it — ECC fixed it", "Write the data twice"], "correct": [0], "review": ["architecture", "scrubbing"]}, {"id": "q-scrub", "type": "single", "text": "Why is scrubbing needed although the decoder corrects single errors?", "options": ["The wrong bit stays in the cell; a second error in the same word would make it uncorrectable", "Scrubbing makes reads faster", "The decoder cannot correct without it", "To erase the memory"], "correct": [0], "review": ["scrubbing"]}, {"id": "q-rmw", "type": "single", "text": "Why does a byte write into an ECC-protected 32-bit word need a read-modify-write?", "options": ["The check bits depend on the whole word", "Bytes cannot be stored in SRAM", "ECC memories have no byte enables", "To scrub the word"], "correct": [0], "review": ["overhead"]}, {"id": "q-wide", "type": "single", "text": "Why is ECC usually computed over wide words?", "options": ["The relative overhead of check bits falls with the word width", "Wide words have fewer errors", "Narrow words cannot be encoded", "It removes the need for a decoder"], "correct": [0], "review": ["overhead"]}, {"id": "q-par", "type": "truefalse", "text": "Simple parity can correct one flipped bit.", "options": ["True", "False"], "correct": [1], "shuffle": false, "review": ["why-ecc"]}, {"id": "q-p1", "type": "single", "text": "4-bit Hamming code: data bits at positions 3, 5, 6, 7 are 0, 1, 1, 0. What is p1 (covers positions 1, 3, 5, 7)?", "options": ["1", "0", "2", "it depends on p2"], "correct": [0], "review": ["worked-example"], "explain": "p1 = 0 ⊕ 1 ⊕ 0 = 1."}, {"id": "q-syn", "type": "single", "text": "The decoder computes s4 s2 s1 = 011 and the overall parity is odd. What does it do?", "options": ["Invert the bit at position 3 and raise ce", "Raise ue", "Invert bit 11", "Nothing — no error"], "correct": [0], "review": ["worked-example"]}, {"id": "q-even", "type": "single", "text": "The syndrome is not 0, but the overall parity is even. What happened?", "options": ["Two bits flipped — uncorrectable, raise ue", "One bit flipped — correct it", "No error", "Only the parity bit flipped"], "correct": [0], "review": ["worked-example"]}]}}, "topics/09-controllers-amba.json": {"id": "controllers-amba", "title": "Memory controllers and AMBA", "duration": "50 min", "summary": "Memories are reached through buses. This topic explains what a **memory controller** does, how memories sit in an SoC behind an interconnect, and gives a high-level map of Arm's **AMBA** protocols — APB, AHB, AXI, AXI-Lite and AXI-Stream — with their handshakes. It ends with a small APB memory controller in SystemVerilog.", "objectives": ["List the jobs of a memory controller and compare SRAM and DRAM controllers.", "Describe how memories, controllers and bridges sit on an SoC bus.", "Name the AMBA protocols and their typical uses.", "Read an APB transfer and an AXI VALID/READY handshake.", "Read an APB slave that controls an SRAM."], "subsections": [{"id": "controller", "title": "What a memory controller does", "blocks": [{"type": "text", "md": "Processors and DMA engines do not drive memory pins directly. They issue **bus transfers** — *read 4 bytes at 0x2000_0A4C* — and a **memory controller** turns them into memory operations. Its jobs:"}, {"type": "table", "columns": ["Job", "Example"], "rows": [["protocol conversion", "bus handshake ↔ en / we / addr / din / dout of the RAM"], ["address mapping", "byte address → bank, row, column, byte strobes (Topic 3)"], ["arbitration", "several masters want the same memory: who goes first?"], ["wait states", "the memory is slower than the bus → stretch the transfer"], ["data width / bursts", "a 64-bit bus on a 32-bit memory, or bursts of 8 words"], ["ECC and repair", "encode, decode, scrub, report errors (Topic 8)"], ["DRAM-specific", "open and close rows, refresh, timing rules such as tRCD, tRP"]], "caption": "Jobs of a memory controller"}, {"type": "tabs", "tabs": [{"label": "SRAM controller", "md": "Simple: one bus transfer = one memory access. Often only a protocol bridge with an address decoder, byte strobes and perhaps one wait state."}, {"label": "DRAM controller", "md": "Complex: requests are queued and **reordered** to hit open rows, refresh must be inserted every few microseconds, and a **PHY** handles the high-speed DDR signalling. Covered in *DRAM and External Memory*."}]}]}, {"id": "soc", "title": "Memories on an SoC bus", "blocks": [{"type": "svg", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5MDAgNTIwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIiB4bWxuczpjMnBhPSJodHRwOi8vYzJwYS5vcmcvbWFuaWZlc3QiPjxtZXRhZGF0YT48YzJwYTptYW5pZmVzdD5BQUFXZ21wMWJXSUFBQUFlYW5WdFpHTXljR0VBRVFBUWdBQUFxZ0E0bTNFRFl6SndZUUFBQUJaY2FuVnRZZ0FBQUVkcWRXMWtZekp0WVFBUkFCQ0FBQUNxQURpYmNRTjFjbTQ2WXpKd1lUbzNNVGt3Wm1Fd09DMWhZamxqTFRReE56VXRZbVk1T0Mxak9UQmtNakE1Tm1RM1kyTUFBQUFEbDJwMWJXSUFBQUFwYW5WdFpHTXlZWE1BRVFBUWdBQUFxZ0E0bTNFRFl6SndZUzVoYzNObGNuUnBiMjV6QUFBQUFMeHFkVzFpQUFBQVJHcDFiV1JqWW05eUFCRUFFSUFBQUtvQU9KdHhFMk15Y0dFdWFXNW5jbVZrYVdWdWRDNTJNd0FBQUFBWVl6SnphRUtOclh6NE53S0svOFN4aXcxZ0twWUFBQUJ3WTJKdmNxTnBaR002Wm05eWJXRjBiV2x0WVdkbEwzTjJaeXQ0Yld4cWFXNXpkR0Z1WTJWSlJIZ3NlRzF3T21scFpEb3dNbVZp d addresses with an error. The SRAM read is started in the setup phase, so no wait state is needed:"}, {"type": "code", "lang": "systemverilog", "code": "module apb_sram #(\n  parameter  int DEPTH = 1024,               // 32-bit words\n  localparam int AW    = $clog2(DEPTH)\n) (\n  input  logic        pclk, presetn,\n  input  logic        psel, penable, pwrite,\n  input  logic [31:0] paddr,                 // byte address\n  input  logic [31:0] pwdata,\n  input  logic [3:0]  pstrb,                 // byte strobes (APB4)\n  output logic [31:0] prdata,\n  output logic        pready,\n  output logic        pslverr\n);\n  logic [31:0]   mem [DEPTH];\n  logic [AW-1:0] widx;\n  logic          setup, access, bad_addr;\n\n  assign widx     = paddr[AW+1:2];           // byte address -> word index\n  assign setup    = psel && !penable;        // 1st cycle of a transfer\n  assign access   = psel &&  penable;        // 2nd cycle of a transfer\n  assign bad_addr = (paddr[31:AW+2] != '0);  // outside this memory\n\n  // read: start the SRAM read in the setup phase,\n  // so the data is ready in the access phase (no wait state)\n  always_ff @(posedge pclk)\n    if (setup && !pwrite) prdata <= mem[widx];\n\n  // write: in the access phase, only the bytes enabled by pstrb\n  always_ff @(posedge pclk)\n    if (access && pwrite && !bad_addr) begin\n      if (pstrb[0]) mem[widx][ 7: 0] <= pwdata[ 7: 0];\n      if (pstrb[1]) mem[widx][15: 8] <= pwdata[15: 8];\n      if (pstrb[2]) mem[widx][23:16] <= pwdata[23:16];\n      if (pstrb[3]) mem[widx][31:24] <= pwdata[31:24];\n    end\n\n  assign pready  = 1'b1;                     // always ready: zero wait states\n  assign pslverr = access && bad_addr;\nendmodule"}, {"type": "accordion", "items": [{"title": "Where is the address mapping?", "md": "`widx = paddr[AW+1:2]` drops the byte bits (Topic 3); `bad_addr` checks that the upper bits are 0 inside this slave's region."}, {"title": "Where are the byte strobes?", "md": "Each of the four byte lanes is written only when its `pstrb` bit is 1 — the byte enables of Topic 5."}, {"title": "What would need a wait state?", "md": "A memory with read latency 2, or an ECC decoder with a pipeline register: the slave would hold `pready` low for one extra cycle."}]}]}], "quiz": {"questions": [{"id": "q-jobs", "type": "multiple", "text": "Which are jobs of a memory controller? Select **all** correct answers.", "options": ["Converting bus transfers into memory operations", "Arbitrating between several masters", "Inserting refresh for DRAM", "Choosing the processor's instruction set"], "correct": [0, 1, 2], "review": ["controller"]}, {"id": "q-apb", "type": "single", "text": "Which bus is typically used for slow peripheral registers?", "options": ["APB", "AXI4", "AXI4-Stream", "CHI"], "correct": [0], "review": ["amba"]}, {"id": "q-stream", "type": "single", "text": "Which AMBA protocol has no addresses at all?", "options": ["AXI4-Stream", "APB", "AHB-Lite", "AXI4-Lite"], "correct": [0], "review": ["amba"]}, {"id": "q-hs", "type": "single", "text": "When is a beat transferred on an AXI channel?", "options": ["In a clock where VALID and READY are both 1", "When VALID rises", "When READY rises", "One clock after VALID"], "correct": [0], "review": ["handshakes"]}, {"id": "q-wait", "type": "single", "text": "How does an APB slave insert a wait state?", "options": ["It keeps PREADY low in the access phase", "It lowers PSEL", "It raises PSLVERR", "It changes PADDR"], "correct": [0], "review": ["handshakes", "sv"]}, {"id": "q-bridge", "type": "single", "text": "Why are peripherals usually placed behind an AXI-to-APB bridge?", "options": ["APB is simple and cheap for slow registers; the bridge keeps them off the fast bus", "APB is faster than AXI", "AXI cannot address registers", "Peripherals need bursts"], "correct": [0], "review": ["soc"]}, {"id": "q-err", "type": "truefalse", "text": "In apb_sram, an access outside the memory's region returns PSLVERR = 1 in the access phase.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["sv"]}]}}, "topics/10-metrics.json": {"id": "metrics", "title": "Metrics", "duration": "45 min", "summary": "How do you compare memories? This topic defines latency and cycle time, bandwidth, density, energy and leakage, retention and endurance — with worked calculations you will need when choosing and sizing memories.", "objectives": ["Distinguish latency and cycle time.", "Compute peak bandwidth for on-chip and external memories.", "Explain why small memories are area-inefficient.", "Compare the energy of on-chip and off-chip accesses.", "Use retention and endurance figures in design decisions."], "subsections": [{"id": "latency", "title": "Latency and cycle time", "blocks": [{"type": "text", "md": "Two different numbers describe speed:\n\n- **Latency** (access time): how long from the request until the data is there.\n- **Cycle time**: how often a new access can start.\n\nA pipelined memory can have a latency of 2 clocks but still accept a new access **every** clock — its cycle time is one clock."}, {"type": "svg", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5MDAgNDIwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KPGRlZnM+PG1hcmtlciBpZD0ibWkiIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiMzNDQ5NWUiLz48L21hcmtlcj48bWFya2VyIGlkPSJtYiIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzFmNmZlYiIvPjwvbWFya2VyPjxtYXJrZXIgaWQ9Im1wIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjNmM0ZmIzIi8+PC9tYXJrZXI+PG1hcmtlciBpZD0ibW8iIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmt t channel", "8 B × 3200 M transfers/s", "25.6 GB/s"], ["HBM2 stack, 1024 bit, 2 Gb/s per pin", "128 B × 2 G/s", "256 GB/s"]], "caption": "Peak bandwidth examples"}, {"type": "callout", "kind": "info", "title": "Peak and sustained", "md": "These are **peak** numbers. Real DRAM bandwidth is lower because of row opening, refresh and bus turnarounds — often 60–90 % of the peak."}]}, {"id": "area", "title": "Density and area", "blocks": [{"type": "text", "md": "Density is bits per mm². It depends first on the **cell** — DRAM and flash pack several times more bits per area than SRAM — and then on the **overhead** around the array: decoders, sense amplifiers, column muxes, control.\n\nThe overhead is roughly fixed per memory, so **small memories are inefficient**: a 64-word memory may spend more area on its periphery than on its cells. That is why many small memories are merged into fewer large ones — or built from flip-flops."}, {"type": "table", "columns": ["Memory size", "Array share of the area (rough)"], "rows": [["very small (≤ 1 Kibit)", "low — periphery dominates"], ["medium (tens of Kibit)", "about half"], ["large (Mibit)", "most of the area"]], "caption": "Array efficiency grows with size (qualitative)"}]}, {"id": "power", "title": "Power and energy", "blocks": [{"type": "text", "md": "A memory consumes:\n\n- **dynamic energy per access** — charging word lines, bit lines and sense amplifiers; it grows with the memory size (longer lines);\n- **leakage** — every cell leaks all the time, so it grows with the number of bits.\n\nOff-chip accesses are far more expensive than on-chip ones:"}, {"type": "table", "columns": ["Operation (45 nm, 64-bit unless noted)", "Energy"], "rows": [["32-bit integer add", "0.1 pJ"], ["read 8 KB SRAM", "10 pJ"], ["read 32 KB SRAM", "20 pJ"], ["read 1 MB SRAM", "100 pJ"], ["read DRAM", "1.3–2.6 nJ"]], "caption": "Energy per operation (after M. Horowitz, ISSCC 2014)"}, {"type": "text", "md": "To save leakage, SRAM macros offer **light sleep** (periphery off), **deep sleep / retention** (lower array voltage, data kept) and **shut-down** (everything off, data lost). In RTL the enable signal already helps: `en = 0` avoids the dynamic energy of an access."}, {"type": "sort", "prompt": "Practice: order by energy per 64-bit access, lowest first.", "items": ["32-bit add", "8 KB SRAM read", "1 MB SRAM read", "DRAM read"]}]}, {"id": "nvm", "title": "Retention and endurance", "blocks": [{"type": "table", "columns": ["Memory", "Retention", "Endurance (writes per cell)"], "rows": [["SRAM", "while powered", "unlimited"], ["DRAM", "~64 ms without refresh", "unlimited"], ["NOR / SLC NAND flash", "~10 years", "~10⁵"], ["TLC NAND flash", "years", "~10³"], ["eFuse / OTP", "lifetime", "1"], ["MRAM", "~10 years", "10¹⁰ and more"]], "caption": "Typical retention and endurance"}, {"type": "callout", "kind": "tip", "title": "Endurance shapes the design", "md": "Flash controllers spread writes over all blocks (**wear levelling**) and use strong ECC. A design that writes a log entry to the same flash page every second would wear it out in about a day at 10⁵ cycles."}]}], "quiz": {"questions": [{"id": "q-latcyc", "type": "single", "text": "A pipelined SRAM has a latency of 2 clocks and accepts a new read every clock. What is its cycle time?", "options": ["1 clock", "2 clocks", "3 clocks", "0.5 clock"], "correct": [0], "review": ["latency"]}, {"id": "q-bw", "type": "single", "text": "What is the peak bandwidth of a 64-bit SRAM at 500 MHz with one port?", "options": ["4 GB/s", "32 GB/s", "500 MB/s", "64 GB/s"], "correct": [0], "review": ["bandwidth"], "explain": "8 bytes × 500 M/s = 4 GB/s."}, {"id": "q-ddr", "type": "single", "text": "DDR4-2400 with a 64-bit channel: peak bandwidth?", "options": ["19.2 GB/s", "2.4 GB/s", "153.6 GB/s", "9.6 GB/s"], "correct": [0], "review": ["bandwidth"], "explain": "8 B × 2400 M/s = 19.2 GB/s."}, {"id": "q-small", "type": "single", "text": "Why are many tiny memories area-inefficient?", "options": ["The periphery (decoders, sense amps) does not shrink with the array", "Their cells are larger", "They need more address bits", "They cannot use SRAM cells"], "correct": [0], "review": ["area"]}, {"id": "q-energy", "type": "single", "text": "Roughly how much more energy does a 64-bit DRAM read cost than an 8 KB SRAM read (45 nm)?", "options": ["About 100–250 times more", "About the same", "About 10 times less", "About 2 times more"], "correct": [0], "review": ["power"]}, {"id": "q-wear", "type": "single", "text": "A flash page rated for 10⁵ writes is written once per second. About when is it worn out?", "options": ["After about a day", "After about a year", "After about a minute", "Never"], "correct": [0], "review": ["nvm"], "explain": "10⁵ s ≈ 28 hours."}, {"id": "q-en", "type": "truefalse", "text": "Keeping a memory's enable low when it is not accessed saves dynamic energy.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["power"]}]}}, "topics/11-timing.json": {"id": "timing", "title": "Timing and datasheets", "duration": "60 min", "summary": "Memories have timing rules just like flip-flops — setup, hold, clock-to-output, cycle time — and stand-alone SRAMs have their own asynchronous cycles. This topic teaches you to read a memory datasheet, compute the clock limit of a path through a memory, and verify a memory with a behavioural model and a self-checking testbench.", "objectives": ["Explain setup, hold, clock-to-output and cycle time of a memory macro.", "Read a memory datasheet and compute the maximum clock frequency of a path.", "Describe asynchronous SRAM read and write cycles.", "Write a behavioural memory model with timing checks and a self-checking testbench."], "subsections": [{"id": "macro-timing", "title": "Setup, hold and clock-to-output", "blocks": [{"type": "text", "md": "An SRAM macro behaves like a big register bank with timing rules at its pins:"}, {"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxu ad data becomes valid tCQ after the edge — the macro's access time."}, {"title": "Cycle time tCYC", "md": "The minimum clock period: one access per tCYC."}]}, {"type": "callout", "kind": "key", "title": "Two timing paths through every memory", "md": "**Into** the memory: logic delay + tSU must fit in the clock period. **Out of** the memory: tCQ + logic delay + the setup of the next flip-flop must fit. The output path is usually the critical one — which is why output registers (latency 2) exist."}]}, {"id": "datasheet", "title": "Reading a memory datasheet", "blocks": [{"type": "text", "md": "A memory compiler produces a datasheet for every generated instance. A typical excerpt (illustrative numbers for one instance and corner):"}, {"type": "table", "columns": ["Parameter", "Symbol", "Value"], "rows": [["minimum cycle time", "tCYC", "1.00 ns"], ["clock to output (access time)", "tCQ / tACC", "0.60 ns"], ["address setup / hold", "tAS / tAH", "0.12 / 0.05 ns"], ["data setup / hold", "tDS / tDH", "0.10 / 0.05 ns"], ["write-enable setup / hold", "tWS / tWH", "0.12 / 0.05 ns"], ["read energy / write energy", "—", "5.2 / 6.0 pJ"], ["leakage", "—", "35 µW"]], "caption": "Datasheet excerpt (illustration)"}, {"type": "text", "md": "**Worked example.** The read data goes through 0.9 ns of logic into a flip-flop with 0.1 ns setup:\n\n> period ≥ tCQ + logic + tSU(FF) = 0.6 + 0.9 + 0.1 = **1.6 ns** → at most 625 MHz.\n\nWith an output register (latency 2) the logic moves to the next stage: period ≥ max(tCYC, tCQ + tSU(FF)) = 1.0 ns → 1 GHz."}, {"type": "callout", "kind": "info", "title": "Corners", "md": "Values are given per **corner**: slow process, low voltage, high temperature for the worst case; fast corners for hold checks. Timing analysis uses all of them."}]}, {"id": "async-sram", "title": "Asynchronous SRAM", "blocks": [{"type": "text", "md": "Stand-alone SRAM chips (and some old designs) have **no clock**. Control signals are active-low: /CE (chip enable), /OE (output enable), /WE (write enable)."}, {"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5MDAgNDIwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KPGRlZnM+PG1hcmtlciBpZD0ibWkiIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiMzNDQ5NWUiLz48L21hcmtlcj48bWFya2VyIGlkPSJtYiIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzFmNmZlYiIvPjwvbWFya2VyPjxtYXJrZXIgaWQ9Im1wIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjNmM0ZmIzIi8+PC9tYXJrZXI+PG1hcmtlciBpZD0ibW8iIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiNkMzU0MDAiLz48L21hcmtlcj48bWFya2VyIGlkPSJtciIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iI2MwMzkyYiIvPjwvbWFya2VyPjxtYXJrZXIgaWQ9Im1nIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMWU4NDQ5Ii8+PC9tYXJrZXI+PC9kZWZzPgo8cmVjdCB3aWR0aD0iOTAwIiBoZWlnaHQ9IjQyMCIgcng9IjE0IiBmaWxsPSIjZmZmZmZmIi8+Cjx0ZXh0IHg9IjQ1MC4wIiB5PSIzNiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxOSIgZm9udC13ZWlnaHQ9IjgwMCIgZmlsbD0iIzFmNGU3OSI+QXN5bmNocm9ub3VzIFNSQU06IHJlYWQgYW5kIHdyaXRlIGN5Y2xlczwvdGV4dD4KPGcgZGF0YS1zdGVwPSIxIiBkYXRhLXVudGlsPSIxIj48dGV4dCB4PSIxNjUiIHk9IjkzIiB0ZXh0LWFuY2hvcj0iZW5kIiBmb250LXNpemU9IjE1IiBmb250LXdlaWdodD0iODAwIiBmaWxsPSIjMWY0ZTc5IiA+YWRkcmVzczwvdGV4dD48dGV4dCB4PSIxNjUiIHk9IjE1MyIgdGV4dC1hbmNob3I9ImVuZCIgZm9udC1zaXplPSIxNSIgZm9udC13ZWlnaHQ9IjgwMCIgZml <= #(T_CQ) mem[a];      // read, valid after tCQ\n    end\n\n  specify\n    $setup(a,   posedge clk, 0.12, notifier);\n    $hold (posedge clk, a,   0.05, notifier);\n    $setup(d,   posedge clk, 0.10, notifier);\n    $hold (posedge clk, d,   0.05, notifier);\n    $setup(wen, posedge clk, 0.12, notifier);\n    $setup(cen, posedge clk, 0.12, notifier);\n  endspecify\n\n  always @(notifier)                      // violation: output unknown\n    if ($realtime > 0) begin              // ignore initialisation at time 0\n      q <= 'x;\n      $display(\"%t: timing violation in %m\", $realtime);\n    end\n\n  // assertion: one clock after a read, q holds the word that was addressed\n  a_read: assert property (\n    @(posedge clk) (!cen && wen) |=> (q === mem[$past(a)])\n  ) else $error(\"read data mismatch\");\nendmodule"}]}, {"id": "testbench", "title": "In SystemVerilog: self-checking testbench", "blocks": [{"type": "text", "md": "The testbench writes random data to random addresses, keeps a **reference model** (an associative array) and compares every read:"}, {"type": "code", "lang": "systemverilog", "code": "`timescale 1ns/1ps\nmodule tb;\n  logic        clk = 0, cen = 1, wen = 1;\n  logic [9:0]  a;\n  logic [15:0] d, q;\n  logic [15:0] ref_mem [int];             // reference model\n  int          errors = 0;\n\n  always #5 clk = ~clk;                   // 100 MHz\n  sram_model #(.DW(16), .AW(10)) dut (.*);\n\n  task automatic write(input logic [9:0] addr, input logic [15:0] data);\n    @(negedge clk); cen = 0; wen = 0; a = addr; d = data;\n    ref_mem[addr] = data;\n  endtask\n\n  task automatic read_check(input logic [9:0] addr);\n    @(negedge clk); cen = 0; wen = 1; a = addr;\n    @(negedge clk); cen = 1;              // q is valid now\n    if (ref_mem.exists(addr) && q !== ref_mem[addr]) begin\n      errors++;\n      $error(\"addr %0h: read %h, expected %h\", addr, q, ref_mem[addr]);\n    end\n  endtask\n\n  initial begin\n    repeat (500) write($urandom_range(0, 1023), $urandom);\n    repeat (500) read_check($urandom_range(0, 1023));\n    $display(\"test finished with %0d errors\", errors);\n    $finish;\n  end\nendmodule"}, {"type": "accordion", "items": [{"title": "Why drive at the falling edge?", "md": "Inputs change half a period before the rising edge, so setup and hold are met with a large margin — the testbench checks function, the specify block checks timing."}, {"title": "Why an associative array?", "md": "It stores only the addresses that were written. `exists()` tells whether a read address has a known expected value — unwritten addresses are skipped."}, {"title": "What next?", "md": "Lab **M1** extends this testbench: byte enables, read-during-write checks, back-to-back accesses and coverage of all addresses."}]}]}, {"id": "summary", "title": "Summary and what comes next", "blocks": [{"type": "flipcards", "md": "Check yourself before the quiz: say the meaning, then flip the card.", "cards": [{"front": "**Memory hierarchy**", "back": "Registers → caches (SRAM) → DRAM → flash: faster and smaller at the top."}, {"front": "**AMAT**", "back": "hit time + miss rate × miss penalty."}, {"front": "**Address bits**", "back": "⌈log₂(depth)⌉."}, {"front": "**Column mux**", "back": "Picks one word of the several words stored in a row."}, {"front": "**Read latency**", "back": "Clocks between a read request and valid data."}, {"front": "**Read-first / write-first / no-change**", "back": "What dout shows during a write: old data, new data, unchanged."}, {"front": "**Byte enable**", "back": "One write enable per byte of the word."}, {"front": "**Bypass**", "back": "Forwards the data being written to a read of the same address."}, {"front": "**tSU / tH / tCQ**", "back": "Setup, hold, clock-to-output of a memory macro."}, {"front": "**Bandwidth**", "back": "width × accesses per second × ports."}, {"front": "**Interleaving**", "back": "Consecutive words in different banks, so accesses overlap."}, {"front": "**FIFO full / empty**", /* Minimal Markdown renderer for training content.
   Supports: # ## ### headings, paragraphs, **bold**, *italic*, `code`, [link](url),

  <script>

      var item = el('li.toc-item' + (open ? '' : '.is-locked') + (done ? '.is-done' : ''), { 'data-topic': t.id }, [el('div.toc-row', null, [link, exp]), subs]);
      if (A.layout === 'sidebar' && A.expanded[t.id]) { item.classList.add('expanded'); exp.setAttribute('aria-expanded', 'true'); }
      exp.addEventListener('click', function (e) {
        e.stopPropagation();
        var o = !item.classList.contains('expanded');
        if (A.layout === 'topbar') list.querySelectorAll('.toc-item.expanded').forEach(function (x) { if (x !== item) { x.classList.remove('expanded'); x.querySelector('.toc-exp').setAttribute('aria-expanded', 'false'); } });
        item.classList.toggle('expanded', o); exp.setAttribute('aria-expanded', o);
        A.expanded[t.id] = o;
      });
      subs.addEventListener('click', function () { if (A.layout === 'topbar') item.classList.remove('expanded'); });
      list.appendChild(item);
    });
    if (A.cert && A.cert.enabled !== false) {
      var ok = allPassed() || preview();
      list.appendChild(el('li.toc-item.toc-cert' + (ok ? '' : '.is-locked'), { 'data-topic': '#certificate' }, [el('div.toc-row', null, [
        el('a.toc-topic', { href: '#certificate' }, [el('span.toc-status' + (ok ? '.done' : '.locked'), { text: ok ? '★' : '🔒' }), el('span.toc-label', { text: T.L('certificate') })])])]));
    }
    toc.appendChild(list);
    var p = P.percent();
    A.progressBar.style.width = p + '%';
    A.progressText.textContent = p + '%';
    markCurrent();
  }
  function markCurrent() {
    A.toc.querySelectorAll('.toc-item').forEach(function (x) { x.classList.toggle('current', x.getAttribute('data-topic') === A.current); });
    A.toc.querySelectorAll('.toc-sub').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-page') === A.current + '/' + A.page); });
    if (A.layout === 'sidebar' && A.current) {
      var cur = A.toc.querySelector('.toc-item.current');
      var exp = cur && cur.querySelector('.toc-exp');
      if (exp && !cur.classList.contains('expanded')) { cur.classList.add('expanded'); exp.setAttribute('aria-expanded', 'true'); A.expanded[A.current] = true; }
    }
  }

  /* ---------------- routing ---------------- */
  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (h === 'certificate') return showCertificate();
    if (!h) { /* resume where the student stopped, or start at the beginning */
      h = (A.cfg.resume && P.state.last) ? P.state.last : '';
      var known = h && A.topics.some(function (t) { return t.id === h.split('/')[0]; });
      if (!known) h = A.topics[0].id;
      history.replaceState(null, '', '#' + h);
    }
    var parts = h.split('/'), idx = 0;
    A.topics.forEach(function (t, i) { if (t.id === parts[0]) idx = i; });
    var t = A.topics[idx], pages = pagesOf(t);
    var page = pages.indexOf(parts[1]) >= 0 ? parts[1] : pages[0];
    if (!unlocked(idx)) showLocked(idx);
    else showPage(idx, page);
    if (window.matchMedia('(max-width: 860px)').matches) document.body.classList.remove('toc-open');
  }

  /* ---------------- one page: a subsection or the quiz ---------------- */
  function showPage(i, page) {
    var t = A.topics[i], tr = A.training, pages = pagesOf(t), k = pages.indexOf(page);
    var main = T.clear(A.main);
    A.current = t.id; A.page = page;

    main.appendChild(el('header.topic-head' + (k > 0 ? '.compact' : ''), null, [
      el('div.topic-kicker', { text: (tr.topicWord || 'Topic') + ' ' + (i + 1) + ' / ' + A.topics.length + (t.duration ? '  ·  ' + t.duration : '') }),
      el(k > 0 ? 'div.topic-title' : 'h1', { text: t.title }),
      k <= 0 && t.summary ? el('p.topic-summary', { html: MD.inline(t.summary) }) : null,
      k <= 0 && t.objectives ? el('ul.objectives', null, t.objectives.map(function (o) { return el('li', { html: MD.inline(o) }); })) : null
    ]));
    if (pages.length > 1) main.appendChild(pageSteps(t, pages, page));

    var rv = hasQuiz(t) ? reviewSubs(t) : null;
    if (rv && rv.subs.length) main.appendChild(reviewNote(t, rv, page));

    if (page === 'quiz') {
      main.appendChild(T.renderQuiz(t.quiz, {
        topic: t, threshold: tr.passThreshold != null ? tr.passThreshold : 0.8,
        showCorrect: tr.showCorrectAnswers || 'afterPass',
        passedBefore: passed(t) ? { score: P.topic(t.id).bestScore || 1 } : null,
        subTitle: function (id) { return subTitle(t, id); },
        onReview: function (id) { location.hash = href(t, id); },
        onResult: function (r) { onQuizResult(t, r); },
        onPass: function (score, bar) { bar.appendChild(nextTopicButton(i)); }
      }));
    } else if (page) {
      var s = subOf(t, page), n = (t.subsections || []).indexOf(s);
      var sec = el('section.subsection', { id: 'sub-' + t.id + '-' + s.id }, [el('h2', null, [el('span.sub-num', { text: (i + 1) + '.' + (n + 1) }), ' ' + s.title])]);
      (s.blocks || []).forEach(function (b) { sec.appendChild(T.renderBlock(b, { topic: t, subsection: s })); });
      main.appendChild(sec);
    }
    A.pager = el('nav.pager', { 'aria-label': T.L('pageNav') });
    main.appendChild(A.pager);
    updatePager(i, page);

    if (page) P.visit(t.id, page);
    T.emit('pageView', { topicId: t.id, page: page || null, index: k, pages: pages.length });
    renderToc();
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    try { A.main.focus({ preventScroll: true }); } catch (e) {}
  }

  function pageSteps(t, pages, page) {
    var st = P.state.topics[t.id] || { visited: [] };
    return el('nav.page-steps', { 'aria-label': T.L('topicParts') }, pages.map(function (p, n) {
      var isQ = p === 'quiz', seen = isQ ? passed(t) : st.visited.indexOf(p) >= 0;
      return el('a.page-step' + (p === page ? '.current' : '') + (seen ? '.visited' : '') + (isQ ? '.is-quiz' : ''), {
        href: href(t, p), title: isQ ? T.L('quiz') : subTitle(t, p), 'aria-current': p === page ? 'page' : null
      }, [el('span.dot', { text: isQ ? '✎' : String(n + 1) }), el('span.step-label', { text: isQ ? T.L('quiz') : subTitle(t, p) })]);
    }));
  }

  function reviewNote(t, rv, page) {
    var onList = rv.subs.indexOf(page) >= 0;
    return el('div.review-note' + (onList ? '.on-list' : ''), null, [
      el('div', null, [el('strong', { text: T.L('lastAttempt', { score: Math.round(rv.attempt.score * 100) + '%' }) }), ' ',
        el('span', { text: onList ? T.L('reviewThis') : T.L('reviewThese') })]),
      el('ul.review-list', null, rv.subs.map(function (r) {
        return el('li', null, [r === page ? el('strong', { text: '▸ ' + subTitle(t, r) }) : el('a', { href: href(t, r), text: subTitle(t, r) })]);
      })),
      page !== 'quiz' ? el('a.btn.small.primary', { href: href(t, 'quiz'), text: '↩ ' + T.L('backToQuiz') }) : null
    ]);
  }

  function updatePager(i, page) {
    var t = A.topics[i], pages = pagesOf(t), k = pages.indexOf(page), pager = T.clear(A.pager);
    /* left: previous part, or previous topic */
    if (k > 0) pager.appendChild(el('a.btn.pager-prev', { href: href(t, pages[k - 1]) }, [el('small', { text: T.L('prev') }), el('span', { text: '← ' + (pages[k - 1] === 'quiz' ? T.L('quiz') : subTitle(t, pages[k - 1])) })]));
    else if (i > 0) { var pt = A.topics[i - 1], pp = pagesOf(pt); pager.appendChild(el('a.btn.pager-prev', { href: href(pt, pp[pp.length - 1]) }, [el('small', { text: T.L('prevTopic') }), el('span', { text: '← ' + pt.title })])); }
    else pager.appendChild(el('span'));
    /* right: next part / quiz / complete / next topic */
    if (page === 'quiz') {
      pager.appendChild(passed(t) || preview() ? nextTopicButton(i) : el('span.btn.disabled.pager-next', { title: T.L('passQuizFirst') }, [el('small', { text: T.L('passQuizFirst') }), el('span', { text: '🔒 ' + T.L('next') })]));
    } else if (k >= 0 && k < pages.length - 1) {
      var nx = pages[k + 1];
      pager.appendChild(el('a.btn.primary.pager-next', { href: href(t, nx) }, [el('small', { text: nx === 'quiz' ? T.L('finishTopic') : T.L('nextPart') }), el('span', { text: (nx === 'quiz' ? '✎ ' + T.L('toQuiz') : subTitle(t, nx)) + ' →' })]));
    } else { /* last part of a topic without quiz */
      if (passed(t)) pager.appendChild(nextTopicButton(i));
      else pager.appendChild(el('button.btn.primary.pager-next', { type: 'button', onclick: function () { P.complete(t.id); afterPass(t); renderToc(); updatePager(i, page); } },
        [el('small', { text: T.L('finishTopic') }), el('span', { text: '✓ ' + T.L('complete') })]));
    }
  }
  function nextTopicButton(i) {
    if (i + 1 < A.topics.length) return el('a.btn.primary.pager-next', { href: href(A.topics[i + 1]) }, [el('small', { text: T.L('next') }), el('span', { text: A.topics[i + 1].title + ' →' })]);
    if (A.cert && A.cert.enabled !== false) return el('a.btn.primary.pager-next', { href: '#certificate' }, [el('small', { text: T.L('allDone') }), el('span', { text: '★ ' + T.L('certificate') })]);
    return el('span.btn.disabled', { text: '✓ ' + T.L('allDone') });
  }

  function onQuizResult(t, r) {
    var was = passed(t);
    P.attempt(t.id, r);
    T.emit('quizAttempt', { topicId: t.id, score: r.score, passed: r.passed, correct: r.correct, total: r.total, wrong: r.wrong, threshold: r.threshold });
    if (r.passed && !was) afterPass(t);
    renderToc();
    updatePager(A.topics.indexOf(t), 'quiz');
    var old = A.main.querySelector('.review-note'); if (old) old.remove(); /* it described the previous attempt */
  }
  function afterPass(t) {
    T.emit('topicPassed', { topicId: t.id, score: P.topic(t.id).bestScore });
    if (allPassed() && !P.state.completedAt) {
      P.state.completedAt = new Date().toISOString();
      P.commit('completed');
      T.emit('completed', { completedAt: P.state.completedAt, averageScore: avgScore(), state: P.state });
    }
  }
  function avgScore() {
    var sc = A.topics.map(function (t) { var x = P.state.topics[t.id]; return x && x.bestScore != null ? x.bestScore : (preview() ? 1 : 0); });
    return sc.reduce(function (a, b) { return a + b; }, 0) / Math.max(1, sc.length);
  }

  function showLocked(i) {
    var main = T.clear(A.main);
    A.current = A.topics[i].id; A.page = null; renderToc();
    var firstOpen = 0; for (var k = 0; k < A.topics.length; k++) if (!passed(A.topics[k])) { firstOpen = k; break; }
    var ft = A.topics[firstOpen], q = hasQuiz(ft) ? 'quiz' : pagesOf(ft)[0];
    main.appendChild(el('div.locked-card', null, [
      el('div.lock-icon', { text: '🔒' }), el('h1', { text: A.topics[i].title }), el('p', { text: T.L('lockedMsg') }),
      el('a.btn.primary', { href: href(ft, q), text: T.L('goTo') + ': ' + ft.title })]));
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
  }

  /* ---------------- certificate page ---------------- */
  function showCertificate() {
    var main = T.clear(A.main); A.current = '#certificate'; A.page = null; renderToc();
    var cfg = A.cert || {};
    main.appendChild(el('header.topic-head', null, [el('h1', { text: T.L('certificate') })]));
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    if (preview()) return certificatePreview(main, cfg);
    if (!allPassed()) {
      main.appendChild(el('div.locked-card', null, [el('div.lock-icon', { text: '🔒' }), el('p', { text: T.L('certLocked') }),
        el('ul.remaining', null, A.topics.filter(function (t) { return !passed(t); }).map(function (t) { return el('li', null, [el('a', { href: href(t), text: t.title })]); }))]));
      return;
    }
    var user = A.cfg.user || {};
    var given = (P.state.certificate && P.state.certificate.name) || user.name || '';
    var locked = !!(A.cfg.lockName && user.name);
    var date = P.state.completedAt || A.topics.map(function (t) { return P.topic(t.id).passedAt || ''; }).sort().pop() || new Date().toISOString();
    var input = el('input.name-input', { type: 'text', value: locked ? user.name : given, placeholder: T.L('certName'), 'aria-label': T.L('certName'), readonly: locked });
    var out = el('div.cert-out');
    var printBtn = el('button.btn', { type: 'button', text: '⎙ ' + T.L('certPrint'), hidden: true, onclick: function () { window.print(); } });
    function make(silent) {
      var name = input.value.trim(); if (!name) { input.focus(); return; }
      var cert = T.renderCertificate(cfg, A.training, { name: name, score: avgScore(), date: date });
      T.clear(out).appendChild(cert);
      printBtn.hidden = false;
      var prev = P.state.certificate || {};
      if (prev.name !== name || prev.id !== cert.getAttribute('data-cert-id')) {
        P.state.certificate = { name: name, id: cert.getAttribute('data-cert-id'), issuedAt: prev.issuedAt && prev.name === name ? prev.issuedAt : new Date().toISOString(), score: avgScore() };
        P.commit('certificate');
        if (!silent) T.emit('certificate', P.state.certificate);
      }
    }
    main.appendChild(el('div.cert-form', null, [el('p', { text: T.L('certReady') }),
      el('div.cert-row', null, [input, el('button.btn.primary', { type: 'button', text: T.L('certCreate'), onclick: function () { make(false); } }), printBtn])]));
    main.appendChild(out);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') make(false); });
    if (given || locked) make(true);
  }

  /* Preview: sample certificate + live style controls (not saved — copy the JSON into certificate.json). */
  function certificatePreview(main, cfg) {
    var style = Object.assign({ design: 'classic', font: 'serif', orientation: 'landscape', accent: '#1f4e79', accent2: '#c9a227', paper: '#fffdf7', ink: '#1d2433' }, cfg.style || {});
    var name = el('input.name-input', { type: 'text', value: (A.cfg.user && A.cfg.user.name) || T.L('sampleName'), 'aria-label': T.L('certName') });
    function sel(key, values) {
      var s = el('select', null, values.map(function (v) { return el('option', { value: v, selected: style[key] === v, text: v }); }));
      s.addEventListener('change', function () { style[key] = s.value; draw(); });
      return el('label', null, [el('span', { text: T.L('cert_' + key) }), s]);
    }
    function color(key) {
      var c = el('input', { type: 'color', value: style[key] });
      c.addEventListener('input', function () { style[key] = c.value; draw(); });
      return el('label', null, [el('span', { text: T.L('cert_' + key) }), c]);
    }
    var json = el('pre.cert-json');
    var out = el('div.cert-out');
    function draw() {
      var c = Object.assign({}, cfg, { style: style });
      T.clear(out).appendChild(T.renderCertificate(c, A.training, { name: name.value.trim() || T.L('sampleName'), score: 0.95, date: new Date().toISOString() }));
      json.textContent = '"style": ' + JSON.stringify(style, null, 2);
    }
    name.addEventListener('input', draw);
    main.appendChild(el('div.callout.info.cert-preview-note', null, [el('div.callout-title', { text: T.L('certPreviewTitle') }), el('div.md', { html: MD.render(T.L('certPreviewNote')) })]));
    main.appendChild(el('div.cert-panel', null, [
      el('label.wide', null, [el('span', { text: T.L('certName') }), name]),
      sel('design', ['classic', 'modern', 'minimal']), sel('font', ['serif', 'sans']), sel('orientation', ['landscape', 'portrait']),
      color('accent'), color('accent2'), color('paper'), color('ink'),
      el('button.btn.small', { type: 'button', text: '⎙ ' + T.L('certPrint'), onclick: function () { window.print(); } })
    ]));
    main.appendChild(out);
    main.appendChild(el('details.cert-json-box', null, [el('summary', { text: T.L('certStyleJson') }), json]));
    draw();
  }

  /* ---------------- small UI helpers ---------------- */
  function toast(msg, kind) {
    var t = el('div.toast' + (kind ? '.' + kind : ''), { role: 'status', text: msg });
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 400); }, 4000);
  }

  /* ---------------- integration: messages from a parent page + JS API ---------------- */
  function listenToParent() {
    if (window.parent === window) return;
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.target !== 'semitec-training') return;
      if (A.cfg.parentOrigin && A.cfg.parentOrigin !== '*' && e.origin !== A.cfg.parentOrigin) return;
      if (d.type === 'navigate' && d.hash) location.hash = d.hash;
      else if (d.type === 'getState') T.emit('state', { state: P.state });
      else if (d.type === 'reset') { P.reset(); renderToc(); location.hash = href(A.topics[0]); }
    });
  }
  function exposeAPI() {
    window.TrainingAPI = {
      getState: function () { return JSON.parse(JSON.stringify(P.state)); },
      getConfig: function () { return Object.assign({}, A.cfg, { adapter: undefined, token: A.cfg.token ? '***' : '' }); },
      navigate: function (hash) { location.hash = hash; },
      reset: function () { P.reset(); renderToc(); location.hash = href(A.topics[0]); },
      flush: function () { return P.flush(); },
      on: T.on
    };
  }

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  document.addEventListener('DOMContentLoaded', boot);
})();

</script>
</body>
</html>
