<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Two AMBA handshakes in one picture</text>
<g data-step="1" data-until="1"><text x="185" y="83" text-anchor="end" font-size="14" font-weight="800" fill="#6c4fb3" >PCLK</text><text x="185" y="123" text-anchor="end" font-size="14" font-weight="800" fill="#6c4fb3" >PSEL</text><text x="185" y="163" text-anchor="end" font-size="14" font-weight="800" fill="#6c4fb3" >PENABLE</text><text x="185" y="203" text-anchor="end" font-size="14" font-weight="800" fill="#6c4fb3" >PADDR, PWRITE</text><text x="185" y="243" text-anchor="end" font-size="14" font-weight="800" fill="#6c4fb3" >PWDATA</text><text x="185" y="283" text-anchor="end" font-size="14" font-weight="800" fill="#6c4fb3" >PREADY</text><path d="M200 86 V70 H250.0 V86 H300 V70 H350.0 V86 H400 V70 H450.0 V86 H500 V70 H550.0 V86 H600 V70 H650.0 V86 H700 V70 H750.0 V86 H800" fill="none" stroke="#34495e" stroke-width="2"/><path d="M200 126 H300 V110 H400 V110 H500 V126 H600 V126 H700 V126 H800" fill="none" stroke="#6c4fb3" stroke-width="2.5"/><path d="M200 166 H300 V166 H400 V150 H500 V166 H600 V166 H700 V166 H800" fill="none" stroke="#6c4fb3" stroke-width="2.5"/><path d="M200 198 H300" stroke="#7a8a99" stroke-width="2"/><path d="M304 190 H396 L400 198 L396 206 H304 L300 198 Z" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="350.0" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#6c4fb3" >A, W</text><path d="M404 190 H496 L500 198 L496 206 H404 L400 198 Z" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="450.0" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#6c4fb3" >A, W</text><path d="M500 198 H800" stroke="#7a8a99" stroke-width="2"/><path d="M200 238 H300" stroke="#7a8a99" stroke-width="2"/><path d="M304 230 H396 L400 238 L396 246 H304 L300 238 Z" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="350.0" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#6c4fb3" >D</text><path d="M404 230 H496 L500 238 L496 246 H404 L400 238 Z" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="450.0" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#6c4fb3" >D</text><path d="M500 238 H800" stroke="#7a8a99" stroke-width="2"/><path d="M200 286 H300 V286 H400 V270 H500 V286 H600 V286 H700 V286 H800" fill="none" stroke="#6c4fb3" stroke-width="2.5"/><text x="350.0" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#6c4fb3" >setup</text><text x="450.0" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#6c4fb3" >access</text><text x="450" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" >APB: a setup cycle (PSEL) then an access cycle (PENABLE); the transfer ends when PREADY = 1.</text></g>
<g data-step="2" data-until="2"><text x="185" y="83" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb" >ACLK</text><text x="185" y="133" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb" >VALID</text><text x="185" y="183" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb" >READY</text><text x="185" y="233" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb" >DATA</text><path d="M200 86 V70 H250.0 V86 H300 V70 H350.0 V86 H400 V70 H450.0 V86 H500 V70 H550.0 V86 H600 V70 H650.0 V86 H700 V70 H750.0 V86 H800" fill="none" stroke="#34495e" stroke-width="2"/><path d="M200 136 H300 V120 H400 V120 H500 V120 H600 V136 H700 V136 H800" fill="none" stroke="#1f6feb" stroke-width="2.5"/><path d="M200 186 H300 V186 H400 V186 H500 V170 H600 V186 H700 V186 H800" fill="none" stroke="#1e8449" stroke-width="2.5"/><path d="M200 228 H300" stroke="#7a8a99" stroke-width="2"/><path d="M304 220 H396 L400 228 L396 236 H304 L300 228 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="350.0" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >D</text><path d="M404 220 H496 L500 228 L496 236 H404 L400 228 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="450.0" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >D</text><path d="M504 220 H596 L600 228 L596 236 H504 L500 228 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="550.0" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >D</text><path d="M600 228 H800" stroke="#7a8a99" stroke-width="2"/><rect x="500" y="60" width="100" height="185" fill="#1e8449" opacity="0.12"/><text x="550.0" y="270" text-anchor="middle" font-size="14" font-weight="800" fill="#1e8449" >transfer</text><text x="450" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" >AXI: the source raises VALID and holds the data; the destination raises READY when it can accept.</text><text x="450" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" >A transfer happens in every clock where VALID and READY are both 1 — on each of the five channels.</text></g>
</svg>
