<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Asynchronous FIFO: two clocks, Gray-code pointers</text>
<rect x="30" y="60" width="260" height="350" rx="8" fill="#eaf2fd" stroke="#1f6feb" stroke-width="2" stroke-dasharray="8 5"/><text x="160" y="85" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6feb" >write clock domain</text><rect x="610" y="60" width="260" height="350" rx="8" fill="#eaf7ef" stroke="#1e8449" stroke-width="2" stroke-dasharray="8 5"/><text x="740" y="85" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449" >read clock domain</text><rect x="340" y="140" width="220" height="120" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="450.0" y="206.0" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00" >dual-clock RAM</text><rect x="60" y="140" width="200" height="50" rx="6" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/><text x="160" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79" >wptr (binary → Gray)</text><path d="M260 165 H338" fill="none" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#mb)"/><rect x="640" y="140" width="200" height="50" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="2"/><text x="740" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449" >rptr (binary → Gray)</text><path d="M560 165 H638" fill="none" stroke="#1e8449" stroke-width="2.5"/><rect x="640" y="230" width="200" height="50" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="2"/><text x="740" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#1e8449" >empty = (rptr == wptr_sync)</text><rect x="60" y="230" width="200" height="50" rx="6" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/><text x="160" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4e79" >full: compare with rptr_sync</text><rect x="400" y="300" width="100" height="40" rx="6" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><text x="450" y="325" text-anchor="middle" font-size="13" font-weight="800" fill="#8a6d00" >2-FF sync</text><path d="M160 190 V320 H398" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#mb)"/><path d="M500 320 H740 V282" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><rect x="400" y="355" width="100" height="40" rx="6" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><text x="450" y="380" text-anchor="middle" font-size="13" font-weight="800" fill="#8a6d00" >2-FF sync</text><path d="M740 190 V375 H502" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><path d="M398 375 H160 V282" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#mb)"/><text x="450" y="425" text-anchor="middle" font-size="13" font-weight="400" fill="#7a8a99" >Gray code changes one bit per step, so a pointer sampled in the other clock domain is never wildly wrong.</text></svg>
