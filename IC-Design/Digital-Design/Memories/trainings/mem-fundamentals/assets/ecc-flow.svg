<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="460" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">An ECC-protected memory: write, read, correct</text>
<text x="70" y="135" text-anchor="middle" font-size="15" font-weight="800" fill="#34495e" >din</text><path d="M90 130 H138" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><rect x="140" y="100" width="140" height="60" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="210" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >encoder</text><path d="M280 130 H328" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><rect x="330" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="337" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="344" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="351" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="358" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="365" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="372" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="379" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="386" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="393" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="400" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="407" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="414" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="421" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="428" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="435" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="442" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="449" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="456" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="463" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="470" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="477" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="484" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="491" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="498" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="505" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="512" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="519" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="526" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="533" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="540" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="547" y="110" width="6" height="40" fill="#fdf7e3" stroke="#c9a227" stroke-width="1"/><rect x="554" y="110" width="6" height="40" fill="#efeafa" stroke="#6c4fb3" stroke-width="1"/><rect x="561" y="110" width="6" height="40" fill="#efeafa" stroke="#6c4fb3" stroke-width="1"/><rect x="568" y="110" width="6" height="40" fill="#efeafa" stroke="#6c4fb3" stroke-width="1"/><rect x="575" y="110" width="6" height="40" fill="#efeafa" stroke="#6c4fb3" stroke-width="1"/><rect x="582" y="110" width="6" height="40" fill="#efeafa" stroke="#6c4fb3" stroke-width="1"/><rect x="589" y="110" width="6" height="40" fill="#efeafa" stroke="#6c4fb3" stroke-width="1"/><rect x="596" y="110" width="6" height="40" fill="#efeafa" stroke="#6c4fb3" stroke-width="1"/><text x="442" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6d00" >32 data bits</text><text x="585" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#6c4fb3" >7 check</text><path d="M605 130 H648" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><rect x="650" y="100" width="140" height="60" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="720" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >decoder</text><path d="M790 130 H840" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><text x="860" y="126" text-anchor="middle" font-size="14" font-weight="800" fill="#34495e" >dout</text><text x="720" y="185" text-anchor="middle" font-size="14" font-weight="800" fill="#34495e" font-family="Consolas, Menlo, monospace">ce   ue</text><g data-step="1" data-until="1"><text x="450" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >Write: the encoder computes 7 check bits; the memory stores 39 bits per word.</text><path d="M210 160 V200 H500 V152" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mb)"/></g>
<g data-step="2" data-until="2"><text x="450" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#1e8449" >Clean read: the syndrome is 0 — data passes through, ce = ue = 0.</text><text x="720" y="215" text-anchor="middle" font-size="14" font-weight="800" fill="#1e8449" font-family="Consolas, Menlo, monospace">0    0</text></g>
<g data-step="3" data-until="3"><text x="450" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#d35400" >One bit flipped (e.g. a particle strike): the syndrome points to it — corrected, ce = 1.</text><rect x="407" y="110" width="6" height="40" fill="#c0392b"/><text x="720" y="215" text-anchor="middle" font-size="14" font-weight="800" fill="#d35400" font-family="Consolas, Menlo, monospace">1    0</text><text x="720" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#d35400" >bit 11 flipped back</text></g>
<g data-step="4" data-until="4"><text x="450" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b" >Two bits flipped: detected but not correctable — ue = 1; the system must react.</text><rect x="407" y="110" width="6" height="40" fill="#c0392b"/><rect x="505" y="110" width="6" height="40" fill="#c0392b"/><text x="720" y="215" text-anchor="middle" font-size="14" font-weight="800" fill="#c0392b" font-family="Consolas, Menlo, monospace">0    1</text><text x="720" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b" >error reported</text></g>
<rect x="140" y="290" width="620" height="80" rx="8" fill="#f4f7fb" stroke="#c8d3df" stroke-width="2"/><text x="450" y="318" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >SECDED = Single Error Correction, Double Error Detection</text><text x="450" y="345" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e" >32 data bits → 7 check bits (39,32) · 64 data bits → 8 check bits (72,64)</text></svg>
