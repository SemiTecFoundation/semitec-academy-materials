<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Access time across the hierarchy (log scale)</text>
<line x1="200" y1="70" x2="200" y2="350" stroke="#e3e8ee" stroke-width="1.5"/><text x="200" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99" >0.1 ns</text><line x1="295" y1="70" x2="295" y2="350" stroke="#e3e8ee" stroke-width="1.5"/><text x="295" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99" >1 ns</text><line x1="390" y1="70" x2="390" y2="350" stroke="#e3e8ee" stroke-width="1.5"/><text x="390" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99" >10 ns</text><line x1="485" y1="70" x2="485" y2="350" stroke="#e3e8ee" stroke-width="1.5"/><text x="485" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99" >100 ns</text><line x1="580" y1="70" x2="580" y2="350" stroke="#e3e8ee" stroke-width="1.5"/><text x="580" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99" >1 µs</text><line x1="675" y1="70" x2="675" y2="350" stroke="#e3e8ee" stroke-width="1.5"/><text x="675" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99" >10 µs</text><line x1="770" y1="70" x2="770" y2="350" stroke="#e3e8ee" stroke-width="1.5"/><text x="770" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99" >100 µs</text><text x="185" y="102" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >register</text><rect x="200" y="84" width="45.32651919836792" height="26" rx="4" fill="#6c4fb3" opacity="0.8"/><text x="253.32651919836792" y="103" text-anchor="start" font-size="14" font-weight="800" fill="#6c4fb3" >0.3 ns</text><text x="185" y="147" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >L1 SRAM</text><rect x="200" y="129" width="95.0" height="26" rx="4" fill="#1f6feb" opacity="0.8"/><text x="303.0" y="148" text-anchor="start" font-size="14" font-weight="800" fill="#1f6feb" >1 ns</text><text x="185" y="192" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >L2 SRAM</text><rect x="200" y="174" width="152.19569917615644" height="26" rx="4" fill="#1f6feb" opacity="0.8"/><text x="360.19569917615644" y="193" text-anchor="start" font-size="14" font-weight="800" fill="#1f6feb" >4 ns</text><text x="185" y="237" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >L3 SRAM</text><rect x="200" y="219" width="206.72866961028973" height="26" rx="4" fill="#1f6feb" opacity="0.8"/><text x="414.7286696102897" y="238" text-anchor="start" font-size="14" font-weight="800" fill="#1f6feb" >15 ns</text><text x="185" y="282" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >DRAM</text><rect x="200" y="264" width="275.79354876423463" height="26" rx="4" fill="#1e8449" opacity="0.8"/><text x="483.79354876423463" y="283" text-anchor="start" font-size="14" font-weight="800" fill="#1e8449" >80 ns</text><text x="185" y="327" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >flash SSD</text><rect x="200" y="309" width="541.4021504119218" height="26" rx="4" fill="#d35400" opacity="0.8"/><text x="749.4021504119218" y="328" text-anchor="start" font-size="14" font-weight="800" fill="#d35400" >50 µs</text><text x="450" y="405" text-anchor="middle" font-size="14" font-weight="400" fill="#7a8a99" >Each level down is roughly 3–10× slower; flash is about a thousand times slower than DRAM.</text></svg>
