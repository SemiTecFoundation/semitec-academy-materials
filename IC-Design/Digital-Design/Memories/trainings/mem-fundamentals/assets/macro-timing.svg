<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Timing of a synchronous memory macro</text>
<text x="150" y="95" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >clk</text><text x="150" y="175" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >addr / we / din</text><text x="150" y="265" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >q</text><path d="M170 100 H230 V80 H380 V100 H530 V80 H680 V100 H830" fill="none" stroke="#34495e" stroke-width="2.5"/><path d="M170 180 H180 L188 170 H342 L350 180 L342 190 H188 L180 180 M350 180 L358 170 H830 M350 180 L358 190 H830" fill="none" stroke="#34495e" stroke-width="2"/><text x="265" y="185" text-anchor="middle" font-size="14" font-weight="800" fill="#34495e" >A1</text><text x="590" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#7a8a99" >next</text><path d="M170 270 H300 L308 260 H520 M300 270 L308 280 H520 L528 270" fill="none" stroke="#34495e" stroke-width="2"/><text x="268" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#7a8a99" >old</text><text x="415" y="275" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6feb" >M[A1]</text><line x1="230" y1="70" x2="230" y2="300" stroke="#c8d3df" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="530" y1="70" x2="530" y2="300" stroke="#c8d3df" stroke-width="1.5" stroke-dasharray="4 4"/><g data-step="1"><rect x="190" y="160" width="40" height="40" fill="#d35400" opacity="0.25"/><path d="M190 145 H228" fill="none" stroke="#d35400" stroke-width="2" marker-end="url(#mo)"/><text x="210" y="138" text-anchor="middle" font-size="14" font-weight="800" fill="#d35400" >tSU</text></g>
<g data-step="2"><rect x="230" y="160" width="25" height="40" fill="#c0392b" opacity="0.25"/><text x="243" y="138" text-anchor="middle" font-size="14" font-weight="800" fill="#c0392b" >tH</text></g>
<g data-step="3"><path d="M230 300 H298" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#mb)"/><text x="265" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6feb" >tCQ</text></g>
<g data-step="4"><path d="M230 345 H528" fill="none" stroke="#6c4fb3" stroke-width="2" marker-end="url(#mp)"/><text x="380" y="338" text-anchor="middle" font-size="14" font-weight="800" fill="#6c4fb3" >tCYC — minimum clock period</text></g>
<g data-step="1" data-until="1"><text x="450" y="385" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >Setup time tSU: inputs must be stable this long BEFORE the rising edge.</text></g>
<g data-step="2" data-until="2"><text x="450" y="385" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >Hold time tH: inputs must stay stable this long AFTER the edge.</text></g>
<g data-step="3" data-until="3"><text x="450" y="385" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >Clock-to-output tCQ (access time): read data is valid this long after the edge.</text></g>
<g data-step="4" data-until="4"><text x="450" y="385" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >Cycle time tCYC: the macro can accept one new access per tCYC.</text></g>
</svg>
