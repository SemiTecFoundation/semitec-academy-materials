<rect width="900" height="520" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">How each memory stores a bit</text>
<rect x="30" y="60" width="260" height="210" rx="10" fill="#fbfcfd" stroke="#c8d3df" stroke-width="2"/><text x="160" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >SRAM — 6 transistors</text><rect x="320" y="60" width="260" height="210" rx="10" fill="#fbfcfd" stroke="#c8d3df" stroke-width="2"/><text x="450" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >DRAM — 1T + 1C</text><rect x="610" y="60" width="260" height="210" rx="10" fill="#fbfcfd" stroke="#c8d3df" stroke-width="2"/><text x="740" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >ROM — transistor or not</text><rect x="30" y="290" width="260" height="210" rx="10" fill="#fbfcfd" stroke="#c8d3df" stroke-width="2"/><text x="160" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >Flash — floating gate</text><rect x="320" y="290" width="260" height="210" rx="10" fill="#fbfcfd" stroke="#c8d3df" stroke-width="2"/><text x="450" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >eFuse — a link</text><rect x="610" y="290" width="260" height="210" rx="10" fill="#fbfcfd" stroke="#c8d3df" stroke-width="2"/><text x="740" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >MRAM — magnetic junction</text><polygon points="140,136 166,150 140,164" fill="#ffffff" stroke="#34495e" stroke-width="2"/><circle cx="170" cy="150" r="4" fill="#fff" stroke="#34495e" stroke-width="2"/><polygon points="166,186 140,200 166,214" fill="#ffffff" stroke="#34495e" stroke-width="2"/><circle cx="136" cy="200" r="4" fill="#fff" stroke="#34495e" stroke-width="2"/><path d="M174 150 H190 V200 H170" fill="none" stroke="#34495e" stroke-width="2.5"/><path d="M136 200 H122 V150 H140" fill="none" stroke="#34495e" stroke-width="2.5"/><rect x="70" y="165" width="30" height="30" rx="4" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><rect x="220" y="165" width="30" height="30" rx="4" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="85" y="185" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6feb" >A</text><text x="235" y="185" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6feb" >A</text><path d="M100 180 H122" fill="none" stroke="#34495e" stroke-width="2.5"/><path d="M190 180 H220" fill="none" stroke="#34495e" stroke-width="2.5"/><text x="160" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >two inverters keep the bit</text><rect x="415" y="130" width="40" height="40" rx="4" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="435" y="155" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6feb" >T</text><path d="M435 170 V195" fill="none" stroke="#34495e" stroke-width="2.5"/><line x1="415" y1="197" x2="455" y2="197" stroke="#34495e" stroke-width="3"/><line x1="415" y1="207" x2="455" y2="207" stroke="#34495e" stroke-width="3"/><path d="M435 207 V225" fill="none" stroke="#34495e" stroke-width="2.5"/><text x="480" y="205" text-anchor="start" font-size="13" font-weight="700" fill="#1e8449" >charge</text><text x="450" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >leaks → refresh needed</text><line x1="650" y1="130" x2="830" y2="130" stroke="#1f6feb" stroke-width="2"/><line x1="680" y1="110" x2="680" y2="220" stroke="#6c4fb3" stroke-width="2"/><line x1="650" y1="165" x2="830" y2="165" stroke="#1f6feb" stroke-width="2"/><line x1="740" y1="110" x2="740" y2="220" stroke="#6c4fb3" stroke-width="2"/><line x1="650" y1="200" x2="830" y2="200" stroke="#1f6feb" stroke-width="2"/><line x1="800" y1="110" x2="800" y2="220" stroke="#6c4fb3" stroke-width="2"/><circle cx="680" cy="130" r="7" fill="#1f4e79"/><circle cx="740" cy="165" r="7" fill="#1f4e79"/><circle cx="800" cy="130" r="7" fill="#1f4e79"/><circle cx="680" cy="200" r="7" fill="#1f4e79"/><circle cx="800" cy="200" r="7" fill="#1f4e79"/><text x="740" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >dot = transistor = stored 0</text><rect x="80" y="335" width="160" height="30" rx="4" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="160" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >control gate</text><rect x="80" y="369" width="160" height="30" rx="4" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/><text x="160" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b" >floating gate  e⁻ e⁻</text><rect x="80" y="403" width="160" height="30" rx="4" fill="#f4f7fb" stroke="#7a8a99" stroke-width="2"/><text x="160" y="423" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99" >thin oxide</text><rect x="80" y="437" width="160" height="30" rx="4" fill="#e8f6ee" stroke="#1e8449" stroke-width="2"/><text x="160" y="457" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449" >channel</text><text x="160" y="485" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >trapped charge shifts Vth</text><path d="M360 370 H420 L435 380 H465 L480 370 H540 V400 H480 L465 390 H435 L420 400 H360 Z" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><text x="450" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6d00" >intact = 0</text><polygon points="360,430 420,430 432,445 420,460 360,460" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><polygon points="468,445 480,430 540,430 540,460 480,460" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><text x="450" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b" >blown once = 1, for ever</text><rect x="670" y="340" width="140" height="34" rx="4" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><path d="M700 357 H780" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#mb)"/><rect x="670" y="380" width="140" height="18" rx="3" fill="#f4f7fb" stroke="#7a8a99" stroke-width="2"/><rect x="670" y="404" width="140" height="34" rx="4" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><path d="M700 421 H780" fill="none" stroke="#6c4fb3" stroke-width="3" marker-end="url(#mp)"/><text x="825" y="362" text-anchor="start" font-size="12" font-weight="700" fill="#1f6feb" >free</text><text x="825" y="394" text-anchor="start" font-size="12" font-weight="700" fill="#7a8a99" >barrier</text><text x="825" y="426" text-anchor="start" font-size="12" font-weight="700" fill="#6c4fb3" >fixed</text><text x="740" y="470" text-anchor="middle" font-size="12" font-weight="400" fill="#34495e" >parallel = low R, anti-parallel = high R</text></svg>
