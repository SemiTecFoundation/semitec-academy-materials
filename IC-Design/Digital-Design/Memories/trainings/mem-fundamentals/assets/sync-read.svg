<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="450" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Synchronous memory: write, then read with latency 1 and 2</text>
<text x="185" y="83" text-anchor="end" font-size="14" font-weight="800" fill="#1f4e79" >clk</text><text x="185" y="123" text-anchor="end" font-size="14" font-weight="800" fill="#1f4e79" >en</text><text x="185" y="163" text-anchor="end" font-size="14" font-weight="800" fill="#1f4e79" >we</text><text x="185" y="203" text-anchor="end" font-size="14" font-weight="800" fill="#1f4e79" >addr</text><text x="185" y="243" text-anchor="end" font-size="14" font-weight="800" fill="#1f4e79" >din</text><text x="185" y="303" text-anchor="end" font-size="14" font-weight="800" fill="#1f4e79" >dout (latency 1)</text><text x="185" y="363" text-anchor="end" font-size="14" font-weight="800" fill="#1f4e79" >dout (latency 2)</text><path d="M200 86 V70 H241.0 V86 H282 V70 H323.0 V86 H364 V70 H405.0 V86 H446 V70 H487.0 V86 H528 V70 H569.0 V86 H610 V70 H651.0 V86 H692 V70 H733.0 V86 H774 V70 H815.0 V86 H856" fill="none" stroke="#34495e" stroke-width="2"/><path d="M200 126 H282 V110 H364 V110 H446 V110 H528 V126 H610 V126 H692 V126 H774 V126 H856" fill="none" stroke="#34495e" stroke-width="2.5"/><path d="M200 166 H282 V150 H364 V166 H446 V166 H528 V166 H610 V166 H692 V166 H774 V166 H856" fill="none" stroke="#34495e" stroke-width="2.5"/><path d="M200 198 H282" stroke="#7a8a99" stroke-width="2"/><path d="M286 190 H360 L364 198 L360 206 H286 L282 198 Z" fill="#ffffff" stroke="#34495e" stroke-width="2"/><text x="323.0" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e" >A0</text><path d="M368 190 H442 L446 198 L442 206 H368 L364 198 Z" fill="#ffffff" stroke="#34495e" stroke-width="2"/><text x="405.0" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e" >A0 </text><path d="M450 190 H524 L528 198 L524 206 H450 L446 198 Z" fill="#ffffff" stroke="#34495e" stroke-width="2"/><text x="487.0" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e" >A1</text><path d="M528 198 H856" stroke="#7a8a99" stroke-width="2"/><path d="M200 238 H282" stroke="#7a8a99" stroke-width="2"/><path d="M286 230 H360 L364 238 L360 246 H286 L282 238 Z" fill="#ffffff" stroke="#34495e" stroke-width="2"/><text x="323.0" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e" >11</text><path d="M364 238 H856" stroke="#7a8a99" stroke-width="2"/><line x1="200" y1="66" x2="200" y2="372" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="282" y1="66" x2="282" y2="372" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="364" y1="66" x2="364" y2="372" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="446" y1="66" x2="446" y2="372" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="528" y1="66" x2="528" y2="372" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="610" y1="66" x2="610" y2="372" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="692" y1="66" x2="692" y2="372" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="774" y1="66" x2="774" y2="372" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="856" y1="66" x2="856" y2="372" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><g data-step="1"><path d="M200 298 H364" stroke="#7a8a99" stroke-width="2"/><path d="M368 290 H442 L446 298 L442 306 H368 L364 298 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="405.0" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >old</text><path d="M446 298 H856" stroke="#7a8a99" stroke-width="2"/><rect x="284" y="104" width="78" height="150" rx="6" fill="none" stroke="#d35400" stroke-width="3"/></g>
<g data-step="1" data-until="1"><text x="450" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#d35400" >Cycle 1: en = we = 1 — the clock edge writes 11 into A0 (the read port shows the old A0).</text></g>
<g data-step="2"><path d="M200 298 H364" stroke="#7a8a99" stroke-width="2"/><path d="M368 290 H442 L446 298 L442 306 H368 L364 298 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="405.0" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >old</text><path d="M450 290 H524 L528 298 L524 306 H450 L446 298 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="487.0" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >11</text><path d="M528 298 H856" stroke="#7a8a99" stroke-width="2"/></g>
<g data-step="2" data-until="2"><text x="450" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6feb" >Cycle 2: read A0. The data appears AFTER the next clock edge — read latency 1.</text></g>
<g data-step="3"><path d="M200 298 H364" stroke="#7a8a99" stroke-width="2"/><path d="M368 290 H442 L446 298 L442 306 H368 L364 298 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="405.0" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >old</text><path d="M450 290 H524 L528 298 L524 306 H450 L446 298 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="487.0" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >11</text><path d="M532 290 H852 L856 298 L852 306 H532 L528 298 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="692.0" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >22</text></g>
<g data-step="3" data-until="3"><text x="450" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6feb" >Back-to-back reads give one word per clock; dout holds its value while en = 0.</text></g>
<g data-step="4"><path d="M200 358 H446" stroke="#7a8a99" stroke-width="2"/><path d="M450 350 H524 L528 358 L524 366 H450 L446 358 Z" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="487.0" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#6c4fb3" >old</text><path d="M532 350 H606 L610 358 L606 366 H532 L528 358 Z" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="569.0" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#6c4fb3" >11</text><path d="M614 350 H852 L856 358 L852 366 H614 L610 358 Z" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="733.0" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#6c4fb3" >22</text></g>
<g data-step="4" data-until="4"><text x="450" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#6c4fb3" >With an output register, every word arrives one clock later — latency 2, but a faster clock.</text></g>
</svg>
