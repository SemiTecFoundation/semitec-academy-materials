e x1="810" y1="66" x2="810" y2="300" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="890" y1="66" x2="890" y2="300" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><text x="450" y="335" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e" >Each pushed word is stored at a clock edge; each pop delivers the oldest word one clock later.</text><text x="450" y="360" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e" >empty falls after the first push and rises again after the last pop.</text></svg>
