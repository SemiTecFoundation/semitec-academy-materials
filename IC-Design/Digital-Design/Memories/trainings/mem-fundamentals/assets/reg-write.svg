<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Writing a word, register by register</text>
<rect x="60" y="110" width="130" height="240" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="125" y="215" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >write</text><text x="125" y="237" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >decoder</text><text x="125" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >2 → 4</text><path d="M20 150 H58" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#mb)"/><text x="20" y="140" text-anchor="start" font-size="13" font-weight="700" fill="#1f6feb" >waddr</text><path d="M20 310 H58" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#mb)"/><text x="20" y="300" text-anchor="start" font-size="13" font-weight="700" fill="#1f6feb" >we</text><text x="380" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#6c4fb3" >din</text><path d="M380 98 V112" fill="none" stroke="#6c4fb3" stroke-width="2"/><line x1="300" y1="112" x2="460" y2="112" stroke="#6c4fb3" stroke-width="2"/><path d="M190 147 H288" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><text x="240" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#7a8a99" >word_en[0]</text><rect x="290" y="125" width="180" height="44" rx="6" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><text x="320" y="153" text-anchor="start" font-size="13" font-weight="700" fill="#8a6d00" >word 0</text><text x="440" y="154" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">00</text><line x1="300" y1="112" x2="300" y2="125" stroke="#6c4fb3" stroke-width="1" opacity="0.4"/><path d="M470 147 H598" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><path d="M190 205 H288" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><text x="240" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#7a8a99" >word_en[1]</text><rect x="290" y="183" width="180" height="44" rx="6" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><text x="320" y="211" text-anchor="start" font-size="13" font-weight="700" fill="#8a6d00" >word 1</text><text x="440" y="212" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">00</text><line x1="300" y1="112" x2="300" y2="183" stroke="#6c4fb3" stroke-width="1" opacity="0.4"/><path d="M470 205 H598" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><path d="M190 263 H288" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><text x="240" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#7a8a99" >word_en[2]</text><rect x="290" y="241" width="180" height="44" rx="6" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><text x="320" y="269" text-anchor="start" font-size="13" font-weight="700" fill="#8a6d00" >word 2</text><text x="440" y="270" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">00</text><line x1="300" y1="112" x2="300" y2="241" stroke="#6c4fb3" stroke-width="1" opacity="0.4"/><path d="M470 263 H598" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><path d="M190 321 H288" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><text x="240" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#7a8a99" >word_en[3]</text><rect x="290" y="299" width="180" height="44" rx="6" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><text x="320" y="327" text-anchor="start" font-size="13" font-weight="700" fill="#8a6d00" >word 3</text><text x="440" y="328" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">00</text><line x1="300" y1="112" x2="300" y2="299" stroke="#6c4fb3" stroke-width="1" opacity="0.4"/><path d="M470 321 H598" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><polygon points="600,120 650,145 650,330 600,355" fill="#f4f7fb" stroke="#34495e" stroke-width="2.5"/><text x="625" y="108" text-anchor="middle" font-size="13" font-weight="400" fill="#7a8a99" >read mux</text><path d="M625 400 V346" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><text x="625" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449" >raddr</text><g data-step="1" data-until="1"><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >A 4 × 8 memory: a write decoder, four 8-bit registers and a read multiplexer.</text></g>
<g data-step="2" data-until="2"><rect x="192" y="240" width="96" height="19" fill="#ffffff"/><path d="M190 263 H288" fill="none" stroke="#1f6feb" stroke-width="4" marker-end="url(#mb)"/><rect x="290" y="241" width="180" height="44" rx="6" fill="#fff1c9" stroke="#c9a227" stroke-width="3.5"/><text x="320" y="269" text-anchor="start" font-size="13" font-weight="700" fill="#8a6d00" >word 2</text><text x="440" y="270" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">00</text><text x="240" y="256" text-anchor="middle" font-size="12" font-weight="800" fill="#1f6feb" >word_en[2] = 1</text><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >we = 1, waddr = 2: the decoder raises only word_en[2].</text></g>
<g data-step="3" data-until="3"><rect x="192" y="240" width="96" height="19" fill="#ffffff"/><path d="M190 263 H288" fill="none" stroke="#1f6feb" stroke-width="4" marker-end="url(#mb)"/><rect x="290" y="241" width="180" height="44" rx="6" fill="#fff1c9" stroke="#c9a227" stroke-width="3.5"/><text x="320" y="269" text-anchor="start" font-size="13" font-weight="700" fill="#8a6d00" >word 2</text><text x="440" y="270" text-anchor="middle" font-size="17" font-weight="800" fill="#d35400" font-family="Consolas, Menlo, monospace">5A</text><text x="240" y="256" text-anchor="middle" font-size="12" font-weight="800" fill="#1f6feb" >word_en[2] = 1</text><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#d35400" >Rising clock edge: register 2 loads din = 0x5A.</text></g>
<g data-step="4" data-until="4"><rect x="290" y="241" width="180" height="44" rx="6" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><text x="320" y="269" text-anchor="start" font-size="13" font-weight="700" fill="#8a6d00" >word 2</text><text x="440" y="270" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">5A</text><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >All other registers had enable 0 and kept their value.</text></g>
</svg>
