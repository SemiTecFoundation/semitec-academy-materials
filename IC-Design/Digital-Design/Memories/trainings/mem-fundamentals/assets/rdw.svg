<rect width="900" height="470" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Read-during-write: what does dout show?</text>
<text x="205" y="83" text-anchor="end" font-size="14" font-weight="800" fill="#1f4e79" >clk</text><text x="205" y="123" text-anchor="end" font-size="14" font-weight="800" fill="#1f4e79" >we</text><text x="205" y="163" text-anchor="end" font-size="14" font-weight="800" fill="#1f4e79" >addr</text><text x="205" y="203" text-anchor="end" font-size="14" font-weight="800" fill="#1f4e79" >din</text><path d="M220 86 V70 H280.0 V86 H340 V70 H400.0 V86 H460 V70 H520.0 V86 H580 V70 H640.0 V86 H700 V70 H760.0 V86 H820" fill="none" stroke="#34495e" stroke-width="2"/><path d="M220 126 H340 V110 H460 V126 H580 V126 H700 V126 H820" fill="none" stroke="#34495e" stroke-width="2.5"/><path d="M220 158 H340" stroke="#7a8a99" stroke-width="2"/><path d="M344 150 H576 L580 158 L576 166 H344 L340 158 Z" fill="#ffffff" stroke="#34495e" stroke-width="2"/><text x="460.0" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e" >A5</text><path d="M580 158 H820" stroke="#7a8a99" stroke-width="2"/><path d="M220 198 H340" stroke="#7a8a99" stroke-width="2"/><path d="M344 190 H456 L460 198 L456 206 H344 L340 198 Z" fill="#ffffff" stroke="#34495e" stroke-width="2"/><text x="400.0" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e" >77</text><path d="M460 198 H820" stroke="#7a8a99" stroke-width="2"/><text x="400.0" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#d35400" >write 77 → A5 (A5 held 33)</text><text x="520.0" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >read A5</text><line x1="220" y1="66" x2="220" y2="420" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="340" y1="66" x2="340" y2="420" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="460" y1="66" x2="460" y2="420" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="580" y1="66" x2="580" y2="420" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="700" y1="66" x2="700" y2="420" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><line x1="820" y1="66" x2="820" y2="420" stroke="#dde3ea" stroke-width="1" stroke-dasharray="3 4"/><g data-step="1"><text x="205" y="303" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb" >dout read-first</text><path d="M224 290 H456 L460 298 L456 306 H224 L220 298 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="340.0" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >prev</text><path d="M464 290 H576 L580 298 L576 306 H464 L460 298 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="520.0" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >33</text><path d="M584 290 H816 L820 298 L816 306 H584 L580 298 Z" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="700.0" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >77</text></g>
<g data-step="1" data-until="1"><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6feb" >In the write cycle the port reads the OLD value (33).</text></g>
<g data-step="2"><text x="205" y="348" text-anchor="end" font-size="14" font-weight="800" fill="#1e8449" >dout write-first</text><path d="M224 335 H456 L460 343 L456 351 H224 L220 343 Z" fill="#e8f6ee" stroke="#1e8449" stroke-width="2"/><text x="340.0" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449" >prev</text><path d="M464 335 H816 L820 343 L816 351 H464 L460 343 Z" fill="#e8f6ee" stroke="#1e8449" stroke-width="2"/><text x="640.0" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449" >77</text></g>
<g data-step="2" data-until="2"><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#1e8449" >The new value goes straight through to dout (77).</text></g>
<g data-step="3"><text x="205" y="393" text-anchor="end" font-size="14" font-weight="800" fill="#6c4fb3" >dout no-change</text><path d="M224 380 H576 L580 388 L576 396 H224 L220 388 Z" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="400.0" y="393" text-anchor="middle" font-size="13" font-weight="700" fill="#6c4fb3" >prev</text><path d="M584 380 H816 L820 388 L816 396 H584 L580 388 Z" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="700.0" y="393" text-anchor="middle" font-size="13" font-weight="700" fill="#6c4fb3" >77</text></g>
<g data-step="3" data-until="3"><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#6c4fb3" >dout keeps its previous value during the write.</text></g>
</svg>
