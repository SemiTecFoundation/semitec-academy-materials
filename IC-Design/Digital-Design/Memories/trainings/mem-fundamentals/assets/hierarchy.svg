<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">The memory hierarchy</text>
<text x="690" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#7a8a99" >typical size</text><text x="820" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#7a8a99" >access time</text><g data-step="1"><polygon points="295.0,80 365.0,80 405.0,142 255.0,142" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/><text x="330" y="108" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3" >Registers</text><text x="330" y="128" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >flip-flops / register file</text><text x="690" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79" >~1 KB</text><text x="820" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79" >< 1 ns</text></g>
<g data-step="2"><polygon points="255.0,152 405.0,152 445.0,214 215.0,214" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="330" y="180" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6feb" >L1 cache</text><text x="330" y="200" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >SRAM</text><text x="690" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79" >32–64 KB</text><text x="820" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79" >~1 ns</text></g>
<g data-step="3"><polygon points="215.0,224 445.0,224 485.0,286 175.0,286" fill="#d6e6fb" stroke="#1f6feb" stroke-width="2.5"/><text x="330" y="252" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6feb" >L2 / L3 cache</text><text x="330" y="272" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >SRAM</text><text x="690" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79" >0.5–64 MB</text><text x="820" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79" >3–20 ns</text></g>
<g data-step="4"><polygon points="175.0,296 485.0,296 525.0,358 135.0,358" fill="#e8f6ee" stroke="#1e8449" stroke-width="2.5"/><text x="330" y="324" text-anchor="middle" font-size="16" font-weight="800" fill="#1e8449" >Main memory</text><text x="330" y="344" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >DRAM</text><text x="690" y="334" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79" >8–512 GB</text><text x="820" y="334" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79" >50–100 ns</text></g>
<g data-step="5"><polygon points="135.0,368 525.0,368 565.0,430 95.0,430" fill="#fff4e8" stroke="#d35400" stroke-width="2.5"/><text x="330" y="396" text-anchor="middle" font-size="16" font-weight="800" fill="#d35400" >Storage</text><text x="330" y="416" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >flash (SSD)</text><text x="690" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79" >0.5–8 TB</text><text x="820" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79" >25–100 µs</text></g>
<path d="M40 430 V100" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><text x="52" y="110" text-anchor="start" font-size="13" font-weight="700" fill="#6c4fb3" >faster, smaller,</text><text x="52" y="127" text-anchor="start" font-size="13" font-weight="700" fill="#6c4fb3" >more cost per bit</text><text x="450" y="458" text-anchor="middle" font-size="13" font-weight="400" fill="#7a8a99" >Numbers are typical orders of magnitude for a desktop / server processor.</text></svg>
