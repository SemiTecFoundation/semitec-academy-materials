<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Asynchronous SRAM: read and write cycles</text>
<g data-step="1" data-until="1"><text x="165" y="93" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >address</text><text x="165" y="153" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >/CE</text><text x="165" y="213" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >/OE</text><text x="165" y="273" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >data out</text><path d="M180 88 H230 L240 78 H700 L710 88 L700 98 H240 L230 88 M710 88 H840" fill="none" stroke="#34495e" stroke-width="2"/><text x="470" y="93" text-anchor="middle" font-size="14" font-weight="800" fill="#34495e" >A</text><path d="M180 140 H290 V156 H400 V156 H510 V156 H620 V156 H730 V156 H840 V140 H950" fill="none" stroke="#34495e" stroke-width="2.5"/><path d="M180 200 H290 V200 H400 V216 H510 V216 H620 V216 H730 V216 H840 V200 H950" fill="none" stroke="#34495e" stroke-width="2.5"/><path d="M180 268 H500 L510 258 H700 L710 268 M500 268 L510 278 H700" fill="none" stroke="#34495e" stroke-width="2"/><text x="605" y="273" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6feb" >data valid</text><path d="M235 320 H498" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#mb)"/><text x="370" y="340" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6feb" >tAA — address to data</text><path d="M400 360 H498" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><text x="450" y="380" text-anchor="middle" font-size="14" font-weight="800" fill="#1e8449" >tOE</text><text x="450" y="410" text-anchor="middle" font-size="14" font-weight="400" fill="#7a8a99" >No clock: data follows the address after tAA, once /CE and /OE are low.</text></g>
<g data-step="2" data-until="2"><text x="165" y="93" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >address</text><text x="165" y="153" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >/CE</text><text x="165" y="213" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >/WE</text><text x="165" y="273" text-anchor="end" font-size="15" font-weight="800" fill="#1f4e79" >data in</text><path d="M180 88 H230 L240 78 H700 L710 88 L700 98 H240 L230 88 M710 88 H840" fill="none" stroke="#34495e" stroke-width="2"/><text x="470" y="93" text-anchor="middle" font-size="14" font-weight="800" fill="#34495e" >A</text><path d="M180 140 H290 V156 H400 V156 H510 V156 H620 V156 H730 V156 H840 V140 H950" fill="none" stroke="#34495e" stroke-width="2.5"/><path d="M180 200 H290 V200 H400 V216 H510 V216 H620 V216 H730 V200 H840 V200 H950" fill="none" stroke="#34495e" stroke-width="2.5"/><path d="M180 268 H420 L430 258 H660 L670 268 M420 268 L430 278 H660" fill="none" stroke="#34495e" stroke-width="2"/><text x="545" y="273" text-anchor="middle" font-size="14" font-weight="800" fill="#d35400" >data</text><path d="M400 320 H728" fill="none" stroke="#d35400" stroke-width="2" marker-end="url(#mo)"/><text x="565" y="340" text-anchor="middle" font-size="14" font-weight="800" fill="#d35400" >tWP — write pulse width</text><path d="M430 360 H728" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><text x="580" y="380" text-anchor="middle" font-size="14" font-weight="800" fill="#1e8449" >tDW — data setup to /WE rising</text><text x="450" y="410" text-anchor="middle" font-size="14" font-weight="400" fill="#7a8a99" >The write happens while /WE is low; data must be stable before /WE goes high.</text></g>
</svg>
