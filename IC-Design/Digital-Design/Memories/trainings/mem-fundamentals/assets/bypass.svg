<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Write-through bypass in a register file</text>
<rect x="320" y="110" width="200" height="160" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="420" y="150" text-anchor="middle" font-size="16" font-weight="800" fill="#8a6d00" >register file</text><text x="420" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6d00" font-family="Consolas, Menlo, monospace">rf[5] = 10</text><path d="M120 150 H318" fill="none" stroke="#6c4fb3" stroke-width="3" marker-end="url(#mp)"/><text x="120" y="175" text-anchor="start" font-size="14" font-weight="700" fill="#6c4fb3" >write r5 ← 99 (this cycle)</text><polygon points="620,150 660,170 660,250 620,270" fill="#f4f7fb" stroke="#34495e" stroke-width="2.5"/><path d="M520 230 H618" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><text x="570" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e" >rf[ra]</text><path d="M660 210 H760" fill="none" stroke="#1e8449" stroke-width="3" marker-end="url(#mg)"/><text x="770" y="215" text-anchor="start" font-size="15" font-weight="800" fill="#1e8449" >rd</text><text x="120" y="345" text-anchor="start" font-size="14" font-weight="700" fill="#1f6feb" >read r5 in the same cycle</text><path d="M120 320 H420 V272" fill="none" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#mb)"/><g data-step="1" data-until="1"><text x="420" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b" >without bypass:</text><text x="710" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#c0392b" >10 (stale!)</text><text x="450" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b" >The write happens at the clock edge — a read in the same cycle still sees the old 10.</text></g>
<g data-step="2" data-until="2"><path d="M200 150 V100 H590 V168 H618" fill="none" stroke="#d35400" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#mo)"/><text x="395" y="92" text-anchor="middle" font-size="13" font-weight="800" fill="#d35400" >bypass: wd</text><text x="640" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#d35400" >sel = we && (wa == ra)</text><text x="710" y="195" text-anchor="middle" font-size="16" font-weight="800" fill="#1e8449" >99</text><text x="450" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#1e8449" >The bypass mux forwards wd when the read address equals the write address.</text></g>
</svg>
