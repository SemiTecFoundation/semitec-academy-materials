<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Locality: why the hierarchy works</text>
<rect x="40" y="70" width="300" height="90" rx="8" fill="#11161d" stroke="#11161d" stroke-width="1"/><text x="60" y="105" text-anchor="start" font-size="15" font-weight="400" fill="#e6edf3" font-family="Consolas, Menlo, monospace">for (i = 0; i < 8; i++)</text><text x="80" y="135" text-anchor="start" font-size="15" font-weight="400" fill="#e6edf3" font-family="Consolas, Menlo, monospace">sum = sum + a[i];</text><rect x="380" y="90" width="54" height="50" rx="6" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="407" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" >a[0]</text><rect x="440" y="90" width="54" height="50" rx="6" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="467" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" >a[1]</text><rect x="500" y="90" width="54" height="50" rx="6" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="527" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" >a[2]</text><rect x="560" y="90" width="54" height="50" rx="6" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="587" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" >a[3]</text><rect x="620" y="90" width="54" height="50" rx="6" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="647" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" >a[4]</text><rect x="680" y="90" width="54" height="50" rx="6" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="707" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" >a[5]</text><rect x="740" y="90" width="54" height="50" rx="6" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="767" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" >a[6]</text><rect x="800" y="90" width="54" height="50" rx="6" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="827" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" >a[7]</text><text x="380" y="80" text-anchor="start" font-size="13" font-weight="700" fill="#7a8a99" >array a — consecutive addresses</text><rect x="380" y="190" width="110" height="50" rx="6" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="435" y="221" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >sum</text><text x="450" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#34495e" font-family="Consolas, Menlo, monospace">access trace:  a0 · sum · a1 · sum · a2 · sum · a3 · sum · …</text><g data-step="1" data-until="1"><text x="450" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79" >The program touches memory in a very regular way.</text></g>
<g data-step="2" data-until="2"><rect x="376" y="86" width="242" height="58" rx="8" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="497" y="170" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6feb" >one cache line = 4 words</text><text x="450" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6feb" >Spatial locality: after a[0], its neighbours a[1..3] are needed soon —</text><text x="450" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6feb" >so a whole line is fetched at once; the next three reads hit.</text></g>
<g data-step="3" data-until="3"><rect x="376" y="186" width="118" height="58" rx="8" fill="none" stroke="#1e8449" stroke-width="4"/><text x="450" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#1e8449" >Temporal locality: sum is used again every iteration —</text><text x="450" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#1e8449" >it stays in the fastest level (a register).</text></g>
</svg>
