3" fill="#f4f7fb" stroke="#c8d3df" stroke-width="1"/><text x="659.25" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">0</text><rect x="672.5" y="90" width="22.5" height="34" rx="3" fill="#f4f7fb" stroke="#c8d3df" stroke-width="1"/><text x="683.75" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">1</text><rect x="697.0" y="90" width="22.5" height="34" rx="3" fill="#f4f7fb" stroke="#c8d3df" stroke-width="1"/><text x="708.25" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">0</text><rect x="721.5" y="90" width="22.5" height="34" rx="3" fill="#f4f7fb" stroke="#c8d3df" stroke-width="1"/><text x="732.75" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">0</text><rect x="746.0" y="90" width="22.5" height="34" rx="3" fill="#f4f7fb" stroke="#c8d3df" stroke-width="1"/><text x="757.25" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">1</text><rect x="770.5" y="90" width="22.5" height="34" rx="3" fill="#f4f7fb" stroke="#c8d3df" stroke-width="1"/><text x="781.75" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">1</text><rect x="795.0" y="90" width="22.5" height="34" rx="3" fill="#f4f7fb" stroke="#c8d3df" stroke-width="1"/><text x="806.25" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">0</text><rect x="819.5" y="90" width="22.5" height="34" rx="3" fill="#f4f7fb" stroke="#c8d3df" stroke-width="1"/><text x="830.75" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">0</text><text x="60" y="82" text-anchor="start" font-size="12" font-weight="700" fill="#7a8a99" >bit 31</text><text x="842.0" y="82" text-anchor="end" font-size="12" font-weight="700" fill="#7a8a99" >bit 0</text><text x="450" y="62" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">byte address 0x2000_0A4C</text><g data-step="1"><rect x="60.0" y="88" width="96.0" height="38" rx="4" fill="none" stroke="#d35400" stroke-width="3.5"/><path d="M108.0 128 V160" fill="none" stroke="#d35400" stroke-width="2"/><text x="108.0" y="178" text-anchor="middle" font-size="14" font-weight="800" fill="#d35400" >region 0x2 → SRAM</text></g>
<g data-step="1" data-until="1"><text x="450" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >1. The top bits choose the memory in the address map: 0x2 = SRAM.</text></g>
<g data-step="2"><rect x="795.0" y="88" width="47.0" height="38" rx="4" fill="none" stroke="#6c4fb3" stroke-width="3.5"/><path d="M818.5 128 V200" fill="none" stroke="#6c4fb3" stroke-width="2"/><text x="818.5" y="218" text-anchor="middle" font-size="14" font-weight="800" fill="#6c4fb3" >byte in word = 0</text></g>
<g data-step="2" data-until="2"><text x="450" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >2. The 2 lowest bits select a byte inside the 32-bit word (used by byte strobes).</text></g>
<g data-step="3"><rect x="746.0" y="88" width="47.0" height="38" rx="4" fill="none" stroke="#1e8449" stroke-width="3.5"/><path d="M769.5 128 V260" fill="none" stroke="#1e8449" stroke-width="2"/><text x="769.5" y="278" text-anchor="middle" font-size="14" font-weight="800" fill="#1e8449" >bank = 3</text></g>
<g data-step="3" data-until="3"><text x="450" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >3. Word address 659; with 4 banks interleaved by word, bits [3:2] = 659 mod 4 = 3.</text></g>
<g data-step="4"><rect x="427.5" y="88" width="316.5" height="38" rx="4" fill="none" stroke="#1f6feb" stroke-width="3.5"/><path d="M585.75 128 V320" fill="none" stroke="#1f6feb" stroke-width="2"/><text x="585.75" y="338" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6feb" >word in bank = 164</text></g>
<g data-step="4" data-until="4"><text x="450" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79" >4. Bits [16:4] are the address inside the bank: 659 div 4 = 164.</text></g>
