<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">A system address map</text>
<rect x="140" y="70" width="160" height="420" rx="6" fill="#f4f7fb" stroke="#c8d3df" stroke-width="2"/><text x="220" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99" >4 GiB address space</text><text x="130" y="82" text-anchor="end" font-size="12" font-weight="700" fill="#7a8a99" >0xFFFF_FFFF</text><text x="130" y="490" text-anchor="end" font-size="12" font-weight="700" fill="#7a8a99" >0x0000_0000</text><rect x="142" y="440" width="156" height="30" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="220" y="460.0" text-anchor="middle" font-size="14" font-weight="800" fill="#c9a227" >Boot ROM</text><path d="M300 455.0 H348" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><text x="355" y="452.0" text-anchor="start" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">0x0000_0000 – 0x0000_FFFF</text><text x="355" y="470.0" text-anchor="start" font-size="13" font-weight="700" fill="#7a8a99" >64 KiB</text><rect x="142" y="380" width="156" height="30" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="220" y="400.0" text-anchor="middle" font-size="14" font-weight="800" fill="#1f6feb" >SRAM</text><path d="M300 395.0 H348" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><text x="355" y="392.0" text-anchor="start" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">0x2000_0000 – 0x2001_FFFF</text><text x="355" y="410.0" text-anchor="start" font-size="13" font-weight="700" fill="#7a8a99" >128 KiB</text><rect x="142" y="320" width="156" height="30" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/><text x="220" y="340.0" text-anchor="middle" font-size="14" font-weight="800" fill="#6c4fb3" >APB peripherals</text><path d="M300 335.0 H348" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><text x="355" y="332.0" text-anchor="start" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">0x4000_0000 – 0x4000_FFFF</text><text x="355" y="350.0" text-anchor="start" font-size="13" font-weight="700" fill="#7a8a99" >64 KiB</text><rect x="142" y="140" width="156" height="120" fill="#e8f6ee" stroke="#1e8449" stroke-width="2.5"/><text x="220" y="205.0" text-anchor="middle" font-size="14" font-weight="800" fill="#1e8449" >DRAM</text><path d="M300 200.0 H348" fill="none" stroke="#7a8a99" stroke-width="1.5" marker-end="url(#mi)"/><text x="355" y="197.0" text-anchor="start" font-size="14" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">0x8000_0000 – 0xBFFF_FFFF</text><text x="355" y="215.0" text-anchor="start" font-size="13" font-weight="700" fill="#7a8a99" >1 GiB</text><text x="220" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99" >unmapped</text><text x="220" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#7a8a99" >unmapped</text><rect x="660" y="190" width="210" height="140" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2.5"/><text x="765" y="220" text-anchor="middle" font-size="16" font-weight="800" fill="#1f4e79" >address decoder</text><text x="765" y="246" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >addr[31:28] picks</text><text x="765" y="264" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >the region; the rest</text><text x="765" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >is the offset in it</text><text x="765" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b" >no match → error</text></svg>
