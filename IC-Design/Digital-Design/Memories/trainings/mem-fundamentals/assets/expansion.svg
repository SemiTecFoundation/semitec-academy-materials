<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Building big memories from small ones</text>
<g data-step="1" data-until="1"><text x="450" y="70" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79" >Width expansion: 64 × 1K from four 16 × 1K</text><path d="M60 110 H840" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#mi)"/><text x="60" y="100" text-anchor="start" font-size="13" font-weight="700" fill="#1f6feb" >addr[9:0], en, we → all four</text><path d="M180 110 V158" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#mb)"/><rect x="110" y="160" width="140" height="90" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="180.0" y="211.0" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00" >16 × 1K</text><text x="180" y="150" text-anchor="middle" font-size="1" font-weight="400" fill="#34495e" ></text><path d="M150 290 V252" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#mi)"/><text x="150" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e" >din[63:48]</text><path d="M210 250 V345" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><text x="210" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449" >dout[63:48]</text><path d="M370 110 V158" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#mb)"/><rect x="300" y="160" width="140" height="90" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="370.0" y="211.0" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00" >16 × 1K</text><text x="370" y="150" text-anchor="middle" font-size="1" font-weight="400" fill="#34495e" ></text><path d="M340 290 V252" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#mi)"/><text x="340" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e" >din[47:32]</text><path d="M400 250 V345" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><text x="400" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449" >dout[47:32]</text><path d="M560 110 V158" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#mb)"/><rect x="490" y="160" width="140" height="90" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="560.0" y="211.0" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00" >16 × 1K</text><text x="560" y="150" text-anchor="middle" font-size="1" font-weight="400" fill="#34495e" ></text><path d="M530 290 V252" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#mi)"/><text x="530" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e" >din[31:16]</text><path d="M590 250 V345" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><text x="590" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449" >dout[31:16]</text><path d="M750 110 V158" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#mb)"/><rect x="680" y="160" width="140" height="90" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="750.0" y="211.0" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00" >16 × 1K</text><text x="750" y="150" text-anchor="middle" font-size="1" font-weight="400" fill="#34495e" ></text><path d="M720 290 V252" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#mi)"/><text x="720" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e" >din[15:0]</text><path d="M780 250 V345" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><text x="780" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449" >dout[15:0]</text><text x="450" y="420" text-anchor="middle" font-size="15" font-weight="400" fill="#7a8a99" >Same address to all; each RAM holds one 16-bit slice of the 64-bit word.</text></g>
<g data-step="2" data-until="2"><text x="450" y="70" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79" >Depth expansion: 16 × 4K from four 16 × 1K</text><rect x="40" y="100" width="150" height="80" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="115" y="135" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79" >decoder</text><text x="115" y="158" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e" >addr[11:10]</text><path d="M60 210 H840" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><text x="60" y="202" text-anchor="start" font-size="13" font-weight="700" fill="#34495e" >addr[9:0], din, we → all four</text><rect x="220" y="240" width="120" height="80" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="280.0" y="286.0" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00" >bank 0</text><path d="M280 210 V238" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#mi)"/><path d="M190 130 H280 V238" fill="none" stroke="#1f6feb" stroke-width="1.8" marker-end="url(#mb)"/><path d="M280 320 V360" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><rect x="380" y="240" width="120" height="80" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="440.0" y="286.0" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00" >bank 1</text><path d="M440 210 V238" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#mi)"/><path d="M190 130 H440 V238" fill="none" stroke="#1f6feb" stroke-width="1.8" marker-end="url(#mb)"/><path d="M440 320 V360" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><rect x="540" y="240" width="120" height="80" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="600.0" y="286.0" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00" >bank 2</text><path d="M600 210 V238" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#mi)"/><path d="M190 130 H600 V238" fill="none" stroke="#1f6feb" stroke-width="1.8" marker-end="url(#mb)"/><path d="M600 320 V360" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><rect x="700" y="240" width="120" height="80" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="760.0" y="286.0" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00" >bank 3</text><path d="M760 210 V238" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#mi)"/><path d="M190 130 H760 V238" fill="none" stroke="#1f6feb" stroke-width="1.8" marker-end="url(#mb)"/><path d="M760 320 V360" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#mg)"/><text x="560" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb" >en of bank i = en AND (addr[11:10] == i)</text><polygon points="300,365 820,365 790,400 330,400" fill="#e8f6ee" stroke="#1e8449" stroke-width="2.5"/><text x="560" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449" >4 : 1 output mux, selected by the registered bank number</text><text x="450" y="440" text-anchor="middle" font-size="14" font-weight="400" fill="#7a8a99" >Only one bank is enabled; the read data comes from the bank that was addressed one clock earlier.</text></g>
