<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">One bit of a test data register</text>
<g transform="translate(0,-70)"><text x="40" y="190" text-anchor="start" font-size="14" font-weight="700" fill="#6c4fb3">from previous bit</text><text x="40" y="208" text-anchor="start" font-size="13" font-weight="400" fill="#7a8a99">(or TDI)</text><path d="M40 220 H228" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><text x="40" y="370" text-anchor="start" font-size="14" font-weight="700" fill="#1e8449">from instrument (status)</text><path d="M60 355 V250 H228" fill="none" stroke="#1e8449" stroke-width="2.5" marker-end="url(#mg)"/><polygon points="230,190 270,208 270,262 230,280" fill="#f4f7fb" stroke="#34495e" stroke-width="2.5"/><text x="250" y="180" text-anchor="middle" font-size="13" font-weight="400" fill="#7a8a99">ShiftDR</text><path d="M270 235 H328" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><rect x="330" y="195" width="130" height="80" rx="10" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/><text x="395" y="232" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">shift</text><text x="395" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#6c4fb3">flip-flop</text><text x="395" y="295" text-anchor="middle" font-size="13" font-weight="400" fill="#7a8a99">ClockDR</text><path d="M460 235 H860" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><text x="860" y="222" text-anchor="end" font-size="14" font-weight="700" fill="#6c4fb3">to next bit (or TDO)</text><path d="M500 235 V318" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><rect x="440" y="320" width="130" height="70" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="505" y="352" text-anchor="middle" font-size="16" font-weight="800" fill="#1f4e79">update</text><text x="505" y="374" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79">latch</text><text x="505" y="408" text-anchor="middle" font-size="13" font-weight="400" fill="#7a8a99">UpdateDR</text><path d="M570 355 H858" fill="none" stroke="#1f6feb" stroke-width="2.5" marker-end="url(#mb)"/><text x="860" y="342" text-anchor="end" font-size="14" font-weight="700" fill="#1f6feb">to instrument (configuration)</text></g></svg>
