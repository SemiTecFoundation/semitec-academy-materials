<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Board test with boundary scan (EXTEST)</text>
<text x="450" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#7a8a99">printed circuit board</text><rect x="50" y="90" width="250" height="320" rx="10" fill="#fbfcfd" stroke="#34495e" stroke-width="3"/><text x="130" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#7a8a99">chip A</text><rect x="80" y="170" width="120" height="140" rx="10" fill="#eef1f4" stroke="#7a8a99" stroke-width="2.5"/><text x="140" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#7a8a99">core</text><rect x="600" y="90" width="250" height="320" rx="10" fill="#fbfcfd" stroke="#34495e" stroke-width="3"/><text x="770" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#7a8a99">chip B</text><rect x="700" y="170" width="120" height="140" rx="10" fill="#eef1f4" stroke="#7a8a99" stroke-width="2.5"/><text x="760" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#7a8a99">core</text><rect x="240" y="130" width="46" height="40" rx="4" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><rect x="614" y="130" width="46" height="40" rx="4" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><line x1="200" y1="150" x2="240" y2="150" stroke="#7a8a99" stroke-width="2"/><line x1="660" y1="150" x2="700" y2="150" stroke="#7a8a99" stroke-width="2"/><line x1="286" y1="150" x2="614" y2="150" stroke="#34495e" stroke-width="3"/><text x="520" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99">net 1</text><rect x="240" y="190" width="46" height="40" rx="4" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><rect x="614" y="190" width="46" height="40" rx="4" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><line x1="200" y1="210" x2="240" y2="210" stroke="#7a8a99" stroke-width="2"/><line x1="660" y1="210" x2="700" y2="210" stroke="#7a8a99" stroke-width="2"/><line x1="286" y1="210" x2="614" y2="210" stroke="#34495e" stroke-width="3"/><text x="520" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99">net 2</text><rect x="240" y="250" width="46" height="40" rx="4" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><rect x="614" y="250" width="46" height="40" rx="4" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><line x1="200" y1="270" x2="240" y2="270" stroke="#7a8a99" stroke-width="2"/><line x1="660" y1="270" x2="700" y2="270" stroke="#7a8a99" stroke-width="2"/><line x1="286" y1="270" x2="614" y2="270" stroke="#34495e" stroke-width="3"/><text x="520" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99">net 3</text><rect x="240" y="310" width="46" height="40" rx="4" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><rect x="614" y="310" width="46" height="40" rx="4" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><line x1="200" y1="330" x2="240" y2="330" stroke="#7a8a99" stroke-width="2"/><line x1="660" y1="330" x2="700" y2="330" stroke="#7a8a99" stroke-width="2"/><text x="520" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99">net 4</text><line x1="286" y1="330" x2="614" y2="330" stroke="#34495e" stroke-width="3"/><path d="M263 392 V350" fill="none" stroke="#6c4fb3" stroke-width="2" marker-end="url(#mp)"/><text x="263" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6d00">boundary-scan cells</text><g data-step="1" data-until="1"><text x="450" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">Functional mode: the boundary-scan cells simply pass the signals between core and pins.</text></g>
<g data-step="2" data-until="5"><text x="263" y="157" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6feb">1</text><text x="263" y="217" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6feb">0</text><text x="263" y="277" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6feb">1</text><text x="263" y="337" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6feb">0</text></g>
<g data-step="2" data-until="2"><text x="450" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6feb">EXTEST: chip A drives a pattern from its boundary-scan cells onto the nets.</text></g>
<g data-step="3" data-until="3"><text x="637" y="157" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">1</text><text x="637" y="217" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">0</text><text x="637" y="277" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">1</text><text x="637" y="337" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">0</text><text x="450" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#1e8449">Chip B captures the nets in its cells; the tester shifts them out: all equal → nets OK.</text></g>
<g data-step="4" data-until="4"><line x1="450" y1="210" x2="450" y2="270" stroke="#c0392b" stroke-width="6"/><text x="470" y="245" text-anchor="start" font-size="14" font-weight="800" fill="#c0392b">short</text><text x="637" y="157" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">1</text><text x="637" y="217" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">0</text><text x="637" y="277" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b">0</text><text x="637" y="337" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">0</text><text x="450" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">A short between nets 2 and 3 pulls net 3 to 0: chip B reads 0 instead of 1 → fault found.</text></g>
<g data-step="5" data-until="5"><rect x="430" y="318" width="40" height="24" fill="#ffffff"/><text x="450" y="336" text-anchor="middle" font-size="13" font-weight="800" fill="#c0392b">open</text><text x="637" y="157" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">1</text><text x="637" y="217" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">0</text><text x="637" y="277" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">1</text><text x="637" y="337" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b">1</text><text x="450" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">An open on net 4: chip B reads the floating input as 1 instead of 0 → fault found.</text></g>
</svg>
