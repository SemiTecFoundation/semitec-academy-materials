<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="230" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">The 32-bit IDCODE register</text>
<rect x="40" y="90" width="102.4" height="60" rx="4" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/><text x="91.2" y="126" text-anchor="middle" font-size="15" font-weight="800" fill="#6c4fb3">version</text><text x="91.2" y="175" text-anchor="middle" font-size="14" font-weight="400" fill="#7a8a99">bits 31–28</text><rect x="142.4" y="90" width="409.6" height="60" rx="4" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="347.20000000000005" y="126" text-anchor="middle" font-size="15" font-weight="800" fill="#1f6feb">part number</text><text x="347.20000000000005" y="175" text-anchor="middle" font-size="14" font-weight="400" fill="#7a8a99">bits 27–12</text><rect x="552.0" y="90" width="281.6" height="60" rx="4" fill="#e8f6ee" stroke="#1e8449" stroke-width="2.5"/><text x="692.8" y="126" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">manufacturer (JEDEC)</text><text x="692.8" y="175" text-anchor="middle" font-size="14" font-weight="400" fill="#7a8a99">bits 11–1</text><rect x="833.6" y="90" width="25.6" height="60" rx="4" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="846.4" y="126" text-anchor="middle" font-size="18" font-weight="800" fill="#c9a227">1</text><text x="846.4" y="175" text-anchor="middle" font-size="14" font-weight="400" fill="#7a8a99">bit 0</text><text x="450" y="210" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">bit 0 is always 1 — so a tester can tell IDCODE (1) from BYPASS (0) after reset</text></svg>
