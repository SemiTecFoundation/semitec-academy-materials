<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Capture, shift, update on a 3-bit register</text>
<text x="150" y="152" text-anchor="end" font-size="16" font-weight="800" fill="#6c4fb3">TDI</text><path d="M160 147 H248" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><text x="810" y="152" text-anchor="start" font-size="16" font-weight="800" fill="#6c4fb3">TDO</text><rect x="250" y="115" width="120" height="64" rx="10" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><rect x="250" y="235" width="120" height="64" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><path d="M370 147 H428" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><rect x="430" y="115" width="120" height="64" rx="10" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><rect x="430" y="235" width="120" height="64" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><path d="M550 147 H608" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><rect x="610" y="115" width="120" height="64" rx="10" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><rect x="610" y="235" width="120" height="64" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><path d="M730 147 H800" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><text x="250" y="106" text-anchor="start" font-size="13" font-weight="700" fill="#6c4fb3">shift flip-flops</text><text x="250" y="226" text-anchor="start" font-size="13" font-weight="700" fill="#1f6feb">update latches</text><rect x="230" y="345" width="520" height="64" rx="10" fill="#e8f6ee" stroke="#1e8449" stroke-width="2.5"/><text x="490" y="370" text-anchor="middle" font-size="16" font-weight="800" fill="#1e8449">instrument</text><g data-step="1" data-until="1"><text x="310" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#7a8a99">-</text><text x="490" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#7a8a99">-</text><text x="670" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#7a8a99">-</text><text x="310" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">0</text><text x="490" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">1</text><text x="670" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">0</text><text x="490" y="396" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">status 101 · uses config 010</text><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">Before the scan: the update latches hold the configuration 010; the instrument has a status 101.</text><text x="450" y="92" text-anchor="middle" font-size="18" font-weight="800" fill="#6c4fb3">before</text></g>
<g data-step="2" data-until="2"><text x="310" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">1</text><text x="490" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">0</text><text x="670" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">1</text><text x="310" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">0</text><text x="490" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">1</text><text x="670" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">0</text><text x="490" y="396" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">status 101 · uses config 010</text><path d="M236 343 V200 H280 V181" fill="none" stroke="#1e8449" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#mg)"/><path d="M416 343 V200 H460 V181" fill="none" stroke="#1e8449" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#mg)"/><path d="M596 343 V200 H640 V181" fill="none" stroke="#1e8449" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#mg)"/><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">Capture-DR: the shift flip-flops load the status 101 in parallel.</text><text x="450" y="92" text-anchor="middle" font-size="18" font-weight="800" fill="#6c4fb3">Capture-DR</text></g>
<g data-step="3" data-until="3"><text x="310" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">0</text><text x="490" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">1</text><text x="670" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">0</text><text x="310" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">0</text><text x="490" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">1</text><text x="670" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">0</text><text x="490" y="396" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">still uses config 010</text><text x="840" y="180" text-anchor="middle" font-size="20" font-weight="800" fill="#6c4fb3">1</text><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">Shift-DR, 1st clock: new bit 0 enters, status bit 1 leaves at TDO. The latches do not move.</text><text x="450" y="92" text-anchor="middle" font-size="18" font-weight="800" fill="#6c4fb3">Shift-DR</text></g>
<g data-step="4" data-until="4"><text x="310" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">1</text><text x="490" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">1</text><text x="670" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">0</text><text x="310" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">0</text><text x="490" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">1</text><text x="670" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">0</text><text x="490" y="396" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">still uses config 010</text><text x="840" y="180" text-anchor="middle" font-size="18" font-weight="800" fill="#6c4fb3">1 0 1</text><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">After 3 shifts: the new value 110 is in place; the status 101 has left through TDO.</text><text x="450" y="92" text-anchor="middle" font-size="18" font-weight="800" fill="#6c4fb3">Shift-DR ×3</text></g>
<g data-step="5" data-until="5"><text x="310" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">1</text><text x="490" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">1</text><text x="670" y="158" text-anchor="middle" font-size="26" font-weight="800" fill="#6c4fb3">0</text><text x="310" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">1</text><text x="490" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">1</text><text x="670" y="278" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6feb">0</text><text x="490" y="396" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">now uses config 110</text><path d="M310 179 V233" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#mb)"/><path d="M490 179 V233" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#mb)"/><path d="M670 179 V233" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#mb)"/><text x="450" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">Update-DR: the latches copy 110 in one step — the instrument sees only the final value.</text><text x="450" y="92" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">Update-DR</text></g>
</svg>
