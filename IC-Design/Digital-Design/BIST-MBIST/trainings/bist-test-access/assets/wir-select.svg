<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="450" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">The wrapper instruction picks the path from WSI to WSO</text>
<text x="50" y="235" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">WSI</text><text x="860" y="235" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">WSO</text><rect x="300" y="85" width="300" height="44" rx="6" fill="#fdf7e3" stroke="#c9a227" stroke-width="2"/><text x="450" y="113" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79">WIR</text><rect x="300" y="155" width="300" height="44" rx="6" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="450" y="183" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79">WBY (1 bit)</text><rect x="300" y="225" width="300" height="44" rx="6" fill="#fff4e8" stroke="#d35400" stroke-width="2"/><text x="450" y="253" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79">WBR</text><rect x="300" y="295" width="300" height="44" rx="6" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="450" y="323" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79">core scan chains</text><line x1="75" y1="230" x2="220" y2="230" stroke="#7a8a99" stroke-width="2"/><line x1="220" y1="107" x2="220" y2="317" stroke="#7a8a99" stroke-width="2"/><line x1="220" y1="107" x2="298" y2="107" stroke="#7a8a99" stroke-width="2"/><line x1="600" y1="107" x2="678" y2="107" stroke="#7a8a99" stroke-width="2"/><line x1="220" y1="177" x2="298" y2="177" stroke="#7a8a99" stroke-width="2"/><line x1="600" y1="177" x2="678" y2="177" stroke="#7a8a99" stroke-width="2"/><line x1="220" y1="247" x2="298" y2="247" stroke="#7a8a99" stroke-width="2"/><line x1="600" y1="247" x2="678" y2="247" stroke="#7a8a99" stroke-width="2"/><line x1="220" y1="317" x2="298" y2="317" stroke="#7a8a99" stroke-width="2"/><line x1="600" y1="317" x2="678" y2="317" stroke="#7a8a99" stroke-width="2"/><polygon points="680,85 720,105 720,320 680,340" fill="#f4f7fb" stroke="#34495e" stroke-width="2.5"/><path d="M720 230 H835" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><g data-step="1" data-until="1"><path d="M75 230 H220" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M220 230 V107 H298" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M600 107 H678" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M720 230 H835" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><text x="450" y="395" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">SelectWIR = 1: an instruction is shifted into the WIR</text></g>
<g data-step="2" data-until="2"><path d="M75 230 H220" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M220 230 V177 H298" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M600 177 H678" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M720 230 H835" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><text x="450" y="395" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">WS_BYPASS: only the 1-bit WBY — the core is skipped</text></g>
<g data-step="3" data-until="3"><path d="M75 230 H220" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M220 230 V247 H298" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M600 247 H678" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M720 230 H835" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><text x="450" y="395" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">WS_EXTEST: the WBR — test the wires to other cores</text></g>
<g data-step="4" data-until="4"><path d="M75 230 H220" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M220 230 V247 H298" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M600 317 H678" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M720 230 H835" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M600 247 H640 V280 H260 V317 H298" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><text x="450" y="395" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">WS_INTEST_SCAN: WBR and the core's scan chains in one path</text></g>
<text x="450" y="430" text-anchor="middle" font-size="13" font-weight="400" fill="#7a8a99">the multiplexer at the right is controlled by SelectWIR and the instruction in the WIR</text></svg>
