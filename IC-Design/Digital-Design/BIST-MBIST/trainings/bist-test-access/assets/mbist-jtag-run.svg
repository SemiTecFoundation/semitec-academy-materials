<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="360" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Running MBIST through JTAG, step by step</text>
<line x1="40" y1="200" x2="860" y2="200" stroke="#7a8a99" stroke-width="2"/><text x="860" y="222" text-anchor="end" font-size="14" font-weight="700" fill="#7a8a99">time →</text><g data-step="1"><rect x="40" y="120" width="130" height="70" rx="10" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/><text x="105.0" y="150" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">IR scan</text><text x="105.0" y="174" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">IJTAG instruction</text></g>
<g data-step="2"><rect x="180" y="120" width="120" height="70" rx="10" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/><text x="240.0" y="150" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">DR scan</text><text x="240.0" y="174" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">open SIB</text></g>
<g data-step="3"><rect x="310" y="120" width="140" height="70" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="380.0" y="150" text-anchor="middle" font-size="16" font-weight="800" fill="#1f6feb">DR scan</text><text x="380.0" y="174" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">config + start</text></g>
<g data-step="4"><rect x="460" y="120" width="230" height="70" rx="10" fill="#e8f6ee" stroke="#1e8449" stroke-width="2.5"/><text x="575.0" y="150" text-anchor="middle" font-size="16" font-weight="800" fill="#1e8449">Run-Test/Idle</text><text x="575.0" y="174" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">wait N TCK</text><path d="M470 252 V240 H475.0 V252 H480 V240 H485.0 V252 H490 V240 H495.0 V252 H500 V240 H505.0 V252 H510 V240 H515.0 V252 H520 V240 H525.0 V252 H530 V240 H535.0 V252 H540 V240 H545.0 V252 H550 V240 H555.0 V252 H560 V240 H565.0 V252 H570 V240 H575.0 V252 H580 V240 H585.0 V252 H590 V240 H595.0 V252 H600 V240 H605.0 V252 H610 V240 H615.0 V252 H620 V240 H625.0 V252 H630 V240 H635.0 V252 H640 V240 H645.0 V252 H650 V240 H655.0 V252 H660 V240 H665.0 V252 H670 V240 H675.0 V252 H680" fill="none" stroke="#1f6feb" stroke-width="2"/><text x="575" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6feb">MBIST runs on the memory clock</text></g>
<g data-step="5"><rect x="700" y="120" width="160" height="70" rx="10" fill="#fff4e8" stroke="#d35400" stroke-width="2.5"/><text x="780.0" y="150" text-anchor="middle" font-size="16" font-weight="800" fill="#d35400">DR scan</text><text x="780.0" y="174" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">read done, pass</text></g>
<text x="450" y="330" text-anchor="middle" font-size="15" font-weight="400" fill="#7a8a99">Only the short DR scans use the slow TCK path; the test itself runs inside at full speed.</text></svg>
