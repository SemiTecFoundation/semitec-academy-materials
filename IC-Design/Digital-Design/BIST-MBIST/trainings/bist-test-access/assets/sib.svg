<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">An IJTAG network with segment insertion bits (SIBs)</text>
<text x="70" y="135" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">TDI</text><text x="850" y="135" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">TDO</text><rect x="200" y="105" width="90" height="56" rx="10" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/><text x="245" y="139" text-anchor="middle" font-size="15" font-weight="800" fill="#6c4fb3">SIB 1</text><rect x="140" y="270" width="210" height="56" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="245" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">MBIST 1 TDR · 32 bits</text><rect x="420" y="105" width="90" height="56" rx="10" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/><text x="465" y="139" text-anchor="middle" font-size="15" font-weight="800" fill="#6c4fb3">SIB 2</text><rect x="360" y="270" width="210" height="56" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="465" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">MBIST 2 TDR · 32 bits</text><rect x="640" y="105" width="90" height="56" rx="10" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/><text x="685" y="139" text-anchor="middle" font-size="15" font-weight="800" fill="#6c4fb3">SIB 3</text><rect x="580" y="270" width="210" height="56" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="685" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">sensor TDR · 16 bits</text><path d="M90 133 H198" fill="none" stroke="#7a8a99" stroke-width="2" marker-end="url(#mi)"/><path d="M290 133 H418" fill="none" stroke="#7a8a99" stroke-width="2" marker-end="url(#mi)"/><path d="M510 133 H638" fill="none" stroke="#7a8a99" stroke-width="2" marker-end="url(#mi)"/><path d="M730 133 H830" fill="none" stroke="#7a8a99" stroke-width="2" marker-end="url(#mi)"/><g data-step="1" data-until="1"><path d="M90 133 H198" fill="none" stroke="#6c4fb3" stroke-width="3.5" marker-end="url(#mp)"/><path d="M290 133 H418" fill="none" stroke="#6c4fb3" stroke-width="3.5" marker-end="url(#mp)"/><path d="M510 133 H638" fill="none" stroke="#6c4fb3" stroke-width="3.5" marker-end="url(#mp)"/><path d="M730 133 H830" fill="none" stroke="#6c4fb3" stroke-width="3.5" marker-end="url(#mp)"/><text x="450" y="385" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">All SIBs closed: the scan path is only 3 bits long — fast to shift.</text></g>
<g data-step="2" data-until="2"><path d="M400 133 V240 H380 V268" fill="none" stroke="#6c4fb3" stroke-width="3.5" marker-end="url(#mp)"/><path d="M550 270 V240 H440 V163" fill="none" stroke="#6c4fb3" stroke-width="3.5" marker-end="url(#mp)"/><text x="465" y="98" text-anchor="middle" font-size="13" font-weight="800" fill="#6c4fb3">open</text><text x="450" y="385" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">Open SIB 2: the MBIST 2 register joins the path — 3 + 32 = 35 bits.</text></g>
<g data-step="3" data-until="3"><path d="M180 133 V240 H160 V268" fill="none" stroke="#6c4fb3" stroke-width="3.5" marker-end="url(#mp)"/><path d="M330 270 V240 H220 V163" fill="none" stroke="#6c4fb3" stroke-width="3.5" marker-end="url(#mp)"/><path d="M620 133 V240 H600 V268" fill="none" stroke="#6c4fb3" stroke-width="3.5" marker-end="url(#mp)"/><path d="M770 270 V240 H660 V163" fill="none" stroke="#6c4fb3" stroke-width="3.5" marker-end="url(#mp)"/><text x="245" y="98" text-anchor="middle" font-size="13" font-weight="800" fill="#6c4fb3">open</text><text x="685" y="98" text-anchor="middle" font-size="13" font-weight="800" fill="#6c4fb3">open</text><text x="450" y="385" text-anchor="middle" font-size="16" font-weight="800" fill="#6c4fb3">Open SIB 1 and SIB 3 instead: 3 + 32 + 16 = 51 bits.</text></g>
</svg>
