<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">iApply: many instrument commands, one scan</text>
<text x="60" y="110" text-anchor="start" font-size="15" font-weight="700" fill="#34495e">iWrite MBIST1.start 1</text><text x="60" y="140" text-anchor="start" font-size="15" font-weight="700" fill="#34495e">iWrite MBIST2.start 1</text><text x="60" y="170" text-anchor="start" font-size="15" font-weight="700" fill="#34495e">iRead  sensor.alarm 0</text><text x="60" y="200" text-anchor="start" font-size="15" font-weight="700" fill="#1e8449">iApply</text><rect x="40" y="80" width="250" height="140" rx="8" fill="none" stroke="#7a8a99" stroke-width="1.5" stroke-dasharray="5 4"/><text x="165" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#7a8a99">PDL (instrument level)</text><g data-step="1" data-until="1"><text x="600" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">iWrite / iRead only queue the request —</text><text x="600" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">nothing is shifted yet.</text></g>
<g data-step="2"><rect x="340" y="250" width="60" height="50" rx="4" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="370.0" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">SIBs</text><rect x="400" y="250" width="170" height="50" rx="4" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="485.0" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">MBIST 1 TDR</text><rect x="570" y="250" width="170" height="50" rx="4" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="655.0" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">MBIST 2 TDR</text><rect x="740" y="250" width="120" height="50" rx="4" fill="#e8f6ee" stroke="#1e8449" stroke-width="2"/><text x="800.0" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">sensor TDR</text><text x="600" y="235" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79">iApply: the tool builds ONE path through the network</text></g>
<g data-step="3"><text x="395" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#6c4fb3">open</text><text x="425" y="325" text-anchor="start" font-size="13" font-weight="700" fill="#1f6feb">start=1</text><text x="595" y="325" text-anchor="start" font-size="13" font-weight="700" fill="#1f6feb">start=1</text><text x="720" y="325" text-anchor="start" font-size="13" font-weight="700" fill="#1e8449">expect alarm 0</text><text x="450" y="385" text-anchor="middle" font-size="14" font-weight="400" fill="#7a8a99">One DR scan writes both start bits and checks the sensor — the order in PDL does not cost extra scans.</text></g>
</svg>
