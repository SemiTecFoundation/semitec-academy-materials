<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="330" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Serial access: shifting bits through a chain</text>
<text x="150" y="175" text-anchor="end" font-size="18" font-weight="800" fill="#6c4fb3">TDI</text><text x="800" y="175" text-anchor="start" font-size="18" font-weight="800" fill="#6c4fb3">TDO</text><path d="M160 170 H298" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><rect x="300" y="130" width="90" height="80" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><path d="M390 170 H418" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><rect x="420" y="130" width="90" height="80" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><path d="M510 170 H538" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><rect x="540" y="130" width="90" height="80" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><path d="M630 170 H658" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><rect x="660" y="130" width="90" height="80" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><path d="M750 170 H788" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#mp)"/><g data-step="1" data-until="1"><text x="450" y="85" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">before shifting</text><text x="345" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#7a8a99">-</text><text x="465" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#7a8a99">-</text><text x="585" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#7a8a99">-</text><text x="705" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#7a8a99">-</text><text x="220" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="#6c4fb3">1</text><text x="450" y="270" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">A 4-bit register; each clock moves every bit one cell to the right.</text></g>
<g data-step="2" data-until="2"><text x="450" y="85" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">clock 1</text><text x="345" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">1</text><text x="465" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#7a8a99">-</text><text x="585" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#7a8a99">-</text><text x="705" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#7a8a99">-</text><text x="220" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="#6c4fb3">1</text><text x="450" y="270" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">The first bit enters from TDI.</text></g>
<g data-step="3" data-until="3"><text x="450" y="85" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">clock 2</text><text x="345" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">1</text><text x="465" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">1</text><text x="585" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#7a8a99">-</text><text x="705" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#7a8a99">-</text><text x="220" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="#6c4fb3">0</text><text x="450" y="270" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">… and moves on, the next one follows.</text></g>
<g data-step="4" data-until="4"><text x="450" y="85" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">clock 3</text><text x="345" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">0</text><text x="465" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">1</text><text x="585" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">1</text><text x="705" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#7a8a99">-</text><text x="220" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="#6c4fb3">1</text><text x="450" y="270" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">Three bits are in.</text></g>
<g data-step="5" data-until="5"><text x="450" y="85" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">clock 4</text><text x="345" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">1</text><text x="465" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">0</text><text x="585" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">1</text><text x="705" y="183" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">1</text><text x="450" y="270" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">After 4 clocks the register holds 1011 — and the old content has left through TDO.</text></g>
</svg>
