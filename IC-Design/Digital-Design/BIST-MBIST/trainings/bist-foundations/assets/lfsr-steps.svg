<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="ls-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker>
  <marker id="ls-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs>
  <rect width="780" height="320" rx="14" fill="#ffffff"/>
  <text x="390" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">A 4-bit LFSR step by step (seed 1000)</text>
  <rect x="150" y="110" width="90" height="80" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/>
  <text x="195.0" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">Q1</text>
  <rect x="290" y="110" width="90" height="80" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/>
  <text x="335.0" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">Q2</text>
  <rect x="430" y="110" width="90" height="80" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/>
  <text x="475.0" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">Q3</text>
  <rect x="570" y="110" width="90" height="80" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/>
  <text x="615.0" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">Q4</text>
  <path d="M710 150H750" stroke="#34495e" stroke-width="2.5" marker-end="url(#ls-a)"/><text x="740" y="135" text-anchor="middle" font-size="12" fill="#34495e">out</text>
  <text x="390" y="305" text-anchor="middle" font-size="12" fill="#6b7a8c">on every clock edge each flip-flop takes the value on its input</text>
  <path d="M240 150H288" stroke="#34495e" stroke-width="2.5" marker-end="url(#ls-a)"/>
  <path d="M380 150H428" stroke="#34495e" stroke-width="2.5" marker-end="url(#ls-a)"/>
  <path d="M520 150H568" stroke="#34495e" stroke-width="2.5" marker-end="url(#ls-a)"/>
  <path d="M660 150H710" stroke="#34495e" stroke-width="2.5"/>
  <g stroke="#c0392b" stroke-width="2.5" fill="none"><path d="M535 150V250H592" marker-end="url(#ls-r)"/><path d="M690 150V250H628" marker-end="url(#ls-r)"/><path d="M594 250"/><path d="M610 266V280H100V150H148" marker-end="url(#ls-r)"/></g>
  <circle cx="535" cy="150" r="4" fill="#c0392b"/><circle cx="690" cy="150" r="4" fill="#c0392b"/>
  <circle cx="610" cy="250" r="16" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><path d="M599 250H621M610 239V261" stroke="#c0392b" stroke-width="2.5"/>
  <text x="300" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">feedback = Q3 ⊕ Q4</text>
  <g data-step="1" data-until="1"><text x="195.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="335.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="475.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="615.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="610" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">0⊕0=0</text><text x="60" y="80" font-size="14" font-weight="700" fill="#34495e">clock 0</text></g>
  <g data-step="2" data-until="2"><text x="195.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="335.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="475.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="615.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="610" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">0⊕0=0</text><text x="60" y="80" font-size="14" font-weight="700" fill="#34495e">clock 1</text></g>
  <g data-step="3" data-until="3"><text x="195.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="335.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="475.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="615.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="610" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">1⊕0=1</text><text x="60" y="80" font-size="14" font-weight="700" fill="#34495e">clock 2</text></g>
  <g data-step="4" data-until="4"><text x="195.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="335.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="475.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="615.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="610" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">0⊕1=1</text><text x="60" y="80" font-size="14" font-weight="700" fill="#34495e">clock 3</text></g>
  <g data-step="5" data-until="5"><text x="195.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="335.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="475.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="615.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="610" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">0⊕0=0</text><text x="60" y="80" font-size="14" font-weight="700" fill="#34495e">clock 4</text></g>
  <g data-step="6" data-until="6"><text x="195.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="335.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="475.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="615.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="610" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">1⊕0=1</text><text x="60" y="80" font-size="14" font-weight="700" fill="#34495e">clock 5</text></g>
  <g data-step="7" data-until="7"><text x="195.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="335.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="475.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="615.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="610" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">1⊕1=0</text><text x="60" y="80" font-size="14" font-weight="700" fill="#34495e">clock 6</text></g>
  <g data-step="8" data-until="8"><text x="195.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="335.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="475.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#9aa7b4">0</text><text x="615.0" y="165" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6feb">1</text><text x="610" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">0⊕1=1</text><text x="60" y="80" font-size="14" font-weight="700" fill="#34495e">clock 7</text></g>
</svg>
