<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="380" rx="14" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">The bathtub curve: failure rate over a chip's life</text>
  <g stroke="#9fb3c8" stroke-width="1.5">
    <line x1="80" y1="310" x2="720" y2="310"/><line x1="80" y1="310" x2="80" y2="60"/>
  </g>
  <text x="400" y="340" text-anchor="middle" font-size="13" fill="#34495e">time in use →</text>
  <text x="40" y="185" text-anchor="middle" font-size="13" fill="#34495e" transform="rotate(-90 40 185)">failure rate →</text>
  <!-- curve -->
  <path d="M85 75C120 220 170 270 260 278H540C620 278 660 250 715 110" fill="none" stroke="#b9c6d6" stroke-width="3"/>

  <g data-step="1">
    <rect x="82" y="60" width="178" height="250" fill="#c0392b" opacity=".08"/>
    <path d="M85 75C120 220 170 270 260 278" fill="none" stroke="#c0392b" stroke-width="4"/>
    <text x="170" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">early failures</text>
    <text x="170" y="118" text-anchor="middle" font-size="12" fill="#34495e">weak chips die young</text>
  </g>
  <g data-step="2">
    <rect x="260" y="60" width="280" height="250" fill="#27ae60" opacity=".08"/>
    <path d="M260 278H540" fill="none" stroke="#27ae60" stroke-width="4"/>
    <text x="400" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#1e8449">useful life</text>
    <text x="400" y="253" text-anchor="middle" font-size="12" fill="#34495e">low, random failures</text>
  </g>
  <g data-step="3">
    <rect x="540" y="60" width="178" height="250" fill="#e67e22" opacity=".08"/>
    <path d="M540 278C620 278 660 250 715 110" fill="none" stroke="#e67e22" stroke-width="4"/>
    <text x="628" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#b8641b">wear-out</text>
    <text x="628" y="118" text-anchor="middle" font-size="12" fill="#34495e">ageing of transistors and wires</text>
  </g>
  <g data-step="4">
    <rect x="82" y="60" width="90" height="250" fill="#6c4fb3" opacity=".14"/>
    <line x1="172" y1="60" x2="172" y2="310" stroke="#6c4fb3" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="127" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#5b3fa0">burn-in</text>
    <text x="127" y="177" text-anchor="middle" font-size="11" fill="#34495e">in the factory,</text>
    <text x="127" y="191" text-anchor="middle" font-size="11" fill="#34495e">not at the customer</text>
  </g>
</svg>
