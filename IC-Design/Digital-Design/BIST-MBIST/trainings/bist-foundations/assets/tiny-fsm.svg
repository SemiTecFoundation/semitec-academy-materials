<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="tf6-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker></defs>
  <rect width="800" height="360" rx="14" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">BIST controller: a small state machine</text>
  <g data-step="1">
    <ellipse cx="90" cy="150" rx="62" ry="38" fill="#f2f5f9" stroke="#34495e" stroke-width="2.5"/>
    <text x="90" y="147" text-anchor="middle" font-size="15" font-weight="800" fill="#34495e">IDLE</text>
    <text x="90" y="166" text-anchor="middle" font-size="11" fill="#34495e">done=0</text>
  </g>
  <g data-step="2">
    <path d="M152 150H226" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#tf6-a)"/>
    <text x="189" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#6c4fb3">start</text>
    <ellipse cx="290" cy="150" rx="62" ry="38" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/>
    <text x="290" y="145" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e79">INIT</text>
    <text x="290" y="164" text-anchor="middle" font-size="11" fill="#34495e">seed LFSR,</text><text x="290" y="177" text-anchor="middle" font-size="11" fill="#34495e">clear MISR</text>
  </g>
  <g data-step="3">
    <path d="M352 150H426" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#tf6-a)"/>
    <ellipse cx="490" cy="150" rx="62" ry="38" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.5"/>
    <text x="490" y="147" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">RUN</text>
    <text x="490" y="166" text-anchor="middle" font-size="11" fill="#34495e">count = count + 1</text>
    <path d="M462 116C440 60 540 60 518 116" fill="none" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#tf6-a)"/>
    <text x="490" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#6c4fb3">count &lt; N</text>
  </g>
  <g data-step="4">
    <path d="M552 150H626" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#tf6-a)"/>
    <text x="589" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#6c4fb3">count = N</text>
    <ellipse cx="700" cy="150" rx="70" ry="38" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/>
    <text x="700" y="147" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00">CHECK</text>
    <text x="700" y="166" text-anchor="middle" font-size="11" fill="#34495e">MISR = golden ?</text>
  </g>
  <g data-step="5">
    <path d="M700 188V252" stroke="#6c4fb3" stroke-width="2.5" marker-end="url(#tf6-a)"/>
    <ellipse cx="700" cy="290" rx="70" ry="38" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/>
    <text x="700" y="287" text-anchor="middle" font-size="15" font-weight="800" fill="#5b3fa0">DONE</text>
    <text x="700" y="306" text-anchor="middle" font-size="11" fill="#34495e">done=1, pass=0/1</text>
    <path d="M630 290H90V190" fill="none" stroke="#6c4fb3" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#tf6-a)"/>
    <text x="360" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#6c4fb3">start = 0 (tester has read the result)</text>
  </g>
</svg>
