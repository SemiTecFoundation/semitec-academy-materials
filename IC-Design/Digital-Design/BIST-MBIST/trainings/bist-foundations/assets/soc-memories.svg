<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="sm-cells" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f3d9a4"/><path d="M8 0H0V8" fill="none" stroke="#d9b56a" stroke-width="1"/></pattern>
  </defs>
  <rect width="800" height="480" rx="14" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="440" rx="10" fill="#f6f9fc" stroke="#1f4e79" stroke-width="3"/>
  <text x="400" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">A system on chip — memories in yellow</text>

  <!-- CPU cluster with L1 caches -->
  <rect x="45" y="65" width="300" height="200" rx="8" fill="#dbe6f3" stroke="#1f4e79" stroke-width="2"/>
  <text x="195" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">CPU cores</text>
  <g>
    <rect x="60" y="98" width="130" height="70" rx="5" fill="#eef4fb" stroke="#7d93ab"/><rect x="200" y="98" width="130" height="70" rx="5" fill="#eef4fb" stroke="#7d93ab"/>
    <rect x="60" y="178" width="130" height="70" rx="5" fill="#eef4fb" stroke="#7d93ab"/><rect x="200" y="178" width="130" height="70" rx="5" fill="#eef4fb" stroke="#7d93ab"/>
    <rect x="68" y="140" width="50" height="22" fill="url(#sm-cells)" stroke="#b8860b"/><rect x="208" y="140" width="50" height="22" fill="url(#sm-cells)" stroke="#b8860b"/>
    <rect x="68" y="220" width="50" height="22" fill="url(#sm-cells)" stroke="#b8860b"/><rect x="208" y="220" width="50" height="22" fill="url(#sm-cells)" stroke="#b8860b"/>
    <rect x="124" y="140" width="22" height="22" fill="#f8e7c4" stroke="#b8860b"/><rect x="264" y="140" width="22" height="22" fill="#f8e7c4" stroke="#b8860b"/>
    <rect x="124" y="220" width="22" height="22" fill="#f8e7c4" stroke="#b8860b"/><rect x="264" y="220" width="22" height="22" fill="#f8e7c4" stroke="#b8860b"/>
    <g font-size="11" fill="#34495e"><text x="70" y="114">core 0</text><text x="210" y="114">core 1</text><text x="70" y="194">core 2</text><text x="210" y="194">core 3</text></g>
  </g>

  <!-- L2 cache -->
  <rect x="365" y="65" width="200" height="200" rx="8" fill="url(#sm-cells)" stroke="#b8860b" stroke-width="2"/>
  <rect x="405" y="148" width="120" height="34" rx="5" fill="#ffffff" opacity=".9"/>
  <text x="465" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#8a6d00">L2 cache</text>

  <!-- GPU -->
  <rect x="585" y="65" width="175" height="200" rx="8" fill="#e6e0f3" stroke="#6c4fb3" stroke-width="2"/>
  <text x="672" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#5b3fa0">GPU / accelerator</text>
  <rect x="600" y="100" width="145" height="60" rx="5" fill="#f2eefb" stroke="#9b87d0"/>
  <rect x="600" y="172" width="145" height="80" rx="5" fill="url(#sm-cells)" stroke="#b8860b"/>
  <text x="672" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6d00">local SRAM</text>

  <!-- interconnect -->
  <rect x="45" y="282" width="715" height="30" rx="6" fill="#e3e9f0" stroke="#7d93ab"/>
  <text x="402" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#34495e">on-chip interconnect</text>

  <!-- peripherals with small memories -->
  <rect x="45" y="330" width="220" height="110" rx="8" fill="#e8f3ec" stroke="#27ae60" stroke-width="2"/>
  <text x="155" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">I/O and peripherals</text>
  <rect x="60" y="364" width="40" height="26" fill="url(#sm-cells)" stroke="#b8860b"/><rect x="110" y="364" width="40" height="26" fill="url(#sm-cells)" stroke="#b8860b"/>
  <rect x="160" y="364" width="40" height="26" fill="url(#sm-cells)" stroke="#b8860b"/><rect x="210" y="364" width="40" height="26" fill="url(#sm-cells)" stroke="#b8860b"/>
  <text x="155" y="420" text-anchor="middle" font-size="11" fill="#34495e">FIFOs, buffers</text>

  <!-- ROM -->
  <rect x="285" y="330" width="150" height="110" rx="8" fill="#f8e7c4" stroke="#b8860b" stroke-width="2"/>
  <text x="360" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#8a6d00">Boot ROM</text>

  <!-- big SRAM -->
  <rect x="455" y="330" width="305" height="110" rx="8" fill="url(#sm-cells)" stroke="#b8860b" stroke-width="2"/>
  <rect x="535" y="368" width="145" height="34" rx="5" fill="#ffffff" opacity=".9"/>
  <text x="607" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#8a6d00">shared SRAM</text>
</svg>
