<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training</title>
  <!-- Template engine styles (layout + components). Do not edit for look & feel: use a theme. -->
  <style>
/* app.css — layout and components of the training template.
   Colours, fonts and radii come from the theme (css/themes/*.css) through CSS variables.
   Two layouts: body.layout-sidebar (contents on the left) and body.layout-topbar (contents on top). */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--head-h) + var(--bar-h, 0px) + 12px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: var(--font-size, 16px)/1.6 var(--font); -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.25; color: var(--heading, var(--text)); }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }
.muted { color: var(--muted); }
.boot { padding: 4rem 2rem; text-align: center; color: var(--muted); }
.boot.error { color: var(--text); max-width: 640px; margin: auto; }
:root { --head-h: 60px; --toc-w: 300px; }

/* ---------------- buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; gap: .4em; padding: .55em 1.05em; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: background .15s, transform .1s, box-shadow .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: .3em .7em; font-size: .85em; }
.btn.danger { color: var(--bad); }
.btn.disabled, .btn:disabled { opacity: .55; cursor: not-allowed; }
.icon-btn { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 8px; border-radius: var(--radius-sm); }
.icon-btn:hover { background: var(--surface-2); }
.topbar-head .icon-btn:hover { background: color-mix(in srgb, currentColor 16%, transparent); }
.burger, .burger::before, .burger::after { display: block; width: 20px; height: 2px; background: currentColor; border-radius: 2px; position: relative; }
.burger::before, .burger::after { content: ""; position: absolute; left: 0; }
.burger::before { top: -6px; } .burger::after { top: 6px; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus, var(--accent)); outline-offset: 2px; }

/* ---------------- header ---------------- */
.topbar-head {
  position: fixed; inset: 0 0 auto 0; height: var(--head-h); z-index: 30;
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
  background: var(--head-bg, var(--surface)); color: var(--head-ink, var(--text));
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm);
}
.brand { flex: 1; min-width: 0; }
.brand-title { font-family: var(--font-head); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: .8em; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { display: flex; align-items: center; gap: 8px; }
.progress-track { width: 140px; height: 8px; border-radius: 99px; background: var(--track, rgba(127,127,127,.25)); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .6s ease; }
.progress-text { font-size: .85em; font-weight: 700; min-width: 3ch; }
.view-menu { position: relative; }
.view-menu > .btn { color: var(--text); }
.view-pop {
  position: absolute; right: 0; top: calc(100% + 8px); width: 230px; padding: 12px; display: grid; gap: 10px;
  background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
}
.view-pop label { display: grid; gap: 4px; font-size: .85em; color: var(--muted); }
.view-pop select { font: inherit; color: var(--text); padding: 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); }

/* ---------------- table of contents ---------------- */
.toc { background: var(--toc-bg, var(--surface)); color: var(--toc-ink, var(--text)); }
.toc-title { font-size: .75em; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 18px 6px; font-weight: 700; }
.toc-list, .toc-subs { list-style: none; margin: 0; padding: 0; }
.toc-row { display: flex; align-items: center; }
.toc-topic { flex: 1; display: flex; align-items: center; gap: 10px; padding: 9px 8px 9px 16px; color: inherit; text-decoration: none; font-weight: 600; min-width: 0; }
.toc-topic:hover { background: var(--surface-2); }
.toc-label { overflow: hidden; text-overflow: ellipsis; }
.toc-status {
  flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .78em; font-weight: 700;
  border: 2px solid var(--border); color: var(--muted); background: var(--surface);
}
.toc-status.done { background: var(--good); border-color: var(--good); color: #fff; }
.toc-status.locked { font-size: .7em; border-style: dashed; }
.toc-item.is-locked .toc-topic { color: var(--muted); }
.toc-item.current > .toc-row { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.toc-item.current .toc-status:not(.done) { border-color: var(--accent); color: var(--accent); }
.toc-exp { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 10px 14px; }
.chev { display: inline-block; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform .2s; }
.toc-item.expanded .toc-exp .chev, .acc-item.open .chev { transform: rotate(-135deg); }
.toc-subs { display: none; }
.toc-item.expanded .toc-subs { display: block; }
.toc-sub { display: block; padding: 6px 16px 6px 52px; color: var(--muted); text-decoration: none; font-size: .9em; border-left: 3px solid transparent; }
.toc-sub:hover { color: var(--text); background: var(--surface-2); }
.toc-sub.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.toc-cert .toc-status.done { background: var(--warn); border-color: var(--warn); }

/* ---------------- layout: SIDEBAR ---------------- */
.layout-sidebar .toc {
  position: fixed; top: var(--head-h); bottom: 0; left: 0; width: var(--toc-w); overflow-y: auto; z-index: 20;
  border-right: 1px solid var(--border); transition: transform .3s ease; padding-bottom: 40px;
}
.layout-sidebar .main { margin-left: var(--toc-w); transition: margin .3s ease; }
.layout-sidebar.toc-hidden .toc { transform: translateX(-100%); }
.layout-sidebar.toc-hidden .main { margin-left: 0; }

/* ---------------- layout: TOP BAR ---------------- */
.layout-topbar { --bar-h: 48px; }
.layout-topbar .toc {
  position: fixed; top: var(--head-h); left: 0; right: 0; height: var(--bar-h); z-index: 25;
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: transform .3s ease, opacity .3s;
}
.layout-topbar .toc-title { display: none; }
.layout-topbar .toc-list { display: flex; height: 100%; align-items: stretch; overflow-x: auto; padding: 0 8px; scrollbar-width: thin; }
.layout-topbar .toc-item { position: static; flex: none; }
.layout-topbar .toc-row { height: 100%; }
.layout-topbar .toc-topic { padding: 0 4px 0 10px; height: 100%; font-size: .9em; }
.layout-topbar .toc-label { max-width: 16ch; white-space: nowrap; }
.layout-topbar .toc-status { width: 22px; height: 22px; font-size: .7em; }
.layout-topbar .toc-exp { padding: 0 10px; height: 100%; }
.layout-topbar .toc-item.current > .toc-row { box-shadow: inset 0 -3px 0 var(--accent); }
.layout-topbar .toc-subs {
  position: fixed; top: calc(var(--head-h) + var(--bar-h)); min-width: 260px; max-width: 360px; z-index: 40;
  background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow); padding: 6px 0;
}
.layout-topbar .toc-sub { padding: 7px 16px; }
.layout-topbar .main { margin: 0 auto; max-width: 1060px; padding-top: calc(var(--head-h) + var(--bar-h) + 10px); }
.layout-topbar.toc-hidden { --bar-h: 0px; }
.layout-topbar.toc-hidden .toc { transform: translateY(-100%); opacity: 0; pointer-events: none; }

/* ---------------- main content ---------------- */
.main { padding: calc(var(--head-h) + 20px) clamp(16px, 4vw, 56px) 80px; outline: none; }
.main:focus, .main:focus-visible { outline: none; }
.layout-sidebar .main > * { max-width: 920px; margin-left: auto; margin-right: auto; }
.topic-head { padding: 18px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; animation: rise .45s ease both; }
.topic-kicker { text-transform: uppercase; letter-spacing: .08em; font-size: .75em; font-weight: 700; color: var(--accent); }
.topic-head h1 { font-size: clamp(1.6rem, 3vw, 2.3rem); margin: .2em 0 .3em; }
.topic-summary { font-size: 1.1em; color: var(--muted); margin: 0 0 .6em; }
.objectives { margin: .4em 0 1em; padding-left: 1.2em; }
.objectives li::marker { color: var(--accent); }
.subsection { padding: 22px 0 6px; animation: rise .5s ease both; scroll-margin-top: calc(var(--head-h) + var(--bar-h, 0px) + 12px); border-radius: var(--radius); }
.subsection h2 { font-size: 1.45rem; margin: .3em 0 .6em; }
.sub-num { color: var(--accent); font-weight: 700; margin-right: .2em; }
.subsection.flash { animation: flash 1.6s ease; }
.block { margin: 14px 0; }
.md p { margin: .55em 0; }
.md ul, .md ol { padding-left: 1.3em; }
.md blockquote { margin: .8em 0; padding: .4em 1em; border-left: 4px solid var(--accent); background: var(--surface-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes flash { 0%, 100% { background: transparent; } 20% { background: var(--accent-soft); box-shadow: 0 0 0 8px var(--accent-soft); } }
.topic-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); }
.locked-card { text-align: center; padding: 60px 20px; animation: rise .4s ease both; }
.lock-icon { font-size: 3rem; }
.remaining { display: inline-block; text-align: left; }

/* ---------------- callouts ---------------- */
.callout { padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); border-left: 5px solid var(--accent); background: var(--surface); }
.callout-title { font-weight: 700; margin-bottom: 2px; }
.callout.tip { border-left-color: var(--good); }
.callout.warning { border-left-color: var(--warn); }
.callout.key { border-left-color: var(--accent); background: var(--accent-soft); }
.callout .md p:first-child { margin-top: 0; } .callout .md p:last-child { margin-bottom: 0; }

/* ---------------- figures, zoom ---------------- */
.fig { margin: 0; }
.fig figcaption { font-size: .88em; color: var(--muted); text-align: center; margin-top: 6px; }
.media { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; text-align: center; overflow: hidden; }
.media img, .media svg, .svg-host svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.svg-host svg { width: 100%; max-height: 460px; }
.media.zoomable { cursor: zoom-in; transition: box-shadow .2s, transform .2s; }
.media.zoomable:hover { box-shadow: var(--shadow); }
.media.zoomable::after { content: "⤢"; position: absolute; right: 10px; top: 8px; font-size: 1.1em; color: var(--muted); opacity: .7; }
.media-bar { display: flex; justify-content: center; margin-top: 6px; }
.svg-host.paused * { animation-play-state: paused !important; }
.zoom-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(10,14,20,.88); display: none; }
.zoom-overlay.open { display: block; animation: fadein .2s ease; }
.zoom-stage { position: absolute; inset: 0 0 60px 0; display: grid; place-items: center; overflow: hidden; cursor: grab; touch-action: none; }
.zoom-holder { transform-origin: center center; max-width: 92vw; max-height: 82vh; transition: transform .08s linear; background: #fff; border-radius: 6px; padding: 8px; }
.zoom-holder img, .zoom-holder svg { max-width: 88vw; max-height: 78vh; width: auto; height: auto; display: block; }
.zoom-holder img { width: min(88vw, 1400px); height: auto; object-fit: contain; }
.zoom-holder svg { width: min(88vw, 1400px); }
.zoom-bar { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; gap: 8px; justify-content: center; }
@keyframes fadein { from { opacity: 0; } }

/* ---------------- compare slider ---------------- */
.compare { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: #fff; --pos: 50%; }
.compare > img, .cmp-top img { display: block; width: 100%; height: auto; }
.cmp-top { position: absolute; inset: 0; }
.cmp-line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 3px; background: var(--accent); transform: translateX(-50%); pointer-events: none; }
.cmp-line::after { content: "⇆"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: var(--accent); color: var(--accent-ink); border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center; }
.cmp-range { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.cmp-label { position: absolute; top: 8px; font-size: .75em; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff; pointer-events: none; }
.cmp-label.l { left: 8px; } .cmp-label.r { right: 8px; }

/* ---------------- accordion ---------------- */
.accordion { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.acc-item + .acc-item { border-top: 1px solid var(--border); }
.acc-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 16px; background: transparent; border: 0; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; }
.acc-head:hover { background: var(--surface-2); }
.acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.acc-body > .content { overflow: hidden; padding: 0 16px; }
.acc-item.open .acc-body { grid-template-rows: 1fr; }
.acc-item.open .acc-body > .content { padding-bottom: 12px; }

/* ---------------- tabs ---------------- */
.tabs { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.tab-bar { display: flex; gap: 2px; background: var(--surface-2); padding: 6px 6px 0; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 9px 16px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: var(--radius-sm) var(--radius-sm) 0 0; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.tab-panel { padding: 6px 16px 14px; animation: fadein .25s ease; }

/* ---------------- flip cards ---------------- */
.flipgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.flipcard { perspective: 900px; border: 0; padding: 0; background: transparent; cursor: pointer; min-height: 150px; font: inherit; color: inherit; text-align: center; }
.flip-inner { position: relative; width: 100%; height: 100%; min-height: 150px; transition: transform .55s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.flipcard.flipped .flip-inner { transform: rotateY(180deg); }
.flip-front, .flip-back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius); padding: 14px; display: grid; place-items: center; border: 1px solid var(--border); }
.flip-front { background: var(--surface); font-weight: 700; font-size: 1.05em; box-shadow: var(--shadow-sm); }
.flip-back { background: var(--accent); color: var(--accent-ink); transform: rotateY(180deg); font-size: .92em; }
.flip-front p, .flip-back p { margin: 0; }

/* ---------------- reveal / hotspots ---------------- */
.reveal { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
.reveal.side { grid-template-columns: minmax(0, 3fr) minmax(200px, 2fr); }
.reveal-stage { position: relative; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
.reveal-stage > img, .reveal-stage > .svg-host { border-radius: var(--radius); overflow: hidden; }
.reveal-stage img, .reveal-stage .svg-host svg { display: block; width: 100%; height: auto; max-height: none; }
.reveal-panel { min-height: 92px; }
.spot { position: absolute; border: 2px dashed var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; cursor: pointer; padding: 0; transition: background .15s, transform .15s; }
.spot:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.spot.active { border-style: solid; background: color-mix(in srgb, var(--accent) 25%, transparent); }
.spot.seen:not(.active) { border-color: var(--good); }
.spot-num { position: absolute; top: -11px; left: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: .75em; font-weight: 700; display: grid; place-items: center; animation: pulse 2s infinite; }
.spot.seen .spot-num { animation: none; background: var(--good); }
.spot.badge-tr .spot-num { left: auto; right: -11px; }
.spot.badge-bl .spot-num { top: auto; bottom: -11px; }
.spot.badge-br .spot-num { top: auto; bottom: -11px; left: auto; right: -11px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.reveal-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; min-height: 120px; animation: fadein .25s; }
.reveal-panel h4 { margin: .2em 0 .4em; color: var(--accent); }
.spot.pick { border-style: dotted; background: transparent; }
.spot.pick:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.spot.pick.chosen { background: color-mix(in srgb, var(--accent) 35%, transparent); border-style: solid; }
.spot.is-correct { border-color: var(--good) !important; box-shadow: 0 0 0 3px var(--good); }

/* ---------------- step animations (scrolly + stepper) ---------------- */
.svg-host [data-step] { transition: opacity .5s ease, transform .5s ease, filter .3s; }
.svg-host .st-hidden { opacity: 0; }
.svg-host .st-past { opacity: .55; }
.svg-host .st-current { opacity: 1; filter: drop-shadow(0 0 5px var(--accent)); }
.scrolly { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.scrolly-visual .svg-host svg { max-height: calc(100vh - var(--head-h) - var(--bar-h, 0px) - 70px); width: 100%; }
.scrolly-step { font-size: .95em; }
.scrolly-visual { position: sticky; top: calc(var(--head-h) + var(--bar-h, 0px) + 20px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.scrolly-steps { padding: 10vh 0 30vh; }
.scrolly-step { min-height: 46vh; padding: 16px 18px; margin-bottom: 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); opacity: .45; transition: opacity .3s, box-shadow .3s, border-color .3s; }
.scrolly-step.active { opacity: 1; border-color: var(--accent); box-shadow: var(--shadow); }
.step-num { font-size: .75em; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--accent); }
.scrolly-step h4 { margin: .2em 0; }
.stepper .media { padding: 14px; }
.stepper-caption { min-height: 3.2em; padding: 10px 4px 4px; }
.stepper-bar { display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; }
.stepper .media:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.step-counter { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------------- activities: sort and categorize ---------------- */
.activity { border: 1px dashed var(--accent); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); }
.hint { font-size: .85em; color: var(--muted); margin: .2em 0 .6em; }
.prompt p { margin-top: 0; font-weight: 600; }
.sortlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; counter-reset: s; }
.sortlist li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: grab; transition: box-shadow .15s, background .2s; counter-increment: s; }
.sortlist li::before { content: counter(s); font-weight: 700; color: var(--accent); min-width: 1.2em; }
.sortlist li.dragging { opacity: .5; box-shadow: var(--shadow); }
.sortlist li .li-text { flex: 1; }
.sortlist.locked li { cursor: default; }
.grip { color: var(--muted); letter-spacing: -2px; }
.arrows { display: flex; gap: 2px; }
.mini { border: 1px solid var(--border); background: var(--surface); border-radius: 4px; cursor: pointer; font-size: .7em; padding: 2px 6px; color: var(--muted); }
.good { border-color: var(--good) !important; background: color-mix(in srgb, var(--good) 14%, var(--surface)) !important; }
.bad { border-color: var(--bad) !important; background: color-mix(in srgb, var(--bad) 12%, var(--surface)) !important; }
.activity-bar, .quiz-bar { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.quiz-bar.center { justify-content: center; margin-top: 30px; }
.activity-msg { font-weight: 700; }
.activity-msg.good, .activity-msg.bad { background: none !important; border: 0; }
.activity-msg.good { color: var(--good); } .activity-msg.bad { color: var(--bad); }
.buckets { display: grid; gap: 12px; }
.pool, .zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 8px 10px; min-height: 64px; transition: border-color .15s, background .15s; }
.zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.zone { background: var(--surface-2); cursor: pointer; }
.zone.over { border-color: var(--accent); background: var(--accent-soft); }
.zone-title { font-size: .8em; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
.zone-items { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.chip { display: inline-block; padding: 6px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); cursor: grab; font-size: .92em; box-shadow: var(--shadow-sm); user-select: none; transition: transform .12s; }
.chip:hover { transform: translateY(-1px); }
.chip.selected { outline: 3px solid var(--accent); }

/* ---------------- code, table, video ---------------- */
.codebox { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--code-bg, #0f1720); }
.code-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: rgba(255,255,255,.06); color: #c9d4e0; font-size: .8em; }
.codebox pre { margin: 0; padding: 14px 16px; overflow-x: auto; color: var(--code-ink, #e6edf3); font: .88em/1.55 var(--font-mono); }
.codebox code { background: none; padding: 0; color: inherit; }
.copy { background: transparent; color: #c9d4e0; border-color: rgba(255,255,255,.2); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; font-size: .94em; }
.tbl th, .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.tbl th { background: var(--surface-2); font-weight: 700; }
.video-wrap { position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden; background: #000; }
.video-wrap video, .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* ---------------- quiz ---------------- */
.quiz { margin-top: 36px; padding: 22px clamp(14px, 3vw, 28px); border-radius: var(--radius); background: var(--quiz-bg, var(--surface)); border: 2px solid var(--accent); box-shadow: var(--shadow); scroll-margin-top: calc(var(--head-h) + var(--bar-h, 0px) + 12px); }
.quiz-head { display: flex; align-items: center; gap: 12px; }
.quiz-head h3 { margin: 0; font-size: 1.3rem; }
.quiz-badge { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: .75em; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; }
.question { margin: 18px 0; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); transition: border-color .2s, background .2s; }
.q-text { font-weight: 600; display: flex; gap: 8px; margin-bottom: 4px; }
.q-num { color: var(--accent); }
.q-img { max-width: 100%; border-radius: var(--radius-sm); margin: 6px 0; }
.q-options { display: grid; gap: 8px; }
.q-option { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; background: var(--surface-2); transition: border-color .15s, background .15s; }
.q-option:hover { border-color: var(--accent); }
.q-option input { margin-top: .3em; accent-color: var(--accent); }
.q-option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.q-option.is-correct { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.question.q-good { border-color: var(--good); }
.question.q-bad { border-color: var(--bad); }
.q-feedback:empty { display: none; }
.q-feedback { margin-top: 10px; font-size: .92em; }
.q-good .q-feedback strong { color: var(--good); } .q-bad .q-feedback strong { color: var(--bad); }
.quiz-result { margin-top: 12px; padding: 0; border-radius: var(--radius); }
.quiz-result.pass, .quiz-result.fail { padding: 14px 16px; animation: rise .35s ease both; }
.quiz-result.pass { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border: 1px solid var(--good); }
.quiz-result.fail { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); border: 1px solid var(--bad); }
.result-line { font-size: 1.05em; }
.review-list a { font-weight: 600; }

.cert-form { margin: 18px 0; }
.cert-row { display: flex; flex-wrap: wrap; gap: 10px; }
.name-input { flex: 1; min-width: 220px; font: inherit; padding: .55em .8em; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.cert-out { margin-top: 20px; overflow-x: auto; }
.load-error { color: var(--bad); }

/* ---------------- paging: one subsection per page ---------------- */
.mode-badge { display: inline-block; margin-left: 10px; padding: 1px 8px; border-radius: 99px; font-size: .62em; letter-spacing: .08em; text-transform: uppercase; vertical-align: middle; background: var(--warn); color: #1d1d1d; }
.view-note { margin: 0; font-size: .8em; color: var(--muted); }
.topic-head.compact { padding: 10px 0 6px; border-bottom: 0; margin-bottom: 0; }
.topic-title { font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; color: var(--heading, var(--text)); }
.page-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 4px; padding: 0 0 14px; border-bottom: 1px solid var(--border); counter-reset: none; }

.page-step:hover { border-color: var(--accent); color: var(--text); }
.page-step .dot { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .85em; background: var(--surface-2); color: var(--muted); }
.page-step .step-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-step.visited .dot { background: color-mix(in srgb, var(--good) 22%, var(--surface)); color: var(--good); }
.page-step.current { border-color: var(--accent); background: var(--accent-soft); color: var(--text); font-weight: 600; }
.page-step.current .dot { background: var(--accent); color: var(--accent-ink); }
.page-step.is-quiz .dot { font-size: .8em; }
.page-steps:has(.page-step:nth-child(6)) .page-step:not(.current) .step-label { display: none; }
.page-steps:has(.page-step:nth-child(6)) .page-step:not(.current) { padding-right: 4px; }
.review-note { margin: 14px 0 0; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); }
.review-note .review-list { margin: 6px 0 10px; }
.review-note.on-list { border-width: 2px; }
.pager { display: flex; justify-content: space-between; align-items: stretch; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); }
.pager .btn { flex-direction: column; align-items: flex-start; gap: 0; max-width: 48%; padding: .55em 1.1em; }
.pager .btn small { font-size: .72em; font-weight: 600; opacity: .75; text-transform: uppercase; letter-spacing: .05em; }
.pager .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.pager .pager-next { align-items: flex-end; margin-left: auto; text-align: right; }
.toc-sub.visited::after { content: " ✓"; color: var(--good); font-size: .85em; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200; max-width: min(560px, 92vw); padding: 10px 16px; border-radius: var(--radius); background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow); animation: rise .3s ease both; transition: opacity .4s; }
.toast.bad { border-color: var(--bad); border-left: 5px solid var(--bad); }
.toast.out { opacity: 0; }

/* ---------------- certificate preview controls ---------------- */
.cert-panel { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin: 16px 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.cert-panel label { display: grid; gap: 4px; font-size: .82em; color: var(--muted); }
.cert-panel label.wide { flex: 1 1 100%; }
.cert-panel select { font: inherit; color: var(--text); padding: 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); }
.cert-panel input[type=color] { width: 48px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); background: none; cursor: pointer; }
.cert-json-box { margin-top: 18px; }
.cert-json-box summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.cert-json { background: var(--code-bg); color: var(--code-ink); padding: 12px 16px; border-radius: var(--radius); font: .85em/1.5 var(--font-mono); overflow-x: auto; }

/* ---------------- responsive ---------------- */
.scrim { display: none; }
@media (max-width: 860px) {
  :root { --toc-w: 290px; }
  .progress-track { width: 70px; }
  .brand-sub { display: none; }
  .layout-sidebar .main { margin-left: 0 !important; }
  .layout-sidebar .toc { transform: translateX(-100%); box-shadow: var(--shadow); }
  .layout-sidebar.toc-open .toc { transform: none; }
  .layout-sidebar.toc-open .scrim { display: block; position: fixed; inset: var(--head-h) 0 0 0; background: rgba(0,0,0,.35); z-index: 15; }
  .reveal, .scrolly { grid-template-columns: 1fr; }
  .scrolly-visual { top: calc(var(--head-h) + var(--bar-h, 0px)); z-index: 2; }
  .scrolly-step { min-height: 30vh; }
  .page-step:not(.current) .step-label { display: none; }
  .page-step:not(.current) { padding-right: 4px; }
  .pager .btn { max-width: 100%; }
  .pager { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }

/* ---------------- print: only the certificate ---------------- */
@media print {
  body { background: #fff !important; }
  .topbar-head, .toc, .scrim, .toast, .main > :not(.cert-out) { display: none !important; }
  .main, .layout-sidebar .main, .layout-topbar .main { margin: 0 !important; padding: 0 !important; max-width: none !important; }
  .main > .cert-out { margin: 0 !important; max-width: none !important; overflow: visible; }
}

  <style>
/* certificate.css — completion certificate.

.certificate {
  --cert-accent: #1f4e79;
  --cert-accent2: #c9a227;
  --cert-paper: #fffdf7;
  --cert-ink: #1d2433;
  position: relative;
  width: 100%;
  max-width: 1000px;
  aspect-ratio: 297 / 210;
  margin: 0 auto;
  background: var(--cert-paper);
  color: var(--cert-ink);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .18);
  overflow: hidden;
  container-type: inline-size;
}
.certificate.portrait { aspect-ratio: 210 / 297; max-width: 720px; }
.certificate.font-serif { font-family: "Georgia", "Cambria", "Times New Roman", serif; }
.certificate.font-sans { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

.cert-frame {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  padding: 6cqw 8cqw;
  gap: 1.3cqw;
}
.cert-top { display: flex; align-items: center; gap: 1.6cqw; margin-bottom: .6cqw; }
.cert-logo { height: 6cqw; width: auto; }
.cert-logotext {
  width: 6cqw; height: 6cqw; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--cert-accent); color: var(--cert-paper);
  font-weight: 700; font-size: 2cqw; letter-spacing: .05em;
}
.cert-issuer { font-size: 1.6cqw; letter-spacing: .18em; text-transform: uppercase; color: var(--cert-accent); font-weight: 600; }
.cert-title { font-size: 4.6cqw; line-height: 1.1; color: var(--cert-accent); font-weight: 700; letter-spacing: .02em; }
.cert-subtitle { font-size: 1.6cqw; opacity: .8; }
.cert-presented { margin-top: 1.4cqw; font-size: 1.6cqw; font-style: italic; opacity: .85; }
.cert-name {
  font-size: 5cqw; line-height: 1.15; font-weight: 700;
  padding: 0 3cqw .6cqw; border-bottom: .25cqw solid var(--cert-accent2);
  min-width: 50%;
}
.cert-body { font-size: 1.8cqw; max-width: 75%; line-height: 1.45; }
.cert-body strong { color: var(--cert-accent); }
.cert-topics { font-size: 1.2cqw; max-width: 64%; opacity: .75; line-height: 1.5; }
.cert-signs { display: flex; gap: 8cqw; margin-top: 2.4cqw; justify-content: center; flex-wrap: wrap; }
.cert-sign { min-width: 18cqw; }
.sign-line { border-top: .15cqw solid currentColor; margin-bottom: .6cqw; opacity: .7; }
.sign-name { font-size: 1.6cqw; font-weight: 600; }
.sign-role { font-size: 1.25cqw; opacity: .7; }
.cert-foot {
  position: absolute; left: 6cqw; right: 6cqw; bottom: 4cqw;
  display: flex; justify-content: space-between; font-size: 1.1cqw; opacity: .65;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
}
.cert-seal {
  position: absolute; right: 7cqw; bottom: 8cqw;
  width: 11cqw; height: 11cqw; border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--cert-accent2) 70%, white), var(--cert-accent2));
  color: var(--cert-paper);
  box-shadow: 0 0 0 .5cqw var(--cert-paper), 0 0 0 .8cqw var(--cert-accent2);
  font-weight: 700; font-size: 1.5cqw; letter-spacing: .08em; text-transform: uppercase;
  transform: rotate(-12deg);
}
.cert-seal span { max-width: 80%; line-height: 1.15; }

/* ---------- design: classic (double frame, corner ornaments) ---------- */
.design-classic .cert-frame { margin: 2.4cqw; border: .5cqw double var(--cert-accent); }
.design-classic .cert-frame::before {
  content: ""; position: absolute; inset: 1cqw; border: .12cqw solid var(--cert-accent2); pointer-events: none;
}
.design-classic .cert-frame::after {
  content: ""; position: absolute; inset: -.5cqw; pointer-events: none;
  background:
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) top left / 4cqw 4cqw no-repeat,
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) top right / 4cqw 4cqw no-repeat,
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) bottom left / 4cqw 4cqw no-repeat,
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) bottom right / 4cqw 4cqw no-repeat;
}
.design-classic .cert-foot { bottom: 5cqw; left: 7cqw; right: 7cqw; }

/* ---------- design: modern (color band on the left, left-aligned) ---------- */
.design-modern { background: linear-gradient(90deg, var(--cert-accent) 0 22%, var(--cert-paper) 22%); }
.design-modern::before {
  content: ""; position: absolute; left: 22%; top: 0; bottom: 0; width: 1.2cqw; background: var(--cert-accent2);

.design-modern .cert-logotext { background: var(--cert-paper); color: var(--cert-accent); }
.design-modern .cert-issuer { color: var(--cert-paper); max-width: 16cqw; text-align: center; font-size: 1.3cqw; }
.design-modern .cert-title { text-transform: uppercase; letter-spacing: .08em; font-size: 4cqw; }
.design-modern .cert-name { border-bottom: none; padding: 0; position: relative; }
.design-modern .cert-name::after { content: ""; display: block; width: 10cqw; height: .5cqw; background: var(--cert-accent2); margin-top: 1cqw; }
.design-modern .cert-body, .design-modern .cert-topics { max-width: 92%; }
.design-modern .cert-signs { justify-content: flex-start; }
.design-modern .cert-foot { left: calc(22% + 7cqw); }
.design-modern .cert-seal { right: 5cqw; bottom: 7cqw; }

/* ---------- design: minimal (thin rule, lots of space) ---------- */
.design-minimal { box-shadow: 0 2px 12px rgba(0, 0, 0, .1); }
.design-minimal .cert-frame { margin: 3cqw; border: .1cqw solid color-mix(in srgb, var(--cert-ink) 25%, transparent); }
.design-minimal .cert-title { font-weight: 300; letter-spacing: .25em; text-transform: uppercase; font-size: 3.2cqw; color: var(--cert-ink); }
.design-minimal .cert-name { font-weight: 400; border-bottom-width: .12cqw; border-color: var(--cert-accent); }
.design-minimal .cert-seal { width: 9cqw; height: 9cqw; right: 5.5cqw; bottom: 6.5cqw; background: none; color: var(--cert-accent); box-shadow: inset 0 0 0 .2cqw var(--cert-accent); transform: none; }

/* ---------- print: A4, only the certificate ---------- */
@media print {
  @page { size: A4 landscape; margin: 0; }
  .certificate { max-width: none; width: 297mm; height: 210mm; aspect-ratio: auto; box-shadow: none; }
  .certificate.portrait { width: 210mm; height: 297mm; }
  .certificate, .certificate * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

iframe.certificate.web-certificate { display:block; width:100%; height:620px; border:0; padding:0; }
@media print { iframe.certificate.web-certificate { height:190mm; } }

he defect changes the logic", "wire A is *stuck at 0*"], ["**Failure**", "the chip gives a wrong result that someone can observe", "the adder outputs 6 instead of 7"]], "caption": "From defect to failure"}, {"type": "callout", "kind": "key", "title": "Why we need fault models", "md": "There are endless kinds of physical defects, but only a few **fault models** (stuck-at, transition, bridging, memory cell faults …). Tests are written to detect the fault models. If a test detects the model, it detects most of the real defects behind it."}, {"type": "callout", "kind": "info", "title": "Verification ≠ test", "md": "**Verification** checks the *design* once, before manufacturing: is the RTL correct? **Test** checks *every manufactured chip*: was this copy built correctly?"}]}, {"id": "yield-cost", "title": "Yield and the cost of a test escape", "blocks": [{"type": "text", "md": "The share of good dies on a wafer is called **yield**:\n\n> yield = good dies ÷ all dies\n\nIf a wafer has 600 dies and the yield is 90 %, about **60 dies are bad**. Test must find all of them. A bad chip that passes the test and is shipped is called a **test escape**. Quality is measured in **DPPM** — defective parts per million shipped."}, {"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MDAgMzgwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8cmVjdCB3aWR0aD0iNzAwIiBoZWlnaHQ9IjM4MCIgcng9IjE0IiBmaWxsPSIjZmZmZmZmIi8+CiAgPHRleHQgeD0iMzUwIiB5PSIzMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNiIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzFmNGU3OSI+Q29zdCBvZiBmaW5kaW5nIG9uZSBiYWQgY2hpcCAocmVsYXRpdmUsIGxvZ2FyaXRobWljIHNjYWxlKTwvdGV4dD4KICA8IS0tIGF4aXMgLS0+CiAgPGcgc3Ryb2tlPSIjOWZiM2M4IiBzdHJva2Utd2lkdGg9IjEuNSI+CiAgICA8bGluZSB4MT0iNzAiIHkxPSIzMjAiIHgyPSI2NzAiIHkyPSIzMjAiLz4KICAgIDxsaW5lIHgxPSI3MCIgeTE9IjMyMCIgeDI9IjcwIiB5Mj0iNjAiLz4KICA8L2c+CiAgPGcgc3Ryb2tlPSIjZTVlY2YzIiBzdHJva2Utd2lkdGg9IjEiPgogICAgPGxpbmUgeDE9IjcwIiB Cg==", "steps": [{"title": "1. Wafer fabrication", "md": "The factory builds hundreds of dies on one silicon wafer. Some of them carry defects — nobody knows which yet."}, {"title": "2. Wafer sort", "md": "A **probe card** with fine needles touches the pads of each die. A **tester** applies test patterns and compares the answers. Failing dies are marked and later thrown away."}, {"title": "3. Dicing and packaging", "md": "The wafer is cut into dies. Only the good ones are put into packages — packaging bad dies would waste money."}, {"title": "4. Burn-in and final test", "md": "Some products (cars, servers) are first **stressed** at high temperature and voltage so that weak chips fail now, not later. Then every package is tested again, often at several temperatures and at full speed."}, {"title": "5. Board and system test", "md": "The customer solders the chips on boards and tests the boards. A bad chip found here is already expensive."}, {"title": "6. In the field", "md": "The chip works in a product for years. Some chips must also **test themselves** during their life — a car checks its safety chips every time it starts."}]}, {"type": "accordion", "items": [{"title": "What is a tester (ATE)?", "md": "**Automatic Test Equipment** is a large, expensive machine with hundreds of digital channels. Each channel drives or reads one chip pin with exact timing. It stores the test patterns in its memory and compares every response with the expected value."}, {"title": "What does a test pattern look like?", "blocks": [{"type": "text", "md": "A pattern is a list of values to apply to the inputs and the values expected on the outputs, cycle by cycle:"}, {"type": "code", "language": "text", "code": "cycle  inputs (a b c)   expected out (y)\n  1        0 0 1              1\n  2        1 0 1              0\n  3        1 1 0              1\n  …       (millions of cycles for a large chip)", "caption": "A tiny piece of a test program"}]}, {"title": "Why test time is money", "md": "A tester costs millions of dollars, so its time is expensive — test cost is often counted in cents per second. Multiply the seconds per chip by millions of chips per year: shortening the test by one second saves real money."}]}, {"type": "sort", "prompt": "Practice: put the steps in the order a chip goes through them.", "items": ["Wafer fabrication", "Wafer sort", "Dicing and packaging", "Final test", "Board test", "Use in the field"]}]}], "quiz": {"questions": [{"id": "q-defect", "type": "single", "text": "A tiny metal particle connects two neighbouring wires on a die. In test language this particle is …", "options": ["a defect", "a fault", "a failure", "a design bug"], "correct": [0], "review": ["defects-faults"], "explain": "The particle is the **physical flaw** — a defect. \"Wire A stuck at 0\" would be the fault that models it."}, {"id": "q-fault", "type": "single", "text": "\"The output of gate G is stuck at 0\" is an example of …", "options": ["a fault model", "a defect", "a test pattern", "a yield value"], "correct": [0], "review": ["defects-faults"], "explain": "Stuck-at-0 is a **logical model** of what a defect does to the circuit."}, {"id": "q-verif", "type": "truefalse", "text": "Manufacturing test checks whether the RTL design is correct.", "options": ["True", "False"], "correct": [1], "shuffle": false, "review": ["defects-faults"], "explain": "That is **verification**. Test checks whether each manufactured copy was **built** correctly."}, {"id": "q-yield", "type": "single", "text": "A wafer has 500 dies; 450 pass the test. What is the yield?", "options": ["90 %", "50 %", "10 %", "45 %"], "correct": [0], "review": ["yield-cost"], "explain": "450 ÷ 500 = 0.9 = **90 %**."}, {"id": "q-cost", "type": "single", "text": "Where is it cheapest to find a bad chip?", "options": ["At wafer sort", "In final test", "On the customer's board", "In the field"], "correct": [0], "review": ["yield-cost"], "explain": "Each later stage costs roughly **ten times** more (the rule of ten)."}, {"id": "q-flow", "type": "order", "text": "Put the test steps in the right order.", "items": ["Wafer sort", "Packaging", "Final test", "Board test", "In the field"], "review": ["test-flow"]}]}}, "topics/02-why-bist.json": {"id": "why-bist", "title": "Why external test is not enough", "duration": "25 min", "summary": "A tester outside the chip runs into three walls: **too few pins**, **too slow** for some defects, and **no way in** to the buried memories. This topic shows each wall and the idea that gets around all three: let the chip **test itself**.", "objectives": ["Estimate how long it takes to load test data through a few pins.", "Explain why delay defects need a test at full clock speed.", "Explain why embedded memories are hard to reach from outside.", "Name the four blocks of a BIST and what each one does."], "subsections": [{"id": "pin-bottleneck", "title": "Too few pins, too much data", "blocks": [{"type": "text", "md": "To test the logic, the tester must put a known value into **every flip-flop**, run one clock, and read every flip-flop back. For this the flip-flops are connected into long shift registers called **scan chains** (you meet them in the DFT course). The values are shifted in and out through a few **test pins** — one bit per pin per clock."}, {"type": "svg", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MDAgNDAwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8c3R5bGU+CiAgICAucGItYml0IHsgYW5pbWF0aW9uOiBwYi1tb3ZlIDIuNHMgbGluZWFyIGluZmluaXRlOyB9CiAgICAucGItZDEgeyBhbmltYXRpb24tZGVsYXk6IC0wLjZzOyB9IC5wYi1kMiB7IGFuaW1hdGlvbi1kZWxheTogLTEuMnM7IH0gLnBiLWQzIHsgYW5pbWF0aW9uLWRlbGF5OiAtMS44czsgfQogICAgQGtleWZyYW1lcyBwYi1tb3ZlIHsgZnJvbSB7IHRyYW5zZm9ybTogdHJhbnNsYXRlWCgwKTsgb3BhY2l0eTogMTsgfSA4NSUgeyBvcGFjaXR5OiAxOyB9IHRvIHsgdHJhbnNmb3JtOiB0cmFuc2xhdGVYKDI1MHB4KTsgb3BhY2l0eTogMDsgfSB9CiAgICAucGItZmYgeyBhbmltYXRpb246IHBiLWJsaW5rIDNzIGVhc2UtaW4tb3V0IGluZmluaXRlOyB9CiAgIC lion** flip-flops and **20** scan input pins.\n\n- Loading one pattern: 10 000 000 ÷ 20 = **500 000 clock cycles**.\n- The test needs **10 000** patterns: 500 000 × 10 000 = 5 × 10⁹ cycles.\n- Shifting at 50 MHz: 5 × 10⁹ ÷ 50 × 10⁶ = **100 seconds** per chip — and the tester must store all those bits."}, {"type": "text", "md": "One hundred seconds per chip, times millions of chips, is far too expensive. Engineers fight back with **test compression** (fewer bits on the pins, expanded on chip) and with **BIST**, where the patterns are made on the chip and only a start command and a result cross the pins.\n\nAnd the problem grows every year: chips get more flip-flops much faster than they get more pins."}]}, {"id": "at-speed", "title": "Defects that only show at full speed", "blocks": [{"type": "text", "md": "Remember the **slow path** from Topic 1: a resistive contact makes a signal arrive late. The logic value is right — it just comes **too late**. Whether the test catches it depends on the clock:"}, {"type": "tabs", "tabs": [{"label": "Slow test clock", "blocks": [{"type": "image", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MDAgMjYwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8cmVjdCB3aWR0aD0iNzAwIiBoZWlnaHQ9IjI2MCIgcng9IjE0IiBmaWxsPSIjZmZmZmZmIi8+CiAgPHRleHQgeD0iMzUwIiB5PSIzMCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzFmNGU3OSI+U2xvdyB0ZXN0IGNsb2NrOiB0aGUgbGF0ZSBzaWduYWwgc3RpbGwgYXJyaXZlcyBpbiB0aW1lPC90ZXh0PgogIDxnIGZvbnQtc2l6ZT0iMTMiIGZvbnQtd2VpZ2h0PSI2MDAiIGZpbGw9IiMzNDQ5NWUiPjx0ZXh0IHg9IjIwIiB5PSI4NSI+Y2xvY2s8L3RleHQ+PHRleHQgeD0iMjAiIHk9IjE1MCI+Z29vZCBwYXRoPC90ZXh0Pjx0ZXh0IHg9IjIwIiB5PSIyMTUiPnNsb3cgcGF0aDwvdGV4dD48L2c+CiAgPCEtLSBjbG9jazogcmlzaW5nIGVkZ2VzIGF0IDE0MCBhbmQgNTgwIC0tPgogIDxwYXRoIGQ9Ik0xMTAgOTVIMTQwVjY1SDM2MFY5NUg1ODBWNjVINjYwIiBmaWxsPSJub25lIiBzdHJva2U9IiMxZjRlNzkiIHN0cm9rZS13aWR0aD0iMi41Ii8+CiAgPGxpbmUgeDE9IjU4MCIgeTE9IjQ1IiB4Mj0 tical answer: put a small test engine **next to each memory**. That is **memory BIST (MBIST)**."}]}, {"id": "bist-idea", "title": "The BIST idea", "blocks": [{"type": "text", "md": "**Built-in self-test (BIST)** moves the tester's work into the chip. Step through the four blocks:"}, {"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MjAgNDQwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8ZGVmcz4KICAgIDxtYXJrZXIgaWQ9ImJpLWFyciIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzM0NDk1ZSIvPjwvbWFya2VyPgogICAgPG1hcmtlciBpZD0iYmktYXJyYyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzZjNGZiMyIvPjwvbWFya2VyPgogIDwvZGVmcz4KICA8cmVjdCB3aWR0aD0iODIwIiBoZWlnaHQ9IjQ0MCIgcng9IjE0IiBmaWxsPSIjZmZmZmZmIi8+CiAgPCEtLSBjaGlwIG91dGxpbmUgLS0+CiAgPHJlY3QgeD0iMjAwIiB5PSIzMCIgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzOTAiIHJ4PSIxNCIgZmlsbD0iI2Y2ZjlmYyIgc3Ryb2tlPSIjMWY0ZTc5IiBzdHJva2Utd2lkdGg9IjMiLz4KICA8dGV4dCB4PSI1MDAiIHk9IjQxMCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxMyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzFmNGU3OSI+dGhlIGNoaXA8L3RleHQ+CgogIDxnIGRhdGEtc3RlcD0iMSI+CiAgICA8cmVjdCB4PSIyMjUiIHk9IjE5MCIgd2lkdGg9IjE2MCIgaGVpZ2h0PSIxMDAiIHJ4PSIxMCIgZmlsbD0iI2UzZWZmYyIgc3Ryb2tlPSIjMWY2ZmViIiBzdHJva2Utd2lkdGg9IjIuNSIvPgogICAgPHRleHQgeD0iMzA1IiB5PSIyMjUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTUiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMxZjRlNzkiPlBhdHRlcm48L3RleHQ+CiAgICA8dGV4dCB4PSIzMDUiIHk9IjI0NSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzFmNGU3OSI+Z2VuZXJhdG9yPC90ZXh0PgogICAgPHRleHQgeD0iMzA1IiB5PSIyNzAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTIiIGZpbGw9IiMzNDQ5NWUiPkxGU1IsIGNvdW50ZXIsIE1hcmNoPC90ZXh0PgogIDwvZz4KICA8ZyBkYXRhLXN0ZXA9IjIiPgogICAgPGxpbmUgeDE9Ij  **March** test."}, {"title": "Circuit under test", "md": "The block being tested: a piece of logic or a memory. During the test it is cut off from its normal inputs and fed by the generator."}, {"title": "Response checker", "md": "Checks the answers. A memory BIST **compares** each read with the expected value. A logic BIST **compacts** millions of answers into one short **signature** in a MISR (Topic 5)."}, {"title": "BIST controller", "md": "A small state machine: waits for *start*, runs the test for the right number of cycles, then raises *done* and *pass/fail*."}, {"title": "The tester's job now", "md": "The tester only sends **start** and later reads **done** and **pass/fail** through a few pins, often the JTAG port. The test itself runs inside the chip, **at the chip's own clock speed**."}]}, {"type": "tabs", "tabs": [{"label": "Memory BIST (MBIST)", "md": "Tests embedded memories. The generator runs **March algorithms** — write and read every address in a fixed order — and a comparator checks every read. Can also tell **which cell** failed and help **repair** the memory with spare rows or columns."}, {"label": "Logic BIST (LBIST)", "md": "Tests random logic. An **LFSR** feeds pseudo-random patterns into the scan chains, a **MISR** compacts the responses, and at the end the signature is compared with the expected (**golden**) one."}]}, {"type": "callout", "kind": "info", "title": "BIST does not replace the tester", "md": "The tester is still needed: to power the chip, run other tests, and read the results. BIST makes test **faster and cheaper**, reaches the **buried** blocks, runs **at speed** — and lets the chip test itself later in the **field** (Topic 3)."}]}], "quiz": {"questions": [{"id": "q-shift", "type": "single", "text": "A chip has 2 million scan flip-flops and 10 scan input pins. How many clock cycles does it take to shift in **one** pattern?", "options": ["200 000", "20 000", "2 000 000", "20"], "correct": [0], "review": ["pin-bottleneck"], "explain": "2 000 000 ÷ 10 = **200 000** cycles — one bit per pin per clock."}, {"id": "q-slow", "type": "single", "text": "Why can a test with a slow clock miss a delay defect?", "options": ["The late signal still settles before the capture edge, so the right value is stored.", "Slow clocks cannot shift data into scan chains.", "Delay defects disappear at low temperature.", "The tester cannot read the outputs at a slow clock."], "correct": [0], "review": ["at-speed"], "explain": "With a long clock period the late signal has time to arrive, so the chip passes. Only at **full speed** does it arrive too late and cause a failure."}, {"id": "q-mem", "type": "multiple", "text": "Why are embedded memories hard to test from outside the chip? Select **all** correct answers.", "options": ["They are buried inside the chip with no direct connection to pins.", "A good memory test reads and writes every address several times.", "They are very dense, so they collect many defects.", "Memories cannot have manufacturing defects."], "correct": [0, 1, 2], "review": ["buried-memories"]}, {"id": "q-flow", "type": "order", "text": "Put the events of one BIST run in order.", "items": ["The tester sends start", "The pattern generator applies patterns", "The circuit under test produces responses", "The response checker compares or compacts them", "The controller raises done and pass/fail"], "review": ["bist-idea"]}, {"id": "q-kind", "type": "match", "text": "Sort the features into MBIST and LBIST.", "categories": [{"id": "mbist", "label": "MBIST"}, {"id": "lbist", "label": "LBIST"}], "items": [{"text": "March algorithms", "category": "mbist"}, {"text": "compares every read with the expected value", "category": "mbist"}, {"text": "can help repair with spare rows", "category": "mbist"}, {"text": "pseudo-random patterns into scan chains", "category": "lbist"}, {"text": "MISR signature", "category": "lbist"}], "review": ["bist-idea"]}, {"id": "q-tester", "type": "truefalse", "text": "With BIST, a chip no longer needs a tester at all.", "options": ["True", "False"], "correct": [1], "shuffle": false, "review": ["bist-idea"], "explain": "The tester still powers the chip, starts BIST, reads the results and runs other tests — but its job becomes much smaller."}]}}, "topics/03-bist-lifetime.json": {"id": "bist-lifetime", "title": "BIST over a chip's life", "duration": "25 min", "summary": "BIST is not only a factory tool. The same hardware tests the chip during **burn-in**, at the **customer**, at every **power-on** and even **while the system runs** — which is why cars, planes and data centres depend on it. But BIST also has a **price**.", "objectives": ["Explain the bathtub curve and why burn-in is done.", "Describe power-on and periodic self-test and why safety standards such as ISO 26262 need them.", "List the costs of BIST and weigh them against its benefits."], "subsections": [{"id": "burn-in", "title": "Weak chips and burn-in", "blocks": [{"type": "text", "md": "Some chips pass every test in the factory and still fail after a few weeks. They carry **weak spots** — a thin wire, a marginal oxide — that work today but break soon. Reliability engineers draw this with the **bathtub curve**:"}, {"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3NjAgMzgwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8cmVjdCB3aWR0aD0iNzYwIiBoZWlnaHQ9IjM4MCIgcng9IjE0IiBmaWxsPSIjZmZmZmZmIi8+CiAgPHRleHQgeD0iMzgwIiB5PSIzMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNiIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzFmNGU3OSI+VGhlIGJhdGh0dWIgY3VydmU6IGZhaWx1cmUgcmF0ZSBvdmVyIGEgY2hpcCdzIGxpZmU8L3RleHQ+CiAgPGcgc3Ryb2tlPSIjOWZiM2M4IiBzdHJva2Utd2lkdGg9IjEuNSI+CiAgICA8bGluZSB4MT0iODAiIHkxPSIzMTAiIHgyPSI3MjAiIHkyPSIzMTAiLz48bGluZSB4MT0iODAiIHkxPSIzMTAiIHgyPSI4MCIgeTI9IjYwIi8+CiAgPC9nPgogIDx0ZXh0IHg9IjQwMCIgeT0iMzQwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjEzIiBmaWxsPSIjMzQ0OTVlIj50aW1lIGluIHVzZSDihpI8L3RleHQ+CiAg , are hit by radiation, heat and voltage spikes. In most products a rare failure is annoying. In a car, a plane or a medical device it can **hurt people**."}, {"type": "tabs", "tabs": [{"label": "Cars (ISO 26262)", "blocks": [{"type": "text", "md": "The functional-safety standard **ISO 26262** asks how well the chip detects its own faults. Each safety function gets an **ASIL** level, from A (lowest) to D (highest, e.g. braking, steering). The higher the level, the more faults the safety mechanisms must catch:"}, {"type": "table", "columns": ["", "ASIL B", "ASIL C", "ASIL D"], "rows": [["Single-point fault metric", "≥ 90 %", "≥ 97 %", "≥ 99 %"], ["Latent fault metric", "≥ 60 %", "≥ 80 %", "≥ 90 %"]], "caption": "Hardware targets in ISO 26262-5 (simplified)"}, {"type": "text", "md": "**Latent** faults are faults that hide — for example in a safety mechanism that is not used until something else breaks. Power-on and periodic **LBIST and MBIST** are a main way to find them."}]}, {"label": "Data centres", "md": "Servers run for years without a break. Memory BIST at boot finds weak cells and **repairs** them with spare rows (MBIST course), and periodic tests catch **silent data corruption** — a core that computes wrong results without crashing."}, {"label": "Aerospace and medical", "md": "Space electronics is hit by radiation; medical devices must prove they work before every use. Both rely on **self-test at start-up** and during operation, together with error-correcting memories."}]}]}, {"id": "bist-costs", "title": "What BIST costs", "blocks": [{"type": "text", "md": "BIST hardware is not free. Before adding it, designers weigh what it **costs** against what it **gives**:"}, {"type": "accordion", "items": [{"title": "Area", "md": "Pattern generators, comparators, controllers and multiplexers take silicon. MBIST for many small memories and LBIST with test points typically add a **few percent** of chip area. Sharing one controller between several memories reduces it."}, {"title": "Test power", "md": "During BIST far more flip-flops toggle than in normal use. The current can be **higher than in functional mode**, causing voltage drop and false failures. BIST must be designed to limit power — test fewer blocks at once, or slow down."}, {"title": "Timing", "md": "Test multiplexers sit in front of memories and flip-flops. Each adds a little **delay** to the functional path, which can reduce the maximum clock frequency if not handled carefully."}, {"title": "Design and verification effort", "md": "BIST must be inserted, connected, verified and documented for every block. Commercial EDA tools automate most of it (Tessent, TestMAX, Modus), but the work remains."}, {"title": "Test quality limits", "md": "Pseudo-random LBIST patterns miss some hard-to-test faults; it may need **test points** or extra deterministic patterns from the tester (LBIST course)."}]}, {"type": "categorize", "prompt": "Practice: drag each item into Benefit or Cost.", "categories": [{"id": "benefit", "label": "Benefit of BIST"}, {"id": "cost", "label": "Cost of BIST"}], "items": [{"text": "shorter tester time", "category": "benefit"}, {"text": "tests at full clock speed", "category": "benefit"}, {"text": "reaches buried memories", "category": "benefit"}, {"text": "works in the field, at power-on", "category": "benefit"}, {"text": "extra silicon area", "category": "cost"}, {"text": "high current during test", "category": "cost"}, {"text": "extra delay in functional paths", "category": "cost"}, {"text": "more design and verification work", "category": "cost"}]}, {"type": "callout", "kind": "key", "title": "The usual answer", "md": "For memories, MBIST is used in **almost every** modern chip — there is no other practical way to test them. LBIST is used where in-field test is required (automotive, aerospace, servers) or where test time is very expensive."}]}], "quiz": {"questions": [{"id": "q-bathtub", "type": "single", "text": "What is the purpose of burn-in?", "options": ["Make weak chips fail in the factory instead of at the customer.", "Make every chip run faster.", "Program the chip's memories.", "Measure the yield of the wafer."], "correct": [0], "review": ["burn-in"], "explain": "Burn-in ages the chips quickly so that the **early failures** of the bathtub curve happen before shipping."}, {"id": "q-oven", "type": "single", "text": "Why is BIST especially useful during burn-in?", "options": ["Each chip needs only power, a clock and a start signal, so hundreds can run at once in the oven.", "BIST works only at high temperature.", "Burn-in ovens contain a full tester for every pin.", "BIST cools the chip down."], "correct": [0], "review": ["burn-in"]}, {"id": "q-post", "type": "single", "text": "A car's brake controller tests itself every time the driver starts the car. This is called …", "options": ["power-on self-test", "wafer sort", "burn-in", "final test"], "correct": [0], "review": ["in-field"]}, {"id": "q-asil", "type": "truefalse", "text": "Under ISO 26262, a safety function with ASIL D must detect a larger share of faults than one with ASIL B.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["in-field"], "explain": "ASIL D is the highest level: e.g. ≥ 99 % single-point fault metric versus ≥ 90 % for ASIL B."}, {"id": "q-periodic", "type": "single", "text": "Why does a periodic test during operation test only **one block at a time**, for a short time?", "options": ["The system must keep doing its job; the tested block is unavailable during the test.", "BIST can only test one block in its whole life.", "Short tests detect more faults than long ones.", "The tester can only connect to one block."], "correct": [0], "review": ["in-field"]}, {"id": "q-costs", "type": "match", "text": "Sort into benefits and costs of BIST.", "categories": [{"id": "b", "label": "Benefit"}, {"id": "c", "label": "Cost"}], "items": [{"text": "at-speed test", "category": "b"}, {"text": "test in the field", "category": "b"}, {"text": "extra area", "category": "c"}, {"text": "high test power", "category": "c"}, {"text": "delay of test multiplexers", "category": "c"}], "review": ["bist-costs"]}]}}, "topics/04-lfsr.json": {"id": "lfsr", "title": "LFSR: patterns made on chip", "duration": "35 min", "summary": "The heart of almost every BIST pattern generator is the **linear feedback shift register (LFSR)**: a few flip-flops and XOR gates that step through a long, random-looking but fully repeatable sequence of patterns.", "objectives": ["Build a Fibonacci LFSR and compute its next states by hand.", "Explain the Galois form and why it is faster.", "Explain primitive polynomials, maximal length 2ⁿ − 1 and the all-zero lock-up state.", "Explain why LFSR patterns are useful as test patterns."], "subsections": [{"id": "fibonacci", "title": "A shift register with feedback", "blocks": [{"type": "text", "md": "Take a shift register of 4 flip-flops, Q1 → Q2 → Q3 → Q4. On every clock edge each bit moves one place to the right. Now **feed back** into Q1 the XOR of some of the outputs — here Q3 and Q4. This is a **Fibonacci LFSR**:"}, {"type": "image", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3ODAgMzIwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8ZGVmcz48bWFya2VyIGlkPSJsZi1hIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMzQ0OTVlIi8+PC9tYXJrZXI+CiAgPG1hcmtlciBpZD0ibGYtciIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iI2MwMzkyYiIvPjwvbWFya2VyPjwvZGVmcz4KICA8cmVjdCB3aWR0aD0iNzgwIiBoZWlnaHQ9IjMyMCIgcng9IjE0IiBmaWxsPSIjZmZmZmZmIi8+CiAgPHRleHQgeD0iMzkwIiB5PSIzMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNiIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzFmNGU3OSI+Rmlib25hY2NpIExGU1IsIDQgYml0czogZmVlZGJhY2sgPSBRMyDiipUg ed by a **characteristic polynomial**. The exponents tell where the taps are. Our first LFSR uses taps Q4 and Q3, so its polynomial is\n\n> p(x) = x⁴ + x³ + 1\n\nAn n-bit register has 2ⁿ states. One of them — **all zeros** — is special: 0 ⊕ 0 = 0, so the register stays at 0000 forever. That leaves at most **2ⁿ − 1** states in the cycle. An LFSR that visits all of them is called **maximal-length**, and it is maximal-length exactly when its polynomial is **primitive**."}, {"type": "tabs", "tabs": [{"label": "Primitive: x⁴ + x³ + 1", "md": "Taps Q4, Q3. From **any** non-zero seed the register runs through **all 15** non-zero states before it repeats. Good for test: no state is missed."}, {"label": "Not primitive: x⁴ + x² + 1", "md": "Taps Q4, Q2. The 15 non-zero states split into **three short cycles**:\n\n- 1000 → 0100 → 1010 → 0101 → 0010 → 0001 → (6 states)\n- 1001 → 1100 → 1110 → 1111 → 0111 → 0011 → (6 states)\n- 1011 → 1101 → 0110 → (3 states)\n\nWhich cycle you get depends on the seed — and most patterns are **never** produced. Bad for test."}]}, {"type": "callout", "kind": "warning", "title": "The lock-up state", "md": "Never seed an XOR-based LFSR with all zeros — it will stay at zero forever. BIST controllers load a non-zero seed at reset, and some designs add a little logic to escape from 0…0."}, {"type": "table", "columns": ["n", "Primitive polynomial", "Taps", "Sequence length 2ⁿ − 1"], "rows": [["3", "x³ + x² + 1", "3, 2", "7"], ["4", "x⁴ + x³ + 1", "4, 3", "15"], ["5", "x⁵ + x³ + 1", "5, 3", "31"], ["6", "x⁶ + x⁵ + 1", "6, 5", "63"], ["7", "x⁷ + x⁶ + 1", "7, 6", "127"], ["8", "x⁸ + x⁶ + x⁵ + x⁴ + 1", "8, 6, 5, 4", "255"], ["16", "x¹⁶ + x¹⁵ + x¹³ + x⁴ + 1", "16, 15, 13, 4", "65 535"], ["32", "x³² + x²² + x² + x + 1", "32, 22, 2, 1", "4 294 967 295"]], "caption": "Some primitive polynomials (Fibonacci taps: XOR the outputs of these stages into Q1)"}, {"type": "text", "md": "You do not need to find primitive polynomials yourself — tables for every length up to hundreds of bits are published. Note that some lengths (like 8) need **four** taps; no two-tap primitive polynomial exists for them."}]}, {"id": "patterns", "title": "Seeds and pseudo-random patterns", "blocks": [{"type": "text", "md": "The **seed** is the state the LFSR starts from. Because the next state depends only on the current state, the same seed always gives **exactly the same sequence**. The patterns look random, but they are fully **repeatable** — that is why they are called **pseudo-random**."}, {"type": "accordion", "items": [{"title": "Why repeatable matters", "md": "The expected responses of the circuit can be computed once by simulation. Every chip, in the factory or in a car years later, runs the **same** patterns and must give the **same** result (the *golden signature*, Topic 5)."}, {"title": "Why random-looking matters", "md": "Neighbouring bits are hardly related, ones and zeros are balanced (a maximal-length sequence has 2ⁿ⁻¹ ones and 2ⁿ⁻¹ − 1 zeros), and many different combinations reach the logic quickly. For many circuits, a few thousand random patterns already detect most stuck-at faults."}, {"title": "Exhaustive test of small blocks", "md": "An n-bit maximal-length LFSR applies **every** non-zero n-bit pattern. For a block with few inputs this is an exhaustive test: all input combinations except 0…0 (which can be added with a little extra logic)."}, {"title": "Why not just a counter?", "md": "A binary counter also visits all states, but its low bits toggle all the time and its high bits almost never — the patterns are strongly correlated. It also needs an adder chain, while an LFSR needs only a few XORs."}]}, {"type": "code", "language": "systemverilog", "code": "// 4-bit Fibonacci LFSR, p(x) = x^4 + x^3 + 1\nmodule lfsr4 (\n  input  logic       clk, rst_n,\n  output logic [4:1] q          // q[1] = Q1 ... q[4] = Q4\n);\n  always_ff @(posedge clk or negedge rst_n)\n    if (!rst_n) q <= 4'b0001;            // seed: Q1 = 1, never all zeros\n    else        q <= {q[3:1], q[3] ^ q[4]}; // shift right, feedback into Q1\nendmodule", "caption": "The same LFSR in SystemVerilog — you will build and simulate it in Lab 1"}, {"type": "sort", "prompt": "Practice: a 3-bit LFSR has feedback Q2 ⊕ Q3 into Q1. Put its first states in order, starting from the seed 100.", "items": ["100", "010", "101", "110", "111", "011", "001"]}]}], "quiz": {"questions": [{"id": "q-next", "type": "single", "text": "The 4-bit LFSR of this topic (new Q1 = Q3 ⊕ Q4, then shift right) is in state Q1Q2Q3Q4 = **1101**. What is the next state?", "options": ["1110", "0110", "1011", "1111"], "correct": [0], "review": ["fibonacci"], "explain": "Q3 ⊕ Q4 = 0 ⊕ 1 = 1 enters Q1; the old Q1Q2Q3 = 110 move right → **1110**."}, {"id": "q-len", "type": "single", "text": "A 5-bit LFSR has a primitive polynomial. How many different states does it go through before repeating?", "options": ["31", "32", "5", "25"], "correct": [0], "review": ["polynomials"], "explain": "Maximal length is 2⁵ − 1 = **31**: every state except all zeros."}, {"id": "q-zero", "type": "single", "text": "Why must an LFSR never be started with the all-zero seed?", "options": ["The XOR of zeros is zero, so the register stays at 0…0 forever.", "All-zero is not allowed in SystemVerilog.", "The flip-flops cannot store zeros after reset.", "It would produce the sequence in reverse order."], "correct": [0], "review": ["polynomials"]}, {"id": "q-prim", "type": "truefalse", "text": "Any choice of taps gives an n-bit LFSR that visits all 2ⁿ − 1 non-zero states.", "options": ["True", "False"], "correct": [1], "shuffle": false, "review": ["polynomials"], "explain": "Only a **primitive** polynomial gives maximal length. x⁴ + x² + 1, for example, splits into cycles of 6, 6 and 3 states."}, {"id": "q-galois", "type": "single", "text": "What is the main advantage of the Galois form over the Fibonacci form?", "options": ["Only a single 2-input XOR lies between any two flip-flops, so it can run faster.", "It produces a longer sequence for the same number of flip-flops.", "It can start from the all-zero state.", "It needs no flip-flops."], "correct": [0], "review": ["galois"]}, {"id": "q-seq3", "type": "order", "text": "A 3-bit LFSR has new Q1 = Q2 ⊕ Q3. Put the first five states in order, starting from the seed 100.", "items": ["100", "010", "101", "110", "111"], "review": ["fibonacci", "patterns"]}, {"id": "q-why", "type": "multiple", "text": "Why is an LFSR a good BIST pattern generator? Select **all** correct answers.", "options": ["It needs only a few flip-flops and XOR gates.", "The same seed always gives the same sequence.", "Its patterns look random and reach many combinations quickly.", "It produces every pattern including all zeros without extra logic."], "correct": [0, 1, 2], "review": ["patterns"]}]}}, "topics/05-misr.json": {"id": "misr", "title": "Compacting responses: MISR", "duration": "35 min", "summary": "The pattern generator makes the questions; now the chip must check the **answers**. Instead of storing millions of expected bits, BIST squeezes all responses into one short **signature** with an LFSR-like register — the **SISR** or **MISR**.", "objectives": ["Explain why responses are compacted into a signature.", "Compute a serial signature step by step and relate it to polynomial division.", "Compute the next state of a MISR.", "Explain aliasing and why unknown (X) values are dangerous."], "subsections": [{"id": "why-compact", "title": "Why compact the responses", "blocks": [{"type": "text", "md": "A logic BIST run applies thousands of patterns to circuits with thousands of outputs: **millions of response bits**. Storing all expected values on the chip would need a huge memory, and comparing them bit by bit a lot of logic.\n\nThe trick: feed all responses into a small register that mixes them into one short value — the **signature**. Only the final signature is compared with the expected **golden signature**, computed once by simulating t cient of xᵏ⁻¹, so Q1Q2Q3Q4 = 0100 means remainder = x."}, {"type": "code", "language": "text", "code": "  1 1 0 1 0 0 1 1     stream   x^7+x^6+x^4+x+1\n⊕ 1 1 0 0 1          p(x)·x^3 (align with the leading 1)\n  ---------------\n  0 0 0 1 1 0 1 1\n⊕       1 1 0 0 1      p(x)·x^0\n  ---------------\n  0 0 0 0 0 0 1 0     remainder = x  →  Q1Q2Q3Q4 = 0 1 0 0", "caption": "Division over GF(2): subtraction is XOR"}, {"type": "callout", "kind": "key", "title": "A single wrong bit is always caught", "md": "One flipped bit adds xᵏ to the stream. Because p(x) ends with **+ 1**, it never divides xᵏ, so the remainder — the signature — always changes."}]}, {"id": "misr", "title": "The multiple-input signature register", "blocks": [{"type": "text", "md": "A real circuit has many outputs (or, in LBIST, many **scan chains**) producing bits in parallel. Putting an XOR in front of **every** stage lets one register take all of them in each clock: the **multiple-input signature register (MISR)**."}, {"type": "image", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3ODAgMzQwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8ZGVmcz48bWFya2VyIGlkPSJtcy1hIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMzQ0OTVlIi8+PC9tYXJrZXI+CiAgPG1hcmtlciBpZD0ibXMtciIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iI2MwMzkyYiIvPjwvbWFya2VyPgogIDxtYXJrZXIgaWQ9Im1zLWciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiMxZTg0NDkiLz48L21hcmtlcj48L2RlZnM+CiAgPHJlY3Qgd2lkdGg9Ijc4MCIgaGVpZ2h0PSIzNDAiIHJ4PSIxNCIgZmlsbD0iI2ZmZmZmZiIvPgogIDx0ZXh0IHg9IjM5MCIgeT0iMzAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTYiIGZvbnQtd2V
