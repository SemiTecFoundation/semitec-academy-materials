<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="rs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker></defs>
  <rect width="760" height="260" rx="14" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79">ROM test: read every word into a signature</text>
  <rect x="30" y="80" width="150" height="90" rx="10" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/>
  <text x="105" y="118" text-anchor="middle" font-size="17" font-weight="800" fill="#5b3fa0">Address</text><text x="105" y="142" text-anchor="middle" font-size="17" font-weight="800" fill="#5b3fa0">counter</text>
  <text x="105" y="190" text-anchor="middle" font-size="14" fill="#34495e">0, 1, 2, … last</text>
  <path d="M180 125H226" stroke="#34495e" stroke-width="3" marker-end="url(#rs-a)"/>
  <rect x="230" y="70" width="170" height="110" rx="10" fill="#f8e7c4" stroke="#b8860b" stroke-width="2.5"/>
  <text x="315" y="120" text-anchor="middle" font-size="20" font-weight="800" fill="#8a6d00">ROM</text><text x="315" y="146" text-anchor="middle" font-size="14" fill="#34495e">fixed content</text>
  <path d="M400 125H446" stroke="#34495e" stroke-width="3" marker-end="url(#rs-a)"/>
  <rect x="450" y="80" width="130" height="90" rx="10" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.5"/>
  <text x="515" y="132" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">MISR</text>
  <path d="M580 125H616" stroke="#34495e" stroke-width="3" marker-end="url(#rs-a)"/>
  <rect x="620" y="70" width="120" height="110" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/>
  <text x="680" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d00">signature</text><text x="680" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d00">= golden?</text>
  <text x="680" y="160" text-anchor="middle" font-size="13" fill="#34495e">from ROM file</text>
  <text x="380" y="235" text-anchor="middle" font-size="15" fill="#34495e">Nothing can be written — so March tests are impossible; reading and compacting is enough.</text>
</svg>
