<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="420" rx="14" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">Reading and writing one cell</text>
  <g stroke="#34495e" stroke-width="2.5" fill="none">
    <line x1="60" y1="70" x2="700" y2="70"/>
    <line x1="100" y1="44" x2="100" y2="340"/><line x1="660" y1="44" x2="660" y2="340"/>
    <path d="M100 230H150M210 230H280M280 160V300"/>
    <path d="M660 230H610M550 230H480M480 160V300"/>
    <path d="M180 210V70M580 210V70"/>
    <path d="M280 170H330M412 170H480"/>
    <path d="M480 290H430M348 290H280"/>
  </g>
  <g fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5">
    <rect x="150" y="212" width="60" height="36" rx="5"/><rect x="550" y="212" width="60" height="36" rx="5"/>
    <path d="M330 140V200L400 170Z"/><circle cx="406" cy="170" r="6"/>
    <path d="M430 260V320L360 290Z"/><circle cx="354" cy="290" r="6"/>
  </g>
  <g font-size="12" font-weight="700" fill="#1f4e79" text-anchor="middle">
    <text x="180" y="235">M5</text><text x="580" y="235">M6</text>
    <text x="365" y="116">M1 + M2</text><text x="405" y="342">M3 + M4</text>
  </g>
  <g font-size="13" font-weight="700" fill="#34495e">
    <text x="300" y="62">WL (word line)</text>
    
    <text x="268" y="144" text-anchor="middle">Q</text><text x="492" y="152" text-anchor="middle">QB</text>
  </g>
  <circle cx="280" cy="230" r="4" fill="#34495e"/><circle cx="480" cy="230" r="4" fill="#34495e"/>
  <rect x="60" y="372" width="640" height="36" rx="8" fill="#f2f5f9" stroke="#7d93ab" stroke-width="2"/>
  <text x="380" y="395" text-anchor="middle" font-size="12" fill="#34495e">column circuits: precharge · sense amplifier · write driver</text>
  <path d="M100 340V372M660 340V372" stroke="#7d93ab" stroke-width="2"/>
  <g data-step="1" data-until="1"><line x1="60" y1="70" x2="700" y2="70" stroke="#9aa7b4" stroke-width="2.5"/><text x="730" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#9aa7b4">0</text><text x="250" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">Q=0</text><text x="512" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">QB=1</text><text x="108" y="330" text-anchor="start" font-size="14" font-weight="800" fill="#1f6feb">BL = ?</text><text x="652" y="330" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb">BLB = ?</text></g>
  <g data-step="2" data-until="2"><line x1="60" y1="70" x2="700" y2="70" stroke="#9aa7b4" stroke-width="2.5"/><text x="730" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#9aa7b4">0</text><text x="250" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">Q=0</text><text x="512" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">QB=1</text><text x="108" y="330" text-anchor="start" font-size="14" font-weight="800" fill="#1f6feb">BL = VDD</text><text x="652" y="330" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb">BLB = VDD</text><rect x="62" y="374" width="636" height="32" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/><text x="380" y="395" text-anchor="middle" font-size="13" font-weight="800" fill="#34495e">precharge both bit lines</text></g>
  <g data-step="3" data-until="3"><line x1="60" y1="70" x2="700" y2="70" stroke="#c0392b" stroke-width="6"/><text x="730" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#c0392b">1</text><text x="250" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">Q=0</text><text x="512" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">QB=1</text><text x="108" y="330" text-anchor="start" font-size="14" font-weight="800" fill="#1f6feb">BL = VDD−ΔV</text><text x="652" y="330" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb">BLB = VDD</text><rect x="62" y="374" width="636" height="32" rx="6" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/><text x="380" y="395" text-anchor="middle" font-size="13" font-weight="800" fill="#1f6feb">BL drops a little through M5</text><path d="M150 230H100" stroke="#1f6feb" stroke-width="5" stroke-dasharray="6 4"/></g>
  <g data-step="4" data-until="4"><line x1="60" y1="70" x2="700" y2="70" stroke="#c0392b" stroke-width="6"/><text x="730" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#c0392b">1</text><text x="250" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">Q=0</text><text x="512" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">QB=1</text><text x="108" y="330" text-anchor="start" font-size="14" font-weight="800" fill="#1f6feb">BL = VDD−ΔV</text><text x="652" y="330" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb">BLB = VDD</text><rect x="62" y="374" width="636" height="32" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="2"/><text x="380" y="395" text-anchor="middle" font-size="13" font-weight="800" fill="#1e8449">sense amp: BL < BLB → read 0</text></g>
  <g data-step="5" data-until="5"><line x1="60" y1="70" x2="700" y2="70" stroke="#9aa7b4" stroke-width="2.5"/><text x="730" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#9aa7b4">0</text><text x="250" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">Q=0</text><text x="512" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">QB=1</text><text x="108" y="330" text-anchor="start" font-size="14" font-weight="800" fill="#1f6feb">BL = VDD</text><text x="652" y="330" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb">BLB = VDD</text><rect x="62" y="374" width="636" height="32" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="2"/><text x="380" y="395" text-anchor="middle" font-size="13" font-weight="800" fill="#34495e">word line off — cell still holds 0</text></g>
  <g data-step="6" data-until="6"><line x1="60" y1="70" x2="700" y2="70" stroke="#9aa7b4" stroke-width="2.5"/><text x="730" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#9aa7b4">0</text><text x="250" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">Q=0</text><text x="512" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">QB=1</text><text x="108" y="330" text-anchor="start" font-size="14" font-weight="800" fill="#1f6feb">BL = 1</text><text x="652" y="330" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb">BLB = 0</text><rect x="62" y="374" width="636" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="380" y="395" text-anchor="middle" font-size="13" font-weight="800" fill="#c0392b">write driver: BL = 1, BLB = 0</text></g>
  <g data-step="7" data-until="7"><line x1="60" y1="70" x2="700" y2="70" stroke="#c0392b" stroke-width="6"/><text x="730" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#c0392b">1</text><text x="250" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">Q=1</text><text x="512" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">QB=0</text><text x="108" y="330" text-anchor="start" font-size="14" font-weight="800" fill="#1f6feb">BL = 1</text><text x="652" y="330" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb">BLB = 0</text><rect x="62" y="374" width="636" height="32" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="380" y="395" text-anchor="middle" font-size="13" font-weight="800" fill="#c0392b">QB pulled to 0 → cell flips</text><path d="M610 230H660" stroke="#c0392b" stroke-width="5" stroke-dasharray="6 4"/></g>
  <g data-step="8" data-until="8"><line x1="60" y1="70" x2="700" y2="70" stroke="#9aa7b4" stroke-width="2.5"/><text x="730" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#9aa7b4">0</text><text x="250" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">Q=1</text><text x="512" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#1e8449">QB=0</text><text x="108" y="330" text-anchor="start" font-size="14" font-weight="800" fill="#1f6feb">BL = VDD</text><text x="652" y="330" text-anchor="end" font-size="14" font-weight="800" fill="#1f6feb">BLB = VDD</text><rect x="62" y="374" width="636" height="32" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="2"/><text x="380" y="395" text-anchor="middle" font-size="13" font-weight="800" fill="#1e8449">word line off — cell now holds 1</text></g>
</svg>
