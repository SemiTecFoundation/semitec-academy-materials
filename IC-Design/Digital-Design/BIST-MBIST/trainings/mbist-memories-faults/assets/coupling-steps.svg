<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="cp-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs>
  <rect width="760" height="360" rx="14" fill="#ffffff"/>
  <g data-step="1" data-until="1"><text x="380" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Two cells: aggressor and victim</text><text x="380" y="330" text-anchor="middle" font-size="16" fill="#34495e">the test writes 0 into both cells</text><rect x="150" y="120" width="150" height="120" rx="12" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="225" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">aggressor a</text><text x="225" y="200" text-anchor="middle" font-size="56" font-weight="800" fill="#1f4e79">0</text><rect x="460" y="120" width="150" height="120" rx="12" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="535" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">victim v</text><text x="535" y="200" text-anchor="middle" font-size="56" font-weight="800" fill="#1f4e79">0</text></g>
  <g data-step="2" data-until="2"><text x="380" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Inversion coupling ⟨↑ ; ↕⟩</text><text x="380" y="330" text-anchor="middle" font-size="16" fill="#34495e">w1 to a: its 0 → 1 transition INVERTS v</text><rect x="150" y="120" width="150" height="120" rx="12" fill="#e3effc" stroke="#1f6feb" stroke-width="3"/><text x="225" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">aggressor a</text><text x="225" y="200" text-anchor="middle" font-size="56" font-weight="800" fill="#1f6feb">1</text><text x="225" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6feb">w1 (↑)</text><path d="M330 180Q380 140 430 180" fill="none" stroke="#c0392b" stroke-width="3.5" marker-end="url(#cp-r)"/><rect x="460" y="120" width="150" height="120" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="3"/><text x="535" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">victim v</text><text x="535" y="200" text-anchor="middle" font-size="56" font-weight="800" fill="#c0392b">1</text><text x="535" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">flipped!</text></g>
  <g data-step="3" data-until="3"><text x="380" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Read the victim</text><text x="380" y="330" text-anchor="middle" font-size="16" fill="#34495e">expected 0, read 1 → fault detected</text><rect x="150" y="120" width="150" height="120" rx="12" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="225" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">aggressor a</text><text x="225" y="200" text-anchor="middle" font-size="56" font-weight="800" fill="#1f4e79">1</text><rect x="460" y="120" width="150" height="120" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="3"/><text x="535" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">victim v</text><text x="535" y="200" text-anchor="middle" font-size="56" font-weight="800" fill="#c0392b">1</text><text x="535" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">r0 → reads 1 ✗</text></g>
  <g data-step="4" data-until="4"><text x="380" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Idempotent coupling ⟨↑ ; 0⟩</text><text x="380" y="330" text-anchor="middle" font-size="16" fill="#34495e">v holds 1; a goes 0 → 1 and FORCES v to 0</text><rect x="150" y="120" width="150" height="120" rx="12" fill="#e3effc" stroke="#1f6feb" stroke-width="3"/><text x="225" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">aggressor a</text><text x="225" y="200" text-anchor="middle" font-size="56" font-weight="800" fill="#1f6feb">1</text><text x="225" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6feb">w1 (↑)</text><path d="M330 180Q380 140 430 180" fill="none" stroke="#c0392b" stroke-width="3.5" marker-end="url(#cp-r)"/><rect x="460" y="120" width="150" height="120" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="3"/><text x="535" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">victim v</text><text x="535" y="200" text-anchor="middle" font-size="56" font-weight="800" fill="#c0392b">0</text><text x="535" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">forced to 0</text></g>
  <g data-step="5" data-until="5"><text x="380" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">State coupling ⟨1 ; 0⟩</text><text x="380" y="330" text-anchor="middle" font-size="16" fill="#34495e">while a = 1, v cannot hold 1: w1 to v, then r1 reads 0</text><rect x="150" y="120" width="150" height="120" rx="12" fill="#e3effc" stroke="#1f6feb" stroke-width="3"/><text x="225" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">aggressor a</text><text x="225" y="200" text-anchor="middle" font-size="56" font-weight="800" fill="#1f6feb">1</text><text x="225" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6feb">state 1</text><path d="M330 180Q380 140 430 180" fill="none" stroke="#c0392b" stroke-width="3.5" marker-end="url(#cp-r)"/><rect x="460" y="120" width="150" height="120" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="3"/><text x="535" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">victim v</text><text x="535" y="200" text-anchor="middle" font-size="56" font-weight="800" fill="#c0392b">0</text><text x="535" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">w1, r1 → reads 0 ✗</text></g>
</svg>
