<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="af-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker>
  <marker id="af-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs>
  <rect width="760" height="380" rx="14" fill="#ffffff"/>
  <g data-step="1" data-until="1"><text x="380" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">A good read</text><text x="380" y="350" text-anchor="middle" font-size="16" fill="#34495e">the read returns 0 and the cell still holds 0</text><text x="150" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">cell before</text><rect x="95" y="125" width="110" height="110" rx="12" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="150" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#1f4e79">0</text><path d="M215 180H300" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><text x="258" y="168" text-anchor="middle" font-size="18" font-weight="800" fill="#34495e">r0</text><text x="380" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">value returned</text><rect x="325" y="125" width="110" height="110" rx="12" fill="#e8f6ee" stroke="#1e8449" stroke-width="3"/><text x="380" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#1e8449">0</text><text x="610" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">cell after</text><rect x="555" y="125" width="110" height="110" rx="12" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="610" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#1f4e79">0</text></g>
  <g data-step="2" data-until="2"><text x="380" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Read destructive fault (RDF)</text><text x="380" y="350" text-anchor="middle" font-size="16" fill="#34495e">the read flips the cell AND returns the wrong value → one read detects it</text><text x="150" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">cell before</text><rect x="95" y="125" width="110" height="110" rx="12" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="150" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#1f4e79">0</text><path d="M215 180H300" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><text x="258" y="168" text-anchor="middle" font-size="18" font-weight="800" fill="#34495e">r0</text><text x="380" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">value returned</text><rect x="325" y="125" width="110" height="110" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="3"/><text x="380" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#c0392b">1</text><text x="610" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">cell after</text><rect x="555" y="125" width="110" height="110" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="3"/><text x="610" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#c0392b">1</text></g>
  <g data-step="3" data-until="3"><text x="380" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Deceptive read destructive fault (DRDF)</text><text x="380" y="350" text-anchor="middle" font-size="16" fill="#34495e">the read returns the right value but flips the cell → only a SECOND read sees it</text><text x="150" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">cell before</text><rect x="95" y="125" width="110" height="110" rx="12" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="150" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#1f4e79">0</text><path d="M215 180H300" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><text x="258" y="168" text-anchor="middle" font-size="18" font-weight="800" fill="#34495e">r0</text><text x="380" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">value returned</text><rect x="325" y="125" width="110" height="110" rx="12" fill="#e8f6ee" stroke="#1e8449" stroke-width="3"/><text x="380" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#1e8449">0</text><text x="610" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">cell after</text><rect x="555" y="125" width="110" height="110" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="3"/><text x="610" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#c0392b">1</text></g>
  <g data-step="4" data-until="4"><text x="380" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Incorrect read fault (IRF)</text><text x="380" y="350" text-anchor="middle" font-size="16" fill="#34495e">the read returns the wrong value, the cell is fine → one read detects it</text><text x="150" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">cell before</text><rect x="95" y="125" width="110" height="110" rx="12" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="150" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#1f4e79">0</text><path d="M215 180H300" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><text x="258" y="168" text-anchor="middle" font-size="18" font-weight="800" fill="#34495e">r0</text><text x="380" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">value returned</text><rect x="325" y="125" width="110" height="110" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="3"/><text x="380" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#c0392b">1</text><text x="610" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#34495e">cell after</text><rect x="555" y="125" width="110" height="110" rx="12" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="610" y="200" text-anchor="middle" font-size="54" font-weight="800" fill="#1f4e79">0</text></g>
</svg>
