<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="af-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker>
  <marker id="af-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs>
  <rect width="760" height="380" rx="14" fill="#ffffff"/>
  <g data-step="1" data-until="1"><text x="380" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">A good decoder</text><text x="380" y="350" text-anchor="middle" font-size="16" fill="#34495e">every address reaches exactly one cell, and every cell has exactly one address</text><rect x="120" y="68" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 0</text><rect x="120" y="128" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 1</text><rect x="120" y="188" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="217" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 2</text><rect x="120" y="248" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="277" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 3</text><rect x="530" y="68" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 0</text><rect x="530" y="128" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 1</text><rect x="530" y="188" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="217" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 2</text><rect x="530" y="248" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="277" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 3</text><path d="M230 90L526 90" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 150L526 150" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 210L526 210" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 270L526 270" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/></g>
  <g data-step="2" data-until="2"><text x="380" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">AF1 — an address reaches no cell</text><text x="380" y="350" text-anchor="middle" font-size="16" fill="#34495e">address 2 selects nothing: writes are lost, reads return no stored data</text><rect x="120" y="68" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 0</text><rect x="120" y="128" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 1</text><rect x="120" y="188" width="110" height="44" rx="8" fill="#efeafa" stroke="#c0392b" stroke-width="2.5"/><text x="175" y="217" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">address 2</text><rect x="120" y="248" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="277" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 3</text><rect x="530" y="68" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 0</text><rect x="530" y="128" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 1</text><rect x="530" y="188" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="217" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 2</text><rect x="530" y="248" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="277" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 3</text><path d="M230 90L526 90" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 150L526 150" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 270L526 270" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><text x="380" y="216" text-anchor="middle" font-size="22" font-weight="800" fill="#c0392b">✗</text></g>
  <g data-step="3" data-until="3"><text x="380" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">AF2 — a cell is never reached</text><text x="380" y="350" text-anchor="middle" font-size="16" fill="#34495e">no address selects cell 2: it can be neither written nor read</text><rect x="120" y="68" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 0</text><rect x="120" y="128" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 1</text><rect x="120" y="188" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="217" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 2</text><rect x="120" y="248" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="277" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 3</text><rect x="530" y="68" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 0</text><rect x="530" y="128" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 1</text><rect x="530" y="188" width="110" height="44" rx="8" fill="#eef4fb" stroke="#9aa7b4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="585" y="217" text-anchor="middle" font-size="18" font-weight="800" fill="#9aa7b4">cell 2</text><rect x="530" y="248" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="277" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 3</text><path d="M230 90L526 90" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 150L526 150" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 270L526 270" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/></g>
  <g data-step="4" data-until="4"><text x="380" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">AF3 — one address reaches several cells</text><text x="380" y="350" text-anchor="middle" font-size="16" fill="#34495e">address 2 writes and reads cells 2 AND 3 together</text><rect x="120" y="68" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 0</text><rect x="120" y="128" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 1</text><rect x="120" y="188" width="110" height="44" rx="8" fill="#efeafa" stroke="#c0392b" stroke-width="2.5"/><text x="175" y="217" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">address 2</text><rect x="120" y="248" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="277" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 3</text><rect x="530" y="68" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 0</text><rect x="530" y="128" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 1</text><rect x="530" y="188" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="217" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 2</text><rect x="530" y="248" width="110" height="44" rx="8" fill="#eef4fb" stroke="#c0392b" stroke-width="2.5"/><text x="585" y="277" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">cell 3</text><path d="M230 90L526 90" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 150L526 150" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 210L526 210" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 210L526 270" stroke="#c0392b" stroke-width="3" marker-end="url(#af-r)"/><path d="M230 270L526 270" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/></g>
  <g data-step="5" data-until="5"><text x="380" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">AF4 — several addresses reach one cell</text><text x="380" y="350" text-anchor="middle" font-size="16" fill="#34495e">addresses 2 and 3 both select cell 3 (cell 2 is lost too)</text><rect x="120" y="68" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 0</text><rect x="120" y="128" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 1</text><rect x="120" y="188" width="110" height="44" rx="8" fill="#efeafa" stroke="#c0392b" stroke-width="2.5"/><text x="175" y="217" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">address 2</text><rect x="120" y="248" width="110" height="44" rx="8" fill="#efeafa" stroke="#1f4e79" stroke-width="2.5"/><text x="175" y="277" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address 3</text><rect x="530" y="68" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 0</text><rect x="530" y="128" width="110" height="44" rx="8" fill="#eef4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="585" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">cell 1</text><rect x="530" y="188" width="110" height="44" rx="8" fill="#eef4fb" stroke="#9aa7b4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="585" y="217" text-anchor="middle" font-size="18" font-weight="800" fill="#9aa7b4">cell 2</text><rect x="530" y="248" width="110" height="44" rx="8" fill="#eef4fb" stroke="#c0392b" stroke-width="2.5"/><text x="585" y="277" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">cell 3</text><path d="M230 90L526 90" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 150L526 150" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/><path d="M230 210L526 270" stroke="#c0392b" stroke-width="3" marker-end="url(#af-r)"/><path d="M230 270L526 270" stroke="#34495e" stroke-width="3" marker-end="url(#af-a)"/></g>
