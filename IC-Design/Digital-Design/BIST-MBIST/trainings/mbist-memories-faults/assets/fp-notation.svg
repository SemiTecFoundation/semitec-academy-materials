<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="470" rx="14" fill="#ffffff"/>
  <text x="380" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">A fault primitive  ⟨ S / F / R ⟩</text>
  <g data-step="1">
    <g font-size="64" fill="#34495e" text-anchor="middle"><text x="150" y="128">⟨</text><text x="345" y="128">/</text><text x="505" y="128">/</text><text x="680" y="128">⟩</text></g>
    <rect x="180" y="62" width="140" height="80" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="3"/>
    <rect x="370" y="62" width="110" height="80" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/>
    <rect x="530" y="62" width="120" height="80" rx="10" fill="#e8f6ee" stroke="#27ae60" stroke-width="3"/>
    <g font-size="40" font-weight="800" text-anchor="middle"><text x="250" y="117" fill="#1f4e79">S</text><text x="425" y="117" fill="#a93226">F</text><text x="590" y="117" fill="#1e8449">R</text></g>
    <g font-size="15" fill="#34495e" text-anchor="middle">
      <text x="250" y="166">what triggers it:</text><text x="250" y="185">start value + operations</text>
      <text x="425" y="166">value the cell</text><text x="425" y="185">holds afterwards</text>
      <text x="590" y="166">value the read</text><text x="590" y="185">returns (− = no read)</text>
    </g>
  </g>
  <g data-step="2">
    <rect x="30" y="215" width="700" height="100" rx="12" fill="#f7f9fc" stroke="#9fb3c8" stroke-width="2"/>
    <text x="50" y="250" font-size="17" font-weight="800" fill="#1f4e79">DRDF</text>
    <g font-size="32" font-weight="800" text-anchor="middle" font-family="Consolas, monospace"><text x="250" y="262" fill="#1f4e79">0r0</text><text x="425" y="262" fill="#a93226">1</text><text x="590" y="262" fill="#1e8449">0</text></g>
    <text x="380" y="298" text-anchor="middle" font-size="15" fill="#34495e">cell holds 0, read 0 → cell becomes 1, the read still returns the correct 0</text>
  </g>
  <g data-step="3">
    <rect x="30" y="335" width="700" height="115" rx="12" fill="#f7f9fc" stroke="#9fb3c8" stroke-width="2"/>
    <text x="50" y="370" font-size="17" font-weight="800" fill="#1f4e79">Coupling</text>
    <g font-size="30" font-weight="800" text-anchor="middle" font-family="Consolas, monospace"><text x="250" y="382" fill="#1f4e79">0w1;0</text><text x="425" y="382" fill="#a93226">1</text><text x="590" y="382" fill="#1e8449">−</text></g>
    <text x="250" y="405" text-anchor="middle" font-size="14" fill="#1f6feb">aggressor ; victim</text>
    <text x="380" y="435" text-anchor="middle" font-size="15" fill="#34495e">writing 1 into the aggressor (0 → 1) flips the victim from 0 to 1</text>
  </g>
</svg>
