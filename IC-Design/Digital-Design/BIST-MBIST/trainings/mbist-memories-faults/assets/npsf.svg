<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif">
<rect width="760" height="420" rx="14" fill="#ffffff"/>
<text x="380" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">The neighbourhood of a victim cell</text>
<rect x="230" y="70" width="80" height="80" rx="10" fill="#f2f5f9" stroke="#9fb3c8" stroke-width="3" stroke-dasharray="6 5"/>
<rect x="330" y="70" width="80" height="80" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="3"/>
<text x="370.0" y="122.0" text-anchor="middle" font-size="32" font-weight="800" fill="#1f6feb">N</text>
<rect x="430" y="70" width="80" height="80" rx="10" fill="#f2f5f9" stroke="#9fb3c8" stroke-width="3" stroke-dasharray="6 5"/>
<rect x="230" y="170" width="80" height="80" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="3"/>
<text x="270.0" y="222.0" text-anchor="middle" font-size="32" font-weight="800" fill="#1f6feb">W</text>
<rect x="330" y="170" width="80" height="80" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="3"/>
<text x="370.0" y="222.0" text-anchor="middle" font-size="32" font-weight="800" fill="#c0392b">v</text>
<rect x="430" y="170" width="80" height="80" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="3"/>
<text x="470.0" y="222.0" text-anchor="middle" font-size="32" font-weight="800" fill="#1f6feb">E</text>
<rect x="230" y="270" width="80" height="80" rx="10" fill="#f2f5f9" stroke="#9fb3c8" stroke-width="3" stroke-dasharray="6 5"/>
<rect x="330" y="270" width="80" height="80" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="3"/>
<text x="370.0" y="322.0" text-anchor="middle" font-size="32" font-weight="800" fill="#1f6feb">S</text>
<rect x="430" y="270" width="80" height="80" rx="10" fill="#f2f5f9" stroke="#9fb3c8" stroke-width="3" stroke-dasharray="6 5"/>
<text x="560" y="140" font-size="16" font-weight="700" fill="#1f6feb">type-1: v + 4 neighbours</text>
<text x="560" y="164" font-size="16" fill="#34495e">(N, S, E, W)</text>
<text x="560" y="214" font-size="16" font-weight="700" fill="#6b7a8c">type-2: + 4 diagonals</text>
<text x="560" y="238" font-size="16" fill="#34495e">(9 cells in all)</text>
<text x="380" y="395" text-anchor="middle" font-size="16" fill="#34495e">Neighbours are PHYSICAL neighbours in the array — not neighbouring addresses.</text></svg>