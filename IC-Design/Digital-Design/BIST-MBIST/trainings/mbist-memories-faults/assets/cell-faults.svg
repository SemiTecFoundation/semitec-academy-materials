<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="cf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker>
  <marker id="cf-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs>
  <rect width="760" height="360" rx="14" fill="#ffffff"/>
  <g data-step="1" data-until="1"><text x="380" y="34" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Good cell</text><text x="380" y="336" text-anchor="middle" font-size="16" fill="#34495e">w0 always leads to 0, w1 always leads to 1</text><circle cx="250" cy="180" r="46" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="250" y="192" text-anchor="middle" font-size="34" font-weight="800" fill="#1f4e79">0</text><circle cx="510" cy="180" r="46" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="510" y="192" text-anchor="middle" font-size="34" font-weight="800" fill="#1f4e79">1</text><path d="M285 148Q380 70 475 148" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#cf-a)"/><text x="380" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#34495e">w1</text><path d="M475 212Q380 290 285 212" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#cf-a)"/><text x="380" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#34495e">w0</text><path d="M208 162C140 120 140 240 208 198" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#cf-a)"/><text x="146" y="186" text-anchor="end" font-size="18" font-weight="700" fill="#34495e">w0</text><path d="M552 162C620 120 620 240 552 198" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#cf-a)"/><text x="614" y="186" text-anchor="start" font-size="18" font-weight="700" fill="#34495e">w1</text></g>
  <g data-step="2" data-until="2"><text x="380" y="34" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Stuck-at-0 (SAF)</text><text x="380" y="336" text-anchor="middle" font-size="16" fill="#34495e">the cell is always 0 — detected by: w1, then r1 (reads 0)</text><circle cx="250" cy="180" r="46" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="250" y="192" text-anchor="middle" font-size="34" font-weight="800" fill="#1f4e79">0</text><circle cx="510" cy="180" r="46" fill="#f2f5f9" stroke="#9aa7b4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="510" y="192" text-anchor="middle" font-size="34" font-weight="800" fill="#9aa7b4">1</text><path d="M208 162C140 120 140 240 208 198" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#cf-r)"/><text x="146" y="186" text-anchor="end" font-size="18" font-weight="700" fill="#c0392b">w0, w1</text></g>
  <g data-step="3" data-until="3"><text x="380" y="34" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Stuck-at-1 (SAF)</text><text x="380" y="336" text-anchor="middle" font-size="16" fill="#34495e">the cell is always 1 — detected by: w0, then r0 (reads 1)</text><circle cx="250" cy="180" r="46" fill="#f2f5f9" stroke="#9aa7b4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="250" y="192" text-anchor="middle" font-size="34" font-weight="800" fill="#9aa7b4">0</text><circle cx="510" cy="180" r="46" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="510" y="192" text-anchor="middle" font-size="34" font-weight="800" fill="#1f4e79">1</text><path d="M552 162C620 120 620 240 552 198" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#cf-r)"/><text x="614" y="186" text-anchor="start" font-size="18" font-weight="700" fill="#c0392b">w0, w1</text></g>
  <g data-step="4" data-until="4"><text x="380" y="34" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Up-transition fault (TF↑)</text><text x="380" y="336" text-anchor="middle" font-size="16" fill="#34495e">0 → 1 fails; 1 → 0 works — detected by: w0, w1, then r1</text><circle cx="250" cy="180" r="46" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="250" y="192" text-anchor="middle" font-size="34" font-weight="800" fill="#1f4e79">0</text><circle cx="510" cy="180" r="46" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="510" y="192" text-anchor="middle" font-size="34" font-weight="800" fill="#1f4e79">1</text><path d="M285 148Q380 70 475 148" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#cf-r)"/><text x="380" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#c0392b">w1</text><text x="380" y="125" text-anchor="middle" font-size="26" font-weight="800" fill="#c0392b">✗</text><path d="M475 212Q380 290 285 212" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#cf-a)"/><text x="380" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#34495e">w0</text><path d="M208 162C140 120 140 240 208 198" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#cf-r)"/><text x="146" y="186" text-anchor="end" font-size="18" font-weight="700" fill="#c0392b">w0, w1</text><path d="M552 162C620 120 620 240 552 198" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#cf-a)"/><text x="614" y="186" text-anchor="start" font-size="18" font-weight="700" fill="#34495e">w1</text></g>
  <g data-step="5" data-until="5"><text x="380" y="34" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Down-transition fault (TF↓)</text><text x="380" y="336" text-anchor="middle" font-size="16" fill="#34495e">1 → 0 fails; 0 → 1 works — detected by: w1, w0, then r0</text><circle cx="250" cy="180" r="46" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="250" y="192" text-anchor="middle" font-size="34" font-weight="800" fill="#1f4e79">0</text><circle cx="510" cy="180" r="46" fill="#eef4fb" stroke="#1f4e79" stroke-width="3"/><text x="510" y="192" text-anchor="middle" font-size="34" font-weight="800" fill="#1f4e79">1</text><path d="M285 148Q380 70 475 148" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#cf-a)"/><text x="380" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#34495e">w1</text><path d="M475 212Q380 290 285 212" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#cf-r)"/><text x="380" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#c0392b">w0</text><text x="380" y="250" text-anchor="middle" font-size="26" font-weight="800" fill="#c0392b">✗</text><path d="M208 162C140 120 140 240 208 198" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#cf-a)"/><text x="146" y="186" text-anchor="end" font-size="18" font-weight="700" fill="#34495e">w0</text><path d="M552 162C620 120 620 240 552 198" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#cf-r)"/><text x="614" y="186" text-anchor="start" font-size="18" font-weight="700" fill="#c0392b">w1, w0</text></g>
</svg>
