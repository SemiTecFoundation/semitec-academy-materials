<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training</title>
  <!-- Template engine styles (layout + components). Do not edit for look & feel: use a theme. -->
  <style>
/* app.css — layout and components of the training template.
   Colours, fonts and radii come from the theme (css/themes/*.css) through CSS variables.
   Two layouts: body.layout-sidebar (contents on the left) and body.layout-topbar (contents on top). */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--head-h) + var(--bar-h, 0px) + 12px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: var(--font-size, 16px)/1.6 var(--font); -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.25; color: var(--heading, var(--text)); }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }
.muted { color: var(--muted); }
.boot { padding: 4rem 2rem; text-align: center; color: var(--muted); }
.boot.error { color: var(--text); max-width: 640px; margin: auto; }
:root { --head-h: 60px; --toc-w: 300px; }

/* ---------------- buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; gap: .4em; padding: .55em 1.05em; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: background .15s, transform .1s, box-shadow .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: .3em .7em; font-size: .85em; }
.btn.danger { color: var(--bad); }
.btn.disabled, .btn:disabled { opacity: .55; cursor: not-allowed; }
.icon-btn { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 8px; border-radius: var(--radius-sm); }
.icon-btn:hover { background: var(--surface-2); }
.topbar-head .icon-btn:hover { background: color-mix(in srgb, currentColor 16%, transparent); }
.burger, .burger::before, .burger::after { display: block; width: 20px; height: 2px; background: currentColor; border-radius: 2px; position: relative; }
.burger::before, .burger::after { content: ""; position: absolute; left: 0; }
.burger::before { top: -6px; } .burger::after { top: 6px; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus, var(--accent)); outline-offset: 2px; }

/* ---------------- header ---------------- */
.topbar-head {
  position: fixed; inset: 0 0 auto 0; height: var(--head-h); z-index: 30;
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
  background: var(--head-bg, var(--surface)); color: var(--head-ink, var(--text));
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm);
}
.brand { flex: 1; min-width: 0; }
.brand-title { font-family: var(--font-head); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: .8em; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { display: flex; align-items: center; gap: 8px; }
.progress-track { width: 140px; height: 8px; border-radius: 99px; background: var(--track, rgba(127,127,127,.25)); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .6s ease; }
.progress-text { font-size: .85em; font-weight: 700; min-width: 3ch; }
.view-menu { position: relative; }
.view-menu > .btn { color: var(--text); }
.view-pop {
  position: absolute; right: 0; top: calc(100% + 8px); width: 230px; padding: 12px; display: grid; gap: 10px;
  background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
}
.view-pop label { display: grid; gap: 4px; font-size: .85em; color: var(--muted); }
.view-pop select { font: inherit; color: var(--text); padding: 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); }

/* ---------------- table of contents ---------------- */
.toc { background: var(--toc-bg, var(--surface)); color: var(--toc-ink, var(--text)); }
.toc-title { font-size: .75em; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 18px 6px; font-weight: 700; }
.toc-list, .toc-subs { list-style: none; margin: 0; padding: 0; }
.toc-row { display: flex; align-items: center; }
.toc-topic { flex: 1; display: flex; align-items: center; gap: 10px; padding: 9px 8px 9px 16px; color: inherit; text-decoration: none; font-weight: 600; min-width: 0; }
.toc-topic:hover { background: var(--surface-2); }
.toc-label { overflow: hidden; text-overflow: ellipsis; }
.toc-status {
  flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .78em; font-weight: 700;
  border: 2px solid var(--border); color: var(--muted); background: var(--surface);
}
.toc-status.done { background: var(--good); border-color: var(--good); color: #fff; }
.toc-status.locked { font-size: .7em; border-style: dashed; }
.toc-item.is-locked .toc-topic { color: var(--muted); }
.toc-item.current > .toc-row { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.toc-item.current .toc-status:not(.done) { border-color: var(--accent); color: var(--accent); }
.toc-exp { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 10px 14px; }
.chev { display: inline-block; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform .2s; }
.toc-item.expanded .toc-exp .chev, .acc-item.open .chev { transform: rotate(-135deg); }
.toc-subs { display: none; }
.toc-item.expanded .toc-subs { display: block; }
.toc-sub { display: block; padding: 6px 16px 6px 52px; color: var(--muted); text-decoration: none; font-size: .9em; border-left: 3px solid transparent; }
.toc-sub:hover { color: var(--text); background: var(--surface-2); }
.toc-sub.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.toc-cert .toc-status.done { background: var(--warn); border-color: var(--warn); }

/* ---------------- layout: SIDEBAR ---------------- */
.layout-sidebar .toc {
  position: fixed; top: var(--head-h); bottom: 0; left: 0; width: var(--toc-w); overflow-y: auto; z-index: 20;
  border-right: 1px solid var(--border); transition: transform .3s ease; padding-bottom: 40px;
}
.layout-sidebar .main { margin-left: var(--toc-w); transition: margin .3s ease; }
.layout-sidebar.toc-hidden .toc { transform: translateX(-100%); }
.layout-sidebar.toc-hidden .main { margin-left: 0; }

/* ---------------- layout: TOP BAR ---------------- */
.layout-topbar { --bar-h: 48px; }
.layout-topbar .toc {
  position: fixed; top: var(--head-h); left: 0; right: 0; height: var(--bar-h); z-index: 25;
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: transform .3s ease, opacity .3s;
}
.layout-topbar .toc-title { display: none; }
.layout-topbar .toc-list { display: flex; height: 100%; align-items: stretch; overflow-x: auto; padding: 0 8px; scrollbar-width: thin; }
.layout-topbar .toc-item { position: static; flex: none; }
.layout-topbar .toc-row { height: 100%; }
.layout-topbar .toc-topic { padding: 0 4px 0 10px; height: 100%; font-size: .9em; }
.layout-topbar .toc-label { max-width: 16ch; white-space: nowrap; }
.layout-topbar .toc-status { width: 22px; height: 22px; font-size: .7em; }
.layout-topbar .toc-exp { padding: 0 10px; height: 100%; }
.layout-topbar .toc-item.current > .toc-row { box-shadow: inset 0 -3px 0 var(--accent); }
.layout-topbar .toc-subs {
  position: fixed; top: calc(var(--head-h) + var(--bar-h)); min-width: 260px; max-width: 360px; z-index: 40;
  background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow); padding: 6px 0;
}
.layout-topbar .toc-sub { padding: 7px 16px; }
.layout-topbar .main { margin: 0 auto; max-width: 1060px; padding-top: calc(var(--head-h) + var(--bar-h) + 10px); }
.layout-topbar.toc-hidden { --bar-h: 0px; }
.layout-topbar.toc-hidden .toc { transform: translateY(-100%); opacity: 0; pointer-events: none; }

/* ---------------- main content ---------------- */
.main { padding: calc(var(--head-h) + 20px) clamp(16px, 4vw, 56px) 80px; outline: none; }
.main:focus, .main:focus-visible { outline: none; }
.layout-sidebar .main > * { max-width: 920px; margin-left: auto; margin-right: auto; }
.topic-head { padding: 18px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; animation: rise .45s ease both; }
.topic-kicker { text-transform: uppercase; letter-spacing: .08em; font-size: .75em; font-weight: 700; color: var(--accent); }
.topic-head h1 { font-size: clamp(1.6rem, 3vw, 2.3rem); margin: .2em 0 .3em; }
.topic-summary { font-size: 1.1em; color: var(--muted); margin: 0 0 .6em; }
.objectives { margin: .4em 0 1em; padding-left: 1.2em; }
.objectives li::marker { color: var(--accent); }
.subsection { padding: 22px 0 6px; animation: rise .5s ease both; scroll-margin-top: calc(var(--head-h) + var(--bar-h, 0px) + 12px); border-radius: var(--radius); }
.subsection h2 { font-size: 1.45rem; margin: .3em 0 .6em; }
.sub-num { color: var(--accent); font-weight: 700; margin-right: .2em; }
.subsection.flash { animation: flash 1.6s ease; }
.block { margin: 14px 0; }
.md p { margin: .55em 0; }
.md ul, .md ol { padding-left: 1.3em; }
.md blockquote { margin: .8em 0; padding: .4em 1em; border-left: 4px solid var(--accent); background: var(--surface-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes flash { 0%, 100% { background: transparent; } 20% { background: var(--accent-soft); box-shadow: 0 0 0 8px var(--accent-soft); } }
.topic-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); }
.locked-card { text-align: center; padding: 60px 20px; animation: rise .4s ease both; }
.lock-icon { font-size: 3rem; }
.remaining { display: inline-block; text-align: left; }

/* ---------------- callouts ---------------- */
.callout { padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); border-left: 5px solid var(--accent); background: var(--surface); }
.callout-title { font-weight: 700; margin-bottom: 2px; }
.callout.tip { border-left-color: var(--good); }
.callout.warning { border-left-color: var(--warn); }
.callout.key { border-left-color: var(--accent); background: var(--accent-soft); }
.callout .md p:first-child { margin-top: 0; } .callout .md p:last-child { margin-bottom: 0; }

/* ---------------- figures, zoom ---------------- */
.fig { margin: 0; }
.fig figcaption { font-size: .88em; color: var(--muted); text-align: center; margin-top: 6px; }
.media { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; text-align: center; overflow: hidden; }
.media img, .media svg, .svg-host svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.svg-host svg { width: 100%; max-height: 460px; }
.media.zoomable { cursor: zoom-in; transition: box-shadow .2s, transform .2s; }
.media.zoomable:hover { box-shadow: var(--shadow); }
.media.zoomable::after { content: "⤢"; position: absolute; right: 10px; top: 8px; font-size: 1.1em; color: var(--muted); opacity: .7; }
.media-bar { display: flex; justify-content: center; margin-top: 6px; }
.svg-host.paused * { animation-play-state: paused !important; }
.zoom-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(10,14,20,.88); display: none; }
.zoom-overlay.open { display: block; animation: fadein .2s ease; }
.zoom-stage { position: absolute; inset: 0 0 60px 0; display: grid; place-items: center; overflow: hidden; cursor: grab; touch-action: none; }
.zoom-holder { transform-origin: center center; max-width: 92vw; max-height: 82vh; transition: transform .08s linear; background: #fff; border-radius: 6px; padding: 8px; }
.zoom-holder img, .zoom-holder svg { max-width: 88vw; max-height: 78vh; width: auto; height: auto; display: block; }
.zoom-holder img { width: min(88vw, 1400px); height: auto; object-fit: contain; }
.zoom-holder svg { width: min(88vw, 1400px); }
.zoom-bar { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; gap: 8px; justify-content: center; }
@keyframes fadein { from { opacity: 0; } }

/* ---------------- compare slider ---------------- */
.compare { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: #fff; --pos: 50%; }
.compare > img, .cmp-top img { display: block; width: 100%; height: auto; }
.cmp-top { position: absolute; inset: 0; }
.cmp-line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 3px; background: var(--accent); transform: translateX(-50%); pointer-events: none; }
.cmp-line::after { content: "⇆"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: var(--accent); color: var(--accent-ink); border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center; }
.cmp-range { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.cmp-label { position: absolute; top: 8px; font-size: .75em; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff; pointer-events: none; }
.cmp-label.l { left: 8px; } .cmp-label.r { right: 8px; }

/* ---------------- accordion ---------------- */
.accordion { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.acc-item + .acc-item { border-top: 1px solid var(--border); }
.acc-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 16px; background: transparent; border: 0; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; }
.acc-head:hover { background: var(--surface-2); }
.acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.acc-body > .content { overflow: hidden; padding: 0 16px; }
.acc-item.open .acc-body { grid-template-rows: 1fr; }
.acc-item.open .acc-body > .content { padding-bottom: 12px; }

/* ---------------- tabs ---------------- */
.tabs { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.tab-bar { display: flex; gap: 2px; background: var(--surface-2); padding: 6px 6px 0; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 9px 16px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: var(--radius-sm) var(--radius-sm) 0 0; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.tab-panel { padding: 6px 16px 14px; animation: fadein .25s ease; }

/* ---------------- flip cards ---------------- */
.flipgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.flipcard { perspective: 900px; border: 0; padding: 0; background: transparent; cursor: pointer; min-height: 150px; font: inherit; color: inherit; text-align: center; }
.flip-inner { position: relative; width: 100%; height: 100%; min-height: 150px; transition: transform .55s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.flipcard.flipped .flip-inner { transform: rotateY(180deg); }
.flip-front, .flip-back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius); padding: 14px; display: grid; place-items: center; border: 1px solid var(--border); }
.flip-front { background: var(--surface); font-weight: 700; font-size: 1.05em; box-shadow: var(--shadow-sm); }
.flip-back { background: var(--accent); color: var(--accent-ink); transform: rotateY(180deg); font-size: .92em; }
.flip-front p, .flip-back p { margin: 0; }

/* ---------------- reveal / hotspots ---------------- */
.reveal { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
.reveal.side { grid-template-columns: minmax(0, 3fr) minmax(200px, 2fr); }
.reveal-stage { position: relative; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
.reveal-stage > img, .reveal-stage > .svg-host { border-radius: var(--radius); overflow: hidden; }
.reveal-stage img, .reveal-stage .svg-host svg { display: block; width: 100%; height: auto; max-height: none; }
.reveal-panel { min-height: 92px; }
.spot { position: absolute; border: 2px dashed var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; cursor: pointer; padding: 0; transition: background .15s, transform .15s; }
.spot:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.spot.active { border-style: solid; background: color-mix(in srgb, var(--accent) 25%, transparent); }
.spot.seen:not(.active) { border-color: var(--good); }
.spot-num { position: absolute; top: -11px; left: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: .75em; font-weight: 700; display: grid; place-items: center; animation: pulse 2s infinite; }
.spot.seen .spot-num { animation: none; background: var(--good); }
.spot.badge-tr .spot-num { left: auto; right: -11px; }
.spot.badge-bl .spot-num { top: auto; bottom: -11px; }
.spot.badge-br .spot-num { top: auto; bottom: -11px; left: auto; right: -11px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.reveal-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; min-height: 120px; animation: fadein .25s; }
.reveal-panel h4 { margin: .2em 0 .4em; color: var(--accent); }
.spot.pick { border-style: dotted; background: transparent; }
.spot.pick:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.spot.pick.chosen { background: color-mix(in srgb, var(--accent) 35%, transparent); border-style: solid; }
.spot.is-correct { border-color: var(--good) !important; box-shadow: 0 0 0 3px var(--good); }

/* ---------------- step animations (scrolly + stepper) ---------------- */
.svg-host [data-step] { transition: opacity .5s ease, transform .5s ease, filter .3s; }
.svg-host .st-hidden { opacity: 0; }
.svg-host .st-past { opacity: .55; }
.svg-host .st-current { opacity: 1; filter: drop-shadow(0 0 5px var(--accent)); }
.scrolly { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.scrolly-visual .svg-host svg { max-height: calc(100vh - var(--head-h) - var(--bar-h, 0px) - 70px); width: 100%; }
.scrolly-step { font-size: .95em; }
.scrolly-visual { position: sticky; top: calc(var(--head-h) + var(--bar-h, 0px) + 20px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.scrolly-steps { padding: 10vh 0 30vh; }
.scrolly-step { min-height: 46vh; padding: 16px 18px; margin-bottom: 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); opacity: .45; transition: opacity .3s, box-shadow .3s, border-color .3s; }
.scrolly-step.active { opacity: 1; border-color: var(--accent); box-shadow: var(--shadow); }
.step-num { font-size: .75em; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--accent); }
.scrolly-step h4 { margin: .2em 0; }
.stepper .media { padding: 14px; }
.stepper-caption { min-height: 3.2em; padding: 10px 4px 4px; }
.stepper-bar { display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; }
.stepper .media:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.step-counter { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------------- activities: sort and categorize ---------------- */
.activity { border: 1px dashed var(--accent); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); }
.hint { font-size: .85em; color: var(--muted); margin: .2em 0 .6em; }
.prompt p { margin-top: 0; font-weight: 600; }
.sortlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; counter-reset: s; }
.sortlist li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: grab; transition: box-shadow .15s, background .2s; counter-increment: s; }
.sortlist li::before { content: counter(s); font-weight: 700; color: var(--accent); min-width: 1.2em; }
.sortlist li.dragging { opacity: .5; box-shadow: var(--shadow); }
.sortlist li .li-text { flex: 1; }
.sortlist.locked li { cursor: default; }
.grip { color: var(--muted); letter-spacing: -2px; }
.arrows { display: flex; gap: 2px; }
.mini { border: 1px solid var(--border); background: var(--surface); border-radius: 4px; cursor: pointer; font-size: .7em; padding: 2px 6px; color: var(--muted); }
.good { border-color: var(--good) !important; background: color-mix(in srgb, var(--good) 14%, var(--surface)) !important; }
.bad { border-color: var(--bad) !important; background: color-mix(in srgb, var(--bad) 12%, var(--surface)) !important; }
.activity-bar, .quiz-bar { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.quiz-bar.center { justify-content: center; margin-top: 30px; }
.activity-msg { font-weight: 700; }
.activity-msg.good, .activity-msg.bad { background: none !important; border: 0; }
.activity-msg.good { color: var(--good); } .activity-msg.bad { color: var(--bad); }
.buckets { display: grid; gap: 12px; }
.pool, .zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 8px 10px; min-height: 64px; transition: border-color .15s, background .15s; }
.zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.zone { background: var(--surface-2); cursor: pointer; }
.zone.over { border-color: var(--accent); background: var(--accent-soft); }
.zone-title { font-size: .8em; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
.zone-items { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.chip { display: inline-block; padding: 6px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); cursor: grab; font-size: .92em; box-shadow: var(--shadow-sm); user-select: none; transition: transform .12s; }
.chip:hover { transform: translateY(-1px); }
.chip.selected { outline: 3px solid var(--accent); }

/* ---------------- code, table, video ---------------- */
.codebox { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--code-bg, #0f1720); }
.code-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: rgba(255,255,255,.06); color: #c9d4e0; font-size: .8em; }
.codebox pre { margin: 0; padding: 14px 16px; overflow-x: auto; color: var(--code-ink, #e6edf3); font: .88em/1.55 var(--font-mono); }
.codebox code { background: none; padding: 0; color: inherit; }
.copy { background: transparent; color: #c9d4e0; border-color: rgba(255,255,255,.2); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; font-size: .94em; }
.tbl th, .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.tbl th { background: var(--surface-2); font-weight: 700; }
.video-wrap { position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden; background: #000; }
.video-wrap video, .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* ---------------- quiz ---------------- */
.quiz { margin-top: 36px; padding: 22px clamp(14px, 3vw, 28px); border-radius: var(--radius); background: var(--quiz-bg, var(--surface)); border: 2px solid var(--accent); box-shadow: var(--shadow); scroll-margin-top: calc(var(--head-h) + var(--bar-h, 0px) + 12px); }
.quiz-head { display: flex; align-items: center; gap: 12px; }
.quiz-head h3 { margin: 0; font-size: 1.3rem; }
.quiz-badge { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: .75em; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; }
.question { margin: 18px 0; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); transition: border-color .2s, background .2s; }
.q-text { font-weight: 600; display: flex; gap: 8px; margin-bottom: 4px; }
.q-num { color: var(--accent); }
.q-img { max-width: 100%; border-radius: var(--radius-sm); margin: 6px 0; }
.q-options { display: grid; gap: 8px; }
.q-option { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; background: var(--surface-2); transition: border-color .15s, background .15s; }
.q-option:hover { border-color: var(--accent); }
.q-option input { margin-top: .3em; accent-color: var(--accent); }
.q-option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.q-option.is-correct { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.question.q-good { border-color: var(--good); }
.question.q-bad { border-color: var(--bad); }
.q-feedback:empty { display: none; }
.q-feedback { margin-top: 10px; font-size: .92em; }
.q-good .q-feedback strong { color: var(--good); } .q-bad .q-feedback strong { color: var(--bad); }
.quiz-result { margin-top: 12px; padding: 0; border-radius: var(--radius); }
.quiz-result.pass, .quiz-result.fail { padding: 14px 16px; animation: rise .35s ease both; }
.quiz-result.pass { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border: 1px solid var(--good); }
.quiz-result.fail { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); border: 1px solid var(--bad); }
.result-line { font-size: 1.05em; }
.review-list a { font-weight: 600; }

.cert-form { margin: 18px 0; }
.cert-row { display: flex; flex-wrap: wrap; gap: 10px; }
.name-input { flex: 1; min-width: 220px; font: inherit; padding: .55em .8em; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.cert-out { margin-top: 20px; overflow-x: auto; }
.load-error { color: var(--bad); }

/* ---------------- paging: one subsection per page ---------------- */
.mode-badge { display: inline-block; margin-left: 10px; padding: 1px 8px; border-radius: 99px; font-size: .62em; letter-spacing: .08em; text-transform: uppercase; vertical-align: middle; background: var(--warn); color: #1d1d1d; }
.view-note { margin: 0; font-size: .8em; color: var(--muted); }
.topic-head.compact { padding: 10px 0 6px; border-bottom: 0; margin-bottom: 0; }
.topic-title { font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; color: var(--heading, var(--text)); }
.page-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 4px; padding: 0 0 14px; border-bottom: 1px solid var(--border); counter-reset: none; }

.page-step:hover { border-color: var(--accent); color: var(--text); }
.page-step .dot { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .85em; background: var(--surface-2); color: var(--muted); }
.page-step .step-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-step.visited .dot { background: color-mix(in srgb, var(--good) 22%, var(--surface)); color: var(--good); }
.page-step.current { border-color: var(--accent); background: var(--accent-soft); color: var(--text); font-weight: 600; }
.page-step.current .dot { background: var(--accent); color: var(--accent-ink); }
.page-step.is-quiz .dot { font-size: .8em; }
.page-steps:has(.page-step:nth-child(6)) .page-step:not(.current) .step-label { display: none; }
.page-steps:has(.page-step:nth-child(6)) .page-step:not(.current) { padding-right: 4px; }
.review-note { margin: 14px 0 0; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); }
.review-note .review-list { margin: 6px 0 10px; }
.review-note.on-list { border-width: 2px; }
.pager { display: flex; justify-content: space-between; align-items: stretch; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); }
.pager .btn { flex-direction: column; align-items: flex-start; gap: 0; max-width: 48%; padding: .55em 1.1em; }
.pager .btn small { font-size: .72em; font-weight: 600; opacity: .75; text-transform: uppercase; letter-spacing: .05em; }
.pager .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.pager .pager-next { align-items: flex-end; margin-left: auto; text-align: right; }
.toc-sub.visited::after { content: " ✓"; color: var(--good); font-size: .85em; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200; max-width: min(560px, 92vw); padding: 10px 16px; border-radius: var(--radius); background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow); animation: rise .3s ease both; transition: opacity .4s; }
.toast.bad { border-color: var(--bad); border-left: 5px solid var(--bad); }
.toast.out { opacity: 0; }

/* ---------------- certificate preview controls ---------------- */
.cert-panel { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin: 16px 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.cert-panel label { display: grid; gap: 4px; font-size: .82em; color: var(--muted); }
.cert-panel label.wide { flex: 1 1 100%; }
.cert-panel select { font: inherit; color: var(--text); padding: 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); }
.cert-panel input[type=color] { width: 48px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); background: none; cursor: pointer; }
.cert-json-box { margin-top: 18px; }
.cert-json-box summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.cert-json { background: var(--code-bg); color: var(--code-ink); padding: 12px 16px; border-radius: var(--radius); font: .85em/1.5 var(--font-mono); overflow-x: auto; }

/* ---------------- responsive ---------------- */
.scrim { display: none; }
@media (max-width: 860px) {
  :root { --toc-w: 290px; }
  .progress-track { width: 70px; }
  .brand-sub { display: none; }
  .layout-sidebar .main { margin-left: 0 !important; }
  .layout-sidebar .toc { transform: translateX(-100%); box-shadow: var(--shadow); }
  .layout-sidebar.toc-open .toc { transform: none; }
  .layout-sidebar.toc-open .scrim { display: block; position: fixed; inset: var(--head-h) 0 0 0; background: rgba(0,0,0,.35); z-index: 15; }
  .reveal, .scrolly { grid-template-columns: 1fr; }
  .scrolly-visual { top: calc(var(--head-h) + var(--bar-h, 0px)); z-index: 2; }
  .scrolly-step { min-height: 30vh; }
  .page-step:not(.current) .step-label { display: none; }
  .page-step:not(.current) { padding-right: 4px; }
  .pager .btn { max-width: 100%; }
  .pager { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }

/* ---------------- print: only the certificate ---------------- */
@media print {
  body { background: #fff !important; }
  .topbar-head, .toc, .scrim, .toast, .main > :not(.cert-out) { display: none !important; }
  .main, .layout-sidebar .main, .layout-topbar .main { margin: 0 !important; padding: 0 !important; max-width: none !important; }
  .main > .cert-out { margin: 0 !important; max-width: none !important; overflow: visible; }
}

  <style>
/* certificate.css — completion certificate.

.certificate {
  --cert-accent: #1f4e79;
  --cert-accent2: #c9a227;
  --cert-paper: #fffdf7;
  --cert-ink: #1d2433;
  position: relative;
  width: 100%;
  max-width: 1000px;
  aspect-ratio: 297 / 210;
  margin: 0 auto;
  background: var(--cert-paper);
  color: var(--cert-ink);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .18);
  overflow: hidden;
  container-type: inline-size;
}
.certificate.portrait { aspect-ratio: 210 / 297; max-width: 720px; }
.certificate.font-serif { font-family: "Georgia", "Cambria", "Times New Roman", serif; }
.certificate.font-sans { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

.cert-frame {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  padding: 6cqw 8cqw;
  gap: 1.3cqw;
}
.cert-top { display: flex; align-items: center; gap: 1.6cqw; margin-bottom: .6cqw; }
.cert-logo { height: 6cqw; width: auto; }
.cert-logotext {
  width: 6cqw; height: 6cqw; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--cert-accent); color: var(--cert-paper);
  font-weight: 700; font-size: 2cqw; letter-spacing: .05em;
}
.cert-issuer { font-size: 1.6cqw; letter-spacing: .18em; text-transform: uppercase; color: var(--cert-accent); font-weight: 600; }
.cert-title { font-size: 4.6cqw; line-height: 1.1; color: var(--cert-accent); font-weight: 700; letter-spacing: .02em; }
.cert-subtitle { font-size: 1.6cqw; opacity: .8; }
.cert-presented { margin-top: 1.4cqw; font-size: 1.6cqw; font-style: italic; opacity: .85; }
.cert-name {
  font-size: 5cqw; line-height: 1.15; font-weight: 700;
  padding: 0 3cqw .6cqw; border-bottom: .25cqw solid var(--cert-accent2);
  min-width: 50%;
}
.cert-body { font-size: 1.8cqw; max-width: 75%; line-height: 1.45; }
.cert-body strong { color: var(--cert-accent); }
.cert-topics { font-size: 1.2cqw; max-width: 64%; opacity: .75; line-height: 1.5; }
.cert-signs { display: flex; gap: 8cqw; margin-top: 2.4cqw; justify-content: center; flex-wrap: wrap; }
.cert-sign { min-width: 18cqw; }
.sign-line { border-top: .15cqw solid currentColor; margin-bottom: .6cqw; opacity: .7; }
.sign-name { font-size: 1.6cqw; font-weight: 600; }
.sign-role { font-size: 1.25cqw; opacity: .7; }
.cert-foot {
  position: absolute; left: 6cqw; right: 6cqw; bottom: 4cqw;
  display: flex; justify-content: space-between; font-size: 1.1cqw; opacity: .65;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
}
.cert-seal {
  position: absolute; right: 7cqw; bottom: 8cqw;
  width: 11cqw; height: 11cqw; border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--cert-accent2) 70%, white), var(--cert-accent2));
  color: var(--cert-paper);
  box-shadow: 0 0 0 .5cqw var(--cert-paper), 0 0 0 .8cqw var(--cert-accent2);
  font-weight: 700; font-size: 1.5cqw; letter-spacing: .08em; text-transform: uppercase;
  transform: rotate(-12deg);
}
.cert-seal span { max-width: 80%; line-height: 1.15; }

/* ---------- design: classic (double frame, corner ornaments) ---------- */
.design-classic .cert-frame { margin: 2.4cqw; border: .5cqw double var(--cert-accent); }
.design-classic .cert-frame::before {
  content: ""; position: absolute; inset: 1cqw; border: .12cqw solid var(--cert-accent2); pointer-events: none;
}
.design-classic .cert-frame::after {
  content: ""; position: absolute; inset: -.5cqw; pointer-events: none;
  background:
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) top left / 4cqw 4cqw no-repeat,
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) top right / 4cqw 4cqw no-repeat,
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) bottom left / 4cqw 4cqw no-repeat,
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) bottom right / 4cqw 4cqw no-repeat;
}
.design-classic .cert-foot { bottom: 5cqw; left: 7cqw; right: 7cqw; }

/* ---------- design: modern (color band on the left, left-aligned) ---------- */
.design-modern { background: linear-gradient(90deg, var(--cert-accent) 0 22%, var(--cert-paper) 22%); }
.design-modern::before {
  content: ""; position: absolute; left: 22%; top: 0; bottom: 0; width: 1.2cqw; background: var(--cert-accent2);

.design-modern .cert-logotext { background: var(--cert-paper); color: var(--cert-accent); }
.design-modern .cert-issuer { color: var(--cert-paper); max-width: 16cqw; text-align: center; font-size: 1.3cqw; }
.design-modern .cert-title { text-transform: uppercase; letter-spacing: .08em; font-size: 4cqw; }
.design-modern .cert-name { border-bottom: none; padding: 0; position: relative; }
.design-modern .cert-name::after { content: ""; display: block; width: 10cqw; height: .5cqw; background: var(--cert-accent2); margin-top: 1cqw; }
.design-modern .cert-body, .design-modern .cert-topics { max-width: 92%; }
.design-modern .cert-signs { justify-content: flex-start; }
.design-modern .cert-foot { left: calc(22% + 7cqw); }
.design-modern .cert-seal { right: 5cqw; bottom: 7cqw; }

/* ---------- design: minimal (thin rule, lots of space) ---------- */
.design-minimal { box-shadow: 0 2px 12px rgba(0, 0, 0, .1); }
.design-minimal .cert-frame { margin: 3cqw; border: .1cqw solid color-mix(in srgb, var(--cert-ink) 25%, transparent); }
.design-minimal .cert-title { font-weight: 300; letter-spacing: .25em; text-transform: uppercase; font-size: 3.2cqw; color: var(--cert-ink); }
.design-minimal .cert-name { font-weight: 400; border-bottom-width: .12cqw; border-color: var(--cert-accent); }
.design-minimal .cert-seal { width: 9cqw; height: 9cqw; right: 5.5cqw; bottom: 6.5cqw; background: none; color: var(--cert-accent); box-shadow: inset 0 0 0 .2cqw var(--cert-accent); transform: none; }

/* ---------- print: A4, only the certificate ---------- */
@media print {
  @page { size: A4 landscape; margin: 0; }
  .certificate { max-width: none; width: 297mm; height: 210mm; aspect-ratio: auto; box-shadow: none; }
  .certificate.portrait { width: 210mm; height: 297mm; }
  .certificate, .certificate * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

iframe.certificate.web-certificate { display:block; width:100%; height:620px; border:0; padding:0; }
@media print { iframe.certificate.web-certificate { height:190mm; } }

 "md": "Each core has L1 instruction and data caches, register files and small buffers — several memory instances per core."}, {"x": 45.6, "y": 13.5, "w": 25, "h": 41.7, "label": "2", "title": "L2 cache", "md": "One of the biggest blocks on the die: millions of bits, often split into many banks."}, {"x": 73.1, "y": 13.5, "w": 21.9, "h": 41.7, "label": "3", "title": "Accelerators", "md": "GPUs and AI engines carry large local SRAMs next to their arithmetic units."}, {"x": 5.6, "y": 68.8, "w": 27.5, "h": 22.9, "label": "4", "title": "Hundreds of small memories", "md": "FIFOs and buffers in every interface. Each is small, but a big SoC can contain **thousands** of memory instances — and every one must be tested."}, {"x": 35.6, "y": 68.8, "w": 18.8, "h": 22.9, "label": "5", "title": "ROM", "md": "Fixed boot code. It can only be read, so its test is different."}, {"x": 56.9, "y": 68.8, "w": 38.1, "h": 22.9, "label": "6", "title": "Shared SRAM", "md": "On-chip working memory used by all cores."}]}, {"type": "text", "md": "In many modern SoCs embedded memories take **half of the die area or more**, and they contain most of the transistors. Memory cells are drawn with the **tightest layout rules** the factory allows — smaller and denser than any logic. Dense structures catch more particles and suffer more from process variation."}, {"type": "callout", "kind": "key", "title": "Where the defects are", "md": "More area, more transistors and denser layout mean that a **large share of all manufacturing defects lands in the memories**. Chip yield is often decided by memory yield — which is why memories get their own tests, their own BIST, and even spare rows and columns for **repair**."}]}, {"id": "memory-types", "title": "Memory types", "blocks": [{"type": "text", "md": "Not all memories are alike. Each type stores a bit in a different way — and the way a bit is stored decides how it can fail."}, {"type": "tabs", "tabs": [{"label": "SRAM", "md": "**Static RAM.** Each bit is held by two cross-coupled inverters (6 transistors). Fast, keeps its value as long as power is on, no refresh. The workhorse of embedded memory: caches, buffers, FPGA block RAM. **This course focuses on SRAM.**"}, {"label": "Register file", "md": "Small, very fast memory inside a processor, usually with **several ports** (e.g. two reads and one write per clock). Built from SRAM-like cells or flip-flops. Extra ports bring extra fault types between ports."}, {"label": "ROM", "md": "**Read-only memory.** Content is fixed when the chip is made (boot code, tables). It cannot be written, so it is tested by **reading every word** and compacting the data into a signature (a MISR — Topic 5 of *BIST Foundations*)."}, {"label": "DRAM", "md": "**Dynamic RAM.** One transistor and one capacitor per bit — very dense, but the charge leaks, so every cell must be **refreshed** regularly. Usually a separate chip; its tests stress **retention** (how long a cell keeps its charge)."}, {"label": "Flash / NVM", "md": "**Non-volatile** memory: keeps data without power (floating gate or charge trap). Found as embedded flash in microcontrollers. Slow to write, wears out after many writes; tested with special program/erase sequences."}]}, {"type": "table", "columns": ["Type", "Cell", "Keeps data without power?", "Typical use"], "rows": [["SRAM", "6 transistors", "no", "caches, buffers, FPGA BRAM"], ["Register file", "SRAM cell / flip-flops, many ports", "no", "CPU registers"], ["ROM", "transistor present / absent", "**yes**", "boot code, tables"], ["DRAM", "1 transistor + 1 capacitor", "no (needs refresh)", "main memory"], ["Flash", "floating-gate transistor", "**yes**", "program memory of MCUs"]], "caption": "Memory types at a glance"}, {"type": "categorize", "prompt": "Practice: does the memory keep its data when the power is switched off?", "categories": [{"id": "v", "label": "Volatile (data lost)"}, {"id": "nv", "label": "Non-volatile (data kept)"}], "items": [{"text": "SRAM", "category": "v"}, {"text": "DRAM", "category": "v"}, {"text": "Register file", "category": "v"}, {"text": "ROM", "category": "nv"}, {"text": "Flash", "category": "nv"}]}]}, {"id": "logic-tests-dont-fit", "title": "Why logic tests do not fit memories", "blocks": [{"type": "text", "md": "Logic is tested with **scan** and **ATPG** (automatic test pattern generation) or with **LBIST**: load a pattern into the flip-flops, clock once, compare the outputs. This does not work well for memories:"}, {"type": "accordion", "items": [{"title": "Memory cells are not scan flip-flops", "md": "Scan works by chaining **flip-flops** into shift registers. The millions of cells of an SRAM are not flip-flops and cannot be chained — you can only reach them through the memory's own ports, one address at a time."}, {"title": "ATPG does not model the inside of a memory", "md": "ATPG tools reason about gates. A memory is a huge, analog-ish array; in ATPG it is usually treated as a **black box**. The logic around it is tested, the cells inside are not."}, {"title": "Memory faults depend on the order of operations", "md": "Many memory faults appear only after a **sequence**: write 0, write 1 to a *neighbour*, then read — or only when the address goes **up** rather than down. A logic pattern is a single snapshot; random patterns would almost never create the right sequence at the right address."}, {"title": "Every address must be visited", "md": "A defect can sit in any one of millions of cells. A memory test must write and read **every** address, several times, with known data. Random patterns would need far too long to cover all of them."}]}, {"type": "svg", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3NjAgMzQwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KPHN0eWxlPi5tcy13e2FuaW1hdGlvbjptcy1kb3duIDhzIHN0ZXBzKDEpIGluZmluaXRlfS5tcy1ye2FuaW1hdGlvbjptcy11cCA4cyBzdGVwcygxKSBpbmZpbml0ZX1Aa2V5ZnJhbWVzIG1zLWRvd257MCV7dHJhbnNmb3JtOnRyYW5zbGF0ZVk ics 4–7)."}]}], "quiz": {"questions": [{"id": "q-share", "type": "single", "text": "Why does a large share of manufacturing defects land in the embedded memories?", "options": ["Memories take much of the die area and use the densest layout, so they catch more defects.", "Memories are made in a different factory.", "Memory cells are larger than logic gates.", "Memories are tested less often, so defects collect there."], "correct": [0], "review": ["memories-everywhere"]}, {"id": "q-sram", "type": "single", "text": "Which memory type holds each bit with two cross-coupled inverters and needs no refresh?", "options": ["SRAM", "DRAM", "ROM", "Flash"], "correct": [0], "review": ["memory-types"]}, {"id": "q-refresh", "type": "single", "text": "Which memory loses its data even with power on unless it is refreshed?", "options": ["DRAM", "SRAM", "ROM", "Flash"], "correct": [0], "review": ["memory-types"]}, {"id": "q-volatile", "type": "match", "text": "Sort the memories: does the data survive a power-off?", "categories": [{"id": "v", "label": "Volatile"}, {"id": "nv", "label": "Non-volatile"}], "items": [{"text": "SRAM", "category": "v"}, {"text": "Register file", "category": "v"}, {"text": "ROM", "category": "nv"}, {"text": "Flash", "category": "nv"}], "review": ["memory-types"]}, {"id": "q-notscan", "type": "multiple", "text": "Why are scan, ATPG and random patterns not enough for memories? Select **all** correct answers.", "options": ["Memory cells cannot be chained into scan shift registers.", "Many memory faults appear only after a specific sequence of writes and reads.", "Every one of millions of addresses must be visited.", "Memories cannot have stuck-at faults."], "correct": [0, 1, 2], "review": ["logic-tests-dont-fit"]}, {"id": "q-mbist", "type": "single", "text": "Which hardware does a simple memory BIST need to run a March-type test?", "options": ["An address counter, a data generator and a comparator.", "A scan chain through every memory cell.", "An ATPG tool on the chip.", "A second copy of the memory."], "correct": [0], "review": ["logic-tests-dont-fit"]}]}}, "topics/02-sram.json": {"id": "sram", "title": "Inside an SRAM", "duration": "35 min", "summary": "To understand how a memory fails, you first need to know how it works. This topic opens an SRAM: the 6-transistor cell, how a bit is read and written, and how thousands of cells are organised into an array with decoders, sense amplifiers and column multiplexers.", "objectives": ["Name the six transistors of an SRAM cell and their jobs.", "Describe a read and a write step by step, and why a read can disturb a cell.", "Explain how an address selects a row and columns in the array.", "Compute rows, columns, column-mux ratio and address bits of a word-oriented memory."], "subsections": [{"id": "cell", "title": "The 6-transistor cell", "blocks": [{"type": "text", "md": "One bit of SRAM is stored by **two inverters connected in a loop**: the output of each one drives the input of the other. The loop has two stable states — Q = 0 / QB = 1 or Q = 1 / QB = 0 — and holds it as long as power is on. Two more transistors connect the cell to the outside world."}, {"type": "reveal", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3NjAgNDIwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8cmVjdCB3aWR0aD0iNzYwIiBoZWlnaHQ9IjQyMCIgcng9IjE0IiBmaWxsPSIjZmZmZmZmIi8+CiAgPHRleHQgeD0iMzgwIiB5PSIyOCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNiIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzFmNGU3OSI+VGhlIDYtdHJhbnNpc3RvciBTUkFNIGNlbGw8L3RleHQ+CiAgPGcgc3Ryb2tlPSIjMzQ0OTVlIiBzdHJva2Utd2lkdGg9IjIuNSIgZmlsbD0ibm9uZSI+CiAgICA8bGluZSB4MT0iNjAiIHkxPSI3MCIgeDI9IjcwMCIgeTI9IjcwIi8+CiAgICA8bGluZSB4MT0iMTAwIiB5MT0iNDQiIHgyPSIxMDAiIHkyPSIzNDAiLz48bGluZSB4MT0iNjYwIiB5MT0iNDQiIHgyPSI2NjAiIHkyPSIzNDAiLz4KICAgIDxwYXRoIGQ9Ik0xMDAgMjMwSDE1ME0yMTAgMjMwSDI4ME0yODAgMTYwVjMwMCIvPgogICAgPHBhdGggZD0iTTY2MCAyMzBINjEwTTU1MCAyMzBINDgwTTQ4MCAxNjBWMzAwIi8+CiAgICA8c 42, "y": 31, "w": 13.2, "h": 47.6, "label": "1", "title": "Cross-coupled inverters (M1–M4)", "md": "Each inverter is one PMOS **pull-up** and one NMOS **pull-down** transistor. Together they form a latch that keeps the bit. This is where the value lives.", "badge": "tr"}, {"x": 34.2, "y": 36.9, "w": 5.3, "h": 34.5, "label": "2", "title": "Storage nodes Q and QB", "md": "The two internal nodes always hold opposite values. *Reading the cell* means finding out which node is 0.", "badge": "bl"}, {"x": 19.7, "y": 50.5, "w": 7.9, "h": 8.6, "label": "3", "title": "Access transistors (M5, M6)", "md": "Switches between the storage nodes and the bit lines. They open only when the **word line** is high."}, {"x": 7.9, "y": 12, "w": 84.2, "h": 7, "label": "4", "title": "Word line (WL)", "md": "One horizontal wire per **row**. Raising it connects every cell of that row to its bit lines."}, {"x": 10.5, "y": 22, "w": 5, "h": 58, "label": "5", "title": "Bit lines (BL and BLB)", "md": "Two vertical wires per **column**, carrying the value and its complement. Shared by all cells of the column."}, {"x": 7.9, "y": 88.6, "w": 84.2, "h": 8.6, "label": "6", "title": "Column circuits", "md": "At the end of each column: **precharge** (pulls both bit lines up before a read), **sense amplifier** (detects a tiny difference), **write driver** (forces a new value)."}]}]}, {"id": "read-write", "title": "Reading and writing a cell", "blocks": [{"type": "text", "md": "Follow one cell through a **read** (steps 1–5) and a **write** (steps 6–8). The cell starts holding **0**."}, {"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3NjAgNDIwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8cmVjdCB3aWR0aD0iNzYwIiBoZWlnaHQ9IjQyMCIgcng9IjE0IiBmaWxsPSIjZmZmZmZmIi8+CiAgPHRleHQgeD0iMzgwIiB5PSIyOCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNiIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzFmNGU3OSI+UmVhZGluZyBhbmQgd3JpdGluZyBvbmUgY2Vsb  holds 0. A read must **never** change the cell — if the access transistor were too strong compared with the pull-down, node Q could rise enough to flip the cell. That failure is a **read disturb** (Topic 6)."}, {"title": "6. Write: drive the bit lines", "md": "To write **1**, the write driver forces BL = 1 and BLB = 0 with strong transistors."}, {"title": "7. Word line on: the cell flips", "md": "Through M6 the driver pulls QB down. The access transistor must be stronger than the cell's pull-up, so QB falls, the inverters switch and the cell flips: **Q = 1, QB = 0**. If it is too weak, the write fails — a **transition fault** (Topic 4)."}, {"title": "8. Word line off", "md": "The cell now holds 1 on its own."}]}, {"type": "callout", "kind": "key", "title": "A delicate balance", "md": "Reads need the cell to be **strong** (not to flip); writes need it to be **weak enough** to flip. Defects and process variation can upset this balance — exactly what the fault models of this training describe."}, {"type": "sort", "prompt": "Practice: put the steps of a read in order.", "items": ["Precharge both bit lines", "Raise the word line", "The bit line on the 0 side drops slightly", "The sense amplifier decides", "Lower the word line"]}]}, {"id": "array", "title": "The array: decoders and sense amplifiers", "blocks": [{"type": "text", "md": "Cells are arranged in **rows** (one word line each) and **columns** (one bit-line pair each). Follow an access to a small memory of 32 words × 4 bits:"}, {"type": "scrolly", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NDAgNTQwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KPGRlZnM+PG1hcmtlciBpZD0iYXItYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzM0NDk1ZSIvPjwvbWFya2VyPjwvZGVmcz4KPHJlY3Qgd2lkdGg9IjY0MCIgaGVpZ2h0PSI1NDAiIHJ4PSIxNCIgZmlsbD0iI2ZmZmZmZiIvPgo8 all and 4 columns wide — a very long, thin block with very long bit lines (slow) and a huge decoder. Folding several words into one row makes the array close to **square**: shorter wires, faster, smaller."}]}]}, {"id": "word-oriented", "title": "Word-oriented memories and column multiplexing", "blocks": [{"type": "text", "md": "Real memories are described as **words × bits per word** (e.g. 4096 × 16). The designer chooses the physical shape:\n\n- **cells** = words × bits\n- **columns** = cells ÷ rows\n- **column-mux ratio** = columns ÷ bits per word\n- **address bits** = log₂(rows) for the row + log₂(mux ratio) for the column"}, {"type": "callout", "kind": "key", "title": "Worked example", "md": "A memory of **1024 × 8** bits is built with **128 rows**.\n\n- cells = 1024 × 8 = 8192\n- columns = 8192 ÷ 128 = **64**\n- column mux = 64 ÷ 8 = **8 : 1**\n- address = 10 bits = **7** row bits (128 rows) + **3** column bits (8 groups)"}, {"type": "tabs", "tabs": [{"label": "Interleaved bits", "md": "With an 8 : 1 mux, the bits of one word sit **8 columns apart**. A particle that hits two neighbouring cells usually damages **two different words**, one bit each — which an error-correcting code (ECC) can fix. Designers interleave on purpose."}, {"label": "Logical vs. physical neighbours", "md": "Address 5 and address 6 are neighbours in the **address space**, but in the array they can be far apart (different column groups, or rows that the decoder has scrambled). Many memory faults happen between **physically** neighbouring cells. A good test either knows the real layout (*address scrambling* information) or uses algorithms that do not depend on it — the March tests."}, {"label": "Word-oriented tests", "md": "All bits of a word are written at the same time. Faults **between bits of the same word** (intra-word) can only be found if the test writes different values into the bits of one word — using several **data backgrounds** such as 0000, 0101, 0011. You will meet them in the *March tests* training."}]}]}], "quiz": {"questions": [{"id": "q-access", "type": "single", "text": "Which transistors connect the SRAM cell to its bit lines, and what controls them?", "options": ["The two access transistors M5, M6 — controlled by the word line.", "The pull-up transistors — controlled by the bit lines.", "The pull-down transistors — controlled by the sense amplifier.", "All six transistors — controlled by the clock."], "correct": [0], "review": ["cell"]}, {"id": "q-read-order", "type": "order", "text": "Put the steps of an SRAM read in order.", "items": ["Precharge both bit lines", "Raise the word line", "The bit line on the 0 side drops slightly", "The sense amplifier decides", "Lower the word line"], "review": ["read-write"]}, {"id": "q-disturb", "type": "truefalse", "text": "If the access transistor is too strong compared with the pull-down transistor, a read can flip the cell.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["read-write"], "explain": "The storage node rises during the read; if it rises too far, the latch switches — a **read disturb**."}, {"id": "q-write", "type": "single", "text": "Why can a write flip the cell although the cell's inverters try to hold the old value?", "options": ["The write driver and access transistor are stronger than the cell's pull-up, so the node is pulled to the new value.", "The word line switches off the inverters during a write.", "The cell is cleared to 0 before every write.", "The sense amplifier stores the new value."], "correct": [0], "review": ["read-write"]}, {"id": "q-mux", "type": "single", "text": "A 4096 × 16-bit memory is built with 512 rows. What is the column-mux ratio?", "options": ["8 : 1", "4 : 1", "16 : 1", "32 : 1"], "correct": [0], "review": ["word-oriented"], "explain": "cells = 65 536; columns = 65 536 ÷ 512 = 128; mux = 128 ÷ 16 = **8 : 1**."}, {"id": "q-bits", "type": "single", "text": "For the same memory (4096 × 16, 512 rows, 8 : 1 mux), how are the 12 address bits split?", "options": ["9 row bits + 3 column bits", "8 row bits + 4 column bits", "12 row bits + 0 column bits", "6 row bits + 6 column bits"], "correct": [0], "review": ["word-oriented"], "explain": "512 rows → 9 bits; 8 column groups → 3 bits; 9 + 3 = 12 (4096 words)."}, {"id": "q-interleave", "type": "multiple", "text": "What follows from column multiplexing? Select **all** correct answers.", "options": ["The bits of one word are not physically next to each other.", "Neighbouring addresses are not always neighbouring cells in the array.", "A particle hitting two adjacent cells usually damages two different words.", "All bits of a word share one bit line."], "correct": [0, 1, 2], "review": ["array", "word-oriented"]}]}}, "topics/03-variants.json": {"id": "variants", "title": "Memory variants and what they mean for test", "duration": "20 min", "summary": "Besides the plain single-port SRAM, a chip contains multi-port memories, ROMs and — in FPGAs — block RAM and distributed (LUT) RAM. Each one changes **how the BIST must test it**. DRAM and flash are mentioned briefly; the details of all memories belong to the Digital Design courses.", "objectives": ["Explain what extra testing a multi-port memory needs.", "Explain how a ROM is tested without writing.", "Explain synchronous and asynchronous read and why the MBIST comparator must know the read latency.", "Name the special concerns of DRAM and flash tests."], "subsections": [{"id": "multi-port", "title": "Multi-port memories and register files", "blocks": [{"type": "image", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3NjAgMzMwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8ZGVmcz48bWFya2VyIGlkPSJkcC1hIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMzQ0OTVlIi8+PC9tYXJrZXI+PC9kZWZzPgogIDxyZWN0IHdpZHRoPSI3NjAiIGhlaWdodD rite the same address is defined by the memory — the test must not expect anything else"]], "caption": "Testing multi-port memories"}]}, {"id": "rom", "title": "ROM", "blocks": [{"type": "text", "md": "A **ROM** is written once, when the chip is made. A test that writes data is impossible, so the BIST simply **reads every word** and compacts the data in a **MISR** — exactly the response compaction of *BIST Foundations*, Topic 5."}, {"type": "image", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3NjAgMjYwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8ZGVmcz48bWFya2VyIGlkPSJycy1hIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMzQ0OTVlIi8+PC9tYXJrZXI+PC9kZWZzPgogIDxyZWN0IHdpZHRoPSI3NjAiIGhlaWdodD0iMjYwIiByeD0iMTQiIGZpbGw9IiNmZmZmZmYiLz4KICA8dGV4dCB4PSIzODAiIHk9IjMyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjE4IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMWY0ZTc5Ij5ST00gdGVzdDogcmVhZCBldmVyeSB3b3JkIGludG8gYSBzaWduYXR1cmU8L3RleHQ+CiAgPHJlY3QgeD0iMzAiIHk9IjgwIiB3aWR0aD0iMTUwIiBoZWlnaHQ9IjkwIiByeD0iMTAiIGZpbGw9IiNlZmVhZmEiIHN0cm9rZT0iIzZjNGZiMyIgc3Ryb2tlLXdpZHRoPSIyLjUiLz4KICA8dGV4dCB4PSIxMDUiIHk9IjExOCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjgwMCIgZmlsbD0iIzViM2ZhMCI+QWRkcmVzczwvdGV4dD48dGV4dCB4PSIxMDUiIHk9IjE0MiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjgwMCIgZmlsbD0iIzViM2ZhMCI+Y291bnRlcjwvdGV4dD4KICA8dGV4dCB4PSIxMDUiIHk9IjE5MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzM0NDk1ZSI+MCwgMSwgMiwg4oCmIGxhc3Q8L3RleHQ+CiAgPHBhdGggZD0iTTE4MCAxMjVIMjI2IiBzdHJva2U9IiMzNDQ5NWUiIHN0cm9rZS13aWR0aD0iMyIgbWFya2VyLWVuZD0idXJsKCNycy1hKSIvPgogIDxyZWN0IHg9IjIzMCIgeT0iNzAiIHdpZHRoPSIxNzAiIGhlaWdodD0iMTEwIiByeD0iMTAiIGZpbGw9IiNmOGU3YzQiIHN0cm9rZT0iI2I4ODYwYiIgc3Ryb2tlLXdpZHRoPSIyLjUiLz4KICA8dGV4dCB4PSIzMTUiIHk9IjEyMCIgdGV4dC1hbmNob3I9Im1pZGRsZSIg "title": "FPGA memories: block RAM and LUT RAM", "blocks": [{"type": "text", "md": "FPGAs offer two kinds of on-chip RAM, and an MBIST built into an FPGA design has to handle both:"}, {"type": "tabs", "tabs": [{"label": "Block RAM (BRAM)", "md": "Dedicated memory blocks of a fixed size (for example 36 Kb blocks in AMD devices, 20 Kb M20K blocks in Intel devices), configurable in width and depth, single- or dual-port. **Synchronous read**: the address is taken at a clock edge and the data appears **after** that edge — one clock later, or two with the optional output register."}, {"label": "LUT RAM (distributed RAM)", "md": "Small memories built from the look-up tables of the logic blocks (AMD: distributed RAM; Intel: MLAB). Writes are synchronous, but the **read is asynchronous**: the data follows the address within the same clock cycle, like combinational logic."}]}, {"type": "image", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3NjAgMzMwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8cmVjdCB3aWR0aD0iNzYwIiBoZWlnaHQ9IjMzMCIgcng9IjE0IiBmaWxsPSIjZmZmZmZmIi8+CiAgPHRleHQgeD0iMzgwIiB5PSIzMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxOCIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzFmNGU3OSI+UmVhZGluZyBhZGRyZXNzIDU6IHdoZW4gZG9lcyB0aGUgZGF0YSBhcHBlYXI/PC90ZXh0PgogIDxnIGZvbnQtc2l6ZT0iMTUiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMzNDQ5NWUiPjx0ZXh0IHg9IjIwIiB5PSI4NSI+Y2xvY2s8L3RleHQ+PHRleHQgeD0iMjAiIHk9IjE0NSI+YWRkcmVzczwvdGV4dD48dGV4dCB4PSIyMCIgeT0iMjA1Ij5MVVRSQU0gb3V0PC90ZXh0Pjx0ZXh0IHg9IjIwIiB5PSIyNjUiPkJSQU0gb3V0PC90ZXh0PjwvZz4KICA8cGF0aCBkPSJNMTQwIDk1SDE3MFY2NUgyNTBWOTVIMzMwVjY1SDQxMFY5NUg0OTBWNjVINTcwVjk1SDY1MFY2NUg3MzAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzFmNGU3OSIgc3Ryb2tlLXdpZHRoPSIyLjUiLz4KICA8ZyBzdHJva2U9IiM5YWE3YjQiIHN0cm9rZS13aWR0aD0iMS4yIiBzdHJva2UtZGFzaGFycmF5PSI1IDQiPjxsaW5lIHgxPSIxNzAiIHkxPSI1NSIgeDI9IjE3MCIgeTI9IjI5MCIvPjxsaW5lIHgxPSIzMzAiIHkxPSI1NSIgeDI9IjMzMCIgeTI9IjI5MCIvPjxsaW5lIHgxPSI0OTAiIHkxPSI1NSIg ry test at boot."}]}, {"label": "Flash", "md": "Non-volatile cells that are **programmed** and **erased** in blocks, slowly, and wear out after many cycles. Tests check program/erase, **endurance** and read margins. Embedded flash in microcontrollers has its own built-in test modes."}]}, {"type": "callout", "kind": "info", "title": "Focus of this course", "md": "From here on we concentrate on **SRAM** — the memories that MBIST tests in almost every chip, including the block RAM and LUT RAM of FPGAs."}]}], "quiz": {"questions": [{"id": "q-mp", "type": "multiple", "text": "What does an MBIST need for a dual-port memory? Select **all** correct answers.", "options": ["Run the memory test through each port.", "Test both ports active in the same clock.", "Respect the memory's rule for two writes to the same address.", "Test only port A — port B uses the same cells."], "correct": [0, 1, 2], "review": ["multi-port"]}, {"id": "q-rom", "type": "single", "text": "How is a ROM tested by BIST?", "options": ["Read every word and compact the data in a MISR; compare with the signature computed from the ROM file.", "Run a March test that writes 0s and 1s.", "Compare it with a second ROM on the chip.", "ROMs cannot have defects, so they are not tested."], "correct": [0], "review": ["rom"]}, {"id": "q-lut", "type": "single", "text": "In an FPGA, which memory has an **asynchronous** read (data in the same clock cycle)?", "options": ["LUT RAM (distributed RAM)", "Block RAM", "Both", "Neither"], "correct": [0], "review": ["fpga"]}, {"id": "q-lat", "type": "single", "text": "An MBIST tests a BRAM with one clock of read latency but compares the data in the same clock as the read. What happens?", "options": ["The comparison uses the wrong data: good memories fail or real faults are missed.", "Nothing — the BRAM adapts its latency.", "The test only runs slower.", "Only the first address is affected."], "correct": [0], "review": ["fpga"]}, {"id": "q-dram", "type": "single", "text": "Why must en value."}, {"title": "Stuck-at-0", "md": "Whatever is written, the cell stays **0** (e.g. a short to ground). A test must **write 1 and read 1** — the read returns 0."}, {"title": "Stuck-at-1", "md": "The cell is always **1**. Detected by **write 0, read 0**."}, {"title": "Up-transition fault", "md": "The cell can hold a 1 but **cannot make the 0 → 1 transition** (e.g. a weak write path). The test must first put a **0** in the cell, then write 1, then read: **w0, w1, r1**."}, {"title": "Down-transition fault", "md": "The cell cannot make the **1 → 0** transition. Detected by **w1, w0, r0**."}]}, {"type": "callout", "kind": "warning", "title": "Order matters already for one cell", "md": "A transition fault is invisible to *w1, r1* if the cell already held 1 — the failing transition never happened. The test must create the transition **on purpose**."}]}, {"id": "sof-drf", "title": "Stuck-open and data-retention faults", "blocks": [{"type": "tabs", "tabs": [{"label": "Stuck-open fault (SOF)", "md": "An **open** in the cell's access path (a broken contact to the word line or the access transistor): the cell can be neither written nor read. What does a read return? Many sense amplifiers simply keep their **last value** — so the read returns the data of the **previous read**.\n\nTo catch it, the test must read the cell when the expected value is **different** from what the sense amplifier read just before — e.g. read a 0 from one cell, then read a 1 from the faulty one."}, {"label": "Data-retention fault (DRF)", "md": "The cell accepts a value and returns it correctly — but **loses it after a while**, for example because one pull-up transistor is open and the node slowly leaks.\n\nA quick test passes. To catch it, the test **writes, waits** (e.g. tens to hundreds of milliseconds), then **reads** — for both 0 and 1. MBIST controllers therefore support a **pause** step."}]}, {"type": "table", "columns": ["Fault", "Behaviour", "Minimum sequence that detects it"], "rows": [["Stuck-at-0 / 1", "the cell always holds 0 / 1", "w1, r1 / w0, r0"], ["Transition ↑ / ↓", "0 → 1 / 1 → 0 fails", "w0, w1, r1 / w1, w0, r0"], ["Stuck-open", "the cell cannot be accessed; a read returns the previous read data", "reads in a row that expect **different** values"], ["Data retention", "the cell loses its value after some time", "w0, pause, r0 and w1, pause, r1"]], "caption": "Single-cell faults and how to catch them"}, {"type": "categorize", "prompt": "Practice: which fault explains the symptom?", "categories": [{"id": "saf", "label": "Stuck-at"}, {"id": "tf", "label": "Transition"}, {"id": "drf", "label": "Data retention"}], "items": [{"text": "reads 0 after any write", "category": "saf"}, {"text": "w1, r1 passes, but w0, w1, r1 fails", "category": "tf"}, {"text": "passes a fast test, fails after a 100 ms pause", "category": "drf"}, {"text": "reads 1 even right after w0", "category": "saf"}]}]}], "quiz": {"questions": [{"id": "q-blocks", "type": "multiple", "text": "Which blocks make up the reduced functional model of a memory? Select **all**.", "options": ["Address decoder", "Memory cell array", "Read / write logic", "Scan chain"], "correct": [0, 1, 2], "review": ["functional-model"]}, {"id": "q-map", "type": "single", "text": "A sense amplifier is broken and always outputs 0. To a memory test this looks like …", "options": ["stuck-at-0 faults of the cells in that column", "a data-retention fault", "a transition fault of one cell", "nothing — it cannot be detected"], "correct": [0], "review": ["functional-model"]}, {"id": "q-tf", "type": "single", "text": "Which sequence is guaranteed to detect an **up-transition** fault (0 → 1 fails)?", "options": ["w0, w1, r1", "w1, r1", "w1, w0, r0", "r1"], "correct": [0], "review": ["stuck-at"], "explain": "The cell must first be put in 0, so that w1 really makes the failing 0 → 1 transition."}, {"id": "q-tf2", "type": "truefalse", "text": "Writing 1 and reading 1 always detects an up-transition fault.", "options": ["True", "False"], "correct": [1], "shuffle": false, "review": ["stuck-at"], "explain": "If the cell already held 1, no 0 → 1 transition happens and the fault stays hidden."}, {"id": "q-sof", "type": "single", "text": "A cell has a stuck-open fault and the sense amplifier keeps its last value. What does a read of that cell return?", "options": ["The data of the previous read", "Always 0", "Always 1", "A random value every time"], "correct": [0], "review": ["sof-drf"]}, {"id": "q-drf", "type": "single", "text": "Why does a fast March test miss a data-retention fault?", "options": ["The cell keeps its value for a short time; only a pause between write and read reveals the loss.", "Retention faults only appear in ROMs.", "March tests never read the cells.", "Retention faults are address-decoder faults."], "correct": [0], "review": ["sof-drf"]}]}}, "topics/05-coupling.json": {"id": "coupling", "title": "Coupling faults", "duration": "30 min", "summary": "Cells are packed so tightly that one cell can disturb another. In a **coupling fault**, an operation on — or the state of — one cell (the **aggressor**) changes another cell (the **victim**). These faults are the main reason why memory tests write and read in specific **orders**.", "objectives": ["Explain aggressor and victim.", "Tell inversion, idempotent and state coupling faults apart and write their notation.", "Explain why a test must visit addresses in both directions and use several data backgrounds.", "Describe neighbourhood pattern-sensitive faults."], "subsections": [{"id": "aggressor-victim", "title": "Aggressor and victim", "blocks": [{"type": "text", "md": "Two neighbouring cells share wires and are separated by only a few nanometres. A defect — a resistive bridge, a leaky junction, too much capacitance between bit lines — can **couple** them:\n\n- the **aggressor** (*a*) is the cell that is written or holds a certain value;\n- the **victim** (*v*) is the cell whose value goes wrong because of it.\n\nThe notation is **⟨what happens to a ; what happens to v⟩**: ↑ is a 0 → 1 transition, ↓ is 1 → 0, ↕ means *inverted*, and 0 / 1 are values."}, {"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3NjAgMzYwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8ZGVmcz48bWFya2VyIGlkPSJjcC1yIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjYzAzOTJiIi8+PC9tYXJrZXI+PC9kZWZzPgogIDxyZWN0IHdpZHRoPSI3NjAiIGhlaWdodD0iMzYwIiByeD0iMTQiIGZpbGw9IiNmZmZmZmYiLz4KICA8ZyBkYXRhLXN0ZXA9IjEiIGRhdGEtdW50aWw9IjEiPjx0ZXh0IHg9IjM4MCIgeT0iNDAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTkiIGZvbnQtd2VpZ2h0PSI4MDAiIGZpbGw9IiMxZjRlNzkiPlR3byBjZWxsczogYWdncmVzc29yIGFuZCB2aWN0aW08L3RleHQ+PHRleHQgeD0iMzgwIiB5PSIzMzAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTYiIGZpbGw9IiMzNDQ5NWUiPnRoZSB0ZXN0IHdyaXRlcyAwIGludG8gYm90aCBjZWxsczwvdGV4dD48cmVjdCB4PSIxNTAiIHk9IjEyMCIgd2lkdGg9IjE1MCIgaGVpZ2h0PSIxMjAiIHJ4PSIxMiIgZmlsbD0iI2VlZjRmYiIgc3Ryb2tlPSIjMWY0ZTc5IiBzdHJva2Utd2lkdGg9IjMiLz48dGV4dCB4PSIyMjUiIHk9IjEwNiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxOCIgZm9udC13ZWlnaHQ9IjgwMCIgZmlsbD0iIzFmNGU3OSI+YWdncmVzc29yIGE8L3RleHQ+PHRleHQgeD0iMjI1IiB5PSIyMDAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iNTYiIGZvbnQtd2VpZ2h0PSI4MDAiIGZpbGw9IiMxZjRlNzkiPjA8L3RleHQ+PHJlY3QgeD0iNDYwIiB5PSIxMjAiIHdpZHRoPSIxNTAiIGhlaWdodD0iMTIwIiByeD0iMTIiIGZpbGw9IiNlZWY0ZmIiIHN0cm9rZT0iIzFmNGU3OSIgc3Ryb2tlLXdpZHRoPSIzIi8+PHRleHQgeD0iNTM1IiB5PSIxMDYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTgiIGZvbnQtd2VpZ2h0PSI4MDAiIGZpbGw9IiMxZjRlNzkiPnZpY3RpbSB2PC90ZXh0Pjx0ZXh0IHg9IjUzNSIgeT0iMjAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjU2IiBmb250LXdlaWdodD0iODAwIiBmaWxsPSIjMWY0ZTc5Ij4wPC90ZXh0PjwvZz4KICA8ZyBkYXRhLXN0ZXA9IjIiIGRhdGEtdW50aWw9IjIiPjx0ZXh0IHg9IjM4MCIgeT0iNDAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtc2l6ZT0iMTkiIGZvbnQtd2VpZ2h0PSI4MDAiIGZpbGw9IiMxZjRl er** the victim was written and **before** it is read — that needs a pass going **downwards**. This is why March tests contain both ⇑ and ⇓ elements."}, {"type": "categorize", "prompt": "Practice: which kind of coupling fault is it?", "categories": [{"id": "in", "label": "Inversion"}, {"id": "id", "label": "Idempotent"}, {"id": "st", "label": "State"}], "items": [{"text": "⟨↓ ; ↕⟩", "category": "in"}, {"text": "⟨↑ ; 1⟩", "category": "id"}, {"text": "⟨0 ; 1⟩", "category": "st"}, {"text": "a 1 → 0 write on a forces v to 0", "category": "id"}, {"text": "while a holds 0, v cannot hold 0", "category": "st"}]}]}, {"id": "inter-intra", "title": "Inter-word and intra-word coupling", "blocks": [{"type": "tabs", "tabs": [{"label": "Inter-word", "md": "Aggressor and victim are in **different words** (different addresses). The test can write and read them at different times, in any order it likes — March tests with a plain background (all 0s, then all 1s) are enough."}, {"label": "Intra-word", "md": "Aggressor and victim are **bits of the same word**. They are always written **at the same moment** — so if every bit gets the same value (0000 → 1111), the aggressor and victim always change together and many coupling faults stay hidden.\n\nThe fix: repeat the test with several **data backgrounds** in which the bits of a word differ. For an 8-bit word, for example: **0000 0000, 0101 0101, 0011 0011, 0000 1111** — log₂(8) + 1 = 4 backgrounds (plus their inverses, which March tests write anyway). Every pair of bits then sees both *equal* and *different* values."}]}, {"type": "callout", "kind": "info", "title": "Physical neighbours", "md": "Coupling happens between **physically** adjacent cells — on the same word line, the same bit-line pair, or side by side. Because of column multiplexing and address scrambling (Topic 2), these are often **not** neighbouring addresses or neighbouring bits."}]}, {"id": "npsf", "title": "Neighbourhood pattern-sensitive faults", "blocks": [{"type": "tex "NPSF type", "What goes wrong"], "rows": [["**Active** (dynamic)", "the victim changes when **one neighbour makes a transition** while the other neighbours hold a certain pattern"], ["**Passive**", "a certain pattern of the neighbours **prevents** the victim from changing"], ["**Static**", "a certain pattern of the neighbours **forces** the victim to a value"]], "caption": "Three kinds of NPSF"}, {"type": "callout", "kind": "warning", "title": "Expensive to test", "md": "Detecting NPSFs needs every relevant pattern around **every** cell, and the exact physical layout. Such tests are much longer than March tests and are used mainly for DRAM. For SRAM, MBIST relies on March tests, which catch some NPSFs along the way."}]}], "quiz": {"questions": [{"id": "q-av", "type": "single", "text": "In a coupling fault, which cell shows the wrong value?", "options": ["The victim", "The aggressor", "Both cells", "The cell with the lowest address"], "correct": [0], "review": ["aggressor-victim"]}, {"id": "q-kinds", "type": "match", "text": "Match the notation with the kind of coupling fault.", "categories": [{"id": "in", "label": "Inversion"}, {"id": "id", "label": "Idempotent"}, {"id": "st", "label": "State"}], "items": [{"text": "⟨↑ ; ↕⟩", "category": "in"}, {"text": "⟨↓ ; 0⟩", "category": "id"}, {"text": "⟨1 ; 1⟩", "category": "st"}, {"text": "⟨↓ ; ↕⟩", "category": "in"}], "review": ["cf-types"]}, {"id": "q-cfid", "type": "single", "text": "Which sequence detects the idempotent coupling fault ⟨↑ ; 0⟩ (aggressor a, victim v)?", "options": ["w1 to v, w0 to a, w1 to a, read v (expect 1)", "w0 to v, w1 to a, read v (expect 0)", "w1 to a, w1 to v, read a", "read v only"], "correct": [0], "review": ["aggressor-victim", "cf-types"], "explain": "v must hold the **opposite** value (1), a must make the **↑** transition, then v is read."}, {"id": "q-dir", "type": "single", "text": "Why do memory tests walk through the addresses both upwards and downwards?", "options": ["The aggressor can have a lower or a higher address than the victim.", "To make the test twice as long.", "Decoders only work in one direction.", "To refresh the memory."], "correct": [0], "review": ["cf-types"]}, {"id": "q-intra", "type": "single", "text": "Why does testing intra-word coupling faults need several data backgrounds?", "options": ["Bits of one word are written together; they must also get different values for the faults to show.", "Backgrounds make the test faster.", "Intra-word faults only appear in ROMs.", "Data backgrounds replace the address order."], "correct": [0], "review": ["inter-intra"]}, {"id": "q-npsf", "type": "single", "text": "How many cells does a type-1 neighbourhood contain (victim included)?", "options": ["5", "4", "9", "8"], "correct": [0], "review": ["npsf"]}]}}, "topics/06-decoder-rw.json": {"id": "decoder-rw", "title": "Address-decoder and read/write faults", "duration": "30 min", "summary": "Not every fault sits in a cell. The **address decoder** can select the wrong cell, and the **read and write circuits** can disturb a cell while they access it. This topic covers these faults and the operations that catch them.", "objectives": ["Describe the four address-decoder faults AF1–AF4 and the March condition that detects them.", "Tell RDF, DRDF and IRF apart and explain why a DRDF needs two reads.", "Explain write-disturb faults and how sense-amplifier and precharge faults appear to a test."], "subsections": [{"id": "address-faults", "title": "The four address-decoder faults", "blocks": [{"type": "text", "md": "The row and column decoders turn an address into **one** selected word. A defect in a decoder gate breaks this one-to-one link. Seen from outside, only four things can go wrong — the four **address-decoder faults (AF)**:"}, {"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3NjAgMzgwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8ZGVmcz48bWFya2VyIGlkPSJhZi1
