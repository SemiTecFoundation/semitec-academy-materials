dress 3 reads"], "rows": [["Initialise: write 0 to all addresses", "—", "—"], ["⇑ address 2: r0, w1 → cell 3 = 1", "0 ✓", "—"], ["⇑ address 3: r0 …", "—", "**1 ✗ detected**"]], "caption": "Going up, the write through address 2 is read back wrongly through address 3"}]}, {"id": "read-faults", "title": "Read-disturb faults: RDF, DRDF, IRF", "blocks": [{"type": "text", "md": "A read is not completely harmless. During a read the bit lines are connected to the cell; a weak cell (for example with a too-small pull-down transistor) can be **flipped by its own read**. Three cases are distinguished, depending on **what the read returns** and **what the cell holds afterwards**:"}, {"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3NjAgMzgwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KICA8ZGVmcz48bWFya2VyIGlkPSJhZi1hIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMzQ0OTVlIi8+PC9tYXJrZXI+CiAgPG1hcmtlciBpZD0iYWYtciIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iI2MwMzkyYiIvPjwvbWFya2VyPjwvZGVmcz4KICA8cmVjdCB3aWR0aD0iNzYwIiBoZWlnaHQ9IjM4MCIgcng9IjE0IiBmaWxsPSIjZmZmZmZmIi8+CiAgPGcgZGF0YS1zdGVwPSIxIiBkYXRhLXVudGlsPSIxIj48dGV4dCB4PSIzODAiIHk9IjM2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjE5IiBmb250LXdlaWdodD0iODAwIiBmaWxsPSIjMWY0ZTc5Ij5BIGdvb2QgcmVhZDwvdGV4dD48dGV4dCB4PSIzODAiIHk9IjM1MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxNiIgZmlsbD0iIzM0NDk1ZSI+dGhlIHJlYWQgcmV0dXJucyAwIGFuZCB0aGUgY2VsbCBzdGlsbCBob2xkcyAwPC90ZXh0Pjx0ZXh0IHg9IjE1MCIgeT0iMTEwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMzQ0OTVlIj5jZWxsIGJlZm9yZTwvdGV4dD48cmVjdCB4PSI5NSIgeT0iMTI1IiB3aWR0aD0iMTEwIiBoZWlnaHQ9IjExMCIgcng9IjEyIiBmaWxsPSIjZWVmNGZiIiBzdHJva2U9IiMxZjRlNzk "wrong", "one read"]], "caption": "Each fault exists for a cell holding 0 and for a cell holding 1"}, {"type": "categorize", "prompt": "Practice: can a single read of the cell detect the fault?", "categories": [{"id": "one", "label": "One read is enough"}, {"id": "two", "label": "Needs a second read"}], "items": [{"text": "RDF", "category": "one"}, {"text": "IRF", "category": "one"}, {"text": "DRDF", "category": "two"}, {"text": "Stuck-at fault", "category": "one"}]}]}, {"id": "write-sa", "title": "Write-disturb and sense-amplifier faults", "blocks": [{"type": "text", "md": "Writes and the shared read circuitry can fail too. These faults look different from cell faults because they depend on the **operation** or affect a **whole column**:"}, {"type": "table", "columns": ["Fault", "What goes wrong", "How a test sees it"], "rows": [["**WDF** — write disturb", "A **non-transition** write (w0 into a cell that holds 0) flips the cell to 1.", "Write the same value twice or write x into a cell already holding x, then read: **w0, r0**."], ["**Sense-amplifier fault**", "The sense amplifier of one column always decides 0 (or 1), or is too slow.", "Every cell of that **column** reads stuck at one value — looks like many stuck-at faults in one column."], ["**Precharge fault**", "A bit line is not fully precharged before a read.", "The read result depends on the **previous** access in that column; seen as wrong reads after a read of the opposite value."], ["**Write recovery fault**", "After a write, the bit lines are not restored in time.", "A read right **after a write** of the opposite value in the same column fails; needs at-speed back-to-back operations."]], "caption": "Faults in the write path and in the shared read circuits"}, {"type": "callout", "kind": "tip", "title": "Why this matters for MBIST", "md": "These faults explain several features of real March tests and MBIST hardware: **back-to-back reads** (DRDF), **non-transition writes** (WDF), **both address directions** turb fault (6)", "⟨0w0/1/−⟩", "writing the same 0 flips the cell"], ["Read destructive fault (6)", "⟨0r0/1/1⟩", "the read flips the cell and returns 1"], ["Deceptive RDF (6)", "⟨0r0/1/0⟩", "the read flips the cell but returns 0"], ["Incorrect read fault (6)", "⟨0r0/0/1⟩", "the read returns 1, the cell is fine"], ["State coupling (5)", "⟨1;1/0/−⟩", "while the aggressor holds 1, the victim cannot hold 1"], ["Disturb coupling (5)", "⟨0w1;0/1/−⟩", "an aggressor write 0 → 1 flips the victim"]], "caption": "Faults from Topics 4–6 written as fault primitives (each also exists with 0 and 1 swapped)"}, {"type": "callout", "kind": "key", "title": "Why this notation matters", "md": "Because S, F and R can only take a few values, the FPs can be **counted**: there are exactly **12 static single-cell** FPs and **36 static two-cell** FPs. A test can be checked against the complete list — this is how modern March tests are proven to detect *all* static faults."}]}, {"id": "static-dynamic", "title": "Static, dynamic and linked faults", "blocks": [{"type": "tabs", "tabs": [{"label": "Static", "md": "S contains **at most one operation** (0, 0w1, 0r0 …). Every fault in Topics 4–6 is static. Most defects behave like this, and classic March tests target them."}, {"label": "Dynamic", "md": "S contains **two or more operations in a row**, for example **⟨0w1r1/0/0⟩**: writing 1 and reading it *immediately* afterwards flips the cell back and returns 0. A slower sequence, or one with another operation in between, would not trigger it. Dynamic faults grow more important in small technology nodes and need **back-to-back operations at full speed**."}, {"label": "Linked", "md": "Two faults that **mask each other**. Example: writing 1 into aggressor *a1* flips victim *v* to 1, and writing 1 into aggressor *a2* flips it back to 0. A test that writes a1, then a2, then reads v sees the correct 0 — **both faults escape**. Special tests (e.g. March SL) order their operations so that linked faults cannot hide."}]}, {"type": "categorize", "prompt": "Practice: is the fault primitive static or dynamic?", "categories": [{"id": "s", "label": "Static (≤ 1 operation)"}, {"id": "d", "label": "Dynamic (≥ 2 operations)"}], "items": [{"text": "⟨0w1/0/−⟩", "category": "s"}, {"text": "⟨1r1/0/0⟩", "category": "s"}, {"text": "⟨0/1/−⟩", "category": "s"}, {"text": "⟨0w1r1/0/0⟩", "category": "d"}, {"text": "⟨1r1r1/0/0⟩", "category": "d"}]}]}, {"id": "detect", "title": "From faults to tests", "blocks": [{"type": "text", "md": "Every fault model asks for certain operations. Collect them in one table and you have the **requirements for a memory test**:"}, {"type": "table", "columns": ["Fault family", "The test must …", "Example operations"], "rows": [["Stuck-at (SAF)", "write and read **both values** in every cell", "w0 … r0, w1 … r1"], ["Transition (TF)", "make **both transitions**, then read", "w0, w1, r1 · w1, w0, r0"], ["Stuck-open (SOF)", "read **opposite values** one after the other", "r0 then r1 in the same column"], ["Data retention (DRF)", "**wait** after a write, then read", "w0, pause, r0 · w1, pause, r1"], ["Coupling (CF)", "operate on the aggressor, then read the victim — in **both address orders**", "⇑(r0, w1) ⇓(r1, w0)"], ["Address decoder (AF)", "⇑(r x … w x̄) **and** ⇓(r x̄ … w x)", "⇑(r0, w1) ⇓(r1, w0)"], ["RDF, IRF", "**read** every cell in both states", "r0, r1"], ["DRDF", "read **twice** in a row", "r0, r0"], ["WDF", "**write the value the cell already holds**, then read", "w0, w0, r0"], ["Intra-word CF", "use several **data backgrounds**", "log₂(B) + 1 backgrounds for B-bit words"]], "caption": "Test requirements collected from Topics 4–6"}, {"type": "callout", "kind": "info", "title": "Look at the last column", "md": "The same few patterns appear again and again: **sweep up, sweep down, read, write the opposite value**. A short sequence such as **⇕(w0) ⇑(r0, w1) ⇓(r1, w0) ⇕(r0)** already meets many of these requirements. That is a **March test** — the subject of the next training."}, {"type": "callout", "kind": "tip", "title": "And ECC?", "md": "MBIST finds faults **at test time**. Faults that appear later — wear-out, or bits flipped by radiation (**soft errors**) — are handled in operation by **error-correcting codes (ECC)**. How ECC works is part of the memory courses in *Digital Design*; how MBIST tests memories with ECC, and how both work together in the field, comes in the *MBIST Architecture* and *BIST in the Field* trainings."}, {"type": "flipcards", "md": "Check yourself before the quiz: say the meaning, then flip the card.", "cards": [{"front": "**Functional model**", "back": "Address decoder, cell array and read/write logic — the parts a fault model talks about."}, {"front": "**SAF / TF**", "back": "A cell stuck at one value / a cell that cannot make one transition."}, {"front": "**DRF**", "back": "Data retention fault: the cell loses its value after a while without access."}, {"front": "**Aggressor / victim**", "back": "In a coupling fault, the cell that acts / the cell that goes wrong."}, {"front": "**AF1–AF4**", "back": "No cell · cell never reached · several cells · several addresses."}, {"front": "**DRDF**", "back": "The read returns the right value but flips the cell — needs two reads."}, {"front": "**⟨S / F / R⟩**", "back": "Fault primitive: sensitizing sequence / faulty cell value / read result."}, {"front": "**Linked faults**", "back": "Two faults that mask each other so that a simple test misses both."}]}, {"type": "callout", "kind": "tip", "title": "Your certificate", "md": "Pass the quiz of this topic to complete the training and open your certificate."}]}], "quiz": {"questions": [{"id": "q-fpparts", "type": "single", "text": "In the fault primitive ⟨S / F / R⟩, what does **R** stand for?", "options": ["The value returned by the read in S (− if there is no read)", "The number of repetitions of S", "The row of the faulty cell", "The value the faulty cell holds afterwards"], "correct": [0], "review": [" /* Minimal Markdown renderer for training content.
   Supports: # ## ### headings, paragraphs, **bold**, *italic*, `code`, [link](url),
   - / * bullet lists, 1. numbered lists, > quotes, line breaks, and $sub$/^sup^-free
   plain text. HTML in the source is escaped (authors use blocks for rich content). */
(function () {
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inline(s) {
    s = esc(s);
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) {
      var safe = /^(https?:|mailto:|#)/.test(u) ? u : '#';
      var ext = /^https?:/.test(u) ? ' target="_blank" rel="noopener"' : '';
      return '<a href="' + safe + '"' + ext + '>' + t + '</a>';
    });
    s = s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + codes[+i] + '</code>'; });
    return s;
  }
  function render(src) {
    if (src == null) return '';
    var lines = String(src).replace(/\r/g, '').split('\n');
    var out = [], para = [], list = null;
    function flushPara() { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
    function flushList() { if (list) { out.push('<' + list.tag + '>' + list.items.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</' + list.tag + '>'); list = null; } }
    lines.forEach(function (line) {
      var m;
      if (/^\s*$/.test(line)) { flushPara(); flushList(); return; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flushPara(); flushList(); var h = Math.min(6, m[1].length + 2); out.push('<h' + h + '>' + inline(m[2]) + '</h' + h + '>'); return; }
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { flushPara(); if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; } list.items.push(m[1]); return; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; } list.items.push(m[1]); return; }
      if ((m = line.match(/^>\s?(.*)$/))) { flushPara(); flushList(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); return; }
      if (list) { list.items[list.items.length - 1] += ' ' + line.trim(); return; }
      para.push(line.trim());
    });
    flushPara(); flushList();
    return out.join('\n');
  }

})();

/* progress.js — learning progress: one JSON "state" object, saved through an adapter.
   Adapters:  local (browser localStorage) · none (preview, nothing saved) ·
              rest (GET/PUT a URL of your platform) · postMessage (parent page saves it) ·
              custom (your own {load, save} object in window.TRAINING_CONFIG.adapter).
   The state format is documented in INTEGRATION.md ("State format"). */
(function () {
  var T = window.T;
  var P = T.progress = { state: null, adapter: null, cfg: null, tr: null };
  var MAX_ATTEMPTS = 20;

  function now() { return new Date().toISOString(); }

    return {
      schema: 1, trainingId: tr.id, trainingVersion: tr.version || '', user: user || null,

      topics: {}, certificate: null

      Object.keys(s.passed || {}).forEach(function (id) {
        var p = s.passed[id];
        n.topics[id] = { visited: [], passed: true, score: p.score, bestScore: p.score, passedAt: p.date, attempts: [] };
      });
      if (s.name) n.certificate = { name: s.name };
      return n;

    if (user) s.user = Object.assign({}, s.user || {}, user);
    return s;

  A.local = {
    key: function () { return 'training:' + P.tr.id + ':progress' + (P.cfg.user && P.cfg.user.id ? ':' + P.cfg.user.id : ''); },
    load: function () {

  };
})();

    root.querySelectorAll('[data-step]').forEach(function (n) {
      var s = +n.getAttribute('data-step'), u = n.hasAttribute('data-until') ? +n.getAttribute('data-until') : Infinity;
      var hidden = s > k || k > u;
      n.classList.toggle('st-hidden', hidden);
      n.classList.toggle('st-current', !hidden && s === k);
      n.classList.toggle('st-past', !hidden && s < k);

  };

  /* ---------------- scroll and learn (sticky picture + scrolling steps) ---------------- */
  B.scrolly = function (b) {
    var host = el('div.svg-host');
    var sticky = el('div.scrolly-visual', null, [host]);
    var steps = el('div.scrolly-steps');
    var svgReady = T.inlineSVG(host, b.src).then(function () { T.setStep(host, 1); });
    (b.steps || []).forEach(function (s, i) {
      var st = el('div.scrolly-step', { 'data-k': i + 1 }, [
        el('div.step-num', { text: T.L('step') + ' ' + (i + 1) }), s.title ? el('h4', { text: s.title }) : null, mdDiv(s.md)]);
      steps.appendChild(st);
    });
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            steps.querySelectorAll('.scrolly-step').forEach(function (x) { x.classList.remove('active'); });
            e.target.classList.add('active');
            svgReady.then(function () { T.setStep(host, +e.target.getAttribute('data-k')); });
          }
        });
      }, { rootMargin: '-45% 0px -45% 0px' });
      setTimeout(function () { steps.querySelectorAll('.scrolly-step').forEach(function (x) { io.observe(x); }); }, 0);
    }

  };

  /* ---------------- step-by-step animation with controls ---------------- */
  B.stepper = function (b) {
    var host = el('div.svg-host'), cap = el('div.stepper-caption');
    var n = (b.steps || []).length, k = 1, timer = null;
    var counter = el('span.step-counter');
    var prev = el('button.btn.small', { type: 'button', text: '‹ ' + T.L('stepPrev') });
    var next = el('button.btn.small', { type: 'button', text: T.L('stepNext') + ' ›' });
    var play = el('button.btn.small.primary', { type: 'button', text: '▶ ' + T.L('play') });
    function show() {
      T.setStep(host, k);
      var s = b.steps[k - 1] || {};

    function stop() { clearInterval(timer); timer = null; play.textContent = '▶ ' + T.L('play'); }

    next.addEventListener('click', function () { stop(); if (k < n) { k++; show(); } });

    var media = el('div.media', null, [host]);

  };

  /* ---------------- drag & drop helpers (mouse, touch via tap-to-place, keyboard via arrows) ---------------- */
  T.dnd = {};
  /* Sortable list: items are <li> with data-id. Returns getter of current order. */
  T.dnd.sortable = function (list) {
    var dragging = null;
    function addArrows(li) {
      var up = el('button.mini', { type: 'button', 'aria-label': 'up', text: '▲' });

  };
  /* Buckets: chips (data-id) can be dragged or tap-placed into zones (data-zone). */
  T.dnd.buckets = function (root) {
    var selected = null;
    function select(chip) {
      root.querySelectorAll('.chip.selected').forEach(function (c) { c.classList.remove('selected'); });

    });
    return function () {
      var map = {};
      root.querySelectorAll('[data-zone]').forEach(function (z) {
        z.querySelectorAll('.chip').forEach(function (c) { map[c.dataset.id] = z.getAttribute('data-zone'); });
      });

    };
  };

  /* ---------------- learning activity: put in order ---------------- */
  B.sort = function (b) {
    var items = (b.items || []).map(function (t, i) { return { id: String(i), text: t }; });
    var shuffled = T.shuffle(items);
    if (shuffled.every(function (x, i) { return x.id === String(i); }) && items.length > 1) shuffled.reverse();
    var list = el('ol.sortlist', null, shuffled.map(function (it) { return el('li', { 'data-id': it.id }, [el('span.grip', { 'aria-hidden': 'true', text: '⋮⋮' }), el('span.li-text', { html: MD.inline(it.text) })]); }));
    var get = T.dnd.sortable(list);
    var msg = el('div.activity-msg');
    var btn = el('button.btn.primary', { type: 'button', text: T.L('check') });
    btn.addEventListener('click', function () {
      var ok = true;
      get().forEach(function (id, pos) {
        var li = list.querySelector('li[data-id="' + id + '"]'); var good = +id === pos;
        li.classList.toggle('good', good); li.classList.toggle('bad', !good); ok = ok && good;
      });
      msg.className = 'activity-msg ' + (ok ? 'good' : 'bad'); msg.textContent = ok ? T.L('wellDone') : T.L('tryAgain');
    });

    return el('div.activity', null, [b.prompt ? mdDiv(b.prompt, 'prompt') : null, el('p.hint', { text: T.L('orderHint') }), list, el('div.activity-bar', null, [btn, msg])]);
  };

  /* ---------------- learning activity: sort into groups ---------------- */
  B.categorize = function (b) {
    var root = el('div.buckets');
    var pool = el('div.pool', { 'data-zone': '' }, [el('div.zone-title', { text: T.L('unplaced') }), el('div.zone-items')]);
    T.shuffle((b.items || []).map(function (it, i) { return { id: String(i), it: it }; })).forEach(function (x) {
      pool.lastChild.appendChild(el('span.chip', { 'data-id': x.id, tabindex: 0, html: MD.inline(x.it.text) }));
    });
    var zones = el('div.zones', null, (b.categories || []).map(function (c) {
      return el('div.zone', { 'data-zone': c.id }, [el('div.zone-title', { text: c.label }), el('div.zone-items')]);
    }));
    root.appendChild(pool); root.appendChild(zones);
    var get = T.dnd.buckets(root);
    var msg = el('div.activity-msg');
    var btn = el('button.btn.primary', { type: 'button', text: T.L('check') });
    btn.addEventListener('click', function () {
      var map = get(), ok = true;
      (b.items || []).forEach(function (it, i) {
        var chip = root.querySelector('.chip[data-id="' + i + '"]'); var good = map[String(i)] === it.category;
        chip.classList.toggle('good', good); chip.classList.toggle('bad', !good); ok = ok && good;
      });
      msg.className = 'activity-msg ' + (ok ? 'good' : 'bad'); msg.textContent = ok ? T.L('wellDone') : T.L('tryAgain');
    });
    root.addEventListener('change', function () { root.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('good', 'bad'); }); msg.textContent = ''; });
    return el('div.activity', null, [b.prompt ? mdDiv(b.prompt, 'prompt') : null, el('p.hint', { text: T.L('matchHint') }), root, el('div.activity-bar', null, [btn, msg])]);
  };

  /* ---------------- code ---------------- */
  B.code = function (b) {
    var pre = el('pre', null, [el('code', { text: b.code || '' })]);
    var copy = el('button.btn.small.copy', { type: 'button', text: T.L('copy') });
    copy.addEventListener('click', function () {
      var done = function () { copy.textContent = T.L('copied'); setTimeout(function () { copy.textContent = T.L('copy'); }, 1200); };
      if (navigator.clipboard) navigator.clipboard.writeText(b.code || '').then(done, done); else done();
    });
    return figure(el('div.codebox', null, [el('div.code-head', null, [el('span.lang', { text: b.language || '' }), copy]), pre]), b.caption);
  };

  /* ---------------- table ---------------- */
  B.table = function (b) {
    var t = el('table.tbl', null, [
      el('thead', null, [el('tr', null, (b.columns || []).map(function (c) { return el('th', { html: MD.inline(c) }); }))]),
      el('tbody', null, (b.rows || []).map(function (r) { return el('tr', null, r.map(function (c) { return el('td', { html: MD.inline(String(c)) }); })); }))
    ]);
    return figure(el('div.tbl-wrap', null, [t]), b.caption);
  };

  /* ---------------- video (local file or embeddable URL) ---------------- */
  B.video = function (b) {
    var v = /\.(mp4|webm|ogg)$/i.test(b.src)
      ? el('video', { src: b.src, controls: true, preload: 'metadata' })
      : el('iframe', { src: b.src, title: b.caption || 'video', allowfullscreen: true, loading: 'lazy' });
    return figure(el('div.video-wrap', null, [v]), b.caption);
  };

  /* ---------------- zoom / pan lightbox ---------------- */
  T.zoom = (function () {
    var ov, stage, holder, scale = 1, tx = 0, ty = 0, drag = null;
    function apply() { holder.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
    function set(s) { scale = Math.max(0.5, Math.min(8, s)); apply(); }
    function build() {
      holder = el('div.zoom-holder');
      stage = el('div.zoom-stage', null, [holder]);
      var bar = el('div.zoom-bar', null, [
        el('button.btn.small', { type: 'button', text: '+', title: T.L('zoomIn'), onclick: function () { set(scale * 1.4); } }),
        el('button.btn.small', { type: 'button', text: '−', title: T.L('zoomOut'), onclick: function () { set(scale / 1.4); } }),
        el('button.btn.small', { type: 'button', text: T.L('zoomReset'), onclick: function () { scale = 1; tx = ty = 0; apply(); } }),
        el('button.btn.small', { type: 'button', text: '✕ ' + T.L('close'), onclick: close })]);
      ov = el('div.zoom-overlay', { role: 'dialog', 'aria-modal': 'true' }, [stage, bar]);
      stage.addEventListener('wheel', function (e) { e.preventDefault(); set(scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); }, { passive: false });
      stage.addEventListener('pointerdown', function (e) { drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.setPointerCapture(e.pointerId); });
      stage.addEventListener('pointermove', function (e) { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); } });
      stage.addEventListener('pointerup', function () { drag = null; });
      stage.addEventListener('dblclick', function () { set(scale < 2 ? 2.5 : 1); if (scale === 1) { tx = ty = 0; apply(); } });
      document.addEventListener('keydown', function (e) { if (ov.classList.contains('open') && e.key === 'Escape') close(); });
      document.body.appendChild(ov);
    }
    function open(node) {
      if (!node) return;
      if (!ov) build();
      T.clear(holder).appendChild(node);
      scale = 1; tx = ty = 0; apply();
      ov.classList.add('open'); document.body.classList.add('no-scroll');
    }
    function close() { ov.classList.remove('open'); document.body.classList.remove('no-scroll'); }
    return { open: open, close: close };
  })();
})();

  <script>
/* quiz.js — end-of-topic quiz: single / multiple choice, order, match (drag to groups), hotspot.
   Each question may list "review": [subsection ids] to send the student back to on a wrong answer. */
(function () {
  var T = window.T, el = T.el;

  function opts(q) { return (q.options || []).map(function (o, i) { return { i: i, text: typeof o === 'string' ? o : o.text }; }); }
  function sameSet(a, b) { a = a.map(String).sort(); b = b.map(String).sort(); return a.length === b.length && a.every(function (x, i) { return x === b[i]; }); }

  /* Each builder returns { node, get(), lock(), correct() } */
  var Q = {};
  Q.single = Q.truefalse = function (q, name) { return choice(q, name, false); };
  Q.multiple = function (q, name) { return choice(q, name, true); };
  function choice(q, name, multi) {
    var list = el('div.q-options');
    var o = q.shuffle === false ? opts(q) : T.shuffle(opts(q));
    o.forEach(function (op) {
      var input = el('input', { type: multi ? 'checkbox' : 'radio', name: name, value: op.i });
      list.appendChild(el('label.q-option', null, [input, el('span', { html: MD.inline(op.text) })]));
    });
    return {
      node: el('div', null, [el('p.hint', { text: multi ? T.L('selectMany') : T.L('selectOne') }), list]),
      get: function () { return [].filter.call(list.querySelectorAll('input'), function (x) { return x.checked; }).map(function (x) { return +x.value; }); },
      check: function (v) { return sameSet(v, q.correct || []); },
      lock: function () { list.querySelectorAll('input').forEach(function (x) { x.disabled = true; }); },
      showCorrect: function () { list.querySelectorAll('input').forEach(function (x) { if ((q.correct || []).indexOf(+x.value) >= 0) x.parentNode.classList.add('is-correct'); }); }
    };
  }
  Q.order = function (q) {
    var items = (q.items || []).map(function (t, i) { return { id: String(i), text: t }; });
    var s = T.shuffle(items); if (s.every(function (x, i) { return x.id === String(i); }) && s.length > 1) s.reverse();
    var list = el('ol.sortlist', null, s.map(function (it) { return el('li', { 'data-id': it.id }, [el('span.grip', { text: '⋮⋮' }), el('span.li-text', { html: MD.inline(it.text) })]); }));
    var get = T.dnd.sortable(list);
    return {
      node: el('div', null, [el('p.hint', { text: T.L('orderHint') }), list]),
      get: get,
      check: function (v) { return v.every(function (id, i) { return +id === i; }); },
      lock: function () { list.classList.add('locked'); list.querySelectorAll('li').forEach(function (li) { li.draggable = false; }); list.querySelectorAll('button').forEach(function (b) { b.disabled = true; }); },
      showCorrect: function () {}
    };
  };
  Q.match = function (q) {
    var root = el('div.buckets');
    var pool = el('div.pool', { 'data-zone': '' }, [el('div.zone-title', { text: T.L('unplaced') }), el('div.zone-items')]);
    T.shuffle((q.items || []).map(function (it, i) { return { id: String(i), it: it }; })).forEach(function (x) {
      pool.lastChild.appendChild(el('span.chip', { 'data-id': x.id, tabindex: 0, html: MD.inline(x.it.text) }));
    });
    root.appendChild(pool);
    root.appendChild(el('div.zones', null, (q.categories || []).map(function (c) {
      return el('div.zone', { 'data-zone': c.id }, [el('div.zone-title', { text: c.label }), el('div.zone-items')]);
    })));
    var get = T.dnd.buckets(root);
    return {
      node: el('div', null, [el('p.hint', { text: T.L('matchHint') }), root]),
      get: get,
      check: function (map) { return (q.items || []).every(function (it, i) { return map[String(i)] === it.category; }); },
      lock: function () { root.classList.add('locked'); root.querySelectorAll('.chip').forEach(function (c) { c.draggable = false; }); },
      showCorrect: function () {}
    };
  };
  Q.hotspot = function (q) {
    var stage = el('div.reveal-stage.hotspot-q');
    var pic = /\.svg$|^data:image\/svg/.test(q.src) ? el('div.svg-host') : el('img', { src: q.src, alt: '' });
    if (pic.tagName === 'DIV') T.inlineSVG(pic, q.src);
    stage.appendChild(pic);
    var chosen = {};
    (q.spots || []).forEach(function (s) {
      var b = el('button.spot.pick', { type: 'button', 'aria-pressed': 'false', 'aria-label': s.label || s.id, style: { left: s.x + '%', top: s.y + '%', width: s.w + '%', height: s.h + '%' } }, [s.label ? el('span.spot-num', { text: s.label }) : null]);
      b.addEventListener('click', function () {
        if (stage.classList.contains('locked')) return;
        chosen[s.id] = !chosen[s.id]; b.classList.toggle('chosen', chosen[s.id]); b.setAttribute('aria-pressed', chosen[s.id]);
      });
      b.dataset.id = s.id; stage.appendChild(b);
    });
    return {
      node: el('div', null, [el('p.hint', { text: T.L('hotspotHint') }), stage]),
      get: function () { return Object.keys(chosen).filter(function (k) { return chosen[k]; }); },
      check: function (v) { return sameSet(v, q.correct || []); },
      lock: function () { stage.classList.add('locked'); },
      showCorrect: function () { stage.querySelectorAll('.spot').forEach(function (b) { if ((q.correct || []).indexOf(b.dataset.id) >= 0) b.classList.add('is-correct'); }); }
    };
  };

  /* ---------------- quiz card ----------------
     opts: { topic, threshold, showCorrect: 'never'|'afterPass'|'always', passedBefore, onResult(result), onPass(score, bar), onReview(subId), subTitle(subId) } */
  T.renderQuiz = function (quiz, o) {
    var card = el('section.quiz', { id: 'quiz-' + o.topic.id });
    var thr = quiz.passThreshold != null ? quiz.passThreshold : o.threshold;
    function build(fromRetry) {
      T.clear(card);
      card.appendChild(el('div.quiz-head', null, [el('span.quiz-badge', { text: T.L('quiz') }), el('h3', { text: quiz.title || o.topic.title })]));
      card.appendChild(el('p.muted', { text: T.L('quizIntro', { threshold: Math.round(thr * 100) + '%' }) }));
      if (o.passedBefore && !fromRetry) {
        card.appendChild(el('div.quiz-result.pass', null, [el('strong', { text: T.L('passed') + ' — ' + T.L('score') + ': ' + Math.round(o.passedBefore.score * 100) + '%' })]));
      }
      var qs = (quiz.questions || []).map(function (q, i) {
        var w = (Q[q.type] || Q.single)(q, T.uid('q'));
        var box = el('div.question', { 'data-type': q.type }, [
          el('div.q-text', null, [el('span.q-num', { text: (i + 1) + '.' }), el('span', { html: MD.inline(q.text) })]),
          q.image ? el('img.q-img', { src: q.image, alt: '' }) : null,
          w.node, el('div.q-feedback')]);
        card.appendChild(box);
        return { q: q, w: w, box: box };
      });
      var result = el('div.quiz-result');
      var submit = el('button.btn.primary', { type: 'button', text: T.L('submit') });
      card.appendChild(el('div.quiz-bar', null, [submit]));
      card.appendChild(result);
      submit.addEventListener('click', function () {
        var good = 0, review = [];
        qs.forEach(function (x) {
          var ok = x.w.check(x.w.get());
          if (ok) good++; else (x.q.review || []).forEach(function (r) { if (review.indexOf(r) < 0) review.push(r); });
          x.box.classList.add(ok ? 'q-good' : 'q-bad');
          x.w.lock();
          var fb = x.box.querySelector('.q-feedback');
          fb.innerHTML = '<strong>' + (ok ? '✓ ' + T.L('correct') : '✗ ' + T.L('incorrect')) + '</strong>' + (ok && x.q.explain ? ' — ' + MD.inline(x.q.explain) : '');
          x.ok = ok;
        });
        var score = qs.length ? good / qs.length : 1, pass = score >= thr - 1e-9;
        if (o.onResult) o.onResult({ score: score, passed: pass, correct: good, total: qs.length, threshold: thr,
          wrong: qs.filter(function (x) { return !x.ok; }).map(function (x, k) { return x.q.id || ('q' + (qs.indexOf(x) + 1)); }) });
        submit.remove();
        result.className = 'quiz-result ' + (pass ? 'pass' : 'fail');
        result.appendChild(el('div.result-line', null, [el('strong', { text: (pass ? '✓ ' + T.L('passed') : '✗ ' + T.L('failed')) }), el('span', { text: '  ' + T.L('score') + ': ' + good + ' / ' + qs.length + ' (' + Math.round(score * 100) + '%)' })]));
        var show = o.showCorrect === 'always' || (o.showCorrect !== 'never' && pass);
        if (show) qs.forEach(function (x) {
          if (!x.ok) { x.w.showCorrect(); if (x.q.explain) x.box.querySelector('.q-feedback').innerHTML += ' — ' + MD.inline(x.q.explain); }
        });
        if (!pass && review.length) {
          result.appendChild(el('p', { text: T.L('review') }));
          result.appendChild(el('ul.review-list', null, review.map(function (r) {
            return el('li', null, [el('a', { href: '#', text: o.subTitle(r), onclick: function (e) { e.preventDefault(); o.onReview(r); } })]);
          })));

    } else if (k >= 0 && k < pages.length - 1) {
      var nx = pages[k + 1];
      pager.appendChild(el('a.btn.primary.pager-next', { href: href(t, nx) }, [el('small', { text: nx === 'quiz' ? T.L('finishTopic') : T.L('nextPart') }), el('span', { text: (nx === 'quiz' ? '✎ ' + T.L('toQuiz') : subTitle(t, nx)) + ' →' })]));
    } else { /* last part of a topic without quiz */
      if (passed(t)) pager.appendChild(nextTopicButton(i));
      else pager.appendChild(el('button.btn.primary.pager-next', { type: 'button', onclick: function () { P.complete(t.id); afterPass(t); renderToc(); updatePager(i, page); } },
        [el('small', { text: T.L('finishTopic') }), el('span', { text: '✓ ' + T.L('complete') })]));
    }
  }
  function nextTopicButton(i) {
    if (i + 1 < A.topics.length) return el('a.btn.primary.pager-next', { href: href(A.topics[i + 1]) }, [el('small', { text: T.L('next') }), el('span', { text: A.topics[i + 1].title + ' →' })]);
    if (A.cert && A.cert.enabled !== false) return el('a.btn.primary.pager-next', { href: '#certificate' }, [el('small', { text: T.L('allDone') }), el('span', { text: '★ ' + T.L('certificate') })]);
    return el('span.btn.disabled', { text: '✓ ' + T.L('allDone') });
  }

  function onQuizResult(t, r) {
    var was = passed(t);
    P.attempt(t.id, r);
    T.emit('quizAttempt', { topicId: t.id, score: r.score, passed: r.passed, correct: r.correct, total: r.total, wrong: r.wrong, threshold: r.threshold });
    if (r.passed && !was) afterPass(t);
    renderToc();
    updatePager(A.topics.indexOf(t), 'quiz');
    var old = A.main.querySelector('.review-note'); if (old) old.remove(); /* it described the previous attempt */
  }
  function afterPass(t) {
    T.emit('topicPassed', { topicId: t.id, score: P.topic(t.id).bestScore });
    if (allPassed() && !P.state.completedAt) {
      P.state.completedAt = new Date().toISOString();
      P.commit('completed');
      T.emit('completed', { completedAt: P.state.completedAt, averageScore: avgScore(), state: P.state });
    }
  }
  function avgScore() {
    var sc = A.topics.map(function (t) { var x = P.state.topics[t.id]; return x && x.bestScore != null ? x.bestScore : (preview() ? 1 : 0); });
    return sc.reduce(function (a, b) { return a + b; }, 0) / Math.max(1, sc.length);
  }

  function showLocked(i) {
    var main = T.clear(A.main);
    A.current = A.topics[i].id; A.page = null; renderToc();
    var firstOpen = 0; for (var k = 0; k < A.topics.length; k++) if (!passed(A.topics[k])) { firstOpen = k; break; }
    var ft = A.topics[firstOpen], q = hasQuiz(ft) ? 'quiz' : pagesOf(ft)[0];
    main.appendChild(el('div.locked-card', null, [
      el('div.lock-icon', { text: '🔒' }), el('h1', { text: A.topics[i].title }), el('p', { text: T.L('lockedMsg') }),
      el('a.btn.primary', { href: href(ft, q), text: T.L('goTo') + ': ' + ft.title })]));
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
  }

  /* ---------------- certificate page ---------------- */
  function showCertificate() {
    var main = T.clear(A.main); A.current = '#certificate'; A.page = null; renderToc();
    if (!A.cert || A.cert.enabled === false) { main.appendChild(el('p', { text: 'The author does not offer a certificate for this training.' })); return; }
    var cfg = A.cert;
    main.appendChild(el('header.topic-head', null, [el('h1', { text: T.L('certificate') })]));
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    if (preview()) return certificatePreview(main, cfg);
    if (!allPassed()) {
      main.appendChild(el('div.locked-card', null, [el('div.lock-icon', { text: '🔒' }), el('p', { text: T.L('certLocked') }),
        el('ul.remaining', null, A.topics.filter(function (t) { return !passed(t); }).map(function (t) { return el('li', null, [el('a', { href: href(t), text: t.title })]); }))]));
      return;
    }
    var user = A.cfg.user || {};
    var given = (P.state.certificate && P.state.certificate.name) || user.name || '';
    var locked = !!(A.cfg.lockName && user.name);
    var date = P.state.completedAt || A.topics.map(function (t) { return P.topic(t.id).passedAt || ''; }).sort().pop() || new Date().toISOString();
    var input = el('input.name-input', { type: 'text', value: locked ? user.name : given, placeholder: T.L('certName'), 'aria-label': T.L('certName'), readonly: locked });
    var out = el('div.cert-out');
    var printBtn = el('button.btn', { type: 'button', text: '⎙ ' + T.L('certPrint'), hidden: true, onclick: function () { window.print(); } });
    function make(silent) {
      var name = input.value.trim(); if (!name) { input.focus(); return; }
      var cert = T.renderCertificate(cfg, A.training, { name: name, score: avgScore(), date: date });
      T.clear(out).appendChild(cert);
      printBtn.hidden = false;
      var prev = P.state.certificate || {};
      if (prev.name !== name || prev.id !== cert.getAttribute('data-cert-id')) {
        P.state.certificate = { name: name, id: cert.getAttribute('data-cert-id'), issuedAt: prev.issuedAt && prev.name === name ? prev.issuedAt : new Date().toISOString(), score: avgScore() };
        P.commit('certificate');
        if (!silent) T.emit('certificate', P.state.certificate);
      }
    }
    main.appendChild(el('div.cert-form', null, [el('p', { text: T.L('certReady') }),
      el('div.cert-row', null, [input, el('button.btn.primary', { type: 'button', text: T.L('certCreate'), onclick: function () { make(false); } }), printBtn])]));
    main.appendChild(out);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') make(false); });
    if (given || locked) make(true);
  }

  /* Preview: sample certificate + live style controls (not saved — copy the JSON into certificate.json). */
  function certificatePreview(main, cfg) {
    if (cfg.kind === 'web') { main.appendChild(T.renderCertificate(cfg, A.training, { name: 'Sample Learner', date: new Date().toISOString(), score: 1 })); return; }
    var style = Object.assign({ design: 'classic', font: 'serif', orientation: 'landscape', accent: '#1f4e79', accent2: '#c9a227', paper: '#fffdf7', ink: '#1d2433' }, cfg.style || {});
    var name = el('input.name-input', { type: 'text', value: (A.cfg.user && A.cfg.user.name) || T.L('sampleName'), 'aria-label': T.L('certName') });
    function sel(key, values) {
      var s = el('select', null, values.map(function (v) { return el('option', { value: v, selected: style[key] === v, text: v }); }));
      s.addEventListener('change', function () { style[key] = s.value; draw(); });
      return el('label', null, [el('span', { text: T.L('cert_' + key) }), s]);
    }
    function color(key) {
      var c = el('input', { type: 'color', value: style[key] });
      c.addEventListener('input', function () { style[key] = c.value; draw(); });
      return el('label', null, [el('span', { text: T.L('cert_' + key) }), c]);
    }
    var json = el('pre.cert-json');
    var out = el('div.cert-out');
    function draw() {
      var c = Object.assign({}, cfg, { style: style });
      T.clear(out).appendChild(T.renderCertificate(c, A.training, { name: name.value.trim() || T.L('sampleName'), score: 0.95, date: new Date().toISOString() }));
      json.textContent = '"style": ' + JSON.stringify(style, null, 2);
    }
    name.addEventListener('input', draw);
    main.appendChild(el('div.callout.info.cert-preview-note', null, [el('div.callout-title', { text: T.L('certPreviewTitle') }), el('div.md', { html: MD.render(T.L('certPreviewNote')) })]));
    main.appendChild(el('div.cert-panel', null, [
      el('label.wide', null, [el('span', { text: T.L('certName') }), name]),
      sel('design', ['classic', 'modern', 'minimal']), sel('font', ['serif', 'sans']), sel('orientation', ['landscape', 'portrait']),
      color('accent'), color('accent2'), color('paper'), color('ink'),
      el('button.btn.small', { type: 'button', text: '⎙ ' + T.L('certPrint'), onclick: function () { window.print(); } })
    ]));
    main.appendChild(out);
    main.appendChild(el('details.cert-json-box', null, [el('summary', { text: T.L('certStyleJson') }), json]));
    draw();
  }

  /* ---------------- small UI helpers ---------------- */
  function toast(msg, kind) {
    var t = el('div.toast' + (kind ? '.' + kind : ''), { role: 'status', text: msg });
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 400); }, 4000);
  }

  /* ---------------- integration: messages from a parent page + JS API ---------------- */
  function listenToParent() {
    if (window.parent === window) return;
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.target !== 'semitec-training') return;
      if (A.cfg.parentOrigin && A.cfg.parentOrigin !== '*' && e.origin !== A.cfg.parentOrigin) return;
      if (d.type === 'navigate' && d.hash) location.hash = d.hash;
      else if (d.type === 'getState') T.emit('state', { state: P.state });
      else if (d.type === 'reset') { P.reset(); renderToc(); location.hash = href(A.topics[0]); }
    });
  }
  function exposeAPI() {
    window.TrainingAPI = {
      getState: function () { return JSON.parse(JSON.stringify(P.state)); },
      getConfig: function () { return Object.assign({}, A.cfg, { adapter: undefined, token: A.cfg.token ? '***' : '' }); },
      navigate: function (hash) { location.hash = hash; },
      reset: function () { P.reset(); renderToc(); location.hash = href(A.topics[0]); },
      flush: function () { return P.flush(); },
      on: T.on
    };
  }

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  document.addEventListener('DOMContentLoaded', boot);
})();

</script>
</body>
</html>
