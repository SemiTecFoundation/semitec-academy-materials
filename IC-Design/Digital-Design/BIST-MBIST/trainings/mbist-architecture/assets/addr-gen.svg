<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="820" height="430" rx="14" fill="#ffffff"/>
<text x="410.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">The address generator</text>
<rect x="280" y="80" width="220" height="100" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="390" y="125" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">address counter</text><text x="390" y="150" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e">n bits, up / down</text><path d="M150 100 H278" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><text x="145" y="105" text-anchor="end" font-size="15" font-weight="400" fill="#34495e">direction ⇑ / ⇓</text><path d="M150 130 H278" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><text x="145" y="135" text-anchor="end" font-size="15" font-weight="400" fill="#34495e">load first</text><path d="M150 160 H278" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><text x="145" y="165" text-anchor="end" font-size="15" font-weight="400" fill="#34495e">step</text><path d="M500 130 H640" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#mb)"/><text x="570" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6feb">address</text><rect x="645" y="95" width="150" height="70" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="720" y="136" text-anchor="middle" font-size="17" font-weight="800" fill="#8a6d00">memory</text><path d="M390 180 V218" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><rect x="290" y="220" width="200" height="50" rx="10" fill="#e8f6ee" stroke="#1e8449" stroke-width="2.5"/><text x="390" y="251" text-anchor="middle" font-size="16" font-weight="800" fill="#1e8449">= last address ?</text><path d="M290 245 H160" fill="none" stroke="#1e8449" stroke-width="2.5" marker-end="url(#mg)"/><text x="150" y="250" text-anchor="end" font-size="15" font-weight="700" fill="#1e8449">element done</text><g data-step="1" data-until="1"><text x="410" y="330" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">One counter serves every element. The controller sets the direction,</text><text x="410" y="356" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">loads the first address and steps the counter once per address.</text></g>
<g data-step="2" data-until="2"><text x="410" y="330" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">⇑ :  load 0,  count 0 → 1 → 2 → … → N−1</text><text x="410" y="360" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">the element is done after address N−1</text></g>
<g data-step="3" data-until="3"><text x="410" y="330" text-anchor="middle" font-size="18" font-weight="800" fill="#1f4e79">⇓ :  load N−1,  count N−1 → … → 1 → 0</text><text x="410" y="360" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">the element is done after address 0 — exactly the reverse order</text></g>
<g data-step="4" data-until="4"><rect x="250" y="300" width="40" height="40" rx="6" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="270" y="327" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">r</text><rect x="296" y="300" width="40" height="40" rx="6" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="316" y="327" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">r</text><rect x="342" y="300" width="40" height="40" rx="6" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="362" y="327" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">r</text><rect x="388" y="300" width="40" height="40" rx="6" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="408" y="327" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">r</text><rect x="434" y="300" width="40" height="40" rx="6" fill="#e3effc" stroke="#1f6feb" stroke-width="2"/><text x="454" y="327" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6feb">r</text><rect x="480" y="300" width="40" height="40" rx="6" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="500" y="327" text-anchor="middle" font-size="18" font-weight="800" fill="#6c4fb3">c</text><rect x="526" y="300" width="40" height="40" rx="6" fill="#efeafa" stroke="#6c4fb3" stroke-width="2"/><text x="546" y="327" text-anchor="middle" font-size="18" font-weight="800" fill="#6c4fb3">c</text><text x="342" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6feb">row bits</text><text x="504" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#6c4fb3">column bits</text><text x="410" y="400" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">Which bits count fastest decides the order: fast-column or fast-row.</text></g>
</svg>
