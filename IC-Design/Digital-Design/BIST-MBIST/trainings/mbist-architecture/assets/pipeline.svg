<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="360" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">A two-stage pipeline in the collar</text>
<text x="170" y="90" text-anchor="middle" font-size="16" font-weight="800" fill="#1f4e79">controller sends</text><rect x="60" y="105" width="220" height="90" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><path d="M282 150 H348" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><text x="460" y="90" text-anchor="middle" font-size="16" font-weight="800" fill="#1f4e79">memory accesses</text><rect x="350" y="105" width="220" height="90" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><path d="M572 150 H638" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><text x="750" y="90" text-anchor="middle" font-size="16" font-weight="800" fill="#1f4e79">collar compares</text><rect x="640" y="105" width="220" height="90" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><g data-step="1" data-until="1"><text x="450" y="240" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6feb">clock 1</text><text x="170" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#1f4e79">r5</text><text x="460" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#7a8a99">—</text><text x="750" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#7a8a99">—</text><text x="450" y="290" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">one new operation every clock — the memory never waits</text></g>
<g data-step="2" data-until="2"><text x="450" y="240" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6feb">clock 2</text><text x="170" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#1f4e79">r6</text><text x="460" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#1f4e79">r5</text><text x="750" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#7a8a99">—</text><text x="450" y="290" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">one new operation every clock — the memory never waits</text></g>
<g data-step="3" data-until="3"><text x="450" y="240" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6feb">clock 3</text><text x="170" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#1f4e79">r7</text><text x="460" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#1f4e79">r6</text><text x="750" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#1e8449">check 5</text><text x="450" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#1e8449">the data of address 5 is compared two clocks after its read was sent</text></g>
<g data-step="4" data-until="4"><text x="450" y="240" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6feb">clock 4</text><text x="170" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#1f4e79">r8</text><text x="460" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#1f4e79">r7</text><text x="750" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#1e8449">check 6</text><text x="450" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#1e8449">the data of address 6 is compared two clocks after its read was sent</text></g>
</svg>
