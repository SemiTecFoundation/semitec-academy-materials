<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Where to compare: local or central</text>
<text x="225" y="75" text-anchor="middle" font-size="16" font-weight="800" fill="#1f4e79">Local compare (in the collar)</text><text x="675" y="75" text-anchor="middle" font-size="16" font-weight="800" fill="#1f4e79">Central compare (in the controller)</text><line x1="450" y1="60" x2="450" y2="400" stroke="#dde3ea" stroke-width="2"/><rect x="40" y="140" width="140" height="80" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="110" y="185" text-anchor="middle" font-size="16" font-weight="800" fill="#1f4e79">controller</text><rect x="250" y="110" width="170" height="160" rx="10" fill="#fff4e8" stroke="#d35400" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="275" y="125" width="120" height="50" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="335.0" y="156.0" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00">SRAM</text><circle cx="335" cy="225" r="24" fill="#e8f6ee" stroke="#1e8449" stroke-width="3"/><text x="335" y="231" text-anchor="middle" font-size="16" font-weight="800" fill="#1e8449">=?</text><path d="M180 160 H234" stroke="#1f6feb" stroke-width="7" fill="none"/><polygon points="232,149 250,160 232,171" fill="#1f6feb"/><text x="214" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6feb">cmd + data</text><path d="M335 175 V199" fill="none" stroke="#1e8449" stroke-width="3" marker-end="url(#mg)"/><path d="M311 225 H182" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#mr)"/><text x="250" y="248" text-anchor="middle" font-size="14" font-weight="800" fill="#c0392b">1 fail bit</text><text x="225" y="330" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e">Only a fail bit travels back:</text><text x="225" y="352" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e">few wires, easy to share.</text><rect x="490" y="140" width="160" height="90" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="570" y="175" text-anchor="middle" font-size="16" font-weight="800" fill="#1f4e79">controller</text><circle cx="570" cy="205" r="18" fill="#e8f6ee" stroke="#1e8449" stroke-width="2.5"/><text x="570" y="211" text-anchor="middle" font-size="13" font-weight="800" fill="#1e8449">=?</text><rect x="720" y="110" width="150" height="160" rx="10" fill="#fff4e8" stroke="#d35400" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="735" y="135" width="120" height="60" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="795.0" y="171.0" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00">SRAM</text><path d="M650 160 H704" stroke="#1f6feb" stroke-width="7" fill="none"/><polygon points="702,149 720,160 702,171" fill="#1f6feb"/><path d="M795 195 V245 H670" stroke="#c0392b" stroke-width="10" fill="none"/><polygon points="672,231 652,245 672,259" fill="#c0392b"/><text x="700" y="292" text-anchor="middle" font-size="14" font-weight="800" fill="#c0392b">all read data, e.g. 128 bits</text><text x="675" y="330" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e">Every read bit travels back:</text><text x="675" y="352" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e">many long wires, hard at speed.</text></svg>
