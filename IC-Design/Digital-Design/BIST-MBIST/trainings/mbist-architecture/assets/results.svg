<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="860" height="420" rx="14" fill="#ffffff"/>
<text x="430.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">From a wrong read to a diagnosis</text>
<g data-step="1"><circle cx="100" cy="180" r="38" fill="#e8f6ee" stroke="#1e8449" stroke-width="3"/><text x="100" y="187" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">= ?</text><text x="100" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#1e8449">comparator</text><text x="100" y="268" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e">per bit</text></g>
<g data-step="2"><path d="M138 180 H198" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#mr)"/><rect x="200" y="145" width="150" height="70" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="2.5"/><text x="275" y="177" text-anchor="middle" font-size="17" font-weight="800" fill="#c0392b">fail flag</text><text x="275" y="200" text-anchor="middle" font-size="15" font-weight="400" fill="#c0392b">sticky</text><text x="275" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#34495e">go / no-go</text></g>
<g data-step="3"><path d="M350 180 H398" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#mr)"/><rect x="400" y="120" width="270" height="110" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><text x="535" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#8a6d00">diagnosis register</text><rect x="410" y="172" width="82" height="42" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="2"/><text x="451" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#34495e">element</text><rect x="496" y="172" width="82" height="42" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="2"/><text x="537" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#34495e">address</text><rect x="582" y="172" width="82" height="42" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="2"/><text x="623" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#34495e">bad bits</text></g>
<g data-step="4"><path d="M670 180 H718" fill="none" stroke="#6c4fb3" stroke-width="3" marker-end="url(#mp)"/><rect x="720" y="145" width="110" height="70" rx="10" fill="#efeafa" stroke="#6c4fb3" stroke-width="2.5"/><text x="775" y="186" text-anchor="middle" font-size="18" font-weight="800" fill="#6c4fb3">TAP</text><text x="430" y="320" text-anchor="middle" font-size="18" font-weight="800" fill="#6c4fb3">stop at the fail  →  shift the record out  →  resume the test</text><text x="430" y="352" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e">repeated for every fail → a failure bitmap of the memory</text></g>
</svg>
