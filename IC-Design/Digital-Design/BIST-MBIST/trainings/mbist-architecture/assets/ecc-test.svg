<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="880" height="500" rx="14" fill="#ffffff"/>
<text x="440.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Testing a memory with ECC</text>
<text x="55" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#34495e">data</text><rect x="110" y="170" width="130" height="60" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="175" y="207" text-anchor="middle" font-size="16" font-weight="800" fill="#1f4e79">encoder</text><rect x="320" y="140" width="240" height="120" rx="10" fill="#fdf7e3" stroke="#c9a227" stroke-width="2.5"/><line x1="480" y1="140" x2="480" y2="260" stroke="#c9a227" stroke-width="2"/><text x="400" y="206" text-anchor="middle" font-size="16" font-weight="800" fill="#8a6d00">data bits</text><text x="520" y="198" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00">check</text><text x="520" y="218" text-anchor="middle" font-size="15" font-weight="800" fill="#8a6d00">bits</text><rect x="640" y="170" width="130" height="60" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="705" y="207" text-anchor="middle" font-size="16" font-weight="800" fill="#1f4e79">decoder</text><text x="830" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#34495e">data</text><text x="830" y="218" text-anchor="middle" font-size="13" font-weight="400" fill="#34495e">+ error flag</text><path d="M80 200 H108" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><path d="M240 200 H318" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><path d="M560 200 H638" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><path d="M770 200 H800" fill="none" stroke="#34495e" stroke-width="2.5" marker-end="url(#mi)"/><rect x="320" y="330" width="240" height="60" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="440" y="367" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79">MBIST</text><g data-step="1" data-until="1"><path d="M80 200 H108" fill="none" stroke="#1f6feb" stroke-width="4" marker-end="url(#mb)"/><path d="M240 200 H318" fill="none" stroke="#1f6feb" stroke-width="4" marker-end="url(#mb)"/><path d="M560 200 H638" fill="none" stroke="#1f6feb" stroke-width="4" marker-end="url(#mb)"/><text x="440" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">Normal operation: one flipped bit is corrected by the decoder —</text><text x="440" y="466" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4e79">so a defective cell can stay hidden.</text></g>
<g data-step="2" data-until="2"><path d="M400 330 V262" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><path d="M520 262 V328" fill="none" stroke="#6c4fb3" stroke-width="4" marker-end="url(#mp)"/><text x="440" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#6c4fb3">MBIST bypasses the ECC and tests every bit:</text><text x="440" y="466" text-anchor="middle" font-size="16" font-weight="700" fill="#6c4fb3">data AND check bits.</text></g>
<g data-step="3" data-until="3"><path d="M360 330 V262" fill="none" stroke="#d35400" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#mo)"/><path d="M560 240 H600 V290 H705 V232" fill="none" stroke="#d35400" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#mo)"/><text x="440" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#d35400">Then test the ECC logic: store a code word with one flipped bit, read it</text><text x="440" y="456" text-anchor="middle" font-size="2" font-weight="400" fill="#34495e"></text></g>
<g data-step="3" data-until="3"><text x="440" y="466" text-anchor="middle" font-size="16" font-weight="700" fill="#d35400">through the decoder, check the corrected data and the error flag.</text></g>
</svg>
