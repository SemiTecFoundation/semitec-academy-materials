<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="900" height="330" rx="14" fill="#ffffff"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">The MBIST insertion flow</text>
<g data-step="1"><rect x="20" y="90" width="150" height="90" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="95" y="128" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79">Memory</text><text x="95" y="152" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79">library</text><text x="95" y="215" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">ports, size,</text><text x="95" y="236" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">scrambling</text></g>
<g data-step="2"><rect x="198" y="90" width="150" height="90" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="273" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79">Plan</text><text x="273" y="215" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">groups, algorithms,</text><text x="273" y="236" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">schedule</text><path d="M172 135 H196" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#mb)"/></g>
<g data-step="3"><rect x="376" y="90" width="150" height="90" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="451" y="128" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79">Generate</text><text x="451" y="152" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79">& insert</text><text x="451" y="215" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">controllers, collars</text><text x="451" y="236" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">into the netlist</text><path d="M350 135 H374" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#mb)"/></g>
<g data-step="4"><rect x="554" y="90" width="150" height="90" rx="10" fill="#e8f6ee" stroke="#1e8449" stroke-width="2.5"/><text x="629" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79">Verify</text><text x="629" y="215" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">simulation with</text><text x="629" y="236" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">faults, timing</text><path d="M528 135 H552" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#mb)"/></g>
<g data-step="5"><rect x="732" y="90" width="150" height="90" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="807" y="128" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79">Tester</text><text x="807" y="152" text-anchor="middle" font-size="17" font-weight="800" fill="#1f4e79">patterns</text><text x="807" y="215" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">configure, start,</text><text x="807" y="236" text-anchor="middle" font-size="14" font-weight="400" fill="#34495e">read via IJTAG</text><path d="M706 135 H730" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#mb)"/></g>
<g data-step="5"><text x="450" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#1e8449">from a list of memories to tester patterns — generated by DFT tools, not written by hand</text></g>
</svg>
