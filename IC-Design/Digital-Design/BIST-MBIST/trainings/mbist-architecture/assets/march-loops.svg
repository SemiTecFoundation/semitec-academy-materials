<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34495e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c4fb3"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e8449"/></marker></defs>
<rect width="820" height="470" rx="14" fill="#ffffff"/>
<text x="410.0" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">A March test as three nested loops</text>
<g data-step="1"><rect x="40" y="65" width="740" height="340" rx="10" fill="#f4f7fb" stroke="#1f4e79" stroke-width="2.5"/><text x="60" y="95" text-anchor="start" font-size="18" font-weight="800" fill="#1f4e79">for each element  e = 0 … E−1</text><text x="760" y="95" text-anchor="end" font-size="15" font-weight="400" fill="#7a8a99">element counter</text></g>
<g data-step="2"><rect x="80" y="115" width="660" height="230" rx="10" fill="#e3effc" stroke="#1f6feb" stroke-width="2.5"/><text x="100" y="145" text-anchor="start" font-size="17" font-weight="800" fill="#1f6feb">for each address a — order ⇑ or ⇓ of element e</text><text x="720" y="145" text-anchor="end" font-size="15" font-weight="400" fill="#7a8a99">address counter</text></g>
<g data-step="3"><rect x="120" y="165" width="580" height="150" rx="10" fill="#e8f6ee" stroke="#1e8449" stroke-width="2.5"/><text x="140" y="195" text-anchor="start" font-size="17" font-weight="800" fill="#1e8449">for each operation of element e</text><text x="680" y="195" text-anchor="end" font-size="15" font-weight="400" fill="#7a8a99">operation counter</text><text x="410" y="240" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e">write:  memory[a] ← data (D or D̄)</text><text x="410" y="272" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e">read:  compare memory[a] with the expected data → fail?</text></g>
<g data-step="4"><text x="410" y="440" text-anchor="middle" font-size="18" font-weight="800" fill="#6c4fb3">after the last element:  done = 1,  pass = no fail seen</text></g>
</svg>
