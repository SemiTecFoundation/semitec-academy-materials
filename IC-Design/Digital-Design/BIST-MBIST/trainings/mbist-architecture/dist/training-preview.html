<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training</title>
  <!-- Template engine styles (layout + components). Do not edit for look & feel: use a theme. -->
  <style>
/* app.css — layout and components of the training template.
   Colours, fonts and radii come from the theme (css/themes/*.css) through CSS variables.
   Two layouts: body.layout-sidebar (contents on the left) and body.layout-topbar (contents on top). */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--head-h) + var(--bar-h, 0px) + 12px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: var(--font-size, 16px)/1.6 var(--font); -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.25; color: var(--heading, var(--text)); }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }
.muted { color: var(--muted); }
.boot { padding: 4rem 2rem; text-align: center; color: var(--muted); }
.boot.error { color: var(--text); max-width: 640px; margin: auto; }
:root { --head-h: 60px; --toc-w: 300px; }

/* ---------------- buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; gap: .4em; padding: .55em 1.05em; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: background .15s, transform .1s, box-shadow .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: .3em .7em; font-size: .85em; }
.btn.danger { color: var(--bad); }
.btn.disabled, .btn:disabled { opacity: .55; cursor: not-allowed; }
.icon-btn { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 8px; border-radius: var(--radius-sm); }
.icon-btn:hover { background: var(--surface-2); }
.topbar-head .icon-btn:hover { background: color-mix(in srgb, currentColor 16%, transparent); }
.burger, .burger::before, .burger::after { display: block; width: 20px; height: 2px; background: currentColor; border-radius: 2px; position: relative; }
.burger::before, .burger::after { content: ""; position: absolute; left: 0; }
.burger::before { top: -6px; } .burger::after { top: 6px; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus, var(--accent)); outline-offset: 2px; }

/* ---------------- header ---------------- */
.topbar-head {
  position: fixed; inset: 0 0 auto 0; height: var(--head-h); z-index: 30;
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
  background: var(--head-bg, var(--surface)); color: var(--head-ink, var(--text));
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm);
}
.brand { flex: 1; min-width: 0; }
.brand-title { font-family: var(--font-head); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: .8em; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { display: flex; align-items: center; gap: 8px; }
.progress-track { width: 140px; height: 8px; border-radius: 99px; background: var(--track, rgba(127,127,127,.25)); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .6s ease; }
.progress-text { font-size: .85em; font-weight: 700; min-width: 3ch; }
.view-menu { position: relative; }
.view-menu > .btn { color: var(--text); }
.view-pop {
  position: absolute; right: 0; top: calc(100% + 8px); width: 230px; padding: 12px; display: grid; gap: 10px;
  background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
}
.view-pop label { display: grid; gap: 4px; font-size: .85em; color: var(--muted); }
.view-pop select { font: inherit; color: var(--text); padding: 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); }

/* ---------------- table of contents ---------------- */
.toc { background: var(--toc-bg, var(--surface)); color: var(--toc-ink, var(--text)); }
.toc-title { font-size: .75em; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 18px 6px; font-weight: 700; }
.toc-list, .toc-subs { list-style: none; margin: 0; padding: 0; }
.toc-row { display: flex; align-items: center; }
.toc-topic { flex: 1; display: flex; align-items: center; gap: 10px; padding: 9px 8px 9px 16px; color: inherit; text-decoration: none; font-weight: 600; min-width: 0; }
.toc-topic:hover { background: var(--surface-2); }
.toc-label { overflow: hidden; text-overflow: ellipsis; }
.toc-status {
  flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .78em; font-weight: 700;
  border: 2px solid var(--border); color: var(--muted); background: var(--surface);
}
.toc-status.done { background: var(--good); border-color: var(--good); color: #fff; }
.toc-status.locked { font-size: .7em; border-style: dashed; }
.toc-item.is-locked .toc-topic { color: var(--muted); }
.toc-item.current > .toc-row { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.toc-item.current .toc-status:not(.done) { border-color: var(--accent); color: var(--accent); }
.toc-exp { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 10px 14px; }
.chev { display: inline-block; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform .2s; }
.toc-item.expanded .toc-exp .chev, .acc-item.open .chev { transform: rotate(-135deg); }
.toc-subs { display: none; }
.toc-item.expanded .toc-subs { display: block; }
.toc-sub { display: block; padding: 6px 16px 6px 52px; color: var(--muted); text-decoration: none; font-size: .9em; border-left: 3px solid transparent; }
.toc-sub:hover { color: var(--text); background: var(--surface-2); }
.toc-sub.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.toc-cert .toc-status.done { background: var(--warn); border-color: var(--warn); }

/* ---------------- layout: SIDEBAR ---------------- */
.layout-sidebar .toc {
  position: fixed; top: var(--head-h); bottom: 0; left: 0; width: var(--toc-w); overflow-y: auto; z-index: 20;
  border-right: 1px solid var(--border); transition: transform .3s ease; padding-bottom: 40px;
}
.layout-sidebar .main { margin-left: var(--toc-w); transition: margin .3s ease; }
.layout-sidebar.toc-hidden .toc { transform: translateX(-100%); }
.layout-sidebar.toc-hidden .main { margin-left: 0; }

/* ---------------- layout: TOP BAR ---------------- */
.layout-topbar { --bar-h: 48px; }
.layout-topbar .toc {
  position: fixed; top: var(--head-h); left: 0; right: 0; height: var(--bar-h); z-index: 25;
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: transform .3s ease, opacity .3s;
}
.layout-topbar .toc-title { display: none; }
.layout-topbar .toc-list { display: flex; height: 100%; align-items: stretch; overflow-x: auto; padding: 0 8px; scrollbar-width: thin; }
.layout-topbar .toc-item { position: static; flex: none; }
.layout-topbar .toc-row { height: 100%; }
.layout-topbar .toc-topic { padding: 0 4px 0 10px; height: 100%; font-size: .9em; }
.layout-topbar .toc-label { max-width: 16ch; white-space: nowrap; }
.layout-topbar .toc-status { width: 22px; height: 22px; font-size: .7em; }
.layout-topbar .toc-exp { padding: 0 10px; height: 100%; }
.layout-topbar .toc-item.current > .toc-row { box-shadow: inset 0 -3px 0 var(--accent); }
.layout-topbar .toc-subs {
  position: fixed; top: calc(var(--head-h) + var(--bar-h)); min-width: 260px; max-width: 360px; z-index: 40;
  background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow); padding: 6px 0;
}
.layout-topbar .toc-sub { padding: 7px 16px; }
.layout-topbar .main { margin: 0 auto; max-width: 1060px; padding-top: calc(var(--head-h) + var(--bar-h) + 10px); }
.layout-topbar.toc-hidden { --bar-h: 0px; }
.layout-topbar.toc-hidden .toc { transform: translateY(-100%); opacity: 0; pointer-events: none; }

/* ---------------- main content ---------------- */
.main { padding: calc(var(--head-h) + 20px) clamp(16px, 4vw, 56px) 80px; outline: none; }
.main:focus, .main:focus-visible { outline: none; }
.layout-sidebar .main > * { max-width: 920px; margin-left: auto; margin-right: auto; }
.topic-head { padding: 18px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; animation: rise .45s ease both; }
.topic-kicker { text-transform: uppercase; letter-spacing: .08em; font-size: .75em; font-weight: 700; color: var(--accent); }
.topic-head h1 { font-size: clamp(1.6rem, 3vw, 2.3rem); margin: .2em 0 .3em; }
.topic-summary { font-size: 1.1em; color: var(--muted); margin: 0 0 .6em; }
.objectives { margin: .4em 0 1em; padding-left: 1.2em; }
.objectives li::marker { color: var(--accent); }
.subsection { padding: 22px 0 6px; animation: rise .5s ease both; scroll-margin-top: calc(var(--head-h) + var(--bar-h, 0px) + 12px); border-radius: var(--radius); }
.subsection h2 { font-size: 1.45rem; margin: .3em 0 .6em; }
.sub-num { color: var(--accent); font-weight: 700; margin-right: .2em; }
.subsection.flash { animation: flash 1.6s ease; }
.block { margin: 14px 0; }
.md p { margin: .55em 0; }
.md ul, .md ol { padding-left: 1.3em; }
.md blockquote { margin: .8em 0; padding: .4em 1em; border-left: 4px solid var(--accent); background: var(--surface-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes flash { 0%, 100% { background: transparent; } 20% { background: var(--accent-soft); box-shadow: 0 0 0 8px var(--accent-soft); } }
.topic-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); }
.locked-card { text-align: center; padding: 60px 20px; animation: rise .4s ease both; }
.lock-icon { font-size: 3rem; }
.remaining { display: inline-block; text-align: left; }

/* ---------------- callouts ---------------- */
.callout { padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); border-left: 5px solid var(--accent); background: var(--surface); }
.callout-title { font-weight: 700; margin-bottom: 2px; }
.callout.tip { border-left-color: var(--good); }
.callout.warning { border-left-color: var(--warn); }
.callout.key { border-left-color: var(--accent); background: var(--accent-soft); }
.callout .md p:first-child { margin-top: 0; } .callout .md p:last-child { margin-bottom: 0; }

/* ---------------- figures, zoom ---------------- */
.fig { margin: 0; }
.fig figcaption { font-size: .88em; color: var(--muted); text-align: center; margin-top: 6px; }
.media { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; text-align: center; overflow: hidden; }
.media img, .media svg, .svg-host svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.svg-host svg { width: 100%; max-height: 460px; }
.media.zoomable { cursor: zoom-in; transition: box-shadow .2s, transform .2s; }
.media.zoomable:hover { box-shadow: var(--shadow); }
.media.zoomable::after { content: "⤢"; position: absolute; right: 10px; top: 8px; font-size: 1.1em; color: var(--muted); opacity: .7; }
.media-bar { display: flex; justify-content: center; margin-top: 6px; }
.svg-host.paused * { animation-play-state: paused !important; }
.zoom-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(10,14,20,.88); display: none; }
.zoom-overlay.open { display: block; animation: fadein .2s ease; }
.zoom-stage { position: absolute; inset: 0 0 60px 0; display: grid; place-items: center; overflow: hidden; cursor: grab; touch-action: none; }
.zoom-holder { transform-origin: center center; max-width: 92vw; max-height: 82vh; transition: transform .08s linear; background: #fff; border-radius: 6px; padding: 8px; }
.zoom-holder img, .zoom-holder svg { max-width: 88vw; max-height: 78vh; width: auto; height: auto; display: block; }
.zoom-holder img { width: min(88vw, 1400px); height: auto; object-fit: contain; }
.zoom-holder svg { width: min(88vw, 1400px); }
.zoom-bar { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; gap: 8px; justify-content: center; }
@keyframes fadein { from { opacity: 0; } }

/* ---------------- compare slider ---------------- */
.compare { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: #fff; --pos: 50%; }
.compare > img, .cmp-top img { display: block; width: 100%; height: auto; }
.cmp-top { position: absolute; inset: 0; }
.cmp-line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 3px; background: var(--accent); transform: translateX(-50%); pointer-events: none; }
.cmp-line::after { content: "⇆"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: var(--accent); color: var(--accent-ink); border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center; }
.cmp-range { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.cmp-label { position: absolute; top: 8px; font-size: .75em; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff; pointer-events: none; }
.cmp-label.l { left: 8px; } .cmp-label.r { right: 8px; }

/* ---------------- accordion ---------------- */
.accordion { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.acc-item + .acc-item { border-top: 1px solid var(--border); }
.acc-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 16px; background: transparent; border: 0; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; }
.acc-head:hover { background: var(--surface-2); }
.acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.acc-body > .content { overflow: hidden; padding: 0 16px; }
.acc-item.open .acc-body { grid-template-rows: 1fr; }
.acc-item.open .acc-body > .content { padding-bottom: 12px; }

/* ---------------- tabs ---------------- */
.tabs { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.tab-bar { display: flex; gap: 2px; background: var(--surface-2); padding: 6px 6px 0; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 9px 16px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: var(--radius-sm) var(--radius-sm) 0 0; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.tab-panel { padding: 6px 16px 14px; animation: fadein .25s ease; }

/* ---------------- flip cards ---------------- */
.flipgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.flipcard { perspective: 900px; border: 0; padding: 0; background: transparent; cursor: pointer; min-height: 150px; font: inherit; color: inherit; text-align: center; }
.flip-inner { position: relative; width: 100%; height: 100%; min-height: 150px; transition: transform .55s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.flipcard.flipped .flip-inner { transform: rotateY(180deg); }
.flip-front, .flip-back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius); padding: 14px; display: grid; place-items: center; border: 1px solid var(--border); }
.flip-front { background: var(--surface); font-weight: 700; font-size: 1.05em; box-shadow: var(--shadow-sm); }
.flip-back { background: var(--accent); color: var(--accent-ink); transform: rotateY(180deg); font-size: .92em; }
.flip-front p, .flip-back p { margin: 0; }

/* ---------------- reveal / hotspots ---------------- */
.reveal { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
.reveal.side { grid-template-columns: minmax(0, 3fr) minmax(200px, 2fr); }
.reveal-stage { position: relative; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
.reveal-stage > img, .reveal-stage > .svg-host { border-radius: var(--radius); overflow: hidden; }
.reveal-stage img, .reveal-stage .svg-host svg { display: block; width: 100%; height: auto; max-height: none; }
.reveal-panel { min-height: 92px; }
.spot { position: absolute; border: 2px dashed var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; cursor: pointer; padding: 0; transition: background .15s, transform .15s; }
.spot:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.spot.active { border-style: solid; background: color-mix(in srgb, var(--accent) 25%, transparent); }
.spot.seen:not(.active) { border-color: var(--good); }
.spot-num { position: absolute; top: -11px; left: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: .75em; font-weight: 700; display: grid; place-items: center; animation: pulse 2s infinite; }
.spot.seen .spot-num { animation: none; background: var(--good); }
.spot.badge-tr .spot-num { left: auto; right: -11px; }
.spot.badge-bl .spot-num { top: auto; bottom: -11px; }
.spot.badge-br .spot-num { top: auto; bottom: -11px; left: auto; right: -11px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.reveal-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; min-height: 120px; animation: fadein .25s; }
.reveal-panel h4 { margin: .2em 0 .4em; color: var(--accent); }
.spot.pick { border-style: dotted; background: transparent; }
.spot.pick:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.spot.pick.chosen { background: color-mix(in srgb, var(--accent) 35%, transparent); border-style: solid; }
.spot.is-correct { border-color: var(--good) !important; box-shadow: 0 0 0 3px var(--good); }

/* ---------------- step animations (scrolly + stepper) ---------------- */
.svg-host [data-step] { transition: opacity .5s ease, transform .5s ease, filter .3s; }
.svg-host .st-hidden { opacity: 0; }
.svg-host .st-past { opacity: .55; }
.svg-host .st-current { opacity: 1; filter: drop-shadow(0 0 5px var(--accent)); }
.scrolly { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.scrolly-visual .svg-host svg { max-height: calc(100vh - var(--head-h) - var(--bar-h, 0px) - 70px); width: 100%; }
.scrolly-step { font-size: .95em; }
.scrolly-visual { position: sticky; top: calc(var(--head-h) + var(--bar-h, 0px) + 20px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.scrolly-steps { padding: 10vh 0 30vh; }
.scrolly-step { min-height: 46vh; padding: 16px 18px; margin-bottom: 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); opacity: .45; transition: opacity .3s, box-shadow .3s, border-color .3s; }
.scrolly-step.active { opacity: 1; border-color: var(--accent); box-shadow: var(--shadow); }
.step-num { font-size: .75em; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--accent); }
.scrolly-step h4 { margin: .2em 0; }
.stepper .media { padding: 14px; }
.stepper-caption { min-height: 3.2em; padding: 10px 4px 4px; }
.stepper-bar { display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; }
.stepper .media:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.step-counter { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------------- activities: sort and categorize ---------------- */
.activity { border: 1px dashed var(--accent); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); }
.hint { font-size: .85em; color: var(--muted); margin: .2em 0 .6em; }
.prompt p { margin-top: 0; font-weight: 600; }
.sortlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; counter-reset: s; }
.sortlist li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: grab; transition: box-shadow .15s, background .2s; counter-increment: s; }
.sortlist li::before { content: counter(s); font-weight: 700; color: var(--accent); min-width: 1.2em; }
.sortlist li.dragging { opacity: .5; box-shadow: var(--shadow); }
.sortlist li .li-text { flex: 1; }
.sortlist.locked li { cursor: default; }
.grip { color: var(--muted); letter-spacing: -2px; }
.arrows { display: flex; gap: 2px; }
.mini { border: 1px solid var(--border); background: var(--surface); border-radius: 4px; cursor: pointer; font-size: .7em; padding: 2px 6px; color: var(--muted); }
.good { border-color: var(--good) !important; background: color-mix(in srgb, var(--good) 14%, var(--surface)) !important; }
.bad { border-color: var(--bad) !important; background: color-mix(in srgb, var(--bad) 12%, var(--surface)) !important; }
.activity-bar, .quiz-bar { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.quiz-bar.center { justify-content: center; margin-top: 30px; }
.activity-msg { font-weight: 700; }
.activity-msg.good, .activity-msg.bad { background: none !important; border: 0; }
.activity-msg.good { color: var(--good); } .activity-msg.bad { color: var(--bad); }
.buckets { display: grid; gap: 12px; }
.pool, .zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 8px 10px; min-height: 64px; transition: border-color .15s, background .15s; }
.zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.zone { background: var(--surface-2); cursor: pointer; }
.zone.over { border-color: var(--accent); background: var(--accent-soft); }
.zone-title { font-size: .8em; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
.zone-items { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.chip { display: inline-block; padding: 6px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); cursor: grab; font-size: .92em; box-shadow: var(--shadow-sm); user-select: none; transition: transform .12s; }
.chip:hover { transform: translateY(-1px); }
.chip.selected { outline: 3px solid var(--accent); }
.buckets.locked .chip { cursor: default; }

/* ---------------- code, table, video ---------------- */
.codebox { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--code-bg, #0f1720); }
.code-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: rgba(255,255,255,.06); color: #c9d4e0; font-size: .8em; }
.codebox pre { margin: 0; padding: 14px 16px; overflow-x: auto; color: var(--code-ink, #e6edf3); font: .88em/1.55 var(--font-mono); }
.codebox code { background: none; padding: 0; color: inherit; }
.copy { background: transparent; color: #c9d4e0; border-color: rgba(255,255,255,.2); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; font-size: .94em; }
.tbl th, .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.tbl th { background: var(--surface-2); font-weight: 700; }
.video-wrap { position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden; background: #000; }
.video-wrap video, .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* ---------------- quiz ---------------- */
.quiz { margin-top: 36px; padding: 22px clamp(14px, 3vw, 28px); border-radius: var(--radius); background: var(--quiz-bg, var(--surface)); border: 2px solid var(--accent); box-shadow: var(--shadow); scroll-margin-top: calc(var(--head-h) + var(--bar-h, 0px) + 12px); }
.quiz-head { display: flex; align-items: center; gap: 12px; }
.quiz-head h3 { margin: 0; font-size: 1.3rem; }
.quiz-badge { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: .75em; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; }
.question { margin: 18px 0; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); transition: border-color .2s, background .2s; }
.q-text { font-weight: 600; display: flex; gap: 8px; margin-bottom: 4px; }
.q-num { color: var(--accent); }
.q-img { max-width: 100%; border-radius: var(--radius-sm); margin: 6px 0; }
.q-options { display: grid; gap: 8px; }
.q-option { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; background: var(--surface-2); transition: border-color .15s, background .15s; }
.q-option:hover { border-color: var(--accent); }
.q-option input { margin-top: .3em; accent-color: var(--accent); }
.q-option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.q-option.is-correct { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.question.q-good { border-color: var(--good); }
.question.q-bad { border-color: var(--bad); }
.q-feedback:empty { display: none; }
.q-feedback { margin-top: 10px; font-size: .92em; }
.q-good .q-feedback strong { color: var(--good); } .q-bad .q-feedback strong { color: var(--bad); }
.quiz-result { margin-top: 12px; padding: 0; border-radius: var(--radius); }
.quiz-result.pass, .quiz-result.fail { padding: 14px 16px; animation: rise .35s ease both; }
.quiz-result.pass { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border: 1px solid var(--good); }
.quiz-result.fail { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); border: 1px solid var(--bad); }
.result-line { font-size: 1.05em; }
.review-list a { font-weight: 600; }

/* ---------------- certificate page controls ---------------- */
.cert-form { margin: 18px 0; }
.cert-row { display: flex; flex-wrap: wrap; gap: 10px; }
.name-input { flex: 1; min-width: 220px; font: inherit; padding: .55em .8em; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.cert-out { margin-top: 20px; overflow-x: auto; }
.load-error { color: var(--bad); }

/* ---------------- paging: one subsection per page ---------------- */
.mode-badge { display: inline-block; margin-left: 10px; padding: 1px 8px; border-radius: 99px; font-size: .62em; letter-spacing: .08em; text-transform: uppercase; vertical-align: middle; background: var(--warn); color: #1d1d1d; }
.view-note { margin: 0; font-size: .8em; color: var(--muted); }
.topic-head.compact { padding: 10px 0 6px; border-bottom: 0; margin-bottom: 0; }
.topic-title { font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; color: var(--heading, var(--text)); }
.page-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 4px; padding: 0 0 14px; border-bottom: 1px solid var(--border); counter-reset: none; }
.page-step { display: inline-flex; align-items: center; gap: 7px; max-width: 230px; padding: 4px 12px 4px 4px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); text-decoration: none; font-size: .85em; transition: border-color .15s, background .15s; }
.page-step:hover { border-color: var(--accent); color: var(--text); }
.page-step .dot { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .85em; background: var(--surface-2); color: var(--muted); }
.page-step .step-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-step.visited .dot { background: color-mix(in srgb, var(--good) 22%, var(--surface)); color: var(--good); }
.page-step.current { border-color: var(--accent); background: var(--accent-soft); color: var(--text); font-weight: 600; }
.page-step.current .dot { background: var(--accent); color: var(--accent-ink); }
.page-step.is-quiz .dot { font-size: .8em; }
.page-steps:has(.page-step:nth-child(6)) .page-step:not(.current) .step-label { display: none; }
.page-steps:has(.page-step:nth-child(6)) .page-step:not(.current) { padding-right: 4px; }
.review-note { margin: 14px 0 0; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); }
.review-note .review-list { margin: 6px 0 10px; }
.review-note.on-list { border-width: 2px; }
.pager { display: flex; justify-content: space-between; align-items: stretch; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); }
.pager .btn { flex-direction: column; align-items: flex-start; gap: 0; max-width: 48%; padding: .55em 1.1em; }
.pager .btn small { font-size: .72em; font-weight: 600; opacity: .75; text-transform: uppercase; letter-spacing: .05em; }
.pager .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.pager .pager-next { align-items: flex-end; margin-left: auto; text-align: right; }
.toc-sub.visited::after { content: " ✓"; color: var(--good); font-size: .85em; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200; max-width: min(560px, 92vw); padding: 10px 16px; border-radius: var(--radius); background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow); animation: rise .3s ease both; transition: opacity .4s; }
.toast.bad { border-color: var(--bad); border-left: 5px solid var(--bad); }
.toast.out { opacity: 0; }

/* ---------------- certificate preview controls ---------------- */
.cert-panel { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin: 16px 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.cert-panel label { display: grid; gap: 4px; font-size: .82em; color: var(--muted); }
.cert-panel label.wide { flex: 1 1 100%; }
.cert-panel select { font: inherit; color: var(--text); padding: 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); }
.cert-panel input[type=color] { width: 48px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); background: none; cursor: pointer; }
.cert-json-box { margin-top: 18px; }
.cert-json-box summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.cert-json { background: var(--code-bg); color: var(--code-ink); padding: 12px 16px; border-radius: var(--radius); font: .85em/1.5 var(--font-mono); overflow-x: auto; }

/* ---------------- responsive ---------------- */
.scrim { display: none; }
@media (max-width: 860px) {
  :root { --toc-w: 290px; }
  .progress-track { width: 70px; }
  .brand-sub { display: none; }
  .layout-sidebar .main { margin-left: 0 !important; }
  .layout-sidebar .toc { transform: translateX(-100%); box-shadow: var(--shadow); }
  .layout-sidebar.toc-open .toc { transform: none; }
  .layout-sidebar.toc-open .scrim { display: block; position: fixed; inset: var(--head-h) 0 0 0; background: rgba(0,0,0,.35); z-index: 15; }
  .reveal, .scrolly { grid-template-columns: 1fr; }
  .scrolly-visual { top: calc(var(--head-h) + var(--bar-h, 0px)); z-index: 2; }
  .scrolly-step { min-height: 30vh; }
  .page-step:not(.current) .step-label { display: none; }
  .page-step:not(.current) { padding-right: 4px; }
  .pager .btn { max-width: 100%; }
  .pager { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ---------------- print: only the certificate ---------------- */
@media print {
  body { background: #fff !important; }
  .topbar-head, .toc, .scrim, .toast, .main > :not(.cert-out) { display: none !important; }
  .main, .layout-sidebar .main, .layout-topbar .main { margin: 0 !important; padding: 0 !important; max-width: none !important; }
  .main > .cert-out { margin: 0 !important; max-width: none !important; overflow: visible; }
}

  <style>
/* certificate.css — completion certificate.

.certificate {
  --cert-accent: #1f4e79;
  --cert-accent2: #c9a227;
  --cert-paper: #fffdf7;
  --cert-ink: #1d2433;
  position: relative;
  width: 100%;
  max-width: 1000px;
  aspect-ratio: 297 / 210;
  margin: 0 auto;
  background: var(--cert-paper);
  color: var(--cert-ink);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .18);
  overflow: hidden;
  container-type: inline-size;
}
.certificate.portrait { aspect-ratio: 210 / 297; max-width: 720px; }
.certificate.font-serif { font-family: "Georgia", "Cambria", "Times New Roman", serif; }
.certificate.font-sans { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

.cert-frame {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  padding: 6cqw 8cqw;
  gap: 1.3cqw;
}
.cert-top { display: flex; align-items: center; gap: 1.6cqw; margin-bottom: .6cqw; }
.cert-logo { height: 6cqw; width: auto; }
.cert-logotext {
  width: 6cqw; height: 6cqw; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--cert-accent); color: var(--cert-paper);
  font-weight: 700; font-size: 2cqw; letter-spacing: .05em;
}
.cert-issuer { font-size: 1.6cqw; letter-spacing: .18em; text-transform: uppercase; color: var(--cert-accent); font-weight: 600; }
.cert-title { font-size: 4.6cqw; line-height: 1.1; color: var(--cert-accent); font-weight: 700; letter-spacing: .02em; }
.cert-subtitle { font-size: 1.6cqw; opacity: .8; }
.cert-presented { margin-top: 1.4cqw; font-size: 1.6cqw; font-style: italic; opacity: .85; }
.cert-name {
  font-size: 5cqw; line-height: 1.15; font-weight: 700;
  padding: 0 3cqw .6cqw; border-bottom: .25cqw solid var(--cert-accent2);
  min-width: 50%;
}
.cert-body { font-size: 1.8cqw; max-width: 75%; line-height: 1.45; }
.cert-body strong { color: var(--cert-accent); }
.cert-topics { font-size: 1.2cqw; max-width: 64%; opacity: .75; line-height: 1.5; }
.cert-signs { display: flex; gap: 8cqw; margin-top: 2.4cqw; justify-content: center; flex-wrap: wrap; }
.cert-sign { min-width: 18cqw; }
.sign-line { border-top: .15cqw solid currentColor; margin-bottom: .6cqw; opacity: .7; }
.sign-name { font-size: 1.6cqw; font-weight: 600; }
.sign-role { font-size: 1.25cqw; opacity: .7; }
.cert-foot {
  position: absolute; left: 6cqw; right: 6cqw; bottom: 4cqw;
  display: flex; justify-content: space-between; font-size: 1.1cqw; opacity: .65;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
}
.cert-seal {
  position: absolute; right: 7cqw; bottom: 8cqw;
  width: 11cqw; height: 11cqw; border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--cert-accent2) 70%, white), var(--cert-accent2));
  color: var(--cert-paper);
  box-shadow: 0 0 0 .5cqw var(--cert-paper), 0 0 0 .8cqw var(--cert-accent2);
  font-weight: 700; font-size: 1.5cqw; letter-spacing: .08em; text-transform: uppercase;
  transform: rotate(-12deg);
}
.cert-seal span { max-width: 80%; line-height: 1.15; }

/* ---------- design: classic (double frame, corner ornaments) ---------- */
.design-classic .cert-frame { margin: 2.4cqw; border: .5cqw double var(--cert-accent); }
.design-classic .cert-frame::before {
  content: ""; position: absolute; inset: 1cqw; border: .12cqw solid var(--cert-accent2); pointer-events: none;
}
.design-classic .cert-frame::after {
  content: ""; position: absolute; inset: -.5cqw; pointer-events: none;
  background:
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) top left / 4cqw 4cqw no-repeat,
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) top right / 4cqw 4cqw no-repeat,
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) bottom left / 4cqw 4cqw no-repeat,
    radial-gradient(circle, var(--cert-accent2) 0 .9cqw, transparent 1cqw) bottom right / 4cqw 4cqw no-repeat;
}
.design-classic .cert-foot { bottom: 5cqw; left: 7cqw; right: 7cqw; }

/* ---------- design: modern (color band on the left, left-aligned) ---------- */
.design-modern { background: linear-gradient(90deg, var(--cert-accent) 0 22%, var(--cert-paper) 22%); }
.design-modern::before {
  content: ""; position: absolute; left: 22%; top: 0; bottom: 0; width: 1.2cqw; background: var(--cert-accent2);

.design-modern .cert-top { position: absolute; left: -22cqw; width: 22cqw; top: 6cqw; flex-direction: column; justify-content: center; }
.design-modern .cert-logotext { background: var(--cert-paper); color: var(--cert-accent); }
.design-modern .cert-issuer { color: var(--cert-paper); max-width: 16cqw; text-align: center; font-size: 1.3cqw; }
.design-modern .cert-title { text-transform: uppercase; letter-spacing: .08em; font-size: 4cqw; }
.design-modern .cert-name { border-bottom: none; padding: 0; position: relative; }
.design-modern .cert-name::after { content: ""; display: block; width: 10cqw; height: .5cqw; background: var(--cert-accent2); margin-top: 1cqw; }
.design-modern .cert-body, .design-modern .cert-topics { max-width: 92%; }
.design-modern .cert-signs { justify-content: flex-start; }
.design-modern .cert-foot { left: calc(22% + 7cqw); }
.design-modern .cert-seal { right: 5cqw; bottom: 7cqw; }

/* ---------- design: minimal (thin rule, lots of space) ---------- */
.design-minimal { box-shadow: 0 2px 12px rgba(0, 0, 0, .1); }
.design-minimal .cert-frame { margin: 3cqw; border: .1cqw solid color-mix(in srgb, var(--cert-ink) 25%, transparent); }
.design-minimal .cert-title { font-weight: 300; letter-spacing: .25em; text-transform: uppercase; font-size: 3.2cqw; color: var(--cert-ink); }
.design-minimal .cert-name { font-weight: 400; border-bottom-width: .12cqw; border-color: var(--cert-accent); }
.design-minimal .cert-seal { width: 9cqw; height: 9cqw; right: 5.5cqw; bottom: 6.5cqw; background: none; color: var(--cert-accent); box-shadow: inset 0 0 0 .2cqw var(--cert-accent); transform: none; }

/* ---------- print: A4, only the certificate ---------- */
@media print {
  @page { size: A4 landscape; margin: 0; }
  .certificate { max-width: none; width: 297mm; height: 210mm; aspect-ratio: auto; box-shadow: none; }
  .certificate.portrait { width: 210mm; height: 297mm; }
  .certificate, .certificate * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

veral memories.\n4. **Compare** — every read is compared with the expected data; a mismatch sets a **fail flag**.\n5. **Done** — the controller raises *done*, switches the collars back to functional mode.\n6. **Read out** — the tester reads *done* and *pass/fail* (and diagnosis data if any) through TAP/IJTAG."}, {"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5MDAgMzgwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KPGRlZnM+PG1hcmtlciBpZD0ibWkiIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiMzNDQ5NWUiLz48L21hcmtlcj48bWFya2VyIGlkPSJtYiIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzFmNmZlYiIvPjwvbWFya2VyPjxtYXJrZXIgaWQ9Im1wIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjNmM0ZmIzIi8+PC9tYXJrZXI+PG1hcmtlciBpZD0ibW8iIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiNkMzU0MDAiLz48L21hcmtlcj48bWFya2VyIGlkPSJtciIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iI2MwMzkyYiIvPjwvbWFya2VyPjxtYXJrZXIgaWQ9Im1nIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMWU4NDQ5Ii8+PC9tYXJrZXI+PC9kZWZzPgo8cmVjdCB3aWR0aD0iOTAwIiBoZWlnaHQ9IjM4MCIgcng9IjE0IiBmaWxsPSIjZmZmZmZmIi8+Cjx0ZXh0IHg9IjQ1MC4wIiB5PSIzNiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIxOSIgZm9udC13ZWlnaHQ9IjgwMCIgZmlsbD0iIzFmNGU3OSI+T25lIE1CSVNUIHJ1bjogc2xvdyBvdXRzaWRlLCBmYXN0IGluc2lkZTwvdGV4  as logic BIST does?", "options": ["The expected memory data is known at every read, so it can be compared directly.", "MISRs cannot be built for memories.", "Memories have no outputs.", "Direct compare needs a slower clock."], "correct": [0], "review": ["parts"]}, {"id": "q-order", "type": "order", "text": "Put the steps of an MBIST run in order.", "items": ["Configure", "Start", "Run at speed", "Done", "Read out pass/fail"], "review": ["test-run"]}, {"id": "q-clock", "type": "single", "text": "Which clock runs the March test itself?", "options": ["The memory's functional clock", "The JTAG clock (TCK)", "The tester's power supply", "No clock — the test is asynchronous"], "correct": [0], "review": ["test-run"]}, {"id": "q-shared", "type": "multiple", "text": "What is true about sharing one controller among several memories? Select **all** correct answers.", "options": ["It saves area compared with one controller per memory.", "The memories can be tested serially or in parallel.", "Memories sharing a controller are usually physically close and on the same clock.", "Shared memories cannot be tested at speed."], "correct": [0, 1, 2], "review": ["choices"]}, {"id": "q-tap", "type": "truefalse", "text": "The tester starts MBIST and reads its results through the test access port (JTAG / IJTAG).", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["big-picture"]}]}}, "topics/02-collar.json": {"id": "collar", "title": "The memory collar", "duration": "30 min", "summary": "The **collar** (also called wrapper or interface) is the small piece of logic that sits around every memory. It decides who talks to the memory — the functional logic or MBIST — and often checks the read data. It must do this without slowing the chip down.", "objectives": ["Draw the functional and test paths through a collar.", "Explain where the comparator can sit and why.", "Explain the bypass that lets scan test the logic around a memory.", "Describe how pipelining keeps the test 48L3N2Zz4K", "caption": "Local compare sends one fail bit back; central compare sends every read bit back"}, {"type": "accordion", "items": [{"title": "Comparator in the collar (local compare)", "md": "The controller sends the **expected data** to the collar; the collar compares and sends back only a **fail bit**. Few wires go back to the controller — important when one controller serves many wide memories. This is the most common choice."}, {"title": "Comparator in the controller (central compare)", "md": "The collar sends the **full read data** back to the controller. Simple collars, but many long wires (a 128-bit memory sends 128 bits), which costs area and makes at-speed timing harder."}, {"title": "Per-bit fail information", "md": "For diagnosis and repair it is useful to know **which bit** failed, not just *that* a fail happened. Local comparators can keep a per-bit (or per-column) fail flag."}]}]}, {"id": "bypass", "title": "Bypass for logic test", "blocks": [{"type": "text", "md": "Scan and ATPG test the **logic** of the chip. A memory is a black box for them: data written into it cannot be predicted by the ATPG tool, and the logic between the memory and the next flip-flops — the **shadow logic** — becomes hard to test.\n\nThe collar helps in one of two ways:\n\n- **Bypass**: in scan mode the memory's inputs are routed straight to its outputs, so ATPG sees a simple path.\n- **Observation flip-flops**: the memory's inputs are captured in extra scan flip-flops, and its outputs are driven by others."}, {"type": "categorize", "prompt": "Practice: which path is active?", "categories": [{"id": "func", "label": "Functional mode"}, {"id": "mbist", "label": "MBIST mode"}, {"id": "scan", "label": "Scan / ATPG mode"}], "items": [{"text": "The CPU writes data into the cache memory", "category": "func"}, {"text": "The controller writes background D into every address", "category": "mbist"}, {"text": "The memory is bypassed so ATPG can test the logic behind it", "category": "scan"}, {"text": "Read data is compared with expected data", "category": "mbist"}]}]}, {"id": "timing", "title": "At-speed timing", "blocks": [{"type": "text", "md": "MBIST must run at the memory's **full clock frequency** to catch dynamic and recovery faults. But the controller may sit far from the memory, and wires across a big chip are slow. The solution is **pipelining**: registers in the collar hold address, data and commands for one clock, and the comparison happens one or two clocks after the read."}, {"type": "stepper", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5MDAgMzYwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KPGRlZnM+PG1hcmtlciBpZD0ibWkiIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiMzNDQ5NWUiLz48L21hcmtlcj48bWFya2VyIGlkPSJtYiIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzFmNmZlYiIvPjwvbWFya2VyPjxtYXJrZXIgaWQ9Im1wIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjNmM0ZmIzIi8+PC9tYXJrZXI+PG1hcmtlciBpZD0ibW8iIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiNkMzU0MDAiLz48L21hcmtlcj48bWFya2VyIGlkPSJtciIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iI2MwMzkyYiIvPjwvbWFya2VyPjxtYXJrZXIgaWQ9Im1nIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMWU4NDQ5Ii8+PC9tYXJrZXI+PC9kZWZzPgo8cmVjdCB3aWR0aD0iOTAwIiBoZWlnaHQ9IjM2MCIgcng9IjE0IiBm oves the need for test_mode."], "correct": [0], "review": ["where-compare"]}, {"id": "q-bypass", "type": "single", "text": "What is the bypass in the collar for?", "options": ["Making the logic around the memory testable by scan / ATPG", "Speeding up the functional path", "Skipping slow memories during MBIST", "Repairing faulty rows"], "correct": [0], "review": ["bypass"]}, {"id": "q-delay", "type": "truefalse", "text": "The collar's input mux lies on the functional path and adds a small delay to it.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["muxes"]}, {"id": "q-pipe", "type": "single", "text": "With a two-stage pipeline, the read of address 5 is sent in clock 1. When is its data compared?", "options": ["Clock 3", "Clock 1", "Clock 2", "Clock 5"], "correct": [0], "review": ["timing"]}, {"id": "q-modes", "type": "match", "text": "Match each action to the mode it belongs to.", "categories": [{"id": "mbist", "label": "MBIST mode"}, {"id": "scan", "label": "Scan mode"}], "items": [{"text": "Controller drives address and data", "category": "mbist"}, {"text": "Read data compared with expected data", "category": "mbist"}, {"text": "Memory inputs routed straight to its outputs", "category": "scan"}, {"text": "ATPG tests the shadow logic", "category": "scan"}], "review": ["muxes", "bypass"]}]}}, "topics/03-generators.json": {"id": "generators", "title": "Address and data generators", "duration": "35 min", "summary": "A March element needs an **address** for every step and the right **data** for every write and expected read. Two small generators produce them: an up/down address counter and a data-background generator.", "objectives": ["Explain how one up/down counter produces both ⇑ and ⇓.", "Explain fast-row and fast-column order and why address scrambling matters.", "Produce solid, checkerboard and stripe data from the background and the address bits.", "Describe what write masks and different word widths add to the generators."], "subsec controller tests a 1000-word and a 4096-word memory. What does it need for each memory?", "options": ["Its own last-address value", "Its own address counter", "A different algorithm", "A different JTAG port"], "correct": [0], "review": ["counter"]}, {"id": "q-scramble", "type": "single", "text": "Why does a checkerboard test need the memory's address scrambling information?", "options": ["Logical neighbours are not always physical neighbours, and the checkerboard is about physical neighbours.", "Without it the memory cannot be written.", "Scrambling changes the clock frequency.", "It does not — scrambling only matters for ROMs."], "correct": [0], "review": ["order"]}, {"id": "q-cb", "type": "single", "text": "Which expression gives checkerboard data from background D?", "options": ["D ⊕ row[0] ⊕ col[0]", "D ⊕ row[0]", "D ⊕ col[0]", "D AND row[0]"], "correct": [0], "review": ["data"]}, {"id": "q-fastcol", "type": "truefalse", "text": "In fast-column order the test stays on one word line while it walks through the columns.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["order"]}, {"id": "q-mask", "type": "single", "text": "How is a byte-write enable tested?", "options": ["Write with one byte masked and check that the masked byte did not change.", "Write every byte twice.", "Read the memory without writing.", "It cannot be tested by MBIST."], "correct": [0], "review": ["masks-widths"]}]}}, "topics/04-controller.json": {"id": "controller", "title": "The MBIST controller", "duration": "35 min", "summary": "The controller turns a March test into a sequence of commands — address, data, read or write — one per clock. It can be a fixed state machine for one algorithm, or a small programmable engine that runs any algorithm loaded into it.", "objectives": ["Describe a March test as three nested loops and map them to counters.", "Sketch a hard-wired controller for a given March test.", "Write a simple March test as a microcode program.", "Compare h +bGFzdCBpbnN0cnVjdGlvbiDihpIgZG9uZTwvdGV4dD48L2c+Cjwvc3ZnPgo=", "interval": 2600, "steps": [{"title": "Instruction 0: ⇕(w0)", "md": "The program counter (PC) points to instruction 0. The address generator counts through all addresses, the sequencer issues one **w0** per address."}, {"title": "Instruction 1: ⇑(r0, w1)", "md": "Load 0, count up; at every address **r0** then **w1**."}, {"title": "Instruction 2: ⇑(r1, w0)", "md": "Up again with the opposite values."}, {"title": "Instruction 3: ⇓(r0, w1)", "md": "Load N−1 and count **down**."}, {"title": "Instruction 4: ⇓(r1, w0)", "md": "Down with the opposite values."}, {"title": "Instruction 5: ⇕(r0)", "md": "The final read. This instruction has *last* = 1, so the controller raises **done** afterwards."}]}, {"type": "sort", "prompt": "Practice: put the instructions of a MATS++ program {⇕(w0); ⇑(r0, w1); ⇓(r1, w0, r0)} in order.", "items": ["⇕ | w0 | last 0", "⇑ | r0, w1 | last 0", "⇓ | r1, w0, r0 | last 1"]}]}, {"id": "compare", "title": "Hard-wired or programmable?", "blocks": [{"type": "tabs", "tabs": [{"label": "Hard-wired", "md": "**+** smallest area, simplest timing.\n\n**−** only the algorithms chosen at design time. If silicon shows a new fault type, nothing can be changed."}, {"label": "Programmable", "md": "**+** any March-type algorithm, loaded after the chip is made; different tests for production, power-on and diagnosis.\n\n**−** more area (instruction registers, decoding), longer setup through IJTAG."}, {"label": "In practice", "md": "Commercial MBIST generators offer both and mix them: a library of built-in algorithms selectable at run time, plus an optional programmable mode for new algorithms. The engineer chooses per controller, depending on how critical the memories are."}]}]}], "quiz": {"questions": [{"id": "q-loops", "type": "order", "text": "Order the loops of a March test from outermost to innermost.", "items": ["elements", "addresses", "operations"], "review": ["loops"]}, {"id": "q-counter", "type": "single", "text": "Which counter decides when a March element is finished?", "options": ["The address counter reaching the last address of the element's order", "The operation counter", "The JTAG clock", "The data background register"], "correct": [0], "review": ["loops", "hardwired"]}, {"id": "q-states", "type": "single", "text": "In the hard-wired MATS+ controller, how many states issue memory operations?", "options": ["5 — one per operation", "3 — one per element", "1", "10"], "correct": [0], "review": ["hardwired"]}, {"id": "q-instr", "type": "single", "text": "In the programmable controller, what does one instruction describe?", "options": ["One March element: order, operations, background", "One memory address", "One bit of the memory", "The whole chip test"], "correct": [0], "review": ["programmable"]}, {"id": "q-adv", "type": "multiple", "text": "What are advantages of a programmable controller? Select **all** correct answers.", "options": ["A new algorithm can be used after the chip is made.", "Different tests can be run for production, power-on and diagnosis.", "It is always smaller than a hard-wired controller.", "It needs no test access port."], "correct": [0, 1], "review": ["compare"]}, {"id": "q-hw", "type": "truefalse", "text": "A chip may contain a few hard-wired algorithms and select one of them through IJTAG.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["hardwired"]}]}}, "topics/05-results.json": {"id": "results", "title": "Results and diagnosis", "duration": "30 min", "summary": "A test is only useful if its result reaches someone. For a production go/no-go decision one bit per memory is enough; for repair and for yield learning the chip must also say **where** it failed. This topic follows a fail from the comparator to the tester.", "objectives": ["Explain sticky fail flags and the go/no-go result.", "Describe diagnosis modes: fail capture, stop and resume, bitmaps.", "Read typical failure-bitmap patterns.", " pe": "multiple", "text": "What can a diagnosis register capture? Select **all** correct answers.", "options": ["The March element of the fail", "The failing address", "Which data bits were wrong", "The chip's temperature"], "correct": [0, 1, 2], "review": ["fail-path"]}, {"id": "q-prod", "type": "single", "text": "Why does production usually run in go/no-go mode?", "options": ["It is fastest and needs the least read-out through the slow JTAG port.", "Diagnosis mode cannot run at speed.", "Go/no-go finds more faults.", "Production chips have no diagnosis registers."], "correct": [0], "review": ["modes"]}, {"id": "q-column", "type": "single", "text": "A failure bitmap shows every cell of one column failing. What is the most likely cause?", "options": ["A broken bit line or sense amplifier", "A single weak cell", "A row-decoder defect", "A wrong algorithm"], "correct": [0], "review": ["bitmaps"]}, {"id": "q-rom", "type": "single", "text": "How is a ROM tested by MBIST?", "options": ["Read all addresses, compact the data in a MISR and compare with a golden signature.", "Write a checkerboard and read it back.", "Run March C− with four backgrounds.", "ROMs cannot be tested by MBIST."], "correct": [0], "review": ["rom"]}, {"id": "q-compact", "type": "truefalse", "text": "Signature compaction can tell exactly which ROM address failed.", "options": ["True", "False"], "correct": [1], "shuffle": false, "review": ["rom"]}]}}, "topics/06-special.json": {"id": "special", "title": "Special memories", "duration": "30 min", "summary": "Not every memory is a plain single-port SRAM. Memories with **ECC**, **multi-port** memories and memories in other **clock domains** each change what MBIST must do.", "objectives": ["Explain why MBIST bypasses ECC and how the ECC logic itself is tested.", "Describe what extra testing multi-port memories need.", "Explain how MBIST handles clock domains and runs at speed."], "subsections": [{"id": "ecc", "title": "Memories with ECC", "blocks": [{"type": able* flag set"]], "caption": "A complete test of a memory with ECC"}, {"type": "callout", "kind": "tip", "title": "ECC in the field", "md": "During operation ECC corrects soft errors, and error counters tell the system when a memory is getting worse. How ECC, scrubbing and periodic MBIST work together is a topic of *BIST in the Field*."}]}, {"id": "multiport", "title": "Multi-port memories and register files", "blocks": [{"type": "accordion", "items": [{"title": "Test every port", "md": "Each port has its own address decoder, read and write circuits. The March test is run **through each port**, so a faulty decoder of port B is not hidden by a good port A."}, {"title": "Port-interaction faults", "md": "Two ports working at the same time share bit lines and cells. Faults may appear only when port A **reads** while port B **writes** the same row or column. **Two-port March tests** run operations on both ports in the same clock."}, {"title": "Register files", "md": "Small, many ports, very fast. They are tested like multi-port memories; very small ones built from flip-flops may be tested by **scan** instead of MBIST."}]}]}, {"id": "clocks", "title": "Clocks and at-speed operation", "blocks": [{"type": "svg", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5MDAgNDMwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIj4KPGRlZnM+PG1hcmtlciBpZD0ibWkiIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiMzNDQ5NWUiLz48L21hcmtlcj48bWFya2VyIGlkPSJtYiIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzFmNmZlYiIvPjwvbWFya2VyPjxtYXJrZXIgaWQ9Im1wIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjNmM0ZmIzI ross between TCK and the memory clock through **synchronizers**."}, {"title": "Where the fast clock comes from", "md": "On the tester, the chip's own **PLL** usually provides the at-speed clock; the tester only supplies a slow reference. MBIST is often repeated at several **voltages** and **temperatures** to find weak cells."}]}, {"type": "categorize", "prompt": "Practice: which clock does the signal or block use?", "categories": [{"id": "tck", "label": "JTAG clock (TCK)"}, {"id": "mem", "label": "Memory clock"}], "items": [{"text": "Shifting the algorithm program into the controller", "category": "tck"}, {"text": "The March operations on the memory", "category": "mem"}, {"text": "The comparator in the collar", "category": "mem"}, {"text": "Reading the pass/fail result out of the chip", "category": "tck"}]}]}], "quiz": {"questions": [{"id": "q-bypass", "type": "single", "text": "Why must MBIST bypass the ECC when it tests the memory cells?", "options": ["Otherwise single faulty cells are corrected and the test would pass.", "ECC makes the memory too slow for MBIST.", "ECC changes the addresses.", "MBIST cannot write check bits."], "correct": [0], "review": ["ecc"]}, {"id": "q-check", "type": "truefalse", "text": "The check-bit cells must be tested by MBIST as well as the data cells.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["ecc"]}, {"id": "q-dec", "type": "single", "text": "How is the ECC decoder tested?", "options": ["Store a code word with flipped bits through the bypass and read it through the decoder.", "Run March C− through the decoder.", "Measure the decoder's power.", "It does not need a test."], "correct": [0], "review": ["ecc"]}, {"id": "q-port", "type": "single", "text": "Why is a March test run through **each** port of a dual-port memory?", "options": ["Each port has its own decoder and read/write circuits that can be faulty.", "The memory content is different on each port.", "One port is only for ECC.", "To make the test twice as fast."], "correct": [0], "review": ["multiport"]}, {"id": "q-domain", "type": "single", "text": "Two memories run on different functional clocks. What does MBIST usually do?", "options": ["Use a separate controller for each clock domain", "Test both on the JTAG clock", "Test only the faster one", "Merge the two clocks"], "correct": [0], "review": ["clocks"]}, {"id": "q-sync", "type": "single", "text": "Which signals cross between the JTAG clock and the memory clock?", "options": ["Control and status such as start and done", "Every memory address", "Every read data word", "None — both run on TCK"], "correct": [0], "review": ["clocks"]}]}}, "topics/07-integration.json": {"id": "integration", "title": "Integration in a chip", "duration": "35 min", "summary": "A real chip needs dozens of controllers for hundreds of memories, scheduled so the test is short but the chip does not draw too much power. This topic covers grouping, scheduling, the tool flow that inserts MBIST, and its cost.", "objectives": ["Group memories onto shared controllers.", "Schedule memory tests under a power budget and compute the test time.", "Describe the steps of the MBIST insertion flow.", "Explain where MBIST area goes and when small memories are tested differently."], "subsections": [{"id": "grouping", "title": "Sharing controllers", "blocks": [{"type": "table", "columns": ["Group memories that …", "Because …"], "rows": [["use the **same clock**", "the controller must run at that clock for at-speed test"], ["are **physically close**", "short wires between controller and collars keep timing and area low"], ["belong to the **same power domain**", "a domain that is switched off cannot be tested from a controller in another one"], ["have **similar type and test needs**", "one algorithm and one data generator fit all of them"]], "caption": "Rules for sharing an MBIST controller"}, {"type": "svg", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZ rify", "md": "Simulate with and without injected faults; check timing at speed."}, {"title": "Tester patterns", "md": "Produce the sequences that configure, start and read every controller."}]}, {"type": "accordion", "items": [{"title": "1. Memory library", "md": "For every memory type: ports, size, word width, test port if any, address/data scrambling, recommended algorithms — usually delivered by the memory compiler."}, {"title": "2. Plan", "md": "Group memories onto controllers, choose algorithms, diagnosis and repair options, schedule and power budget."}, {"title": "3. Generate and insert", "md": "The tool writes controllers and collars and inserts them into the RTL or gate-level netlist, connecting them to the IJTAG network."}, {"title": "4. Verify", "md": "Simulate the MBIST runs on the design — fault-free, and with injected faults to prove the fails are seen. Check timing at speed."}, {"title": "5. Patterns for the tester", "md": "Generate the tester sequences that configure, start and read every controller through JTAG/IJTAG."}]}, {"type": "sort", "prompt": "Practice: put the steps of the MBIST flow in order.", "items": ["Describe the memories (library)", "Plan groups, algorithms and schedule", "Generate and insert controllers and collars", "Verify by simulation and timing", "Generate tester patterns"]}]}, {"id": "cost-next", "title": "Area cost and what comes next", "blocks": [{"type": "text", "md": "The controller is shared, so its area is spread over many memories. What every memory pays for is its **collar**: muxes, comparator and pipeline registers. For a large memory this is tiny compared with the array; for a **very small** memory — a few dozen words — the collar can be as large as the memory itself. Such memories are often grouped behind one collar, or built from flip-flops and tested by **scan** instead."}, {"type": "flipcards", "md": "Check yourself before the quiz: say the meaning, then flip the card.", "cards": [{"front": "**Collar**", "back": "Logic around one memory: test/functional muxes, comparator, bypass, pipeline."}, {"front": "**Address generator**", "back": "Up/down counter with a last-address compare: ⇑ and ⇓."}, {"front": "**Data generator**", "back": "Background register, inversion, XOR with address bits for patterns."}, {"front": "**Programmable controller**", "back": "Runs a March algorithm loaded as a short program through IJTAG."}, {"front": "**Sticky fail flag**", "back": "Set by the first mismatch, kept until the next test: go/no-go."}, {"front": "**Failure bitmap**", "back": "Map of failing cells at physical positions — points to the defect."}, {"front": "**ECC bypass**", "back": "MBIST tests data and check bits directly so ECC cannot hide faults."}, {"front": "**Test scheduling**", "back": "Running memory tests in sessions so the power budget is kept."}]}, {"type": "callout", "kind": "tip", "title": "Next trainings", "md": "**Test Access: JTAG and IJTAG** shows how the tester reaches all these controllers. **Memory Repair** uses the fail information to replace bad rows and columns with spares. Pass the quiz of this topic to complete *MBIST Architecture* and open your certificate."}]}], "quiz": {"questions": [{"id": "q-group", "type": "multiple", "text": "Which memories should share one MBIST controller? Select **all** correct answers.", "options": ["Memories on the same clock", "Memories that are physically close", "Memories in the same power domain", "Memories that are as far apart as possible"], "correct": [0, 1, 2], "review": ["grouping"]}, {"id": "q-power", "type": "single", "text": "Why can't all memories of a big chip simply be tested at the same time?", "options": ["The total power and current would be too high and could make good memories fail.", "The tester has too few pins.", "March tests cannot run in parallel.", "All memories share one address bus."], "correct": [0], "review": ["scheduling"]}, {"id": "q-sched", "type": "single", "text": "Session 1 tests memories taking 80 ms /* Minimal Markdown renderer for training content.
   Supports: # ## ### headings, paragraphs, **bold**, *italic*, `code`, [link](url),
   - / * bullet lists, 1. numbered lists, > quotes, line breaks, and $sub$/^sup^-free

    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) {

    function flushPara() { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
    function flushList() { if (list) { out.push('<' + list.tag + '>' + list.items.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</' + list.tag + '>'); list = null; } }

  <script>
