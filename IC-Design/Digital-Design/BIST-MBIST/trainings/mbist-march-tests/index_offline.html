IGFkZHJlc3MgZmF1bHRzLCB0cmFuc2l0aW9uIGZhdWx0czwvdGV4dD48L2c+Cjwvc3ZnPgo=", "interval": 3200, "steps": [{"title": "Write and read the checkerboard", "md": "Every cell gets the **opposite** value of its four physical neighbours. Then all cells are read."}, {"title": "Write and read the inverse", "md": "The same with every value inverted. Together: **4N** operations."}]}, {"type": "text", "md": "The checkerboard puts the **largest possible difference** between neighbours. A short (bridge) between two neighbours, or leakage from one cell to the next, shows up as a wrong value. With a **pause** before each read it is also a simple retention test.\n\nIts weakness: it makes few transitions and visits the addresses in only one order, so it misses most **address-decoder** and **transition** faults. In practice it is used **together with** a March test — often as an extra background for the March test itself."}]}, {"id": "retention", "title": "Retention tests", "blocks": [{"type": "text", "md": "A **data-retention fault** (DRF) shows only after the cell has been left alone for a while. March notation adds a **Del** element — a pause with no access:\n\n> {⇕(w0); Del; ⇕(r0, w1); Del; ⇕(r1)}\n\nThe pause is typically tens to hundreds of milliseconds, often at **high temperature** and **low supply voltage**, where leakage is worst."}, {"type": "callout", "kind": "key", "title": "The pause dominates", "md": "A 10N March test on a 1 Mi-word memory takes about 0.1 s at 100 MHz; two retention pauses of 100 ms add another 0.2 s. To save time, all memories of a chip pause **at the same time**, and the pause can overlap with other tests."}]}, {"id": "galpat", "title": "GALPAT and walking patterns", "blocks": [{"type": "accordion", "items": [{"title": "Walking 1 / walking 0", "md": "Fill the memory with 0. Write 1 into one cell, then **read all other cells** to check that none changed; restore the cell and move on to the next. Every cell is the aggressor once, and every other cell is checked each time → about **2N²** operations."}, {"title": "GALPAT (galloping pattern)", "md": "Like walking, but the reads **alternate** between the base cell and each other cell: read base, read cell j, read base, read cell k, … This also checks the read path between every pair of addresses → about **4N²** operations."}, {"title": "Butterfly and sliding diagonal", "md": "Variants that check only the neighbours of the base cell (or a diagonal) to cut the time — still longer than March tests and with less provable coverage."}]}, {"type": "table", "columns": ["Test", "Length", "Time for 1 Mi words at 100 MHz"], "rows": [["March C−", "10N", "0.1 s"], ["March SS", "22N", "0.23 s"], ["Walking 1/0", "≈ 2N²", "≈ 6 hours"], ["GALPAT", "≈ 4N²", "≈ 12 hours"]], "caption": "Tests that grow with N² are far too slow for production"}, {"type": "callout", "kind": "tip", "title": "Where N² tests still live", "md": "On **small** memories, on a few chips in the lab for **characterisation**, or for **diagnosis** of a known bad block. March tests with the right elements catch the same fault models in linear time."}]}], "quiz": {"questions": [{"id": "q-nbg", "type": "single", "text": "How many data backgrounds are needed for intra-word coupling faults in a memory with 32-bit words?", "options": ["6", "32", "5", "2"], "correct": [0], "review": ["backgrounds"]}, {"id": "q-w1", "type": "single", "text": "When a March test is applied to a word-oriented memory with background D, what does **w1** mean?", "options": ["Write the inverse background D̄", "Write all ones", "Write D again", "Write only the lowest bit"], "correct": [0], "review": ["backgrounds"]}, {"id": "q-whybg", "type": "single", "text": "Why does a single background D = 00…0 miss coupling faults inside one word?", "options": ["Aggressor and victim in the same word are always written with the same value at the same time.", "The word is never read.", "Backgrounds only matter for ROM.", "Intra-word faults need a pause."], "correct": [0], "review": ["backgrounds"]}, {"id": "q-cb", "type": "multiple", "text": "What does the checkerboard test detect well? Select **all** correct answers.", "options": ["Bridges between neighbouring cells", "Data-retention faults, when pauses are added", "All address-decoder faults", "All transition faults"], "correct": [0, 1], "review": ["checkerboard"]}, {"id": "q-del", "type": "single", "text": "What does **Del** mean in a March test?", "options": ["A pause with no memory access, for retention faults", "Delete the memory content", "Decrement the address", "A double read"], "correct": [0], "review": ["retention"]}, {"id": "q-galpat", "type": "truefalse", "text": "GALPAT is the standard production test for large embedded memories.", "options": ["True", "False"], "correct": [1], "shuffle": false, "review": ["galpat"]}]}}, "topics/06-choosing.json": {"id": "choosing", "title": "Choosing a test", "duration": "30 min", "summary": "There is no single best memory test. Engineers choose by **coverage**, **test time** and **where** the test runs: in the factory, at every power-on, or in the lab for diagnosis. This topic puts the pieces together and leads to the MBIST hardware that runs the algorithms.", "objectives": ["Weigh test time against fault coverage for a given memory.", "Choose suitable tests for production, power-on and diagnosis.", "Explain how a March algorithm maps onto MBIST hardware, hard-wired or programmable."], "subsections": [{"id": "time-coverage", "title": "Test time versus coverage", "blocks": [{"type": "table", "columns": ["Test", "Length", "1 Mi words at 100 MHz", "Covers"], "rows": [["MATS+", "5N", "52 ms", "SAF, AF"], ["March C−", "10N", "105 ms", "+ TF, all unlinked CFs"], ["March C− × 4 backgrounds", "40N", "0.42 s", "+ intra-word CFs (8-bit words)"], ["March SS", "22N", "0.23 s", "all static simple faults"], ["March SL", "41N", "0.43 s", "all static linked faults"], ["+ retention (2 pauses)", "+ Del", "+ 0.2 s", "data-retention faults"]], "caption": "Example times for one 1 Mi-word memory; a chip tests many memories in parallel"}, {"type": "text", "md": "A big SoC has hundreds or thousands of memories. MBIST tests many of them **in parallel**, so the chip's test time is set by the **largest** memories — and by the **power** the chip may draw while all of them run. Tester time costs money on every chip, so a few hundred milliseconds matter."}]}, {"id": "where", "title": "Production, power-on and diagnosis", "blocks": [{"type": "tabs", "tabs": [{"label": "Production", "md": "At **wafer sort** and **final test**: the strongest test the time budget allows — typically a March C− or March SS class algorithm, several data backgrounds, retention pauses, run **at speed** and at several voltage / temperature corners. Fails are logged for **repair** (spare rows and columns)."}, {"label": "Power-on / in field", "md": "At every start-up, for example in cars: a **short** test (milliseconds), often a March C−-type algorithm, run before the software uses the memory — because a March test **destroys the content**. Periodic tests during operation must save and restore the data or test one block at a time."}, {"label": "Diagnosis", "md": "On a few failing chips in the lab: long tests, many algorithms, and a **failure bitmap** (which cells failed in which element). The pattern of fails points to the defect — a whole row, a column, a pair of cells — and helps the factory improve the process."}]}, {"type": "categorize", "prompt": "Practice: where does each test choice belong?", "categories": [{"id": "prod", "label": "Production test"}, {"id": "field", "label": "Power-on / in field"}, {"id": "diag", "label": "Diagnosis in the lab"}], "items": [{"text": "March SS with 4 backgrounds and retention pauses at high temperature", "category": "prod"}, {"text": "A 10N test that must finish in a few ms before the software starts", "category": "field"}, {"text": "GALPAT on one failing chip to build a failure bitmap", "category": "diag"}, {"text": "Logging failing addresses to program spare rows", "category": "prod"}]}]}, {"id": "to-hardware", "title": "From algorithm to hardware", "blocks": [{"type": "text", "md": "Every March test maps onto the same few hardware parts:"}, {"type": "table", "columns": ["In the March test", "MBIST hardware"], "rows": [["element order ⇑ / ⇓", "**address generator**: an up/down counter"], ["0 / 1, data backgrounds", "**data generator**: background register + inverter"], ["r x", "**comparator**: read data vs expected data → fail flag"], ["list of elements", "**controller**: a state machine that steps through the elements"]], "caption": "From algorithm to hardware"}, {"type": "text", "md": "A **hard-wired** controller runs one fixed algorithm — small, but it cannot change after the chip is made. A **programmable** controller reads the algorithm from a small instruction memory or registers, so engineers can switch to a stronger test after silicon if a new fault type shows up. Commercial MBIST tools ship a library of algorithms and offer both kinds."}, {"type": "flipcards", "md": "Check yourself before the quiz: say the meaning, then flip the card.", "cards": [{"front": "**⇑ ⇓ ⇕**", "back": "Address order up, down (exact reverse), or either."}, {"front": "**kN**", "back": "Test length: k operations per address, N addresses."}, {"front": "**MATS+**", "back": "{⇕(w0); ⇑(r0, w1); ⇓(r1, w0)} — 5N, stuck-at and address faults."}, {"front": "**March C−**", "back": "{⇕(w0); ⇑(r0,w1); ⇑(r1,w0); ⇓(r0,w1); ⇓(r1,w0); ⇕(r0)} — 10N."}, {"front": "**March SS**", "back": "22N — all static simple faults, including DRDF and WDF."}, {"front": "**Data background**", "back": "The B-bit pattern written as '0'; log₂(B) + 1 of them for intra-word faults."}, {"front": "**Del**", "back": "A pause in a March test, for data-retention faults."}, {"front": "**At speed**", "back": "Running the test at the memory's functional clock — needed for dynamic faults."}]}, {"type": "callout", "kind": "tip", "title": "Next: MBIST Architecture", "md": "The next training builds this hardware: the MBIST controller, address and data generators, comparators and the **collar** around each memory. Pass the quiz of this topic to complete *March Tests* and open your certificate."}]}], "quiz": {"questions": [{"id": "q-parallel", "type": "single", "text": "A chip has 500 memories tested in parallel by MBIST. What mainly sets the chip's memory test time?", "options": ["The largest memories and the power limit for running many tests at once", "The number of memories times 10N", "The smallest memory", "The number of pins of the chip"], "correct": [0], "review": ["time-coverage"]}, {"id": "q-time", "type": "single", "text": "March C− with 4 backgrounds on a 1 Mi-word memory at 100 MHz takes about …", "options": ["0.4 s", "4 ms", "4 s", "40 s"], "correct": [0], "review": ["time-coverage"]}, {"id": "q-destroy", "type": "single", "text": "Why must a power-on March test run before the software uses the memory?", "options": ["A March test overwrites the memory content.", "The memory is not powered later.", "March tests only work at low temperature.", "The software would make the test longer."], "correct": [0], "review": ["where"]}, {"id": "q-where", "type": "match", "text": "Match each activity to where it happens.", "categories": [{"id": "prod", "label": "Production test"}, {"id": "diag", "label": "Diagnosis"}], "items": [{"text": "Strong test at voltage/temperature corners", "category": "prod"}, {"text": "Collect fail addresses for repair", "category": "prod"}, {"text": "Failure bitmap of one bad chip", "category": "diag"}, {"text": "Long N² tests on a few chips", "category": "diag"}], "review": ["where"]}, {"id": "q-hw", "type": "single", "text": "Which MBIST part implements the ⇑ / ⇓ address order?", "options": ["An up/down address counter", "The comparator", "The data background register", "The fuse box"], "correct": [0], "review": ["to-hardware"]}, {"id": "q-prog", "type": "truefalse", "text": "A programmable MBIST controller can run a new, stronger algorithm after the chip is made.", "options": ["True", "False"], "correct": [0], "shuffle": false, "review": ["to-hardware"]}]}}}, "themes": ["foundation", "midnight", "paper"]};

  /* ---------------- step machinery shared by scrolly and stepper ----------------

      var hidden = s > k || k > u;

      n.classList.toggle('st-past', !hidden && s < k);

  /* ---------------- scroll and learn (sticky picture + scrolling steps) ---------------- */
  B.scrolly = function (b) {
    var host = el('div.svg-host');
    var sticky = el('div.scrolly-visual', null, [host]);
    var steps = el('div.scrolly-steps');
    var svgReady = T.inlineSVG(host, b.src).then(function () { T.setStep(host, 1); });
    (b.steps || []).forEach(function (s, i) {
      var st = el('div.scrolly-step', { 'data-k': i + 1 }, [
        el('div.step-num', { text: T.L('step') + ' ' + (i + 1) }), s.title ? el('h4', { text: s.title }) : null, mdDiv(s.md)]);

  /* ---------------- step-by-step animation with controls ---------------- */

    var next = el('button.btn.small', { type: 'button', text: T.L('stepNext') + ' ›' });

  };

  /* ---------------- drag & drop helpers (mouse, touch via tap-to-place, keyboard via arrows) ---------------- */
  T.dnd = {};
  /* Sortable list: items are <li> with data-id. Returns getter of current order. */
  T.dnd.sortable = function (list) {

    function addArrows(li) {
      var up = el('button.mini', { type: 'button', 'aria-label': 'up', text: '▲' });

  /* Buckets: chips (data-id) can be dragged or tap-placed into zones (data-zone). */
  T.dnd.buckets = function (root) {

    });
    return function () {
      var map = {};
      root.querySelectorAll('[data-zone]').forEach(function (z) {
        z.querySelectorAll('.chip').forEach(function (c) { map[c.dataset.id] = z.getAttribute('data-zone'); });

    };
  };

  /* ---------------- learning activity: put in order ---------------- */
  B.sort = function (b) {
    var items = (b.items || []).map(function (t, i) { return { id: String(i), text: t }; });
    var shuffled = T.shuffle(items);

    var msg = el('div.activity-msg');
    var btn = el('button.btn.primary', { type: 'button', text: T.L('check') });

      var ok = true;

        var li = list.querySelector('li[data-id="' + id + '"]'); var good = +id === pos;

      });

    });
    list.addEventListener('change', function () { list.querySelectorAll('li').forEach(function (li) { li.classList.remove('good', 'bad'); }); msg.textContent = ''; });
    return el('div.activity', null, [b.prompt ? mdDiv(b.prompt, 'prompt') : null, el('p.hint', { text: T.L('orderHint') }), list, el('div.activity-bar', null, [btn, msg])]);
  };

  /* ---------------- learning activity: sort into groups ---------------- */
  B.categorize = function (b) {
    var root = el('div.buckets');
    var pool = el('div.pool', { 'data-zone': '' }, [el('div.zone-title', { text: T.L('unplaced') }), el('div.zone-items')]);
    T.shuffle((b.items || []).map(function (it, i) { return { id: String(i), it: it }; })).forEach(function (x) {
      pool.lastChild.appendChild(el('span.chip', { 'data-id': x.id, tabindex: 0, html: MD.inline(x.it.text) }));
    });
    var zones = el('div.zones', null, (b.categories || []).map(function (c) {
      return el('div.zone', { 'data-zone': c.id }, [el('div.zone-title', { text: c.label }), el('div.zone-items')]);
    }));
    root.appendChild(pool); root.appendChild(zones);
    var get = T.dnd.buckets(root);
    var msg = el('div.activity-msg');
    var btn = el('button.btn.primary', { type: 'button', text: T.L('check') });
    btn.addEventListener('click', function () {
      var map = get(), ok = true;
      (b.items || []).forEach(function (it, i) {
        var chip = root.querySelector('.chip[data-id="' + i + '"]'); var good = map[String(i)] === it.category;
        chip.classList.toggle('good', good); chip.classList.toggle('bad', !good); ok = ok && good;
      });

  /* ---------------- code ---------------- */

  };

  /* ---------------- table ---------------- */
  B.table = function (b) {
    var t = el('table.tbl', null, [
      el('thead', null, [el('tr', null, (b.columns || []).map(function (c) { return el('th', { html: MD.inline(c) }); }))]),
      el('tbody', null, (b.rows || []).map(function (r) { return el('tr', null, r.map(function (c) { return el('td', { html: MD.inline(String(c)) }); })); }))
    ]);

  };

  /* ---------------- video (local file or embeddable URL) ---------------- */
  B.video = function (b) {
    var v = /\.(mp4|webm|ogg)$/i.test(b.src)

    return figure(el('div.video-wrap', null, [v]), b.caption);
  };

  /* ---------------- zoom / pan lightbox ---------------- */
  T.zoom = (function () {
    var ov, stage, holder, scale = 1, tx = 0, ty = 0, drag = null;
    function apply() { holder.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
    function set(s) { scale = Math.max(0.5, Math.min(8, s)); apply(); }
    function build() {
      holder = el('div.zoom-holder');
      stage = el('div.zoom-stage', null, [holder]);
      var bar = el('div.zoom-bar', null, [
        el('button.btn.small', { type: 'button', text: '+', title: T.L('zoomIn'), onclick: function () { set(scale * 1.4); } }),
        el('button.btn.small', { type: 'button', text: '−', title: T.L('zoomOut'), onclick: function () { set(scale / 1.4); } }),
        el('button.btn.small', { type: 'button', text: T.L('zoomReset'), onclick: function () { scale = 1; tx = ty = 0; apply(); } }),
        el('button.btn.small', { type: 'button', text: '✕ ' + T.L('close'), onclick: close })]);
      ov = el('div.zoom-overlay', { role: 'dialog', 'aria-modal': 'true' }, [stage, bar]);
      stage.addEventListener('wheel', function (e) { e.preventDefault(); set(scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); }, { passive: false });
      stage.addEventListener('pointerdown', function (e) { drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.setPointerCapture(e.pointerId); });
      stage.addEventListener('pointermove', function (e) { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); } });
      stage.addEventListener('pointerup', function () { drag = null; });
      stage.addEventListener('dblclick', function () { set(scale < 2 ? 2.5 : 1); if (scale === 1) { tx = ty = 0; apply(); } });
      document.addEventListener('keydown', function (e) { if (ov.classList.contains('open') && e.key === 'Escape') close(); });
      document.body.appendChild(ov);
    }
    function open(node) {
      if (!node) return;
      if (!ov) build();
      T.clear(holder).appendChild(node);
      scale = 1; tx = ty = 0; apply();
      ov.classList.add('open'); document.body.classList.add('no-scroll');
    }
    function close() { ov.classList.remove('open'); document.body.classList.remove('no-scroll'); }
    return { open: open, close: close };
  })();
})();

  <script>
/* quiz.js — end-of-topic quiz: single / multiple choice, order, match (drag to groups), hotspot.
   Each question may list "review": [subsection ids] to send the student back to on a wrong answer. */
(function () {
  var T = window.T, el = T.el;

  function opts(q) { return (q.options || []).map(function (o, i) { return { i: i, text: typeof o === 'string' ? o : o.text }; }); }
  function sameSet(a, b) { a = a.map(String).sort(); b = b.map(String).sort(); return a.length === b.length && a.every(function (x, i) { return x === b[i]; }); }

  /* Each builder returns { node, get(), lock(), correct() } */
  var Q = {};
  Q.single = Q.truefalse = function (q, name) { return choice(q, name, false); };
  Q.multiple = function (q, name) { return choice(q, name, true); };
  function choice(q, name, multi) {
    var list = el('div.q-options');
    var o = q.shuffle === false ? opts(q) : T.shuffle(opts(q));
    o.forEach(function (op) {
      var input = el('input', { type: multi ? 'checkbox' : 'radio', name: name, value: op.i });
      list.appendChild(el('label.q-option', null, [input, el('span', { html: MD.inline(op.text) })]));
    });
    return {
      node: el('div', null, [el('p.hint', { text: multi ? T.L('selectMany') : T.L('selectOne') }), list]),
      get: function () { return [].filter.call(list.querySelectorAll('input'), function (x) { return x.checked; }).map(function (x) { return +x.value; }); },
      check: function (v) { return sameSet(v, q.correct || []); },
      lock: function () { list.querySelectorAll('input').forEach(function (x) { x.disabled = true; }); },
      showCorrect: function () { list.querySelectorAll('input').forEach(function (x) { if ((q.correct || []).indexOf(+x.value) >= 0) x.parentNode.classList.add('is-correct'); }); }
    };
  }
  Q.order = function (q) {
    var items = (q.items || []).map(function (t, i) { return { id: String(i), text: t }; });
    var s = T.shuffle(items); if (s.every(function (x, i) { return x.id === String(i); }) && s.length > 1) s.reverse();
    var list = el('ol.sortlist', null, s.map(function (it) { return el('li', { 'data-id': it.id }, [el('span.grip', { text: '⋮⋮' }), el('span.li-text', { html: MD.inline(it.text) })]); }));
    var get = T.dnd.sortable(list);
    return {
      node: el('div', null, [el('p.hint', { text: T.L('orderHint') }), list]),
      get: get,
      check: function (v) { return v.every(function (id, i) { return +id === i; }); },
      lock: function () { list.classList.add('locked'); list.querySelectorAll('li').forEach(function (li) { li.draggable = false; }); list.querySelectorAll('button').forEach(function (b) { b.disabled = true; }); },
      showCorrect: function () {}
    };
  };
  Q.match = function (q) {
    var root = el('div.buckets');
    var pool = el('div.pool', { 'data-zone': '' }, [el('div.zone-title', { text: T.L('unplaced') }), el('div.zone-items')]);
    T.shuffle((q.items || []).map(function (it, i) { return { id: String(i), it: it }; })).forEach(function (x) {
      pool.lastChild.appendChild(el('span.chip', { 'data-id': x.id, tabindex: 0, html: MD.inline(x.it.text) }));
    });
    root.appendChild(pool);
    root.appendChild(el('div.zones', null, (q.categories || []).map(function (c) {
      return el('div.zone', { 'data-zone': c.id }, [el('div.zone-title', { text: c.label }), el('div.zone-items')]);
    })));
    var get = T.dnd.buckets(root);
    return {
      node: el('div', null, [el('p.hint', { text: T.L('matchHint') }), root]),
      get: get,
      check: function (map) { return (q.items || []).every(function (it, i) { return map[String(i)] === it.category; }); },
      lock: function () { root.classList.add('locked'); root.querySelectorAll('.chip').forEach(function (c) { c.draggable = false; }); },
      showCorrect: function () {}
    };
  };
  Q.hotspot = function (q) {
    var stage = el('div.reveal-stage.hotspot-q');
    var pic = /\.svg$|^data:image\/svg/.test(q.src) ? el('div.svg-host') : el('img', { src: q.src, alt: '' });
    if (pic.tagName === 'DIV') T.inlineSVG(pic, q.src);

    var chosen = {};
    (q.spots || []).forEach(function (s) {
      var b = el('button.spot.pick', { type: 'button', 'aria-pressed': 'false', 'aria-label': s.label || s.id, style: { left: s.x + '%', top: s.y + '%', width: s.w + '%', height: s.h + '%' } }, [s.label ? el('span.spot-num', { text: s.label }) : null]);
      b.addEventListener('click', function () {
        if (stage.classList.contains('locked')) return;

      });
      b.dataset.id = s.id; stage.appendChild(b);
    });
    return {

      main.appendChild(T.renderQuiz(t.quiz, {
        topic: t, threshold: tr.passThreshold != null ? tr.passThreshold : 0.8,
        showCorrect: tr.showCorrectAnswers || 'afterPass',
        passedBefore: passed(t) ? { score: P.topic(t.id).bestScore || 1 } : null,
        subTitle: function (id) { return subTitle(t, id); },
        onReview: function (id) { location.hash = href(t, id); },
        onResult: function (r) { onQuizResult(t, r); },
        onPass: function (score, bar) { bar.appendChild(nextTopicButton(i)); }
      }));
    } else if (page) {
      var s = subOf(t, page), n = (t.subsections || []).indexOf(s);
      var sec = el('section.subsection', { id: 'sub-' + t.id + '-' + s.id }, [el('h2', null, [el('span.sub-num', { text: (i + 1) + '.' + (n + 1) }), ' ' + s.title])]);
      (s.blocks || []).forEach(function (b) { sec.appendChild(T.renderBlock(b, { topic: t, subsection: s })); });
      main.appendChild(sec);
    }
    A.pager = el('nav.pager', { 'aria-label': T.L('pageNav') });
    main.appendChild(A.pager);
    updatePager(i, page);

    if (page) P.visit(t.id, page);
    T.emit('pageView', { topicId: t.id, page: page || null, index: k, pages: pages.length });
    renderToc();
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    try { A.main.focus({ preventScroll: true }); } catch (e) {}
  }

  function pageSteps(t, pages, page) {
    var st = P.state.topics[t.id] || { visited: [] };
    return el('nav.page-steps', { 'aria-label': T.L('topicParts') }, pages.map(function (p, n) {
      var isQ = p === 'quiz', seen = isQ ? passed(t) : st.visited.indexOf(p) >= 0;
      return el('a.page-step' + (p === page ? '.current' : '') + (seen ? '.visited' : '') + (isQ ? '.is-quiz' : ''), {
        href: href(t, p), title: isQ ? T.L('quiz') : subTitle(t, p), 'aria-current': p === page ? 'page' : null
      }, [el('span.dot', { text: isQ ? '✎' : String(n + 1) }), el('span.step-label', { text: isQ ? T.L('quiz') : subTitle(t, p) })]);
    }));
  }

  function reviewNote(t, rv, page) {
    var onList = rv.subs.indexOf(page) >= 0;
    return el('div.review-note' + (onList ? '.on-list' : ''), null, [
      el('div', null, [el('strong', { text: T.L('lastAttempt', { score: Math.round(rv.attempt.score * 100) + '%' }) }), ' ',
        el('span', { text: onList ? T.L('reviewThis') : T.L('reviewThese') })]),
      el('ul.review-list', null, rv.subs.map(function (r) {
        return el('li', null, [r === page ? el('strong', { text: '▸ ' + subTitle(t, r) }) : el('a', { href: href(t, r), text: subTitle(t, r) })]);
      })),
      page !== 'quiz' ? el('a.btn.small.primary', { href: href(t, 'quiz'), text: '↩ ' + T.L('backToQuiz') }) : null
    ]);
  }

  function updatePager(i, page) {
    var t = A.topics[i], pages = pagesOf(t), k = pages.indexOf(page), pager = T.clear(A.pager);
    /* left: previous part, or previous topic */
    if (k > 0) pager.appendChild(el('a.btn.pager-prev', { href: href(t, pages[k - 1]) }, [el('small', { text: T.L('prev') }), el('span', { text: '← ' + (pages[k - 1] === 'quiz' ? T.L('quiz') : subTitle(t, pages[k - 1])) })]));
    else if (i > 0) { var pt = A.topics[i - 1], pp = pagesOf(pt); pager.appendChild(el('a.btn.pager-prev', { href: href(pt, pp[pp.length - 1]) }, [el('small', { text: T.L('prevTopic') }), el('span', { text: '← ' + pt.title })])); }
    else pager.appendChild(el('span'));
    /* right: next part / quiz / complete / next topic */
    if (page === 'quiz') {
      pager.appendChild(passed(t) || preview() ? nextTopicButton(i) : el('span.btn.disabled.pager-next', { title: T.L('passQuizFirst') }, [el('small', { text: T.L('passQuizFirst') }), el('span', { text: '🔒 ' + T.L('next') })]));
    } else if (k >= 0 && k < pages.length - 1) {
      var nx = pages[k + 1];
      pager.appendChild(el('a.btn.primary.pager-next', { href: href(t, nx) }, [el('small', { text: nx === 'quiz' ? T.L('finishTopic') : T.L('nextPart') }), el('span', { text: (nx === 'quiz' ? '✎ ' + T.L('toQuiz') : subTitle(t, nx)) + ' →' })]));
    } else { /* last part of a topic without quiz */
      if (passed(t)) pager.appendChild(nextTopicButton(i));
      else pager.appendChild(el('button.btn.primary.pager-next', { type: 'button', onclick: function () { P.complete(t.id); afterPass(t); renderToc(); updatePager(i, page); } },
        [el('small', { text: T.L('finishTopic') }), el('span', { text: '✓ ' + T.L('complete') })]));
    }
  }
  function nextTopicButton(i) {
    if (i + 1 < A.topics.length) return el('a.btn.primary.pager-next', { href: href(A.topics[i + 1]) }, [el('small', { text: T.L('next') }), el('span', { text: A.topics[i + 1].title + ' →' })]);
    if (A.cert && A.cert.enabled !== false) return el('a.btn.primary.pager-next', { href: '#certificate' }, [el('small', { text: T.L('allDone') }), el('span', { text: '★ ' + T.L('certificate') })]);
    return el('span.btn.disabled', { text: '✓ ' + T.L('allDone') });
  }

  function onQuizResult(t, r) {
    var was = passed(t);
    P.attempt(t.id, r);
    T.emit('quizAttempt', { topicId: t.id, score: r.score, passed: r.passed, correct: r.correct, total: r.total, wrong: r.wrong, threshold: r.threshold });
    if (r.passed && !was) afterPass(t);
    renderToc();
    updatePager(A.topics.indexOf(t), 'quiz');
    var old = A.main.querySelector('.review-note'); if (old) old.remove(); /* it described the previous attempt */
  }
  function afterPass(t) {
    T.emit('topicPassed', { topicId: t.id, score: P.topic(t.id).bestScore });
    if (allPassed() && !P.state.completedAt) {
      P.state.completedAt = new Date().toISOString();
      P.commit('completed');
      T.emit('completed', { completedAt: P.state.completedAt, averageScore: avgScore(), state: P.state });
    }
  }
  function avgScore() {
    var sc = A.topics.map(function (t) { var x = P.state.topics[t.id]; return x && x.bestScore != null ? x.bestScore : (preview() ? 1 : 0); });
    return sc.reduce(function (a, b) { return a + b; }, 0) / Math.max(1, sc.length);
  }

  function showLocked(i) {
    var main = T.clear(A.main);
    A.current = A.topics[i].id; A.page = null; renderToc();
    var firstOpen = 0; for (var k = 0; k < A.topics.length; k++) if (!passed(A.topics[k])) { firstOpen = k; break; }
    var ft = A.topics[firstOpen], q = hasQuiz(ft) ? 'quiz' : pagesOf(ft)[0];
    main.appendChild(el('div.locked-card', null, [
      el('div.lock-icon', { text: '🔒' }), el('h1', { text: A.topics[i].title }), el('p', { text: T.L('lockedMsg') }),
      el('a.btn.primary', { href: href(ft, q), text: T.L('goTo') + ': ' + ft.title })]));
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
  }

  /* ---------------- certificate page ---------------- */
  function showCertificate() {
    var main = T.clear(A.main); A.current = '#certificate'; A.page = null; renderToc();
    if (!A.cert || A.cert.enabled === false) { main.appendChild(el('p', { text: 'The author does not offer a certificate for this training.' })); return; }
    var cfg = A.cert;
    main.appendChild(el('header.topic-head', null, [el('h1', { text: T.L('certificate') })]));
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    if (preview()) return certificatePreview(main, cfg);
    if (!allPassed()) {
      main.appendChild(el('div.locked-card', null, [el('div.lock-icon', { text: '🔒' }), el('p', { text: T.L('certLocked') }),
        el('ul.remaining', null, A.topics.filter(function (t) { return !passed(t); }).map(function (t) { return el('li', null, [el('a', { href: href(t), text: t.title })]); }))]));
      return;
    }
    var user = A.cfg.user || {};
    var given = (P.state.certificate && P.state.certificate.name) || user.name || '';
    var locked = !!(A.cfg.lockName && user.name);
    var date = P.state.completedAt || A.topics.map(function (t) { return P.topic(t.id).passedAt || ''; }).sort().pop() || new Date().toISOString();
    var input = el('input.name-input', { type: 'text', value: locked ? user.name : given, placeholder: T.L('certName'), 'aria-label': T.L('certName'), readonly: locked });
    var out = el('div.cert-out');
    var printBtn = el('button.btn', { type: 'button', text: '⎙ ' + T.L('certPrint'), hidden: true, onclick: function () { window.print(); } });
    function make(silent) {
      var name = input.value.trim(); if (!name) { input.focus(); return; }
      var cert = T.renderCertificate(cfg, A.training, { name: name, score: avgScore(), date: date });
      T.clear(out).appendChild(cert);
      printBtn.hidden = false;
      var prev = P.state.certificate || {};
      if (prev.name !== name || prev.id !== cert.getAttribute('data-cert-id')) {
        P.state.certificate = { name: name, id: cert.getAttribute('data-cert-id'), issuedAt: prev.issuedAt && prev.name === name ? prev.issuedAt : new Date().toISOString(), score: avgScore() };
        P.commit('certificate');
        if (!silent) T.emit('certificate', P.state.certificate);
      }
    }
    main.appendChild(el('div.cert-form', null, [el('p', { text: T.L('certReady') }),
      el('div.cert-row', null, [input, el('button.btn.primary', { type: 'button', text: T.L('certCreate'), onclick: function () { make(false); } }), printBtn])]));
    main.appendChild(out);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') make(false); });
    if (given || locked) make(true);
  }

  /* Preview: sample certificate + live style controls (not saved — copy the JSON into certificate.json). */
  function certificatePreview(main, cfg) {
    if (cfg.kind === 'web') { main.appendChild(T.renderCertificate(cfg, A.training, { name: 'Sample Learner', date: new Date().toISOString(), score: 1 })); return; }
    var style = Object.assign({ design: 'classic', font: 'serif', orientation: 'landscape', accent: '#1f4e79', accent2: '#c9a227', paper: '#fffdf7', ink: '#1d2433' }, cfg.style || {});
    var name = el('input.name-input', { type: 'text', value: (A.cfg.user && A.cfg.user.name) || T.L('sampleName'), 'aria-label': T.L('certName') });
    function sel(key, values) {
      var s = el('select', null, values.map(function (v) { return el('option', { value: v, selected: style[key] === v, text: v }); }));
      s.addEventListener('change', function () { style[key] = s.value; draw(); });
      return el('label', null, [el('span', { text: T.L('cert_' + key) }), s]);
    }
    function color(key) {
      var c = el('input', { type: 'color', value: style[key] });
      c.addEventListener('input', function () { style[key] = c.value; draw(); });
      return el('label', null, [el('span', { text: T.L('cert_' + key) }), c]);
    }
    var json = el('pre.cert-json');
    var out = el('div.cert-out');
    function draw() {
      var c = Object.assign({}, cfg, { style: style });
      T.clear(out).appendChild(T.renderCertificate(c, A.training, { name: name.value.trim() || T.L('sampleName'), score: 0.95, date: new Date().toISOString() }));
      json.textContent = '"style": ' + JSON.stringify(style, null, 2);
    }
    name.addEventListener('input', draw);
    main.appendChild(el('div.callout.info.cert-preview-note', null, [el('div.callout-title', { text: T.L('certPreviewTitle') }), el('div.md', { html: MD.render(T.L('certPreviewNote')) })]));
    main.appendChild(el('div.cert-panel', null, [
      el('label.wide', null, [el('span', { text: T.L('certName') }), name]),
      sel('design', ['classic', 'modern', 'minimal']), sel('font', ['serif', 'sans']), sel('orientation', ['landscape', 'portrait']),
      color('accent'), color('accent2'), color('paper'), color('ink'),
      el('button.btn.small', { type: 'button', text: '⎙ ' + T.L('certPrint'), onclick: function () { window.print(); } })
    ]));
    main.appendChild(out);
    main.appendChild(el('details.cert-json-box', null, [el('summary', { text: T.L('certStyleJson') }), json]));
    draw();
  }

  /* ---------------- small UI helpers ---------------- */
  function toast(msg, kind) {
    var t = el('div.toast' + (kind ? '.' + kind : ''), { role: 'status', text: msg });
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 400); }, 4000);
  }

  /* ---------------- integration: messages from a parent page + JS API ---------------- */
  function listenToParent() {
    if (window.parent === window) return;
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.target !== 'semitec-training') return;
      if (A.cfg.parentOrigin && A.cfg.parentOrigin !== '*' && e.origin !== A.cfg.parentOrigin) return;
      if (d.type === 'navigate' && d.hash) location.hash = d.hash;
      else if (d.type === 'getState') T.emit('state', { state: P.state });
      else if (d.type === 'reset') { P.reset(); renderToc(); location.hash = href(A.topics[0]); }
    });
  }
  function exposeAPI() {
    window.TrainingAPI = {
      getState: function () { return JSON.parse(JSON.stringify(P.state)); },
      getConfig: function () { return Object.assign({}, A.cfg, { adapter: undefined, token: A.cfg.token ? '***' : '' }); },
      navigate: function (hash) { location.hash = hash; },
      reset: function () { P.reset(); renderToc(); location.hash = href(A.topics[0]); },
      flush: function () { return P.flush(); },
      on: T.on
    };
  }

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  document.addEventListener('DOMContentLoaded', boot);
})();

</script>
</body>
</html>
