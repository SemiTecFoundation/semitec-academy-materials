<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
<rect width="760" height="360" rx="14" fill="#ffffff"/>
<text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Running the element ⇑(r0, w1) on 4 addresses</text>
<text x="155" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#34495e" >address 0</text><text x="305" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#34495e" >address 1</text><text x="455" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#34495e" >address 2</text><text x="605" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#34495e" >address 3</text><g data-step="1" data-until="1"><rect x="110" y="115" width="90" height="90" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="155" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1f4e79" >0</text><rect x="260" y="115" width="90" height="90" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="305" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1f4e79" >0</text><rect x="410" y="115" width="90" height="90" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="455" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1f4e79" >0</text><rect x="560" y="115" width="90" height="90" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="605" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1f4e79" >0</text><text x="380" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" >Before the element: the previous element left 0 in every cell.</text><text x="380" y="295" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >⇑ means: start at address 0 and go up.</text></g>
<g data-step="2" data-until="2"><rect x="110" y="115" width="90" height="90" rx="10" fill="#e8f6ee" stroke="#1f6feb" stroke-width="4"/><text x="155" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1e8449" >1</text><rect x="260" y="115" width="90" height="90" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="305" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1f4e79" >0</text><rect x="410" y="115" width="90" height="90" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="455" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1f4e79" >0</text><rect x="560" y="115" width="90" height="90" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="605" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1f4e79" >0</text><path d="M155 112 l-9 -12 h18 z" fill="#1f6feb"/><text x="380" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" >address 0:  r0 → reads 0 ✓   then   w1 → cell becomes 1</text><text x="380" y="295" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >operations so far: 2</text></g>
