<g data-step="5" data-until="5"><rect x="110" y="115" width="90" height="90" rx="10" fill="#e8f6ee" stroke="#1e8449" stroke-width="2"/><text x="155" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1e8449" >1</text><rect x="260" y="115" width="90" height="90" rx="10" fill="#e8f6ee" stroke="#1e8449" stroke-width="2"/><text x="305" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1e8449" >1</text><rect x="410" y="115" width="90" height="90" rx="10" fill="#e8f6ee" stroke="#1e8449" stroke-width="2"/><text x="455" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1e8449" >1</text><rect x="560" y="115" width="90" height="90" rx="10" fill="#e8f6ee" stroke="#1f6feb" stroke-width="4"/><text x="605" y="175" text-anchor="middle" font-size="44" font-weight="800" fill="#1e8449" >1</text><path d="M605 112 l-9 -12 h18 z" fill="#1f6feb"/><text x="380" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" >address 3:  r0 → reads 0 ✓   then   w1 → cell becomes 1</text><text x="380" y="295" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >operations so far: 8</text><text x="380" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#1e8449" >The element is finished: 2 operations × 4 addresses = 8 operations.</text></g>
