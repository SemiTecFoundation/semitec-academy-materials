<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Segoe UI, Arial, sans-serif">
<rect width="800" height="380" rx="14" fill="#ffffff"/>
<text x="400.0" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Inside March SS: the element ⇑(r0, r0, w0, r0, w1)</text>
<rect x="110" y="80" width="100" height="80" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="160" y="133" text-anchor="middle" font-size="32" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">r0</text><rect x="230" y="80" width="100" height="80" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="280" y="133" text-anchor="middle" font-size="32" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">r0</text><rect x="350" y="80" width="100" height="80" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="400" y="133" text-anchor="middle" font-size="32" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">w0</text><rect x="470" y="80" width="100" height="80" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="520" y="133" text-anchor="middle" font-size="32" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">r0</text><rect x="590" y="80" width="100" height="80" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="640" y="133" text-anchor="middle" font-size="32" font-weight="800" fill="#1f4e79" font-family="Consolas, Menlo, monospace">w1</text><g data-step="1" data-until="1"><rect x="106" y="76" width="108" height="88" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="400" y="230" text-anchor="middle" font-size="20" font-weight="800" fill="#1f4e79" >1st r0</text><text x="400" y="268" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >Checks the stored 0: catches SAF, IRF and RDF.</text><text x="400" y="296" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >If the cell has a DRDF, this read flips it silently.</text></g>
<g data-step="2" data-until="2"><rect x="226" y="76" width="108" height="88" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="400" y="230" text-anchor="middle" font-size="20" font-weight="800" fill="#1f4e79" >2nd r0</text><text x="400" y="268" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >A second read with no write in between</text><text x="400" y="296" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >catches the DRDF flipped by the first read.</text></g>
<g data-step="3" data-until="3"><rect x="346" y="76" width="108" height="88" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="400" y="230" text-anchor="middle" font-size="20" font-weight="800" fill="#1f4e79" >w0</text><text x="400" y="268" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >Writes the value the cell already holds</text><text x="400" y="296" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >— a non-transition write. A WDF flips the cell here.</text></g>
<g data-step="4" data-until="4"><rect x="466" y="76" width="108" height="88" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="400" y="230" text-anchor="middle" font-size="20" font-weight="800" fill="#1f4e79" >3rd r0</text><text x="400" y="268" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >Reads after the non-transition write</text><text x="400" y="296" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >and catches the WDF.</text></g>
<g data-step="5" data-until="5"><rect x="586" y="76" width="108" height="88" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="400" y="230" text-anchor="middle" font-size="20" font-weight="800" fill="#1f4e79" >w1</text><text x="400" y="268" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >The 0 → 1 transition: it checks TF later and acts</text><text x="400" y="296" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >as an aggressor on cells not yet visited.</text></g>
<text x="400" y="350" text-anchor="middle" font-size="15" font-weight="400" fill="#7a8a99" >March SS repeats this idea in four elements, for both values and both directions: 22N</text></svg>
