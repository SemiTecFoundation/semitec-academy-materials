<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
<rect width="760" height="360" rx="14" fill="#ffffff"/>
<text x="380.0" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">Anatomy of a March test</text>
<text x="62" y="128" text-anchor="middle" font-size="46" font-weight="400" fill="#34495e" >{</text><text x="250" y="124" text-anchor="middle" font-size="40" font-weight="400" fill="#34495e" >;</text><text x="490" y="124" text-anchor="middle" font-size="40" font-weight="400" fill="#34495e" >;</text><text x="738" y="128" text-anchor="middle" font-size="46" font-weight="400" fill="#34495e" >}</text><rect x="90" y="80" width="140" height="64" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="118" y="123" text-anchor="middle" font-size="30" font-weight="700" fill="#1f4e79" >⇕</text><text x="136" y="122" text-anchor="start" font-size="26" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">(w0)</text><rect x="270" y="80" width="200" height="64" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="298" y="123" text-anchor="middle" font-size="30" font-weight="700" fill="#1f4e79" >⇑</text><text x="316" y="122" text-anchor="start" font-size="26" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">(r0, w1)</text><rect x="510" y="80" width="200" height="64" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="538" y="123" text-anchor="middle" font-size="30" font-weight="700" fill="#1f4e79" >⇓</text><text x="556" y="122" text-anchor="start" font-size="26" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">(r1, w0)</text><g data-step="1" data-until="1"><text x="380" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" >A March test is a list of March elements</text><text x="380" y="245" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >The elements run one after the other, from left to right.</text><text x="380" y="275" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >This test has 3 elements.</text><rect x="86" y="76" width="148" height="72" rx="10" fill="none" stroke="#1f6feb" stroke-width="3.5"/><rect x="266" y="76" width="208" height="72" rx="10" fill="none" stroke="#1f6feb" stroke-width="3.5"/><rect x="506" y="76" width="208" height="72" rx="10" fill="none" stroke="#1f6feb" stroke-width="3.5"/></g>
<g data-step="2" data-until="2"><text x="380" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" >One March element</text><text x="380" y="245" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >= an address order + a list of operations.</text><text x="380" y="275" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >The element ⇑(r0, w1) visits every address once.</text><rect x="266" y="76" width="208" height="72" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/></g>
<g data-step="3" data-until="3"><text x="380" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" >The address order</text><text x="380" y="245" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >⇑ up: address 0, 1, 2 … N−1  ·  ⇓ down: N−1 … 1, 0</text><text x="380" y="275" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >⇕ either order — the result does not depend on it</text><circle cx="118" cy="112" r="22" fill="none" stroke="#c0392b" stroke-width="3.5"/><circle cx="298" cy="112" r="22" fill="none" stroke="#c0392b" stroke-width="3.5"/><circle cx="538" cy="112" r="22" fill="none" stroke="#c0392b" stroke-width="3.5"/></g>
<g data-step="4" data-until="4"><text x="380" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" >The operations</text><text x="380" y="245" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >r0 = read and expect 0  ·  w1 = write 1</text><text x="380" y="275" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >All operations of an element are done on one address before moving to the next.</text><rect x="132" y="94" width="92" height="38" rx="6" fill="none" stroke="#1e8449" stroke-width="3.5"/><rect x="312" y="94" width="152" height="38" rx="6" fill="none" stroke="#1e8449" stroke-width="3.5"/><rect x="552" y="94" width="152" height="38" rx="6" fill="none" stroke="#1e8449" stroke-width="3.5"/></g>
<g data-step="5" data-until="5"><text x="380" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" >Test length</text><text x="380" y="280" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >1 + 2 + 2 = 5 operations per address  →  5N</text><text x="380" y="310" text-anchor="middle" font-size="16" font-weight="400" fill="#34495e" >For a memory of N words the test needs 5·N read/write operations.</text><circle cx="160.0" cy="186" r="18" fill="#1f6feb"/><text x="160.0" y="193" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff" >1</text><circle cx="370.0" cy="186" r="18" fill="#1f6feb"/><text x="370.0" y="193" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff" >2</text><circle cx="610.0" cy="186" r="18" fill="#1f6feb"/><text x="610.0" y="193" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff" >2</text></g>
</svg>
