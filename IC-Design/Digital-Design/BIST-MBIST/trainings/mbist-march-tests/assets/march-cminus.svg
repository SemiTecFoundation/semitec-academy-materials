<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Segoe UI, Arial, sans-serif">
<rect width="800" height="360" rx="14" fill="#ffffff"/>
<text x="400.0" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">March C−: six elements, 10N</text>
<rect x="22" y="70" width="116" height="92" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="80" y="98" text-anchor="middle" font-size="17" font-weight="800" fill="#34495e" >M0</text><text x="80" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">⇕(w0)</text><text x="80" y="192" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e" >all 0</text><rect x="150" y="70" width="116" height="92" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="208" y="98" text-anchor="middle" font-size="17" font-weight="800" fill="#34495e" >M1</text><text x="208" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">⇑(r0,w1)</text><text x="208" y="192" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e" >all 1</text><rect x="278" y="70" width="116" height="92" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="336" y="98" text-anchor="middle" font-size="17" font-weight="800" fill="#34495e" >M2</text><text x="336" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">⇑(r1,w0)</text><text x="336" y="192" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e" >all 0</text><rect x="406" y="70" width="116" height="92" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="464" y="98" text-anchor="middle" font-size="17" font-weight="800" fill="#34495e" >M3</text><text x="464" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">⇓(r0,w1)</text><text x="464" y="192" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e" >all 1</text><rect x="534" y="70" width="116" height="92" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="592" y="98" text-anchor="middle" font-size="17" font-weight="800" fill="#34495e" >M4</text><text x="592" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">⇓(r1,w0)</text><text x="592" y="192" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e" >all 0</text><rect x="662" y="70" width="116" height="92" rx="10" fill="#f4f7fb" stroke="#34495e" stroke-width="2"/><text x="720" y="98" text-anchor="middle" font-size="17" font-weight="800" fill="#34495e" >M5</text><text x="720" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79" font-family="Consolas, Menlo, monospace">⇕(r0)</text><text x="720" y="192" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e" >—</text><text x="22" y="192" text-anchor="middle" font-size="15" font-weight="400" fill="#34495e" ></text><g data-step="1" data-until="1"><rect x="18" y="66" width="124" height="100" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="400" y="255" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79" >M0 — initialise</text><text x="400" y="290" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >Write 0 into every cell. Nothing is checked yet.</text></g>
<g data-step="2" data-until="2"><rect x="146" y="66" width="124" height="100" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="400" y="255" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79" >M1 — up: check 0, make 0 → 1</text><text x="400" y="290" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >Aggressors BELOW a victim change before the victim is read.</text></g>
<g data-step="3" data-until="3"><rect x="274" y="66" width="124" height="100" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="400" y="255" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79" >M2 — up: check 1, make 1 → 0</text><text x="400" y="290" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >The same, with the opposite values and transitions.</text></g>
<g data-step="4" data-until="4"><rect x="402" y="66" width="124" height="100" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="400" y="255" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79" >M3 — down: check 0, make 0 → 1</text><text x="400" y="290" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >Now aggressors ABOVE a victim change before it is read.</text></g>
<g data-step="5" data-until="5"><rect x="530" y="66" width="124" height="100" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="400" y="255" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79" >M4 — down: check 1, make 1 → 0</text><text x="400" y="290" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >The opposite transition in the down direction.</text></g>
<g data-step="6" data-until="6"><rect x="658" y="66" width="124" height="100" rx="10" fill="none" stroke="#1f6feb" stroke-width="4"/><text x="400" y="255" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79" >M5 — final read</text><text x="400" y="290" text-anchor="middle" font-size="17" font-weight="400" fill="#34495e" >Catches what the 1 → 0 writes of M4 did to cells already passed.</text></g>
<text x="400" y="335" text-anchor="middle" font-size="14" font-weight="400" fill="#7a8a99" >memory content after each element is shown under its box</text></svg>
